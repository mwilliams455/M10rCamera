apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: "io.github.wurensen.android-aspectjx"
Properties versionProps = new Properties()
android {
    signingConfigs {
        debug {
            storeFile file('../key/PcamLeak.jks')
            storePassword 'photoncamera'
            keyPassword 'photoncamera'
            keyAlias 'key0'
        }
    }
    def versionPropsFile = file('version.properties')
    def versionBuild

    buildFeatures {
        buildConfig true
        dataBinding true
        mlModelBinding true
    }

    if (versionPropsFile.canRead()) {
        versionProps.load(new FileInputStream(versionPropsFile))
        versionBuild = versionProps['VERSION_BUILD'].toInteger()
    } else {
        throw new FileNotFoundException("Could not read version.properties!")
    }

    ext.autoIncrementBuildNumber = {
        if (versionPropsFile.canRead()) {
            versionProps.load(new FileInputStream(versionPropsFile))
            versionBuild = versionProps['VERSION_BUILD'].toInteger() + 1
            versionProps['VERSION_BUILD'] = versionBuild.toString()
            versionProps.store(versionPropsFile.newWriter(), null)
        } else {
            throw new FileNotFoundException("Could not read version.properties!")
        }
    }

    defaultConfig {
        compileSdk 36
        applicationId 'com.m10rproject.m10rcam.photon'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 28901
        buildConfigField "boolean", "M10R_TONE_CACHE3H", providers.gradleProperty('m10rToneCache3H').getOrElse('true')
        // Set false to retain the complete RENDERPERF3F Java normalization control.
        buildConfigField 'boolean', 'M10R_NATIVE_NORMALIZE3G',
                providers.gradleProperty('m10rNativeNormalize3G').getOrElse('true')
        // Legacy counterfactual histograms are research-only; exact native counters stay on.
        buildConfigField 'boolean', 'M10R_LEGACY_DIAGNOSTICS3F',
                providers.gradleProperty('m10rLegacyDiagnostics3F').getOrElse('false')
        // DETAIL3D is an opt-in photographic trial; the default keeps EDGE0A.
        buildConfigField 'boolean', 'M10R_DETAIL3D',
                providers.gradleProperty('m10rDetail3D').getOrElse('false')
        // Build with -Pm10rRenderedColor1A=false for the exact matrix control.
        buildConfigField 'boolean', 'M10R_RENDERED_COLOR1A',
                providers.gradleProperty('m10rRenderedColor1A').getOrElse('true')
        // Accepted photographic renderer order, retained from MIDGAP1S.
        buildConfigField 'boolean', 'M10R_COLOR_ORDER1A',
                providers.gradleProperty('m10rColorOrder1A').getOrElse('true')
        // Meter candidates use the same accepted renderer as the photograph.
        buildConfigField 'boolean', 'M10R_METER_RENDERER1M',
                providers.gradleProperty('m10rMeterRenderer1M').getOrElse('true')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        versionName '1.39-m10r-colourcache3h-test'
        versionProps['VERSION_NAME'] = versionName
        proguardFiles
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable = false
            zipAlignEnabled = true
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable = true
            zipAlignEnabled = false
        }
    }

    // Preserves parent native libraries; verification/build_native.py builds the
    // isolated COLOURCACHE3H library for both supported ABIs with private static C++.

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    namespace 'com.particlesdevs.photoncamera'
    applicationVariants.all {
        variant -> variant.outputs.all {
            outputFileName = "M10RCam-Photon-${versionName}${versionBuild}-${variant.name}.apk"
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}




dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.opencv:opencv:4.13.0'
    implementation project(path: ':circularbarlib')
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation group: 'commons-io', name: 'commons-io', version: '20030203.000550'
    implementation 'com.google.code.gson:gson:2.13.2'
    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.7"
    //Subsampling image view
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    // Gallery modernization: ViewPager2 for bounded tiling/HDR (thumbnails via Glide - single loader to keep baseline low on 4GB)
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    //Google Material
    implementation 'com.google.android.material:material:1.14.0'
    // M3E shape morphs and spring physics (declared explicitly; also provided by Material)
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.anggrayudi:storage:2.2.0"
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'
    //implementation 'com.microsoft.onnxruntime:onnxruntime-android:latest.release'
    //Leak Canary
    //Use this lib to detect memory leaks when debugging
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.6'
    //For Testing
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    implementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    // Real JSON serialization in probe diagnostic tests; never packaged in the app.
    testImplementation files('test-libs/json-20250517.jar')
    androidTestImplementation 'org.testng:testng:7.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
repositories {
    mavenCentral()
}
