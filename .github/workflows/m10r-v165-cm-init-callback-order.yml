name: M10-R v1.65 CM init callback ordering
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v165-cm-init-callback-order.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CM init callbacks and TF overlay ordering
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v165_cm_init_callback_order.txt
          from pathlib import Path
          import struct,string
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(max(BASE,a)):off(min(END,z))],max(BASE,a)))
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            oo=ops(i)
            if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
          def lit(i):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>1 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+oo[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def ascii_at(a,n=96):
            o=off(a);d=b[o:o+n]
            return ''.join(chr(x) if 32<=x<127 else '.' for x in d)
          print('M10-R v1.65 CM INIT CALLBACK ORDER')
          print('\n=== init owner 0x420a5de4 ===')
          for i in dis(0x420a5de4,0x420a5e14):print(fmt(i))
          print('\n=== registration-name bytes ===')
          for a in (0x420a5e20,0x420a5e40,0x420a5e60): print(hex(a),ascii_at(a,80))
          callbacks=[0x420a5cdc,0x420a5e80,0x420a5b04]
          interesting={0x420d4c24:'mailbox_transport',0x420a3488:'candidate_send_wrapper',0x420a4aac:'preset_calc'}
          for A in callbacks:
            print(f'\n=== callback {A|1:#x} body ===')
            W=dis(A,A+0x700)
            for i in W:print(fmt(i))
            calls=[]
            for i in W:
              c=call(i)
              if c is not None and BASE<=c<END and c not in calls:calls.append(c)
            print('DIRECT_CALLS', [hex(x) for x in calls])
            for c in calls[:20]:
              print(f'-- callee {c:#x} first 0x280 --')
              for i in dis(c,c+0x280):print(fmt(i))
          print('\n=== direct calls to known mailbox transport with context ===')
          hs=[];a=BASE
          while a<END:
            for i in dis(a,min(END,a+0x10000)):
              if call(i)==0x420d4c24: hs.append(i.address)
            a+=0x10000
          print([hex(x) for x in hs])
          for h in hs:
            if 0x420a0000<=h<0x420b0000:
              print(f'-- transport caller {h:#x} --')
              for i in dis(h-0x90,h+0x90):print(fmt(i))
          print('\n=== literal refs to shared config 0x43705830 ===')
          refs=[];a=BASE
          while a<END:
            for i in dis(a,min(END,a+0x10000)):
              q=lit(i)
              if q and q[1]==0x43705830:refs.append(i.address)
            a+=0x10000
          print([hex(x) for x in refs])
          for h in refs:
            print(f'-- config ref {h:#x} --')
            for i in dis(h-0x60,h+0x100):print(fmt(i))
          print('\n=== TARGET ===')
          print('Identify which registered callback overlays/parses TF data after base preset calculation, and whether that callback then sends opcode 0x20/config to CA9.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v165_cm_init_callback_order.txt
          git commit -m 'research: record v1.65 CM init callback ordering trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push