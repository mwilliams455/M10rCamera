name: M10-R v1.40 gain producer B2Y core
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v140-gain-producer-b2y-core.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve CA9 gain producer and IMG B2Y core
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v140_gain_producer_b2y_core.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          cb=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); CB=0x40000000; CP=4
          ib=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); IB=0x42000000; IP=4
          ca=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); ca.detail=True; ca.skipdata=True
          th=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); th.detail=True; th.skipdata=True
          def off(base,pfx,a):return pfx+a-base
          def dis(b,md,base,pfx,a,z):return list(md.disasm(b[off(base,pfx,a):off(base,pfx,z)],a))
          def cstr(b,base,pfx,a,limit=260):
            o=off(base,pfx,a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+limit));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(b,base,pfx,i,thumb=False):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=(((i.address+4)&~3) if thumb else i.address+8)+i.operands[1].mem.disp;o=off(base,pfx,la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adrstr(b,base,pfx,i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                a=i.operands[1].imm; s=cstr(b,base,pfx,a)
                if s:return a,s
            except:pass
          def fmt(b,base,pfx,i,thumb=False):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(b,base,pfx,i,thumb)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}';st=cstr(b,base,pfx,q[1])
              if st:s+=f' STRING={st!r}'
            a=adrstr(b,base,pfx,i)
            if a:s+=f' ; ADR {a[0]:#x} STRING={a[1]!r}'
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.40 GAIN PRODUCER / B2Y CORE')
          print('\n=== CA9 candidate gain producer 0x40009720..0x40009C40 ===')
          for i in dis(cb,ca,CB,CP,0x40009720,0x40009c40):print(fmt(cb,CB,CP,i))
          print('\n=== CA9 candidate prologues 0x40009600..0x40009D00 ===')
          starts=[]
          for i in dis(cb,ca,CB,CP,0x40009600,0x40009d00):
            if i.mnemonic=='push' and 'lr' in i.op_str:starts.append(i.address);print(hex(i.address),i.op_str)
          print('\n=== DIRECT CALLERS OF CANDIDATE PROLOGUES ===')
          allins=dis(cb,ca,CB,CP,0x40000000,0x40014000)
          for st in starts:
            hs=[]
            for i in allins:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==st:hs.append(i.address)
            if hs:print(hex(st),[hex(x) for x in hs])
          print('\n=== CA9 STRING/LITERAL REFERENCES IN PRODUCER WINDOW ===')
          for i in dis(cb,ca,CB,CP,0x40009600,0x40009d00):
            q=lit(cb,CB,CP,i)
            if q and cstr(cb,CB,CP,q[1]):print(fmt(cb,CB,CP,i))
          print('\n=== IMG B2Y neighborhood 0x420A4680..0x420A4B00 ===')
          for i in dis(ib,th,IB,IP,0x420a4680,0x420a4b00):print(fmt(ib,IB,IP,i,True))
          print('\n=== EXACT REFERENCES TO B2Y IDENTIFIERS ===')
          targets=[]
          for needle in (b'B2Y_CC0_CA9_CM.bin',b'B2Y_TF_REMAPPING_CA9_CM.bin'):
            p=ib.find(needle);a=IB+p-IP if p>=0 else None
            print(needle.decode(),hex(a) if a else None)
            if a:targets.append(a)
          for a in targets:
            pat=struct.pack('<I',a);q=0;hs=[]
            while True:
              q=ib.find(pat,q)
              if q<0:break
              hs.append(IB+q-IP);q+=1
            print(f'target {a:#x} word_pools {[hex(x) for x in hs]}')
            for i in dis(ib,th,IB,IP,0x420a4300,0x420a4d00):
              q=lit(ib,IB,IP,i,True);ad=adrstr(ib,IB,IP,i)
              if (q and q[1]==a) or (ad and ad[0]==a):print(fmt(ib,IB,IP,i,True))
          print('\n=== CALLERS OF FUNCTIONS CONTAINING B2Y IDENTIFIERS (LOCAL PROLOGUE HEURISTIC) ===')
          # list prologues in the local region and all direct callers to them
          pro=[]
          for i in dis(ib,th,IB,IP,0x420a4300,0x420a4d00):
            if i.mnemonic=='push' and 'lr' in i.op_str:pro.append(i.address)
          print('prologues',[hex(x) for x in pro])
          scan=dis(ib,th,IB,IP,0x42090000,0x420b2000)
          for st in pro:
            hs=[]
            for i in scan:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==st:hs.append(i.address)
            if hs:print(hex(st),[hex(x) for x in hs])
          print('\n=== TARGET ===')
          print('Determine whether CA9 0x400097xx producer owns WB gain doubles and identify the IMG routine that serializes/programs CC0 and tone-function remapping into B2Y.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v140_gain_producer_b2y_core.txt
          git commit -m 'research: record v1.40 gain producer B2Y core' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push