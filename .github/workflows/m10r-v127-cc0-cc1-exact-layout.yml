name: M10-R v1.27 exact CC0 CC1 layout
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v127-cc0-cc1-exact-layout.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace exact rendered CC0 and CC1 layout
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v127_cc0_cc1_exact_layout.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def astr(v):
            o=off(v)
            if not 0<=o<len(b): return None
            e=b.find(b'\0',o,min(len(b),o+220))
            if e<=o: return None
            q=b[o:e]
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4: return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              z=astr(q[1])
              if z: s+=f' STRING={z!r}'
            if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
              va=((i.address+4)&~3)+i.operands[1].imm; z=astr(va)
              s+=f' ; ADR_TARGET={va:#x}'
              if z: s+=f' STRING={z!r}'
            return s
          print('M10-R v1.27 CC0 / CC1 EXACT LAYOUT')
          print('Source-state callback base is original r0, saved at sp+0x68 by ColorManagementFinished.')
          print('\n=== PRE-CC / CC0 CODE 0x420A3CA0..0x420A4090 ===')
          for i in dis(0x420a3ca0,0x420a4090): print(fmt(i))
          print('\n=== CC1 CODE 0x420A4340..0x420A44E4 ===')
          for i in dis(0x420a4340,0x420a44e4): print(fmt(i))
          print('\n=== SOURCE-BASE FIELD ACCESSES IN BOTH CODE RANGES ===')
          for a,z in ((0x420a3ca0,0x420a4090),(0x420a4340,0x420a44e4)):
            ins=dis(a,z)
            for idx,i in enumerate(ins):
              # retain direct load/store offsets; contextual register provenance is visible around each slice
              if any(op.type==ARM_OP_MEM and op.mem.disp in (0x24,0x28,0x4c,0x50,0x54,0x68,0x70,0x78,0x7c,0x80,0x81,0x9c) for op in getattr(i,'operands',[])):
                print(f'\n-- access @{i.address:#x} --')
                for j in ins[max(0,idx-5):min(len(ins),idx+6)]: print(fmt(j))
          print('\n=== LOGICAL HYPOTHESES TO CONFIRM/REJECT ===')
          print('record0 = source+0x28; record1 = source+0x54; each is 0x2C bytes and contains 9 int32 coefficients, u16 fixed-point shift at +0x24, and a final word at +0x28.')
          print('CC1 observation already implies source+0x7C (= record1+0x28) is Kelvin. Test whether source+0x50 (= record0+0x28) is CC0 Kelvin.')
          print('Freeze exact locations of default flag and tint independently; do not assume the two records contain them.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v127_cc0_cc1_exact_layout.txt
          git commit -m 'research: record v1.27 exact CC0 CC1 layout' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
