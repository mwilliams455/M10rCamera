name: M10-R output-space transfer 1D
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1d.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y TF remapping asset
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1D.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def valid(a):return BASE<=a<BASE+len(b)-PFX
          def one(a):
            if not valid(a):return None
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1));return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a)) if z>a else []
          def astr(v):
            if not valid(v):return None
            o=off(v);e=b.find(b'\0',o,min(len(b),o+240));q=b[o:e] if e>o else b''
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:return ((i.address+4)&~3)+i.operands[1].imm
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {hex(q[0])}->{hex(q[1])}';st=astr(q[1])
              if st:s+=f' STRING={st!r}'
            a=adr(i)
            if a:
              s+=f' ; ADR={hex(a)}';st=astr(a)
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s

          print('M10-R OUTPUTSPACE TRANSFER1D')
          needle=b'B2Y_TF_REMAPPING_CA9_CM.bin';p=b.find(needle)
          if p<0:raise SystemExit('asset string missing')
          S=BASE+p-PFX;print('TF_REMAPPING_STRING',hex(S),repr(astr(S)))

          # Recover all halfword-aligned direct ADR/literal xrefs near CA9 loader family.
          refs=[]
          for a in range(0x420a4400,0x420a5200,2):
            i=one(a)
            if not i:continue
            vals=[];q=lit(i)
            if q:vals.append(q[1])
            x=adr(i)
            if x:vals.append(x)
            if S in vals:refs.append(a)
          print('\n=== TF STRING XREFS ===');print(','.join(hex(x) for x in refs) if refs else 'NONE')

          owners=[]
          for a in refs:
            pro=None
            for q in range(a,max(0x420a4400,a-0x800),-2):
              i=one(q)
              if i and i.mnemonic=='push' and 'lr' in i.op_str:pro=q;break
            if pro:owners.append(pro)
            print(f'\n=== TF XREF {hex(a)} OWNER {hex(pro) if pro else "NONE"} ===')
            start=pro if pro else a-0x80
            for i in dis(start,min(0x420a5400,start+0x800)):print(fmt(i))

          # Direct callers of each recovered loader owner within CA9 CM/start-management region.
          print('\n=== CALLERS OF TF LOADER ===')
          for o in sorted(set(owners)):
            hits=[]
            for a in range(0x420a2000,0x420a7000,2):
              i=one(a)
              if i and call(i)==o:hits.append(a)
            print('owner',hex(o),'callers',','.join(hex(x) for x in hits) if hits else 'NONE')
            for a in hits:
              print(f'-- caller {hex(a)} --')
              for i in dis(max(0x420a2000,a-0x100),min(0x420a7000,a+0x160)):print(fmt(i))

          # Enumerate immediate output writes and literal hardware-looking addresses in loader.
          print('\n=== TF LOADER WRITE/CALL SURFACE ===')
          for o in sorted(set(owners)):
            for i in dis(o,min(o+0x900,BASE+len(b)-PFX)):
              q=lit(i);t=call(i)
              if i.mnemonic.startswith('str') or t is not None or (q and 0x20000000<=q[1]<0x21000000):print(fmt(i))

          # Search code for direct callers of known B2Y nonlinear programmers from TF loader/callers.
          known={0x420d15e8:'DG_CONTROL',0x420d25a4:'INTERP_GAMMA',0x420d3c1c:'TONE_HELPER',0x420d1170:'DEKNEE_REGION'}
          print('\n=== KNOWN NONLINEAR DIRECT CALLS ===')
          blocks=sorted(set(owners))
          for o in blocks:
            hits=[]
            for i in dis(o,min(o+0x900,BASE+len(b)-PFX)):
              t=call(i)
              if t in known:hits.append((i.address,known[t],t))
            print(hex(o),[(hex(a),n,hex(t)) for a,n,t in hits] if hits else 'NONE')

          print('\n=== INTERPRETATION GATE ===')
          print('Filename proves a CA9 B2Y TF REMAPPING calibration asset exists. Payload shape/consumer must determine whether it is an OETF, a remap control structure, or another transfer-domain object. Do not alter Android output transfer from filename alone.')
          PY
      - name: Commit textual result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1D.txt
          git commit -m 'research: record B2Y TF remapping loader trace 1D' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
