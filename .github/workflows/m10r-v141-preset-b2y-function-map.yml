name: M10-R v1.41 preset B2Y function map
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v141-preset-b2y-function-map.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve preset semantics and B2Y helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v141_preset_b2y_function_map.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          ib=Path('/tmp/sections/092_IMG-System.bin').read_bytes();IB=0x42000000;IP=4
          cb=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();CB=0x40000000;CP=4
          th=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);th.detail=True;th.skipdata=True
          ar=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);ar.detail=True;ar.skipdata=True
          def off(base,pfx,a):return pfx+a-base
          def dis(b,md,base,pfx,a,z):return list(md.disasm(b[off(base,pfx,a):off(base,pfx,z)],a))
          def cstr(b,base,pfx,a,limit=300):
            o=off(base,pfx,a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+limit));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(b,base,pfx,i,thumb=False):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=(((i.address+4)&~3) if thumb else i.address+8)+i.operands[1].mem.disp;o=off(base,pfx,la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(b,base,pfx,i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                # Capstone reports the encoded immediate for this Thumb image.
                a=((i.address+4)&~3)+i.operands[1].imm
                s=cstr(b,base,pfx,a)
                return a,s
            except:pass
          def fmt(b,base,pfx,i,thumb=False):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(b,base,pfx,i,thumb)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}';st=cstr(b,base,pfx,q[1])
              if st:s+=f' STRING={st!r}'
            if thumb:
              a=adr(b,base,pfx,i)
              if a:s+=f' ; ADR_EFF {a[0]:#x}'+(f' STRING={a[1]!r}' if a[1] else '')
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.41 PRESET / B2Y FUNCTION MAP')
          print('\n=== CORRECTED WB ENUM FACT ===')
          print('IMG fallback writes top-level mode=3 and secondary preset=1 while logging Daylight; CA9 mode 3 dispatches on input+0x18. Therefore mode 3 = PRESET mode and preset 1 = DAYLIGHT.')
          print('\n=== CA9 mode-3 preset dispatch ===')
          for i in dis(cb,ar,CB,CP,0x4000b208,0x4000b340):print(fmt(cb,CB,CP,i))
          print('\n=== CA9 caller around gain accumulator 0x4000A688..0x4000A840 ===')
          for i in dis(cb,ar,CB,CP,0x4000a688,0x4000a840):print(fmt(cb,CB,CP,i))
          print('\n=== IMG ca9_cm_Get_BinFileData candidate 0x420A4628..0x420A4884 ===')
          for i in dis(ib,th,IB,IP,0x420a4628,0x420a4884):print(fmt(ib,IB,IP,i,True))
          print('\n=== IMG B2Y CC0 helper 0x420A4884..0x420A4AAC ===')
          for i in dis(ib,th,IB,IP,0x420a4884,0x420a4aac):print(fmt(ib,IB,IP,i,True))
          print('\n=== IMG B2Y TF remap helper 0x420A4AAC..0x420A4D20 ===')
          for i in dis(ib,th,IB,IP,0x420a4aac,0x420a4d20):print(fmt(ib,IB,IP,i,True))
          print('\n=== CALL SITES FROM ca9_cm_fill_parameter ===')
          for a,z in ((0x420a57d0,0x420a58a0),(0x420a5d70,0x420a5e30)):
            print(f'-- {a:#x}..{z:#x} --')
            for i in dis(ib,th,IB,IP,a,z):print(fmt(ib,IB,IP,i,True))
          print('\n=== ASCII RUNS AROUND B2Y INLINE DATA ===')
          for a,z in ((0x420a47f0,0x420a4860),(0x420a4970,0x420a49e0)):
            o=off(IB,IP,a);end=off(IB,IP,z);i=o
            while i<end:
              if 0x20<=ib[i]<=0x7e:
                j=i
                while j<end and 0x20<=ib[j]<=0x7e:j+=1
                if j-i>=4:print(hex(IB+i-IP),repr(ib[i:j].decode('ascii','replace')))
                i=j+1
              else:i+=1
          print('\n=== TARGET ===')
          print('Freeze mode3/preset1 semantics and identify B2Y CC0/TF helper input-output contracts, plus decide whether 0x40009750 accumulation belongs to AWB clustering rather than final gain storage.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v141_preset_b2y_function_map.txt
          git commit -m 'research: record v1.41 preset B2Y function map' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push