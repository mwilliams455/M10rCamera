name: M10-R output-space transfer 2B
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2b.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode CA9 output-space function table
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2B.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def u32(a):return struct.unpack_from('<I',b,off(a))[0]
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            return i.operands[0].imm if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            t=call(i)
            if t is not None:s+=f' ; CALL={t:#x}'
            return s
          def function(st,limit=0x500):
            out=[]
            for i in dis(st,min(BASE+len(b)-PFX,st+limit)):
              out.append(i)
              if i.address>st and ((i.mnemonic=='pop' and 'pc' in i.op_str) or (i.mnemonic=='bx' and 'lr' in i.op_str)):break
            return out
          print('M10-R OUTPUTSPACE TRANSFER2B')
          print('\n=== MODE INDEX PROOF ===')
          for i in dis(0x40003bc8,0x40003c08):print(fmt(i))
          print('\n=== TABLE RAW 0x40013930..0x40013980 ===')
          for a in range(0x40013930,0x40013980,4):print(hex(a),hex(u32(a)))
          print('\n=== MODE ENTRIES ===')
          base=0x40013940
          ptrs=[]
          for mode in range(3):
            e=base+mode*12
            vals=[u32(e),u32(e+4),u32(e+8)]
            print('MODE',mode,'ENTRY',hex(e),'WORDS',','.join(hex(v) for v in vals))
            for v in vals[1:]:
              if BASE<=v<BASE+len(b)-PFX:ptrs.append(v & ~1)
          print('\n=== SIX MODE FUNCTIONS ===')
          for p in sorted(set(ptrs)):
            print('\n-- FUNCTION',hex(p),'--')
            for i in function(p,0x700):print(fmt(i))
          print('\n=== FUNCTION CALL TARGETS / FP OPS ===')
          for p in sorted(set(ptrs)):
            print('\nFUNCTION',hex(p))
            for i in function(p,0x700):
              if call(i) is not None or i.mnemonic.startswith(('v','cmp','ldr','str')):print(fmt(i))
          print('\n=== SEARCH KNOWN NONLINEAR ADDRESSES ===')
          known={0x420d15e8:'DG_ARM926',0x420d25a4:'INTERP_GAMMA_ARM926',0x420d3c1c:'TONE_ARM926',0x420d1170:'DEKNEE_ARM926'}
          # CA9 cannot directly call ARM926 addresses, but report any literal/call coincidence and math signatures.
          for p in sorted(set(ptrs)):
            for i in function(p,0x700):
              t=call(i)
              if t in known:print(hex(p),hex(i.address),known[t])
          print('\n=== POW/LOG/EXP-LIKE SHARED TARGETS ===')
          counts={}
          for p in sorted(set(ptrs)):
            for i in function(p,0x700):
              t=call(i)
              if t:counts.setdefault(t,[]).append((p,i.address))
          for t,xs in sorted(counts.items()):print(hex(t),','.join(hex(p)+'@'+hex(a) for p,a in xs))
          print('\n=== DECISION GATE ===')
          print('Classify mode 0/1/2 function pairs. If they implement XYZ/RGB matrix/whitepoint conversion rather than nonlinear transfer, output-space switching is CM-only and Android sRGB OETF remains downstream behavior for sRGB output.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2B.txt
          git commit -m 'research: record CA9 output-space function table 2B' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push