name: M10-R v1.52 CA9 remapped ASN store trace
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v152-ca9-remapped-asn-store-trace.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Find CA9 writers of remapped ASN output triplet
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v152_ca9_remapped_asn_store_trace.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,n=260):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(32<=x<127 for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          ins=list(md.disasm(b[PFX:],BASE))
          print('M10-R v1.52 CA9 REMAPPED ASN STORE TRACE')
          accesses=[];stores=[]
          for i in ins:
            ds=[]
            try:ds=[o.mem.disp for o in i.operands if o.type==ARM_OP_MEM]
            except:pass
            if any(x in (0xb8,0xc0,0xc8) for x in ds):
              accesses.append(i)
              if i.mnemonic.startswith(('str','vstr','stm')):stores.append(i)
          print('\n=== all B8/C0/C8 stores ===')
          for i in stores:print(fmt(i))
          print('\n=== store neighborhoods ===')
          for i in stores:
            print(f'-- store {i.address:#x} --')
            for j in dis(max(BASE,i.address-0x70),min(BASE+len(b)-PFX,i.address+0xb0)):print(fmt(j))
          print('\n=== grouped regions containing 2+ distinct output offsets ===')
          # cluster stores separated by <=0x300 and report which offsets occur
          clusters=[]
          for i in stores:
            if not clusters or i.address-clusters[-1][-1].address>0x300:clusters.append([i])
            else:clusters[-1].append(i)
          interesting=[]
          for cl in clusters:
            offs=set()
            for i in cl:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in (0xb8,0xc0,0xc8):offs.add(o.mem.disp)
            if len(offs)>=2:
              interesting.append((cl,offs));print(hex(cl[0].address),hex(cl[-1].address),[hex(x) for x in sorted(offs)])
          print('\n=== full windows for grouped regions ===')
          for cl,offs in interesting:
            lo=max(BASE,cl[0].address-0x180);hi=min(BASE+len(b)-PFX,cl[-1].address+0x240)
            print(f'-- region {lo:#x}..{hi:#x} offs={[hex(x) for x in sorted(offs)]} --')
            for i in dis(lo,hi):print(fmt(i))
          print('\n=== raw 256.0 (0x40700000 high word) literal pools + bounded xrefs ===')
          target=0x40700000;pat=struct.pack('<I',target);p=0;pools=[]
          while True:
            p=b.find(pat,p)
            if p<0:break
            pools.append(BASE+p-PFX);p+=4
          print([hex(x) for x in pools])
          for lp in pools:
            for i in dis(max(BASE,lp-0x500),lp):
              q=lit(i)
              if q and q[0]==lp:print(fmt(i))
          print('\n=== likely ARM function starts before interesting regions and callers ===')
          starts=[]
          for cl,_ in interesting:
            a=cl[0].address;cand=None
            for j in dis(max(BASE,a-0x800),a+4):
              # common ARM GCC/ARMCC save-lr prologues
              if ('lr' in j.op_str and ('sp' in j.op_str or j.mnemonic in ('push','stmdb','stmfd'))) and j.mnemonic.startswith(('push','stm')):cand=j.address
            if cand is not None and cand not in starts:starts.append(cand)
          print([hex(x) for x in starts])
          for st in starts:
            callers=[i.address for i in ins if call(i)==st]
            print(hex(st),'callers',[hex(x) for x in callers])
          print('\n=== focused low-address math region 0x400038C0..0x40003AF4 ===')
          for i in dis(0x400038c0,0x40003af4):print(fmt(i))
          print('\n=== TARGET ===')
          print('Find the writer of the returned ASN-remapped triplet at output +B8/+C0/+C8. If a three-offset writer exists, trace its input table/config and interpolation helper next.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v152_ca9_remapped_asn_store_trace.txt
          git commit -m 'research: record v1.52 CA9 remapped ASN store trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push