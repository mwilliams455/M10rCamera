name: M10-R output-space transfer 3R
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3r.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace interpolation-gamma caller to source field and refresh owner
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3R.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return P+a-B
          def one(a):
            q=off(a);z=list(md.disasm(b[q:q+4],a,count=1)) if 0<=q<len(b) else []
            return z[0] if z else None
          def ds(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);x=lit(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            return s
          TARGETCALL=0x4215445c; SETTER=0x420d25a4
          print('M10-R OUTPUTSPACE TRANSFER3R')
          print('\n=== RAW WINDOW AROUND INTERPOLATION-GAMMA CALL ===')
          for i in ds(0x42154200,0x42154680):print(fmt(i))
          print('\n=== FUNCTION OWNER OF CALL 0x4215445C ===')
          pushes=[]
          for a in range(TARGETCALL-0x1000,TARGETCALL+2,2):
            i=one(a)
            if i and i.mnemonic=='push' and 'lr' in i.op_str:pushes.append(a)
          print('PUSHES',[hex(x) for x in pushes])
          s=pushes[-1] if pushes else None
          print('OWNER',hex(s) if s else None)
          if s:
            for i in ds(s,min(B+len(b)-P,s+0x1000)):
              print(fmt(i))
              if i.address>s and i.mnemonic=='pop' and 'pc' in i.op_str:break
          print('\n=== DIRECT CALLERS OF GAMMA OWNER ===')
          callers=[]
          if s:
            for a in range(0x42150000,0x42170000,2):
              i=one(a)
              if i and call(i)==s:callers.append(a);print(fmt(i))
          print('CALLERS',[hex(x) for x in callers])
          print('\n=== CALLER WINDOWS + SIBLING B2Y CALLS ===')
          known=(0x42151f28,0x4215220c,0x420d25a4,0x420d3434,0x420d4380)
          for a in callers:
            print('\nCALLER',hex(a))
            lo=max(B,a-0x300);hi=min(B+len(b)-P,a+0x400)
            for i in ds(lo,hi):
              c=call(i)
              if abs(i.address-a)<0x100 or c in known or (c is not None and 0x42150000<=c<0x42170000):print(fmt(i))
          print('\n=== COMMON PARENTS WITH SETTINGS APPLY 0x42151F28/0x4215220C ===')
          # find functions in high-level range that call gamma owner and either settings stage
          for a in range(0x42160000,0x42170000,2):
            i=one(a)
            if not i:continue
            c=call(i)
            if c in ((s if s else 0),0x42151f28,0x4215220c):print(fmt(i))
          print('\n=== SOURCE-OFFSET SIGNATURES AROUND GAMMA CALL ===')
          for i in ds(TARGETCALL-0x100,TARGETCALL+0x20):
            if i.mnemonic.startswith(('ldr','ldrh','ldrb','add','mov','str')):print(fmt(i))
          print('\n=== COLORSPACE FIELD SIGNATURE CHECK ===')
          # explicit +0xb4 accesses in gamma-owner region and caller windows
          ranges=[]
          if s:ranges.append((s,min(B+len(b)-P,s+0x1000)))
          ranges += [(max(B,a-0x300),min(B+len(b)-P,a+0x400)) for a in callers]
          for lo,hi in ranges:
            print('RANGE',hex(lo),hex(hi))
            for i in ds(lo,hi):
              if '0xb4' in i.op_str:print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Identify interpolation-gamma source field and its owner chain. If it is independent of settings+0xB4 and no output-space branch reaches it, close output-space->interpolation-gamma coupling as absent in recovered path.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3R.txt
          git commit -m 'research: trace interpolation gamma source field 3R' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
