name: M10-R v1.61 CA9 ASN triplet TF consumer
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v161-ca9-asn-triplet-tf-consumer.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace ASN triplet mutation and TF config consumers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v161_ca9_asn_triplet_tf_consumer.txt
          from pathlib import Path
          import struct,re,collections
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4; END=BASE+len(b)-PFX
          def off(a): return PFX+a-BASE
          def mk(mode):
            m=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN); m.detail=True; m.skipdata=True; return m
          arm=mk(CS_MODE_ARM); thumb=mk(CS_MODE_THUMB)
          def dis(md,a,z): return list(md.disasm(b[off(a):off(z)],a))
          def lit(i,thumbmode=False):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                pc=((i.address+4)&~3) if thumbmode else i.address+8
                la=pc+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i,tm=False):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i,tm);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.61 CA9 ASN TRIPLET / TF CONSUMER TRACE')
          core=dis(arm,0x40003af4,0x40004050)
          print('\n=== all core references to local ASN triplet sp+0x150..0x164 ===')
          for i in core:
            hit=False
            for o in i.operands:
              if o.type==ARM_OP_MEM and i.reg_name(o.mem.base)=='sp' and 0x150<=o.mem.disp<=0x164: hit=True
            if hit: print(fmt(i))
          print('\n=== calls preceded by construction of sp+0x150 alias ===')
          for n,i in enumerate(core):
            c=call(i)
            if c is None: continue
            w=core[max(0,n-10):n+1]
            if any(('sp, #0x150' in x.op_str or 'sp, #0x154' in x.op_str or 'sp, #0x158' in x.op_str or 'sp, #0x160' in x.op_str) for x in w):
              print(f'\n-- call {c:#x} at {i.address:#x} --')
              for x in w: print(fmt(x))
          targets=[0x400060f0,0x40005e94,0x40004490,0x400053ec,0x40012ffc,0x40012e24,0x40012fd0,0x40013658,0x40012ff8]
          print('\n=== focused helper bodies ===')
          for t in targets:
            print(f'\n-- helper {t:#x} --')
            for x in dis(arm,t,min(END,t+0x1000)):print(fmt(x))
          # Scan exact config serialization displacements in both instruction sets.
          wanted={0x128,0x12c,0x134}
          for md,label,tm in [(arm,'ARM',False),(thumb,'THUMB',True)]:
            ins=dis(md,BASE,END); hits=[]
            for i in ins:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in wanted:
                  hits.append(i);break
            print(f'\n=== {label} exact memory displacements 0x128/0x12c/0x134 ===')
            print([(hex(i.address),hex(next(o.mem.disp for o in i.operands if o.type==ARM_OP_MEM and o.mem.disp in wanted)),fmt(i,tm)) for i in hits])
            for i in hits:
              print(f'\n-- {label} hit {i.address:#x} --')
              for x in dis(md,max(BASE,i.address-0x100),min(END,i.address+0x180)):print(fmt(x,tm))
          # Search for count-driven pair-table pattern independent of 31 constant: load [base,#0x12c], index*8, base+0x134.
          print('\n=== ARM functions containing at least two target displacements ===')
          ins=dis(arm,BASE,END)
          pro=[i.address for i in ins if ((i.mnemonic=='push' and 'lr' in i.op_str) or (i.mnemonic=='stmdb' and 'sp!' in i.op_str and 'lr' in i.op_str))]
          for a in pro:
            w=dis(arm,a,min(END,a+0x600)); ds=set()
            for i in w:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in wanted: ds.add(o.mem.disp)
            if len(ds)>=2:
              print(f'\n-- candidate {a:#x} disps={[hex(x) for x in sorted(ds)]} --')
              for i in w:print(fmt(i))
          print('\n=== TARGET ===')
          print('Prove the exact function that mutates ASN_R/G/B and whether it reads serialized TF enable/count/pairs directly or via a reformatted config block.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v161_ca9_asn_triplet_tf_consumer.txt
          git commit -m 'research: record v1.61 ASN triplet and TF consumer trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push