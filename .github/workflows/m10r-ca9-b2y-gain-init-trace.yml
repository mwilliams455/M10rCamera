name: M10-R CA9_PARITY1 B2Y Gain Init Trace
on:
  push:
    branches: [m10r-ca9-parity1]
    paths:
      - '.github/workflows/m10r-ca9-b2y-gain-init-trace.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone

      - name: Trace B2Y base users outside rendered-color programmer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' \
            -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null

          python3 - <<'PY' > research/M10R_ca9_parity1_b2y_gain_init_trace.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):
              aa=max(BASE,a);zz=min(BASE+len(b)-PFX,z)
              return [] if zz<=aa else list(md.disasm(b[off(aa):off(zz)],aa))
          def lit(i):
              try:
                  if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                      if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
              except Exception:pass
          def call(i):
              try:
                  if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
              except Exception:pass
          def fmt(i):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
              if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              c=call(i)
              if c is not None:s+=f' ; CALL {c:#x}'
              return s
          def prev_prologue(a,span=0x500):
              p=None
              for i in dis(a-span,a+2):
                  if i.mnemonic=='push' and 'lr' in i.op_str:p=i.address
              return p

          # Raw pool search located B2Y base literals around 0x420d11xx..0x420d44xx.
          # Traverse only that bounded subsystem window.
          scan=dis(0x420cf000,0x420d5000)
          vals=(0x20020080,0x20020880,0x20022400,0x01000100,0x00000100,0xf800ffff)
          refs={v:[] for v in vals}
          for i in scan:
              q=lit(i)
              if q and q[1] in refs:refs[q[1]].append(i.address)
          print('M10-R CA9_PARITY1 B2Y GAIN INIT / RESET TRACE')
          print('\n=== bounded literal references ===')
          for v in vals:print(hex(v),[hex(x) for x in refs[v]])

          funcs=[]
          for a in refs[0x20020080]+refs[0x20020880]:
              p=prev_prologue(a)
              if p and p not in funcs:funcs.append(p)
          print('\n=== candidate functions owning B2Y base refs ===')
          print([hex(x) for x in funcs])
          for p in funcs:
              print(f'\n-- function slice from {p:#x} --')
              # bounded large-enough slice; stop after second pop/return when possible
              blk=dis(p,p+0x700);ret_seen=0
              for i in blk:
                  print(fmt(i))
                  if (i.mnemonic=='pop' and 'pc' in i.op_str) or i.mnemonic=='bx' and 'lr' in i.op_str:
                      ret_seen+=1
                      if ret_seen>=1:break

          print('\n=== focused neighborhoods around each B2Y-base code ref ===')
          for a in refs[0x20020080]+refs[0x20020880]:
              print('-- ref',hex(a),'prologue',hex(prev_prologue(a) or 0),'--')
              for i in dis(a-0x60,a+0xa0):print(fmt(i))

          print('\n=== instructions carrying immediate 256 in candidate functions ===')
          for p in funcs:
              for i in dis(p,p+0x700):
                  try:
                      if any(o.type==ARM_OP_IMM and o.imm==256 for o in i.operands):print(hex(p),fmt(i))
                  except Exception:pass

          print('\n=== interpretation guard ===')
          print('A write of 0x01000100, or two 0x100 channel fields, specifically to B2Y +0x0C/+0x10 would prove 256 as reset/default unity. Generic 0x100 constants elsewhere do not.')
          print('\n=== target ===')
          print('Identify direct reset/init values for gain words 0x2002008C and 0x20020090. If absent, mark hardware-unity reset as not recovered and proceed to datapath/FPGA evidence.')
          PY

      - name: Commit trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_ca9_parity1_b2y_gain_init_trace.txt
          git commit -m 'research: trace B2Y WB gain init and reset paths' || exit 0
          git pull --rebase origin m10r-ca9-parity1
          git push
