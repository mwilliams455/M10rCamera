name: M10-R v0.16 IMG command 0x32 and CA9 AE producer
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v016-img-cmd32-ca9.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace IMG
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v016-img-cmd32-ca9.txt
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          img=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); base=0x42000000; pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          ins=[i for i in md.disasm(img[pfx:],base) if i.mnemonic!='.byte']
          print('IMG_SIZE',len(img),'INS',len(ins))
          # Immediate 0x32 materializations: print broad neighborhoods.
          hits=[]
          for n,i in enumerate(ins):
            if '#0x32' in i.op_str or '#50' in i.op_str:
              hits.append(n)
          print('IMM32_HITS',[(hex(ins[n].address),ins[n].mnemonic,ins[n].op_str) for n in hits])
          for n in hits:
            print('\n=== IMM32_'+hex(ins[n].address)+' ===')
            for j in ins[max(0,n-45):min(len(ins),n+70)]: print(f'{j.address:08x}: {j.mnemonic:8s} {j.op_str}')
          # Locate key strings and all direct pointer literals to them.
          terms=[b'CA9: AE MODULE',b'liveview',b'Live view',b'AE algorithm running',b'Exposure']
          for term in terms:
            pos=0
            while True:
              pos=img.find(term,pos)
              if pos<0: break
              va=base+pos-pfx; print('\nSTRING',term.decode('ascii','ignore'),hex(va))
              needle=struct.pack('<I',va); q=0; lits=[]
              while True:
                q=img.find(needle,q)
                if q<0:break
                lits.append(base+q-pfx);q+=1
              print('PTR_LITERALS',[hex(x) for x in lits])
              # Print code refs to literal pools.
              for n,i in enumerate(ins):
                if i.mnemonic.startswith('ldr') and '[pc' in i.op_str:
                  try:
                    disp=int(i.op_str.split('#')[1].split(']')[0],0)
                    lit=((i.address+4)&~3)+disp
                  except: continue
                  if lit in lits:
                    print('CODE_REF',hex(i.address),'LIT',hex(lit))
                    print('---')
                    for j in ins[max(0,n-55):min(len(ins),n+95)]: print(f'{j.address:08x}: {j.mnemonic:8s} {j.op_str}')
              pos+=1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v016-img-cmd32-ca9
          path: /tmp/m10r-v016-img-cmd32-ca9.txt
          if-no-files-found: error
