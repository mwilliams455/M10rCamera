name: M10-R v1.97 B2Y object acquire contrast trace
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v197-b2y-object-acquire-contrast.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode object acquisition and contrast field source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v197_b2y_object_acquire_contrast.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          def off(a):return P+a-BASE
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            try:
              o=ops(i)
              if i.mnemonic in ('bl','blx') and o and o[0].type==ARM_OP_IMM:return o[0].imm&~1
            except:pass
          def lit(i):
            try:
              o=ops(i)
              if i.mnemonic.startswith('ldr') and len(o)>=2 and o[1].type==ARM_OP_MEM and o[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+o[1].mem.disp;fo=off(la)
                if 0<=fo<=len(b)-4:return la,struct.unpack_from('<I',b,fo)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def dump(a,z):
            for i in md.disasm(b[off(a):off(z)],a):print(fmt(i))
          print('M10-R v1.97 B2Y OBJECT ACQUIRE / CONTRAST')
          print('\n=== acquire helper 0x42160d40..0x42161040 ===')
          dump(0x42160d40,0x42161040)
          print('\n=== immediate caller setup first acquire ===')
          dump(0x42169e90,0x42169ef0)
          print('\n=== immediate caller setup second acquire ===')
          dump(0x4216a0e0,0x4216a120)
          print('\n=== literals/globals around acquire helper data pool ===')
          lo=max(0,off(0x42160d40));hi=min(len(b),off(0x42161120))
          for m in re.finditer(rb'[ -~]{4,}',b[lo:hi]): print(hex(BASE+lo+m.start()-P),repr(m.group().decode('ascii','replace')))
          print('\n=== accesses near +0xAC relative to any non-SP base inside acquire helper ===')
          for i in md.disasm(b[off(0x42160d40):off(0x42161040)],0x42160d40):
            try:
              for op in ops(i):
                if op.type==ARM_OP_MEM and op.mem.disp in (0xa8,0xac,0xb0,0xb4,0xb8): print(fmt(i));break
            except:pass
          print('\n=== writes through r2 or aliases, and pointer-return candidates ===')
          for i in md.disasm(b[off(0x42160d40):off(0x42161040)],0x42160d40):
            try:
              if i.mnemonic.startswith('str') and any(op.type==ARM_OP_MEM for op in ops(i)):print(fmt(i))
            except:pass
          print('\nTARGET: determine whether 0x42160D40 allocates, retrieves, or copies the B2Y parameter object; identify the exact returned-pointer source and whether contrast +0xAC is already initialized in that object. If it only returns an existing object pointer, identify the narrow next producer/global to trace.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v197_b2y_object_acquire_contrast.txt
          git commit -m 'research: record v1.97 B2Y object acquire contrast trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push