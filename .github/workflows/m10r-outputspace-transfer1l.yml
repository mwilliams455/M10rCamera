name: M10-R output-space transfer 1L
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1l.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace output-space string consumer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1L.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def one(a):
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1)) if BASE<=a<BASE+len(b)-PFX else []
            return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def cstr(a,n=160):
            if not BASE<=a<BASE+len(b)-PFX:return ''
            o=off(a);e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e] if e>o else b''
            try:return q.decode('ascii')
            except:return ''
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:
              s+=f' ; LIT {hex(x[0])}->{hex(x[1])}';st=cstr(x[1])
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER1L')
          print('\n=== EXACT COLORSPACE STRINGS ===')
          for a in (0x42151884,0x42151898,0x421518b0):print(hex(a),repr(cstr(a)),b[off(a):off(a)+32].hex())
          print('\n=== SOLE MODE-STRING CALLER REGION 0x42152200..0x42152680 ===')
          ins=dis(0x42152200,0x42152680)
          for i in ins:print(fmt(i))
          print('\n=== CALL SURFACE AFTER 0x42152354 ===')
          for i in ins:
            if 0x42152354<=i.address<0x42152680 and call(i) is not None:print(fmt(i))
          print('\n=== PASS/USE OF STACK STRING STRUCT POINTERS ===')
          for i in ins:
            if i.address>=0x42152354 and ('sp, #0x30' in i.op_str or 'sp, #0xb0' in i.op_str or 'sp, #0x' in i.op_str and i.mnemonic in ('add','ldr','str')):print(fmt(i))
          print('\n=== CALLS TO B2Y SELECTOR FAMILY FROM CALLER REGION ===')
          for i in ins:
            t=call(i)
            if t and 0x42153000<=t<0x42156000:print(fmt(i))
          print('\n=== CALLERS OF PARENT REGION FUNCTIONS NEAR 0x42152200 ===')
          # locate likely function starts by push, then show direct callers of starts in broader IMG neighborhood
          starts=[i.address for i in ins if i.mnemonic=='push' and 'lr' in i.op_str]
          print('STARTS',','.join(hex(x) for x in starts))
          for st in starts:
            hits=[]
            for a in range(0x4214f000,0x42157000,2):
              j=one(a)
              if j and call(j)==st:hits.append(a)
            if hits:print('CALLERS',hex(st),','.join(hex(x) for x in hits))
          print('\n=== GATE ===')
          print('If ColorSpace string struct is only filled/copied/logged and never passed to a B2Y selector/programmer, treat 0x42151508 as descriptive serialization. If it reaches CC0/CC1 selector payloads, trace only those consumers for mode-specific behavior.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1L.txt
          git commit -m 'research: record output-space string consumer trace 1L' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
