name: M10-R YBLEND GAMMA CALLERS1L
on:
  push:
    branches: [m10r-yblend-topology1k]
    paths:
      - '.github/workflows/m10r-yblend-gamma-callers1l.yml'
      - 'tools/m10r_yblend_gamma_callers1l.py'
      - 'tools/m10r_sections.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone==5.0.3
      - name: Decode firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker);z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Trace callers
        run: |
          mkdir -p results
          python3 tools/m10r_yblend_gamma_callers1l.py /tmp/sec --out results/M10R_YBLEND_GAMMA_CALLERS1L.json | tee results/M10R_YBLEND_GAMMA_CALLERS1L.txt
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/generated
          cp results/M10R_YBLEND_GAMMA_CALLERS1L.* research/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/M10R_YBLEND_GAMMA_CALLERS1L.*
          git commit -m "Research freeze DGamma writer callers" || exit 0
          git pull --rebase origin m10r-yblend-topology1k
          git push origin HEAD:m10r-yblend-topology1k
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M10R-YBLEND-GAMMA-CALLERS1L
          path: results/
          retention-days: 90
