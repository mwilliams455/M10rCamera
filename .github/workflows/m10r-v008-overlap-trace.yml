name: M10-R static trace

on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.m10r-v008-trigger']

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace selector-5 receive channels
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-selector5-receive.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/090_CTRL-System.bin').read_bytes();base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(v):return pfx+v-base
          def dis(label,s,e):
            print(f'\n=== {label} {s:#010x}..{e:#010x} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte':print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          print('SELECTOR5: dispatcher 0x0801D6DA case r0==5 -> 0x0801D886 -> 0x0800E1EC')
          callers=[0x08015634,0x0801569c,0x08018538,0x0801859c,0x08018616,0x0801862a]
          for a in callers: dis('DISPATCH_CALL_'+hex(a),a-160,a+96)
          # direct callers of these enclosing receive helpers, to identify transport registration
          print('\n=== CALLS INTO CALLER NEIGHBORHOODS ===')
          ranges=[(0x08015580,0x08015720),(0x08018460,0x08018680)]
          for i in md.disasm(b[pfx:],base):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
              t=i.operands[0].imm
              if any(lo<=t<hi for lo,hi in ranges): print(hex(i.address),'->',hex(t))
          # print strings referenced from the receive regions
          print('\n=== STRINGS REFERENCED FROM RECEIVE REGIONS ===')
          strings={}
          for m in re.finditer(rb'[ -~]{4,120}\x00',b): strings[base+m.start()-pfx]=m.group()[:-1].decode('ascii','ignore')
          for i in md.disasm(b[off(0x08015560):off(0x08018680)],0x08015560):
            if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              lit=((i.address+4)&~3)+i.operands[1].mem.disp
              if base<=lit<=base+len(b)-pfx-4:
                v=struct.unpack_from('<I',b,off(lit))[0]
                if v in strings: print(hex(i.address),'->',hex(v),repr(strings[v]))
          # selector-5 immediate nearby call candidates in ALL Thumb-like sections; keep only sites with a BL within next 4 insns.
          print('\n=== NON-CTRL MOV R0,#5 + NEAR BL CANDIDATES ===')
          for path in sorted(Path('/tmp/sections').glob('*.bin')):
            if path.name.startswith('090_'): continue
            data=path.read_bytes()
            # sections with ARM/Thumb images are scanned heuristically from offset 4 at VA 0; report offsets only.
            md2=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md2.detail=True;md2.skipdata=True
            ins=list(md2.disasm(data[4:],0))
            hits=[]
            for idx,i in enumerate(ins):
              if i.mnemonic in ('movs','mov.w','mov') and i.op_str.replace(' ','') in ('r0,#5','r0,#0x5'):
                nxt=ins[idx+1:idx+5]
                bs=[x for x in nxt if x.mnemonic in ('bl','blx')]
                if bs: hits.append((i.address,[(x.address,x.op_str) for x in bs]))
            if hits:
              print('\nSECTION',path.name,'COUNT',len(hits))
              for h in hits[:120]: print(hex(h[0]),[(hex(a),s) for a,s in h[1]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-selector5-receive
          path: /tmp/m10r-selector5-receive.txt
          if-no-files-found: error
