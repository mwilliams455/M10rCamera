name: M10-R v2.36c ColorSpec helper semantics
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v236c-ca9-colorspec-helper-semantics.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace only direct ColorSpec math helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v236c_ca9_colorspec_helper_semantics.txt
          from pathlib import Path
          import struct,math
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          arm=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); arm.detail=True
          th=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); th.detail=True
          def off(a): return PFX+a-BASE
          def dump(md,a,z,name):
              print(f'=== {name} {a:08x}..{z:08x} ===')
              for i in md.disasm(b[off(a):off(z)],a): print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}')
              print()
          print('M10-R v2.36c CA9 COLORSPEC HELPER SEMANTICS TRACE')
          print('Only direct callees required to express the v2.36/v2.36b white-construction path.')
          print()
          dump(arm,0x40004360,0x40004420,'matrix scalar / comparison helpers')
          dump(arm,0x40004480,0x400047b0,'matrix-matrix and matrix-vector helpers')
          dump(arm,0x40004910,0x40004980,'XYZ/vector to xy helper')
          dump(arm,0x400058a0,0x40005980,'white adaptation matrix builder')
          dump(arm,0x40012fc0,0x40013150,'xy/vector/matrix wrapper helpers')
          dump(th,0x40012940,0x400129d0,'rounding helper complete Thumb')
          dump(th,0x400133d0,0x40013430,'rounding primitive callee Thumb')
          print('=== REQUIRED OUTPUT SEMANTICS ===')
          print('Label only helpers whose arithmetic/data movement proves their role. These labels will be used by tools/m10r_ca9_colorspec_oracle.py.')
          PY
      - name: Commit v2.36c trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v236c_ca9_colorspec_helper_semantics.txt
          git commit -m 'research: record v2.36c ColorSpec helper semantics' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
