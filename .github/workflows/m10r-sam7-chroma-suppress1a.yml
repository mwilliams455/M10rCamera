name: M10-R SAM7 CHROMA-SUPPRESS1A

on:
  push:
    branches: [m10r-b2y-saturationfields1a]
    paths:
      - '.github/workflows/m10r-sam7-chroma-suppress1a.yml'
      - 'tools/m10r_sam7_chroma_suppress1a.py'
      - 'tools/m10r_sections.py'
  workflow_dispatch:

permissions: {contents: write}

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone==5.0.3
      - name: Decode matched M10-R firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          x=p.index(marker)+len(marker); y=p.index("\n          CPP",x)
          Path('/tmp/unpack.cpp').write_text(p[x:y])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' \
            -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null

      - name: Recover SAM7 chroma-suppress writer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sam7_chroma1a_results
          python3 tools/m10r_sam7_chroma_suppress1a.py /tmp/sec \
            --out sam7_chroma1a_results/M10R_SAM7_CHROMA_SUPPRESS1A.json \
            | tee sam7_chroma1a_results/stdout.txt
          git rev-parse HEAD > sam7_chroma1a_results/source_commit.txt

      - name: Assert page ownership candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('sam7_chroma1a_results/M10R_SAM7_CHROMA_SUPPRESS1A.json').read_text())
          assert d['schema']=='M10R_SAM7_CHROMA_SUPPRESS1A_V1'
          assert d['diag_offsets'], d
          assert d['page_literal_offsets'], d
          assert d['functions'], d
          print('diag',d['diag_offsets'])
          print('page literals',d['page_literal_offsets'])
          print('functions',[x['function_start'] for x in d['functions']])
          PY

      - name: Persist trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/generated
          cp sam7_chroma1a_results/M10R_SAM7_CHROMA_SUPPRESS1A.json research/generated/M10R_SAM7_CHROMA_SUPPRESS1A.json
          cp sam7_chroma1a_results/stdout.txt research/generated/M10R_SAM7_CHROMA_SUPPRESS1A.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/M10R_SAM7_CHROMA_SUPPRESS1A.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research freeze SAM7 chroma suppress trace"
          git push origin HEAD:m10r-b2y-saturationfields1a

      - uses: actions/upload-artifact@v4
        with:
          name: M10R-SAM7-CHROMA-SUPPRESS1A-RESULTS
          path: sam7_chroma1a_results/
          retention-days: 90
