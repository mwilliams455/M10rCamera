name: M10-R output-space transfer 3T
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3t.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Identify B2Y parasets keyed by colorspace string offset 0x48
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3T.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return P+a-B
          def ds(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM:return ((i.address+4)&~3)+i.operands[1].imm
            except:pass
          def cstr(a,n=180):
            q=off(a)
            if not 0<=q<len(b):return None
            z=b.find(b'\0',q,min(len(b),q+n));z=min(len(b),q+n) if z<0 else z;x=b[q:z]
            if x and all(32<=c<127 or c in (9,10,13) for c in x):return x.decode('latin1','replace')
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);a=adr(i);x=lit(i)
            if a is not None:s+=f' ; ADR={a:#x} STR={repr(cstr(a))}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x} PTRSTR={repr(cstr(x[1]))}'
            if c is not None:s+=f' ; CALL={c:#x}'
            return s
          LO,HI=0x42153000,0x42155400
          ins=ds(LO,HI)
          starts=[]
          for i in ins:
            if i.mnemonic=='push' and 'lr' in i.op_str:starts.append(i.address)
          starts.append(HI)
          print('M10-R OUTPUTSPACE TRANSFER3T')
          print('\n=== FUNCTIONS IN SELECTOR RANGE ===')
          for i in range(len(starts)-1):
            s,e=starts[i],starts[i+1]
            fi=[x for x in ins if s<=x.address<e]
            if not fi:continue
            hits=[x for x in fi if '0x48' in x.op_str]
            # Also mark selector helpers and B2Y.bin loader functions
            calls=[call(x) for x in fi if call(x) is not None]
            strings=[cstr(adr(x)) for x in fi if adr(x) is not None and cstr(adr(x))]
            interesting=bool(hits) or 0x421a0fc0 in calls or any('String' in t or 'STRING' in t or 'B2Y.bin' in t for t in strings)
            if not interesting:continue
            print('\nFUNC',hex(s),'END',hex(e),'OFFSET48', [hex(x.address) for x in hits])
            for t in strings:print('  STR',repr(t))
            for x in fi:print(fmt(x))
          print('\n=== STRICT +0x48 CONCATENATION HITS ===')
          # Look for +0x48 immediately feeding strcat-like 0x4204f1f4/0x4204efd4
          for idx,i in enumerate(ins):
            if '0x48' not in i.op_str:continue
            win=ins[max(0,idx-4):min(len(ins),idx+8)]
            if any(call(x) in (0x4204f1f4,0x4204efd4) for x in win):
              print('\nHIT',fmt(i))
              for x in win:print(fmt(x))
          print('\n=== B2Y.BIN RECORD LOAD CALLS WITH NEARBY IDs ===')
          for idx,i in enumerate(ins):
            if call(i)==0x421a0fc0:
              print('\nLOAD',hex(i.address))
              for x in ins[max(0,idx-8):idx+3]:print(fmt(x))
          print('\n=== DOWNSTREAM DRIVER SETTERS FROM COLORSPACE-KEYED FUNCTIONS ===')
          # For each function with strict +0x48, print calls into driver address space
          keyed=[]
          for j in range(len(starts)-1):
            s,e=starts[j],starts[j+1];fi=[x for x in ins if s<=x.address<e]
            if any('0x48' in x.op_str for x in fi) and any(call(x) in (0x4204f1f4,0x4204efd4) for x in fi):keyed.append((s,e,fi))
          for s,e,fi in keyed:
            print('\nKEYEDFUNC',hex(s))
            for x in fi:
              c=call(x)
              if c is not None and 0x420c0000<=c<0x420e0000:print(fmt(x))
          print('\n=== DECISION GATE ===')
          print('Map selector-object +0x48 (the SRGB/ADOBERGB/ECI string) to exact B2Y paraset types and downstream driver setters. This determines which blocks are actually output-space dependent.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3T.txt
          git commit -m 'research: map colorspace-keyed B2Y parasets 3T' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
