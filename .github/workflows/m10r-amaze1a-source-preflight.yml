name: M10-R AMaZE1A source preflight
on:
  push:
    branches: [m10r-render2n-amaze1a]
    paths: ['.github/workflows/m10r-amaze1a-source-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@v4
        with:
          repository: mwilliams455/M9Camera_refresh
          ref: a00e722bf25b4c609ae9addcc4b612e6d8e434d6
          path: m9-reference
          sparse-checkout: |
            patches/colourtrial1c/upstream
            patches/amazeperf1a
      - name: Reconstruct verified RENDER2M source only
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          w=yaml.safe_load(Path('.github/workflows/m10r-render2m-meterarea1a.yml').read_text())
          for name in ['Reconstruct verified RENDER2L baseline','Insert shadow probe and prove frozen photometric code']:
              steps=[s for s in w['jobs']['build']['steps'] if s.get('name')==name]
              assert len(steps)==1,name
              subprocess.run(['bash','-euo','pipefail','-c',steps[0]['run']],check=True)
          PY
      - name: Package source for host integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          Path('source-export').mkdir()
          manifest={}
          with zipfile.ZipFile('source-export/AMAZE1A_PINNED_SOURCES.zip','w',zipfile.ZIP_DEFLATED) as z:
              for prefix,root in [('m10r',Path('.')),('m9-upstream',Path('m9-reference/patches/colourtrial1c/upstream')),('assembled',Path('PhotonCamera'))]:
                  if prefix=='m10r':
                      paths=[p for folder in ['patches','android','native','tests','.github/workflows'] for p in Path(folder).rglob('*') if p.is_file()]
                  elif prefix=='assembled':
                      paths=[p for p in root.rglob('*') if p.is_file() and (p.suffix in ['.java','.cpp','.cc','.c','.h','.hpp','.gradle','.json'] or p.name=='CMakeLists.txt') and '.git' not in p.parts]
                  else: paths=[p for p in root.rglob('*') if p.is_file()]
                  for p in paths:
                      name=prefix+'/'+str(p.relative_to(root))
                      z.write(p,name)
                      manifest[name]=hashlib.sha256(p.read_bytes()).hexdigest()
              z.writestr('MANIFEST.json',json.dumps(manifest,indent=2))
          print('Source entries:',len(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-AMAZE1A-PINNED-SOURCES
          path: source-export/
          retention-days: 90
          if-no-files-found: error
