name: M10-R v1.80 B2Y dynamic CC provenance
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v180-b2y-dynamic-cc-provenance.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace central B2Y object and dynamic CC coefficient provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v180_b2y_dynamic_cc_provenance.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4;END=BASE+len(b)-P
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return P+a-BASE
          def dis(a,z):return list(md.disasm(b[off(max(BASE,a)):off(min(END,z))],max(BASE,a)))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          whole=list(md.disasm(b[P:],BASE))
          target=0x42154f84
          callers=[i.address for i in whole if call(i)==target]
          print('M10-R v1.80 B2Y DYNAMIC CC PROVENANCE')
          print('central selector',hex(target),'callers',[hex(x) for x in callers])
          for a in callers:
            print(f'\n=== caller context {a:#x} +/-0x500 ===')
            for i in dis(a-0x500,a+0x500):print(fmt(i))
          print('\n=== direct refs to rendered CC globals ===')
          for T in (0x408fe130,0x408fe15c,0x408fe124):
            refs=[]
            for i in whole:
              q=lit(i)
              if q and q[1]==T:refs.append(i.address)
            print(hex(T),[hex(x) for x in refs])
            for a in refs:
              if 0x42140000<=a<0x42180000 or any(abs(a-c)<0x3000 for c in callers):
                print('--',hex(a));
                for i in dis(a-0x60,a+0xc0):print(fmt(i))
          print('\n=== stores with displacement 0x100..0x160 in IMG-System ===')
          hits=[]
          for i in whole:
            try:
              if i.mnemonic.startswith('str'):
                for op in i.operands:
                  if op.type==ARM_OP_MEM and 0x100<=op.mem.disp<=0x160:hits.append(i.address);break
            except:pass
          print('count',len(hits),'first',[hex(x) for x in hits[:300]])
          # Focus neighborhoods that are near central caller(s), selectors, B2Y programmers, or rendered-CC refs
          anchors=callers+[0x42154f84,0x42152f8c,0x421536bc,0x420a3638]
          for a in hits:
            if any(abs(a-x)<0x5000 for x in anchors):
              print(f'\n-- offset-store hit {a:#x} --')
              for i in dis(a-0x50,a+0x90):print(fmt(i))
          print('\n=== functions calling CC selectors or B2Y programmers ===')
          for T in (0x42153d24,0x42153dec,0x42152f8c,0x421536bc):
            aa=[i.address for i in whole if call(i)==T];print(hex(T),[hex(x) for x in aa])
            for a in aa:
              print('-- caller',hex(a));
              for i in dis(a-0x100,a+0x180):print(fmt(i))
          print('\nTARGET: prove provenance of central B2Y object +0x100 dynamic coefficient block used by CC0/CC1, preferably connecting it directly to CA9-rendered matrices 0x408FE130/15C; distinguish any intermediate format conversion/copy.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v180_b2y_dynamic_cc_provenance.txt
          git commit -m 'research: record v1.80 B2Y dynamic CC provenance' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push