name: M10-R v0.23 compact AE chain trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v023-compact-ae-chain.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Build compact trace
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v023_compact_ae_chain.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC

          def setup(path,base,pfx=4):
              b=Path(path).read_bytes(); md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
              def off(a): return pfx+a-base
              def r32(a):
                  o=off(a); return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
              def line(i):
                  ex=''
                  if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      la=((i.address+4)&~3)+i.operands[1].mem.disp; v=r32(la)
                      if v is not None: ex=f' ; LIT {la:#x}->{v:#x}'
                  if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: ex+=f' ; CALL {i.operands[0].imm:#x}'
                  return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
              def dump(a,z,title):
                  print(f'\n=== {title} {a:#x}..{z:#x} ===')
                  for i in md.disasm(b[off(a):off(z)],a):
                      if i.mnemonic!='.byte': print(line(i))
              def all_ins(): return list(md.disasm(b[pfx:],base))
              return b,md,off,r32,line,dump,all_ins

          ib,imd,ioff,ir32,iline,idump,iall=setup('/tmp/sections/092_IMG-System.bin',0x42000000)
          idump(0x42161fa0,0x42162220,'IMG CA9 AE COMPLETION / PACK PRODUCER')
          idump(0x420ab8a0,0x420ab8bc,'IMG EVENT 0x78000032 WRAPPER')
          print('\n=== IMG CALLERS OF EVENT WRAPPER 0x420ab8a0 ===')
          ins=iall(); callers=[]
          for i in ins:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==0x420ab8a0: callers.append(i.address)
          print('CALLERS', [hex(x) for x in callers])
          for a in callers: idump(max(0x42000000,a-0x50),a+0x60,'CALLER '+hex(a))

          cb,cmd,coff,cr32,cline,cdump,call=setup('/tmp/sections/090_CTRL-System.bin',0x08000000)
          target=0x20000132; pat=struct.pack('<I',target); q=0; lits=[]
          while True:
              q=cb.find(pat,q)
              if q<0: break
              lits.append(0x08000000+q-4); q+=1
          refs=[]
          for i in call():
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  la=((i.address+4)&~3)+i.operands[1].mem.disp
                  if la in lits: refs.append(i.address)
          print('\n=== CTRL SELECTOR 0x20000132 XREFS ===')
          print('LITERALS',[hex(x) for x in lits]); print('REFS',[hex(x) for x in refs])
          for a in refs: cdump(max(0x08000000,a-0x50),a+0x70,'SELECTOR XREF '+hex(a))
          cdump(0x0800f180,0x0800f2b0,'CTRL SELECTOR HELPER + BVCMOS UPDATE')
          cdump(0x08003020,0x08003120,'CTRL LVVIDEOSYNC RING INGEST')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v023_compact_ae_chain.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.23 compact AE chain trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
