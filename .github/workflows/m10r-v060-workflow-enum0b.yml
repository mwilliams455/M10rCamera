name: M10-R v0.60 workflow enum 0x0b
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v060-workflow-enum0b.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Trace workflow enum 0x0b
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v060_workflow_enum0b.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();base=0x42000000;pfx=4;code=b[pfx:]
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return pfx+a-base
          def u32(a):
              o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def astr(a,n=260):
              o=off(a)
              if not 0<=o<len(b):return None
              z=b.find(b'\0',o,min(len(b),o+n));z=z if z>=0 else min(len(b),o+n)
              try:s=b[o:z].decode('ascii')
              except:return None
              return s if len(s)>3 and all(c in '\r\n\t' or ' '<=c<='~' for c in s) else None
          def fmt(i):
              if i.id==0:return f'{i.address:08x}: .byte {i.op_str}'
              ex=''
              try:
                  if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      la=((i.address+4)&~3)+i.operands[1].mem.disp;v=u32(la)
                      if v is not None:
                          s=astr(v);ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
              except:pass
              return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
          ins=list(md.disasm(code,base)); idx={i.address:n for n,i in enumerate(ins)}
          print('M10-R v0.60 WORKFLOW ENUM 0x0B TRACE')
          print('Owner 0x42161FA0 sets command32 lf when indexed workflow object +0x20C == 0x0B.')
          candidates=[]
          for n,i in enumerate(ins):
              try:
                  if i.mnemonic.startswith('cmp') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM and i.operands[1].imm==0xb:
                      # prioritize if backward 20 insns contains +0x20c or global 0x408fc238/table 0x408cecf0
                      prev=ins[max(0,n-22):n+1]
                      txt=' '.join(x.op_str.lower() for x in prev)
                      score=(('0x20c' in txt)*4 + ('0x40' in txt)*1)
                      # inspect literals
                      lits=[]
                      for x in prev:
                          try:
                              if x.mnemonic.startswith('ldr') and len(x.operands)>1 and x.operands[1].type==ARM_OP_MEM and x.operands[1].mem.base==ARM_REG_PC:
                                  la=((x.address+4)&~3)+x.operands[1].mem.disp;v=u32(la)
                                  if v in (0x408fc238,0x408cecf0):score+=4
                                  s=astr(v) if v is not None else None
                                  if s:lits.append((x.address,s))
                          except:pass
                      if score or lits:candidates.append((score,i.address,lits))
              except:pass
          candidates=sorted(candidates,reverse=True)
          print('CANDIDATES',[(s,hex(a),l) for s,a,l in candidates[:80]])
          for s,a,l in candidates[:40]:
              print(f'\n=== CMP_0B candidate score={s} at {a:#x} ===')
              n=idx[a]
              for x in ins[max(0,n-35):min(len(ins),n+45)]:
                  if abs(x.address-a)<=0xb0: print(fmt(x))
          print('\nSEMANTIC STRING HITS')
          needles=(b'workflow',b'Workflow',b'LIVE',b'Live',b'live',b'finder',b'Finder',b'video',b'Video',b'sensor operation',b'SensorOperation',b'preview',b'Preview')
          hits=[]
          for needle in needles:
              q=0
              while True:
                  q=b.find(needle,q)
                  if q<0:break
                  va=base+q-pfx;z=b.find(b'\0',q,min(len(b),q+240));z=z if z>=0 else min(len(b),q+240)
                  s=b[q:z].decode('ascii','replace')
                  hits.append((va,s));q+=1
          for va,s in sorted(set(hits))[:600]: print(hex(va),repr(s))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v060_workflow_enum0b.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.60 workflow enum 0x0b trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
