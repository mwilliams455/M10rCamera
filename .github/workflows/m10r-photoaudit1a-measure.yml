name: M10-R PHOTOAUDIT1B validated measurements
on:
  push:
    branches: [m10r-photoaudit1a]
    paths: ['tools/m10r_photoaudit_measure1a.py', 'tools/m10r_photoaudit_validate1b.py', '.github/workflows/m10r-photoaudit1a-measure.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: M10R-PHOTOAUDIT1A-RESEARCH-INPUTS
          path: audit_inputs
          run-id: 35518775600
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pinned measurement dependencies
        run: python3 -m pip install --quiet numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.13.0.92
      - name: Native same-RAW audit and actual-pixel validation
        run: |
          set -euo pipefail
          mkdir -p audit_results
          python3 tools/m10r_photoaudit_validate1b.py audit_inputs audit_results | tee audit_results/stdout.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_results/results.json').read_text())
          assert r['status']=='PASS_PHOTOAUDIT1B_ACTUAL_RGB_PIXELS'
          assert len(r['scenes'])==6
          assert r['frozen_renderer_modified'] is False
          assert r['capture_policy_modified'] is False
          PY
      - name: Persist completed evidence on isolated branch
        run: |
          set -euo pipefail
          cp audit_results/results.json research/M10R_PHOTOAUDIT1B_RESULTS_20260920.json
          cp audit_results/REPORT.md research/M10R_PHOTOAUDIT1B_20260920.md
          cp audit_results/PHOTOAUDIT1B_HELDOUT_COMPARISON.jpg research/photoaudit1a_source/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_PHOTOAUDIT1B* research/photoaudit1a_source/PHOTOAUDIT1B_HELDOUT_COMPARISON.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'audit: retain validated same-RAW tonal and colour error measurements'
            git pull --rebase origin m10r-photoaudit1a
            git push origin HEAD:m10r-photoaudit1a
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M10R-PHOTOAUDIT1B-VALIDATED-MEASUREMENTS
          path: |
            audit_results/
            tools/m10r_photoaudit_measure1a.py
            tools/m10r_photoaudit_validate1b.py
          retention-days: 90
          if-no-files-found: error
