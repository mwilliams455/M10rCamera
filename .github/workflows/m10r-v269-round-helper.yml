name: M10-R v2.69 CC round-helper exact trace
on:
  push:
    branches: [m10r-wbcc0-v269-research]
    paths: ['.github/workflows/m10r-v269-round-helper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Unpack firmware and dump round helper plus residual-base callee
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v269_round_helper_40012940.txt
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN

          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes()
          BASE=0x40000000; PFX=4
          def off(a): return PFX+a-BASE
          def hx(a,z):
              d=b[off(a):off(z)]
              for q in range(0,len(d),16):
                  print(f'{a+q:08x}: '+d[q:q+16].hex(' '))
          def dump(a,z,title,thumb=False):
              mode=(CS_MODE_THUMB if thumb else CS_MODE_ARM)|CS_MODE_LITTLE_ENDIAN
              md=Cs(CS_ARCH_ARM,mode); md.detail=True
              print(f'=== {title} {a:08x}..{z:08x} mode={"THUMB" if thumb else "ARM"} ===')
              for i in md.disasm(b[off(a):off(z)],a):
                  print(f'{i.address:08x}: {i.bytes.hex():10s} {i.mnemonic:12s} {i.op_str}')
              print()
          print('M10-R v2.69 EXACT CC ROUND-HELPER TRACE — CALLEE INCLUDED')
          print('firmware sha256 ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498')
          print('ARM callers BLX 0x40012940; helper executes Thumb. Helper BL 0x400133D0; callee also executes Thumb.')
          print()
          print('=== raw bytes / constants around helper ===')
          hx(0x40012920,0x40012a80)
          print()
          dump(0x40012940,0x400129c8,'0x40012940 exact helper body',thumb=True)
          dump(0x400133d0,0x40013520,'0x400133D0 residual-base callee',thumb=True)
          dump(0x400038b0,0x40003b20,'rendered-CC builder and scale-search callers',thumb=False)
          dump(0x40012f20,0x40012f90,'additional direct caller neighborhood',thumb=False)
          print('INTERPRETATION BOUNDARY')
          print('- d2/d3/d4 literals used by 0x40012940 resolve to +1.0/+0.5/-0.5.')
          print('- Exact round mode is frozen only after identifying what 0x400133D0 returns for finite positive/negative doubles.')
          print('- Helper participates in scale search, so semantics can alter q[i] and selected scaleCode.')
          PY
      - name: Commit helper plus callee trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v269_round_helper_40012940.txt
          git commit -m 'research: record v269 CC round-helper callee trace' || exit 0
          git pull --rebase origin m10r-wbcc0-v269-research
          git push
