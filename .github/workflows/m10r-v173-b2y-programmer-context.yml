name: M10-R v1.73 B2Y programmer context
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v173-b2y-programmer-context.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y programmer callers, object fields, and helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v173_b2y_programmer_context.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(max(BASE,a)):off(min(END,z))],max(BASE,a)))
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            oo=ops(i)
            if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
          def lit(i):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>1 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+oo[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          # whole-image direct callers of both programmers
          progs=[0x42152f8c,0x421536bc]
          whole=[];a=BASE
          while a<END:
            whole.extend(dis(a,min(END,a+0x10000)));a+=0x10000
          print('M10-R v1.73 B2Y PROGRAMMER CONTEXT')
          for p in progs:
            hs=[i.address for i in whole if call(i)==p]
            print(f'\n=== callers of {p:#x} ===');print([hex(x) for x in hs])
            for h in hs:
              print(f'-- caller {h:#x} --')
              for i in dis(h-0x180,h+0x100):print(fmt(i))
          # helper bodies and direct callers
          helpers=[0x420d038c,0x4209f988,0x42051b64]
          for h in helpers:
            print(f'\n=== helper {h:#x} body first 0x500 ===')
            for i in dis(h,h+0x500):print(fmt(i))
            cs=[i.address for i in whole if call(i)==h]
            print('CALLERS',[hex(x) for x in cs[:120]])
          # Search exact memory accesses to interesting object offsets globally.
          offs={0x1c,0x40,0x44,0x58,0x5c,0x2cc,0x2d0,0x2d4}
          print('\n=== global exact mem displacement accesses to B2Y object fields ===')
          for offv in sorted(offs):
            hits=[]
            for n,i in enumerate(whole):
              try:
                if any(o.type==ARM_OP_MEM and o.mem.disp==offv for o in i.operands):hits.append(n)
              except:pass
            print(f'\nOFFSET {offv:#x} count={len(hits)}')
            # show only neighborhoods in likely B2Y/driver territory or instructions storing the field
            shown=0
            for n in hits:
              i=whole[n]
              if i.address<0x420c0000 and not (0x42140000<=i.address<0x42180000): continue
              if shown>=30:break
              shown+=1;print(f'-- hit {i.address:#x} --')
              for x in whole[max(0,n-8):min(len(whole),n+12)]:print(fmt(x))
          print('\nTARGET: classify programmer r4 object as image geometry/DMA vs color/tone state; identify producer provenance of fields and semantics of helper calls.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v173_b2y_programmer_context.txt
          git commit -m 'research: record v1.73 B2Y programmer context' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push