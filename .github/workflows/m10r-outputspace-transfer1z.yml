name: M10-R output-space transfer 1Z
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1z.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace StartColorManagement caller payload
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1Z.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def one(a):
            o=off(a);q=list(md.disasm(b[o:o+4],a,count=1)) if 0<=o<len(b)-4 else []
            return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            t=call(i)
            if t is not None:s+=f' ; CALL={t:#x}'
            return s
          def start(a):
            for p in range(a,max(BASE,a-0x800),-2):
              i=one(p)
              if i and i.mnemonic=='push' and 'lr' in i.op_str:return p
          print('M10-R OUTPUTSPACE TRANSFER1Z')
          print('\n=== DIRECT CALLERS OF StartColorManagement 0x420A3488 ===')
          calls=[]
          for a in range(BASE+PFX,BASE+len(b)-4,2):
            i=one(a)
            if i and call(i)==0x420a3488:calls.append(a);print(hex(a),'owner',hex(start(a) or 0))
          print('COUNT',len(calls))
          for a in calls:
            print('\n-- CALL WINDOW',hex(a),'--')
            for i in dis(max(BASE,a-0x180),min(BASE+len(b)-PFX,a+0x70)):print(fmt(i))
          print('\n=== OWNER FULL FUNCTIONS ===')
          seen=set()
          for a in calls:
            st=start(a)
            if not st or st in seen:continue
            seen.add(st);print('\nFUNCTION',hex(st))
            for i in dis(st,min(BASE+len(b)-PFX,st+0x1600)):
              print(fmt(i))
              if i.address>a and i.mnemonic=='pop' and 'pc' in i.op_str:break
          print('\n=== COLORSPACE GLOBAL LITERAL XREFS NEAR CALLERS ===')
          for a in calls:
            for i in dis(max(BASE,a-0x500),min(BASE+len(b)-PFX,a+0x200)):
              x=lit(i)
              if x and x[1] in (0x43705760,0x43705780):print('CALLER',hex(a),fmt(i))
          print('\n=== LIVE CA9 STATE FIELD WRITES 0x43705780 ===')
          for a in range(0x420a5000,0x420a7000,2):
            i=one(a);x=lit(i) if i else None
            if x and x[1]==0x43705760:
              print('\nBASEXREF',fmt(i))
              for j in dis(max(0x420a5000,a-0x30),min(0x420a7000,a+0x50)):print(fmt(j))
          print('\n=== DECISION GATE ===')
          print('Identify the caller-provided nine-word payload and show which word is the CA9 CM parameter-object pointer. Then map output-space field into that object without assuming pointer/address identity across cores.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1Z.txt
          git commit -m 'research: record StartColorManagement caller payload trace 1Z' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push