name: M10-R output-space transfer 1H
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1h.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace TF transformer and B2Y paraset selector
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1H.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a): return PFX+a-BASE
          def one(a):
            if not BASE<=a<BASE+len(b)-PFX:return None
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1)); return q[0] if q else None
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def astr(v):
            if not BASE<=v<BASE+len(b)-PFX:return None
            o=off(v);e=b.find(b'\0',o,min(len(b),o+220));q=b[o:e] if e>o else b''
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:
              s+=f' ; LIT {hex(x[0])}->{hex(x[1])}';st=astr(x[1])
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s
          def window(a,before=8,after=14):
            return [x for x in (one(v) for v in range(a-before*2,a+after*2,2)) if x]
          known={0x420d15e8:'DG',0x420d25a4:'INTERP_GAMMA',0x420d3c1c:'TONE',0x420d1170:'DEKNEE',0x420d456c:'YC'}
          print('M10-R OUTPUTSPACE TRANSFER1H')
          print('\n=== TF TRANSFORMER 0x420A4628..0x420A4884 RAW ===')
          tins=dis(0x420a4628,0x420a4884)
          for i in tins:print(fmt(i))
          print('\n=== TF TRANSFORMER CALLS / STATE LITERALS / INPUT OFFSETS ===')
          for i in tins:
            x=lit(i);t=call(i)
            if t is not None or (x and (0x20000000<=x[1]<0x21000000 or 0x40000000<=x[1]<0x44000000)) or ('[r0,' in i.op_str or '[r1,' in i.op_str or '[r4,' in i.op_str):print(fmt(i))
          print('\n=== TF TRANSFORMER KNOWN NONLINEAR CALLS ===')
          got=False
          for i in tins:
            t=call(i)
            if t in known:print(hex(i.address),known[t],hex(t));got=True
          if not got:print('NONE')
          print('\n=== TF TRANSFORMER DIRECT CA9 COLORSPACE GLOBAL ===')
          got=False
          for i in tins:
            x=lit(i)
            if x and x[1] in (0x43705760,0x43705780):print(fmt(i));got=True
          if not got:print('NONE')

          print('\n=== GENERIC B2Y PARASET SELECTOR 0x421A0FC0..0x421A1400 RAW ===')
          sins=dis(0x421a0fc0,0x421a1400)
          for i in sins:print(fmt(i))
          print('\n=== PARASET SELECTOR CALLS / GLOBALS ===')
          for i in sins:
            x=lit(i);t=call(i)
            if t is not None or (x and (0x40000000<=x[1]<0x44000000 or 0x20000000<=x[1]<0x21000000)):
              print(fmt(i))
          print('\n=== PARASET SELECTOR DIRECT OUTPUTSPACE DEPENDENCY ===')
          got=False
          for i in sins:
            x=lit(i)
            if x and x[1] in (0x43705760,0x43705780,0x40818760):print(fmt(i));got=True
          if not got:print('NONE')

          print('\n=== CALLERS OF 0x421A0FC0 IN B2Y SELECTOR FAMILY ===')
          calls=[]
          for a in range(0x42152000,0x42157000,2):
            i=one(a)
            if i and call(i)==0x421a0fc0:
              calls.append(a);print('\nCALLSITE',hex(a))
              for j in window(a,12,8):print(fmt(j))
          print('CALL_COUNT',len(calls))

          print('\n=== GLOBAL REFERENCES TO LIVE CA9 COLORSPACE BASE/EXACT BYTE ===')
          # PC-relative literal references only. This catches consumers that materialise base/global directly.
          refs=[]
          for a in range(BASE,BASE+len(b)-PFX-4,2):
            i=one(a)
            if not i:continue
            x=lit(i)
            if x and x[1] in (0x43705760,0x43705780):refs.append((a,x[1]))
          print('COUNT',len(refs))
          for a,v in refs:
            print('\nREF',hex(a),'->',hex(v))
            for j in window(a,10,14):print(fmt(j))

          print('\n=== SELECTOR FAMILY STRING INVENTORY AROUND 0x42153xxx..0x42156xxx ===')
          for a in range(0x42153000,0x42156000):
            o=off(a)
            if o<0 or o>=len(b):continue
            if b[o:o+1] and 0x20<=b[o]<0x7f and (a==0x42153000 or b[o-1]==0):
              e=b.find(b'\0',o,min(len(b),o+140));q=b[o:e] if e>o else b''
              try:s=q.decode('ascii')
              except:continue
              if len(s)>=5 and any(k in s.lower() for k in ('conversion','color','colour','gamma','tone','cc0','cc1','b2y','rgb','srgb','adobe','eci')):print(hex(a),repr(s))

          print('\n=== DECISION GATE ===')
          print('If 0x421A0FC0 has no direct output-space dependency, inspect the selector/string argument source at its callsites before declaring YC invariant. If TF transformer has no live mode/global or nonlinear calls, classify TF_REMAPPING as mode-independent remapping/control unless its caller supplies mode-dependent data.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1H.txt
          git commit -m 'research: record TF transformer and B2Y paraset selector trace 1H' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
