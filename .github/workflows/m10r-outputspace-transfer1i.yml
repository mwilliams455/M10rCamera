name: M10-R output-space transfer 1I
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1i.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Fast trace output-space literals and B2Y selector
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1I.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def one(a):
            if not BASE<=a<BASE+len(b)-PFX:return None
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1));return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def astr(v):
            if not BASE<=v<BASE+len(b)-PFX:return None
            o=off(v);e=b.find(b'\0',o,min(len(b),o+220));q=b[o:e] if e>o else b''
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:
              s+=f' ; LIT {hex(x[0])}->{hex(x[1])}';st=astr(x[1])
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s
          def win(a,bb=12,aa=18):
            return [i for i in (one(x) for x in range(max(BASE,a-bb*2),min(BASE+len(b)-PFX,a+aa*2),2)) if i]
          print('M10-R OUTPUTSPACE TRANSFER1I')
          print('\n=== TF TRANSFORMER 0x420A4628..0x420A4884 ===')
          ti=dis(0x420a4628,0x420a4884)
          for i in ti:print(fmt(i))
          print('\n=== TF TRANSFORMER MODE/NONLINEAR TEST ===')
          known={0x420d15e8:'DG',0x420d25a4:'INTERP_GAMMA',0x420d3c1c:'TONE',0x420d1170:'DEKNEE',0x420d456c:'YC'}
          hit=False
          for i in ti:
            x=lit(i);t=call(i)
            if (x and x[1] in (0x43705760,0x43705780,0x40818760)) or t in known:
              print(fmt(i),known.get(t,''));hit=True
          if not hit:print('NONE')

          print('\n=== B2Y SELECTOR 0x421A0FC0..0x421A1300 ===')
          si=dis(0x421a0fc0,0x421a1300)
          for i in si:print(fmt(i))
          print('\n=== B2Y SELECTOR GLOBAL/CALL SURFACE ===')
          for i in si:
            x=lit(i);t=call(i)
            if t is not None or (x and (0x40000000<=x[1]<0x44000000 or 0x20000000<=x[1]<0x21000000)):print(fmt(i))
          print('\n=== B2Y SELECTOR DIRECT COLORSPACE TEST ===')
          hit=False
          for i in si:
            x=lit(i)
            if x and x[1] in (0x43705760,0x43705780,0x40818760):print(fmt(i));hit=True
          if not hit:print('NONE')

          print('\n=== CALLS TO B2Y SELECTOR, LOCAL ARGUMENT WINDOWS ===')
          cs=[]
          for a in range(0x42153000,0x42156000,2):
            i=one(a)
            if i and call(i)==0x421a0fc0:
              cs.append(a);print('\nCALL',hex(a));[print(fmt(j)) for j in win(a)]
          print('COUNT',len(cs))

          print('\n=== RAW LITERAL OCCURRENCES FOR CA9 COLORSPACE BASE/BYTE ===')
          for target in (0x43705760,0x43705780,0x40818760):
            pat=struct.pack('<I',target);p=0;occ=[]
            while True:
              q=b.find(pat,p)
              if q<0:break
              occ.append(BASE+(q-PFX));p=q+1
            print(hex(target),'literal_occurrences',','.join(hex(x) for x in occ) if occ else 'NONE')
            for la in occ:
              # Only decode +/- 0x180 around literal occurrence and retain true PC-relative users of this pool word.
              users=[]
              for a in range(max(BASE,la-0x180)&~1,min(BASE+len(b)-PFX,la+0x40)&~1,2):
                i=one(a);x=lit(i) if i else None
                if x and x[0]==la and x[1]==target:users.append(a)
              for a in users:
                print(' USER',hex(a),'POOL',hex(la));[print(fmt(j)) for j in win(a,10,14)]

          print('\n=== B2Y SELECTOR-FAMILY RELEVANT STRINGS ===')
          lo,hi=0x42153000,0x42156000
          o0,o1=off(lo),off(hi)
          region=b[o0:o1]
          pos=0
          while pos<len(region):
            if 0x20<=region[pos]<0x7f and (pos==0 or region[pos-1]==0):
              e=region.find(b'\0',pos,min(len(region),pos+180))
              if e>pos:
                q=region[pos:e]
                try:s=q.decode('ascii')
                except:s=''
                if len(s)>=5 and any(k in s.lower() for k in ('conversion','color','colour','gamma','tone','cc0','cc1','b2y','rgb','srgb','adobe','eci')):print(hex(lo+pos),repr(s))
                pos=e+1;continue
            pos+=1
          print('\n=== DECISION GATE ===')
          print('No renderer change unless TF transformer or B2Y record-selection chain positively demonstrates a mode-dependent nonlinear transfer. YC mode-dependence requires evidence at selector argument/global source, not merely B2Y.bin lookup.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1I.txt
          git commit -m 'research: record fast output-space selector trace 1I' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
