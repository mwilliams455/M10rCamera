name: M10-R v0.75 YC inverse and reconstruction trace
on:
  push:
    branches: [m10r-b2y-yc-domain1a]
    paths:
      - 'tools/m10r_yc_inverse_trace_v075.py'
      - '.github/workflows/m10r-yc-inverse-trace-v075.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verify decode extract
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Trace YC inverse/reconstruction evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/m10r_yc_inverse_trace_v075.py /tmp/sec | tee research/M10R_v075_yc_inverse_trace.txt
          grep -q 'V075_FWD_Q12=' research/M10R_v075_yc_inverse_trace.txt
          grep -q 'OVERALL_VERDICT=' research/M10R_v075_yc_inverse_trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-V075-YC-INVERSE-TRACE
          path: research/M10R_v075_yc_inverse_trace.txt
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v075_yc_inverse_trace.txt
          git commit -m 'research: record v075 YC inverse trace' || exit 0
          git pull --rebase origin m10r-b2y-yc-domain1a
          git push
