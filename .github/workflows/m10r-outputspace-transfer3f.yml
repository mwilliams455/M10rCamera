name: M10-R output-space transfer 3F
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3f.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace sRGB constants and B2Y colorspace selector
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3F.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); B=0x42000000; P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True
          def off(a): return P+a-B
          def addr(q): return B+q-P
          def tlit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'; x=tlit(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL={i.operands[0].imm:#x}'
            except: pass
            return s
          def ptr_occ(v):
            pat=struct.pack('<I',v&0xffffffff);p=0;xs=[]
            while True:
              q=b.find(pat,p)
              if q<0:break
              xs.append(addr(q));p=q+1
            return xs
          print('M10-R OUTPUTSPACE TRANSFER3F')
          const_offs=[0x7f9a78,0x7fa11c,0x97f00c,0x97f610]
          print('\n=== CANDIDATE 2.4 / 1.055 FLOAT PROVENANCE ===')
          for q in const_offs:
            a=addr(q); print(f'\nOFF={q:#x} ADDR={a:#x} F32={struct.unpack_from("<f",b,q)[0]!r}')
            lo=max(0,q-128);hi=min(len(b),q+132); print('HEX',b[lo:hi].hex())
            asc=b[max(0,q-512):min(len(b),q+512)]
            print('ASCII',[(hex(addr(max(0,q-512)+m.start())),m.group().decode('latin1','replace')[:180]) for m in re.finditer(rb'[ -~]{5,}',asc)])
            print('PTR_RUNTIME',[hex(x) for x in ptr_occ(a)[:80]])
            print('PTR_OFFSET',[hex(x) for x in ptr_occ(q)[:80]])
            # direct disassembly only as a data/code sanity test
            dlo=max(B,a-96)&~1; dhi=min(B+len(b)-P,a+96)
            print('DISASM')
            for i in md.disasm(b[off(dlo):off(dhi)],dlo):print(fmt(i))
          print('\n=== GLOBAL LITERAL LOADS RESOLVING TO CANDIDATE CONSTANT ADDRESSES ===')
          cas={addr(q):q for q in const_offs}
          for i in md.disasm(b[P:],B):
            x=tlit(i)
            if x and x[1] in cas: print(fmt(i),'TARGET_OFF',hex(cas[x[1]]))
          cs_offs=[0x151888,0x15189c,0x1518b4]
          print('\n=== B2Y COLORSPACE SELECTOR STRINGS ===')
          for q in cs_offs:
            a=addr(q);z=b.find(b'\0',q);s=b[q:z if z>=0 else q+64]
            print(f'OFF={q:#x} ADDR={a:#x} STR={s!r}')
            print('PTR_RUNTIME',[hex(x) for x in ptr_occ(a)[:80]])
            print('PTR_OFFSET',[hex(x) for x in ptr_occ(q)[:80]])
          print('\n=== B2Y COLORSPACE SELECTOR NEIGHBORHOOD 0x42151600..0x42152200 ===')
          for i in md.disasm(b[off(0x42151600):off(0x42152200)],0x42151600):print(fmt(i))
          print('\n=== ALL LITERAL LOADS TO COLORSPACE STRINGS ===')
          csa={addr(q):q for q in cs_offs}
          for i in md.disasm(b[P:],B):
            x=tlit(i)
            if x and x[1] in csa:print(fmt(i),'STR_OFF',hex(csa[x[1]]))
          print('\n=== STILL B2Y MODE INIT/UPDATE ENTRY WINDOWS ===')
          for lo,hi in ((0x42152e00,0x421537c0),(0x42160f00,0x42162200)):
            print('\n--',hex(lo),hex(hi),'--')
            for i in md.disasm(b[off(lo):off(hi)],lo):
              x=tlit(i); keep=False
              if x and (x[1] in csa or x[1] in cas):keep=True
              if keep or any(k in i.op_str for k in ('#0x80','#0x81','#0x20020080','#0x20020880')):print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Determine whether exact 2.4/1.055 floats are executable rendered-transfer constants or unrelated embedded data, and whether B2Y _COLORSPACE selects only matrix/calibration parasets or any nonlinear transfer state.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3F.txt
          git commit -m 'research: record sRGB constant and B2Y colorspace trace 3F' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push