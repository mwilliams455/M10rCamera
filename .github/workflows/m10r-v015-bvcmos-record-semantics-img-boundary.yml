name: M10-R v0.15 BvCMOS record semantics and IMG boundary
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v015-bvcmos-record-semantics-img-boundary.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover sections
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace CTRL record semantics and IMG boundary
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/m10r-v015-bvcmos-record-semantics-img-boundary.txt
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          import struct,re

          def analyze(path,base,prefix,label):
            b=Path(path).read_bytes(); md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
            def off(v): return prefix+v-base
            def r32(v):
              o=off(v); return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
            def dis(s,e):
              o=off(s); oe=off(e)
              if not (0<=o<len(b)): return []
              return [i for i in md.disasm(b[o:max(o,min(len(b),oe))],s) if i.mnemonic!='.byte']
            ins=[i for i in md.disasm(b[prefix:],base) if i.mnemonic!='.byte']
            def lit(i):
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp; return a,r32(a)
              return None,None
            def ascii_at(v,n=260):
              o=off(v)
              if not(0<=o<len(b)): return None
              s=[]
              for c in b[o:o+n]:
                if c==0: break
                if c in (9,10,13) or 32<=c<127: s.append(chr(c))
                else:return None
              q=''.join(s); return q if len(q)>=4 else None
            def dump(tag,s,e):
              print(f'\n=== {label} {tag} {s:#010x}..{e:#010x} ===')
              for i in dis(s,e):
                a,v=lit(i); ex=''
                if v is not None:
                  q=ascii_at(v); ex=f' ; {a:#010x}->{v:#010x}' + (f' STRING={q!r}' if q else '')
                print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}{ex}')
            def callers(t): return [i.address for i in ins if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==(t&~1)]
            return b,ins,dump,callers,ascii_at,lit,off

          cb,ci,cdump,ccall,cascii,clit,coff=analyze('/tmp/sections/090_CTRL-System.bin',0x08000000,4,'CTRL')
          cdump('PREPARE_LV_VIDEO_HANDLER',0x08003068,0x080035b4)
          print('\nCTRL callers 0x08003068', [hex(x) for x in ccall(0x08003068)])
          cdump('CMOS_UPDATE_F228',0x0800f228,0x0800f97a)
          cdump('LV_EXPOSURE_BUILDER_E14A',0x0800e120,0x0800e1c0)
          print('\nCTRL callers 0x0800e14a', [hex(x) for x in ccall(0x0800e14a)])

          print('\n=== CTRL BV / METER RELATED STRINGS ===')
          # raw scan strings with stronger BV/AE terms
          o=4
          while o<len(cb):
            if 32<=cb[o]<127:
              e=o
              while e<len(cb) and (32<=cb[e]<127 or cb[e] in (9,10,13)):e+=1
              if e-o>=5:
                s=cb[o:e].decode('latin1','ignore')
                if re.search(r'(BV|Bv|metering mode|lightmeter|live view|video parameter|AE algorithm|AE library)',s): print(hex(0x08000000+o-4),repr(s[:260]))
              o=max(e,o+1)
            else:o+=1

          # IMG: code/string alias scan. Search first for strings and any PC-relative literal refs to them.
          ib=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); ibase=0x42000000; ipfx=4
          imd=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); imd.detail=True; imd.skipdata=True
          def ioff(v): return ipfx+v-ibase
          def ir32(v):
            o=ioff(v); return struct.unpack_from('<I',ib,o)[0] if 0<=o<=len(ib)-4 else None
          iins=[i for i in imd.disasm(ib[ipfx:],ibase) if i.mnemonic!='.byte']
          def ilit(i):
            if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              a=((i.address+4)&~3)+i.operands[1].mem.disp; return a,ir32(a)
            return None,None
          def iascii(v,n=260):
            o=ioff(v)
            if not(0<=o<len(ib)): return None
            s=[]
            for c in ib[o:o+n]:
              if c==0:break
              if c in (9,10,13) or 32<=c<127:s.append(chr(c))
              else:return None
            q=''.join(s);return q if len(q)>=4 else None
          print('\n=== IMG MATCHING STRINGS + CODE XREFS ===')
          matches=[]; o=ipfx
          while o<len(ib):
            if 32<=ib[o]<127:
              e=o
              while e<len(ib) and (32<=ib[e]<127 or ib[e] in (9,10,13)):e+=1
              if e-o>=6:
                s=ib[o:e].decode('latin1','ignore')
                if re.search(r'(AE MODULE|live view|metering|lightmeter|BV|Bv|exposure parameter|LCC AE|AE algorithm)',s,re.I): matches.append((ibase+o-ipfx,s[:240]))
              o=max(e,o+1)
            else:o+=1
          for a,s in matches[:250]:
            refs=[]
            for i in iins:
              _,v=ilit(i)
              if v==a: refs.append(i.address)
            print(hex(a),repr(s),'refs',[hex(x) for x in refs[:30]])
            for r in refs[:5]:
              print('  CONTEXT',hex(r))
              # find instruction index and dump around
              n=next((k for k,x in enumerate(iins) if x.address==r),None)
              if n is not None:
                for j in iins[max(0,n-10):min(len(iins),n+22)]:
                  _,v=ilit(j); q=iascii(v) if v else None; ex=f' ; ->{v:#010x}' if v is not None else ''
                  if q:ex+=f' STRING={q!r}'
                  print(f'    {j.address:08x}: {j.mnemonic:9s} {j.op_str}{ex}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v015-bvcmos-record-semantics-img-boundary
          path: /tmp/m10r-v015-bvcmos-record-semantics-img-boundary.txt
          if-no-files-found: error
