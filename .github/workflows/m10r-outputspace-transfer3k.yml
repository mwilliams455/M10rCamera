name: M10-R output-space transfer 3K
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3k.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y live colorspace field and key consumer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3K.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return P+a-B
          def ds(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);x=lit(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER3K')
          print('\n=== CALLER REGION 0x42151F00..0x42152640 ===')
          ins=ds(0x42151f00,0x42152640)
          for i in ins:print(fmt(i))
          print('\n=== FUNCTION STARTS BEFORE 0x42152354 ===')
          for i in ins:
            if i.mnemonic=='push' and 'lr' in i.op_str:print(fmt(i))
          print('\n=== HALFWORD-SLIDING ACCESSES WITH DISP 0xB4 IN B2Y AREA ===')
          hits=[]
          for q in range(off(0x4214f000),off(0x42164000),2):
            a=B+q-P; xs=list(md.disasm(b[q:q+4],a,count=1))
            if not xs:continue
            i=xs[0]
            try:
              if any(op.type==ARM_OP_MEM and op.mem.disp==0xb4 for op in i.operands):
                hits.append(a);print(fmt(i))
            except:pass
          print('HITS',[hex(x) for x in hits])
          print('\n=== WINDOWS AROUND B4 WRITES ===')
          for a in hits:
            i=list(md.disasm(b[off(a):off(a)+4],a,count=1))[0]
            if i.mnemonic.startswith('str'):
              print('\nWRITE',hex(a))
              for j in ds(max(B,a-0x80),min(B+len(b)-P,a+0xc0)):print(fmt(j))
          print('\n=== SELECTOR CALL FOLLOW-ON 0x42152340..0x42152640 ===')
          for i in ds(0x42152340,0x42152640):print(fmt(i))
          print('\n=== KEY-BUILDER COPY HELPER 0x4204EFD4 CALLERS NEAR SELECTOR ===')
          for i in ds(0x42151500,0x42151900):
            if call(i)==0x4204efd4:print(fmt(i))
          print('\n=== KNOWN B2Y ASSET/CONTROL ADDRESS LITERALS IN CALLER REGION ===')
          vals={0x023b74b8,0x023b74ba,0x023b7548,0x023b754a,0x023b80c4,0x023b80c6,0x023b80c8,0x023b80ca,0x023b749a,0x023b749b,0x023b74ec,0x20020080,0x20020880,0x20021000}
          for i in ins:
            x=lit(i)
            if x and x[1] in vals:print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Trace live colorspace field caller+0xB4 to its writer and then identify what 0x42151508-built key controls/reloads. Distinguish whole-record tuning reload from matrix-only selection.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3K.txt
          git commit -m 'research: record live B2Y colorspace field trace 3K' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push