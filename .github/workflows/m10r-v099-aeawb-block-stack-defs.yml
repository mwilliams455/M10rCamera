name: M10-R v0.99 AEAWB block stack defs
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v099-aeawb-block-stack-defs.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace definitions of h/v block-number print slots
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v099_aeawb_block_stack_defs.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC,ARM_REG_SP
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def u32a(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+180)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all(32<=ord(c)<127 for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp;return a,u32a(a)
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q and q[1] is not None:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            return s
          lo,hi=0x420d9300,0x420d9490
          ins=[i for i in md.disasm(b[off(lo):off(hi)],lo) if i.id]
          print('M10-R v0.99 AEAWB BLOCK STACK DEFINITIONS')
          print('v0.98: debug print uses sp+0x18 = horizontal block number, sp+0x1C = vertical block number.')
          print('\n=== FULL LOCAL FUNCTION REGION ===')
          for i in ins:print(fmt(i))
          print('\n=== WRITES TO TARGET STACK SLOTS ===')
          for n,i in enumerate(ins):
            hit=False
            try:
              if i.mnemonic.startswith('str') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_SP and i.operands[1].mem.disp in (0x18,0x1c):hit=True
            except:pass
            if hit:
              print(f'\n--- TARGET WRITE @{i.address:#x} ---')
              for j in range(max(0,n-16),min(len(ins),n+10)):print(fmt(ins[j]))
          print('\n=== ALL STACK WRITES +0x08..+0x4C BEFORE PRINTS ===')
          for i in ins:
            try:
              if i.mnemonic.startswith('str') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_SP and 8<=i.operands[1].mem.disp<=0x4c:
                print(fmt(i))
            except:pass
          # detect likely function start as last PUSH before 0x420d93e8 and report direct BL callers across whole IMG with raw Thumb BL decode via capstone bounded full scan chunks
          starts=[i.address for i in ins if i.mnemonic=='push' and i.address<0x420d93e8]
          fs=starts[-1] if starts else None
          print('\nLIKELY_FUNCTION_START',hex(fs) if fs else None)
          if fs:
            callers=[]
            # disassemble code range around prepro only to avoid materializing entire image
            for base in range(0x420d8000,0x420db000,0x4000):
              chunk=b[off(base):off(min(base+0x4000,0x420db000))]
              for i in md.disasm(chunk,base):
                if i.id and i.mnemonic=='bl' and i.op_str.strip()==hex(fs):callers.append(i.address)
            print('DIRECT_CALLERS',*[hex(x) for x in callers])
          print('\n=== DECISION ===')
          print('If target stack slots are loaded from a true AEAWB config structure, trace those source offsets/writers next. If they are immediate 22/16, freeze producer grid immediately.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v099_aeawb_block_stack_defs.txt
          git commit -m 'research: record v0.99 AEAWB block stack defs' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
