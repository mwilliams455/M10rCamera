name: M10-R v1.94 contrast suffix mapper
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v194-contrast-suffix-mapper.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace contrast enum to selector suffix mapper
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v194_contrast_suffix_mapper.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return P+a-BASE
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.94 CONTRAST SUFFIX MAPPER')
          print('\n=== function 0x42151508 exact ===')
          for i in md.disasm(b[off(0x42151508):off(0x42151800)],0x42151508):print(fmt(i))
          print('\n=== caller setup around 0x42152318..0x42152358 ===')
          for i in md.disasm(b[off(0x42152318):off(0x42152358)],0x42152318):print(fmt(i))
          print('\n=== literal/string targets reachable from function ===')
          for i in md.disasm(b[off(0x42151508):off(0x42151800)],0x42151508):
            q=lit(i)
            if q:
              a=q[1];o=off(a)
              if 0<=o<len(b):
                raw=b[o:o+100].split(b'\0',1)[0]
                if raw and all((32<=x<127) for x in raw):print(fmt(i),'STRING',repr(raw.decode('ascii','replace')))
          print('\n=== raw ASCII near function/data pools containing contrast words/fragments ===')
          lo=max(0,off(0x42151400));hi=min(len(b),off(0x42151a00))
          for m in re.finditer(rb'[ -~]{2,}',b[lo:hi]):
            s=m.group().decode('ascii','replace')
            if any(k in s.upper() for k in ('LOW','MED','HIGH','CONTRAST','_B2YMODE')): print(hex(BASE+lo+m.start()-P),repr(s))
          print('\nTARGET: map numeric/input contrast field at owner input +0xAC / selector +0x68 into the suffix string at selector +0x6C. Recover exact enum values and whether any value is the default/neutral setting. Distinguish mapper semantics from UI default state.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v194_contrast_suffix_mapper.txt
          git commit -m 'research: record v1.94 contrast suffix mapper' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push