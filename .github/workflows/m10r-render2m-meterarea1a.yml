name: M10-R RENDER2M METERAREA1A SHADOW
on:
  push:
    branches: [m10r-render2m-meterarea1a]
    paths:
      - '.github/workflows/m10r-render2m-meterarea1a.yml'
      - 'patches/fix-m10r-render2m-meterarea1a.py'
      - 'android/meterarea1a/**'
      - 'tests/test-meterarea1a.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: meterarea1a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute reducer and stable identity regression tests
        run: |
          python3 -m py_compile patches/fix-m10r-render2m-meterarea1a.py
          python3 tests/test-meterarea1a.py METERAREA1A_HOST_TEST_RESULTS.json
          python3 tests/test-sourceproxy1c.py SOURCEPROXY1C_HOST_TEST_RESULTS.json
      - name: Reconstruct verified RENDER2L baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          w=yaml.safe_load(Path('.github/workflows/m10r-render2l-mfm1d-sourceproxy1c.yml').read_text())
          for name in ['Reconstruct exact RENDER2K through existing verified patch chain','Apply SOURCEPROXY1C and verify frozen source and target paths']:
              steps=[s for s in w['jobs']['build']['steps'] if s.get('name')==name]
              assert len(steps)==1,name
              subprocess.run(['bash','-euo','pipefail','-c',steps[0]['run']],check=True)
          PY
      - name: Insert shadow probe and prove frozen photometric code
        run: python3 patches/fix-m10r-render2m-meterarea1a.py PhotonCamera
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Build against real Android SDK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x PhotonCamera/gradlew
          cd PhotonCamera
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/METERAREA1A_GRADLE.log"
      - name: Verify and package diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          apks=list(Path('PhotonCamera/app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks)==1,apks
          with zipfile.ZipFile(apks[0]) as z:
              assert z.testzip() is None
              dex=b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
              for marker in [b'METERAREA1A_SHADOW',b'm10rMeterAreaRaw1A',b'areaProxyBeforeAverageDecision',b'frameMetadataExactTimestampMatch',b'SOURCEPROXY1C_STATIC_V1',b'YA_TOPOLOGY1A',b'M10R_PORT1A']:
                  assert marker in dex,marker
          out=Path('delivery/M10RCam_RENDER2M_METERAREA1A_SHADOW_TEST.apk')
          shutil.copy2(apks[0],out)
          p=json.loads(Path('PhotonCamera/M10R_RENDER2M_METERAREA1A_PROVENANCE.json').read_text())
          for key in ['frozenFilesUnchanged','insertionRemovalRestoresExactBaseline','activeExposureSelectorUnchanged','sharedMfmDecisionUnchanged','sourceproxy1cUnchanged','nativeSourceAndAssetsUnchanged','dngSaverUnchanged']:
              assert p[key],key
          p.update(source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],apk_bytes=out.stat().st_size,apk_sha256=hashlib.sha256(out.read_bytes()).hexdigest())
          Path('delivery/APK_PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          for name in ['METERAREA1A_HOST_TEST_RESULTS.json','SOURCEPROXY1C_HOST_TEST_RESULTS.json']:
              shutil.copy2(name,'delivery/')
          with zipfile.ZipFile('delivery/METERAREA1A_GENERATED_SOURCES.zip','w',zipfile.ZIP_DEFLATED) as z:
              base=Path('PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera')
              for rel in ['ui/camera/views/viewfinder/MainRenderer.java','capture/CaptureController.java','m10r/M10RNativeRenderer.java','m10r/M10RMeterArea1A.java','m10r/M10RMeterAreaMath.java','processing/parameters/IsoExpoSelector.java']:
                  z.write(base/rel,rel)
          print(json.dumps({k:v for k,v in p.items() if k!='frozenFiles'},indent=2))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose delivery/*.apk | tee delivery/signature_verification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M10R-RENDER2M-METERAREA1A-BUILDLOG
          path: |
            METERAREA1A_GRADLE.log
            METERAREA1A_HOST_TEST_RESULTS.json
            SOURCEPROXY1C_HOST_TEST_RESULTS.json
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: M10RCam-RENDER2M-METERAREA1A-SHADOW-TEST-APK
          path: delivery/
          if-no-files-found: error
          retention-days: 90
