name: M10-R v0.93 AFAEAWB dimension field writers
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v093-afaeawb-dimension-field-writers.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace all Prepro writers of AFAEAWB source dimensions
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v093_afaeawb_dimension_field_writers.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;lo=off(la)
                if 0<=lo<=len(b)-4:return la,struct.unpack_from('<I',b,lo)[0]
            except:pass
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+180)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all(32<=ord(c)<127 or c in '\r\n\t' for c in s) else None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:
              s+=f' ; LIT {hex(q[0])}->{hex(q[1])}'
              st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            return s
          def dump(a,z,title):
            print('\n===',title,hex(a),'..',hex(z),'===')
            for i in md.disasm(b[off(a):off(z)],a):
              if i.id:print(fmt(i))
          print('M10-R v0.93 AFAEAWB DIMENSION FIELD WRITERS')
          print('Target source fields: +0x5C/+0x60 feed AFAEAWB block +0x1C/+0x20, which CA9 multiplies as Block_Cnt.')
          writers=[];readers=[]
          for i in md.disasm(b[off(0x420d0000):off(0x420e1000)],0x420d0000):
            if not i.id:continue
            try:
              mems=[op for op in i.operands if op.type==ARM_OP_MEM]
            except:mems=[]
            for op in mems:
              if op.mem.disp in (0x5c,0x60):
                if i.mnemonic.startswith('str'):writers.append(i.address)
                elif i.mnemonic.startswith('ldr'):readers.append(i.address)
          print('\nWRITERS',len(writers),*[hex(x) for x in writers])
          for x in writers:dump(x-0x70,x+0x80,f'FIELD WRITER @ {hex(x)}')
          print('\nREADERS',len(readers),*[hex(x) for x in readers])
          for x in readers[:40]:dump(x-0x40,x+0x54,f'FIELD READER @ {hex(x)}')
          dump(0x420d9f20,0x420da020,'KNOWN INIT/WRITER CLUSTER AROUND 0x420D9FA2')
          # Static mode-object table areas selected by 0x420D9304, to expose initialized defaults if any.
          print('\n=== MODE OBJECT BASES / RAW WORDS ===')
          bases=[0x408ef72c,0x408ef7a8,0x408ef824,0x408ef8a0,0x408ef91c,0x408ef998,0x408efa14,0x408efa90]
          print('Runtime RAM objects; values are not resident here in IMG ROM. Bases:',*[hex(x) for x in bases])
          print('\n=== INTERPRETATION RULE ===')
          print('A constant store of 16 and 22 to +0x5C/+0x60 would close 16x22 Block_Cnt geometry. If writers copy values from a caller/config structure instead, trace that source next rather than assigning semantics by expected grid size.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v093_afaeawb_dimension_field_writers.txt
          git commit -m 'research: record v0.93 AFAEAWB dimension field writers' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
