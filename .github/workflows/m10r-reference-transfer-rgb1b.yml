name: M10-R full RGB domain placement audit RGB1B
on:
  push:
    branches: [m10r-reference-transfer-rgb1b]
    paths:
      - '.github/workflows/m10r-reference-transfer-rgb1b.yml'
      - 'app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1BRenderer.java'
      - 'tools/M10RTransferRgb1BCli.java'
      - 'tools/m10r_reference_transfer_rgb1b_fit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
          python3 -m pip install --quiet rawpy pillow numpy

      - name: Extract and verify exact M10-R nonlinear assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          rm -rf /tmp/m10r_b2y_assets
          python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/m10r_b2y_assets >/dev/null
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/m10r_b2y_assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/m10r_b2y_assets/dg_expanded_u16le.bin' | sha256sum -c -

      - name: Compile RGB1B domain placement renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m10r_reference_transfer_rgb1b_fit.py tools/m10r_reference_transfer_rgb_fit.py tools/m10r_reference_order_fit.py
          mkdir -p /tmp/m10r_rgb1b_classes
          javac -d /tmp/m10r_rgb1b_classes \
            app/src/main/java/com/m10r/diagnostic/DngMetadataReader.java \
            app/src/main/java/com/m10r/diagnostic/DngRawDecoder.java \
            app/src/main/java/com/m10r/diagnostic/LosslessJpegDecoder.java \
            app/src/main/java/com/m10r/diagnostic/SensorPreviewCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RColorSpecCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RReferenceColorCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RNeutralClipReferenceRenderer.java \
            app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1BRenderer.java \
            tools/M10RTransferRgb1BCli.java

      - name: Render and score six identity-gated same-capture pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m10r_rgb1b
          for id in 01 02 03 04 05 06; do
            echo "=== RGB1B sample $id ==="
            base="https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_${id}"
            curl -L --fail --retry 3 --retry-delay 2 "$base.jpg" -o "/tmp/m10r_rgb1b/${id}.jpg"
            curl -L --fail --retry 3 --retry-delay 2 "$base.dng" -o "/tmp/m10r_rgb1b/${id}.dng"
            exiftool -j -n \
              -Make -Model -SerialNumber -ImageUniqueID -DateTimeOriginal -CreateDate \
              -ExposureTime -FNumber -ISO -FocalLength -ExposureCompensation \
              -WhiteBalance -Contrast -Saturation -Sharpness \
              "/tmp/m10r_rgb1b/${id}.jpg" "/tmp/m10r_rgb1b/${id}.dng" > "/tmp/m10r_rgb1b/${id}_exif.json"
            java -cp /tmp/m10r_rgb1b_classes com.m10r.diagnostic.M10RTransferRgb1BCli \
              "/tmp/m10r_rgb1b/${id}.dng" \
              /tmp/m10r_b2y_assets/tone_medium_q15.u32le \
              /tmp/m10r_b2y_assets/dg_expanded_u16le.bin \
              "/tmp/m10r_rgb1b/${id}_ll_oetf.ppm" \
              "/tmp/m10r_rgb1b/${id}_ll_identity.ppm" \
              "/tmp/m10r_rgb1b/${id}_le_identity.ppm" \
              "/tmp/m10r_rgb1b/${id}_el_oetf.ppm" \
              "/tmp/m10r_rgb1b/${id}_ee_identity.ppm" 2000 \
              | tee "/tmp/m10r_rgb1b/${id}_render.txt"
            python3 tools/m10r_reference_transfer_rgb1b_fit.py \
              --jpg "/tmp/m10r_rgb1b/${id}.jpg" \
              --dng "/tmp/m10r_rgb1b/${id}.dng" \
              --ll-oetf "/tmp/m10r_rgb1b/${id}_ll_oetf.ppm" \
              --ll-identity "/tmp/m10r_rgb1b/${id}_ll_identity.ppm" \
              --le-identity "/tmp/m10r_rgb1b/${id}_le_identity.ppm" \
              --el-oetf "/tmp/m10r_rgb1b/${id}_el_oetf.ppm" \
              --ee-identity "/tmp/m10r_rgb1b/${id}_ee_identity.ppm" \
              --sample "$id" \
              --metadata-json "/tmp/m10r_rgb1b/${id}_exif.json" \
              --out "/tmp/m10r_rgb1b/${id}_metrics.json" >/dev/null
            rm -f "/tmp/m10r_rgb1b/${id}.jpg" "/tmp/m10r_rgb1b/${id}.dng" /tmp/m10r_rgb1b/${id}_*.ppm
          done

      - name: Aggregate RGB1B evidence and decision gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path

          modes=[
            'linear_luma_linear_gain_oetf',
            'linear_luma_linear_gain_identity',
            'linear_luma_encoded_gain_identity',
            'encoded_luma_linear_gain_oetf',
            'encoded_luma_encoded_gain_identity',
          ]
          short={
            'linear_luma_linear_gain_oetf':'LL_OETF',
            'linear_luma_linear_gain_identity':'LL_IDENTITY',
            'linear_luma_encoded_gain_identity':'LE_IDENTITY',
            'encoded_luma_linear_gain_oetf':'EL_OETF',
            'encoded_luma_encoded_gain_identity':'EE_IDENTITY',
          }
          rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/m10r_rgb1b').glob('*_metrics.json'))]
          valid=[r for r in rows if r.get('metadata',{}).get('identity_supported') is True
                 and r.get('metadata',{}).get('default_jpeg_controls') is True]
          core=['encoded_rgb_rmse','luma_rmse','delta_e76_mean']
          all_metrics=['encoded_rgb_rmse','encoded_rgb_mae','luma_rmse','luma_mae','delta_e76_mean',
                       'hue_error_deg_mean','saturation_error_abs_mean']

          def vals(mode,key):
              return [r['metrics'][mode][key] for r in valid if r['metrics'][mode].get(key) is not None]
          def med(mode,key):
              v=vals(mode,key); return statistics.median(v) if v else None
          def metric_wins(mode,key):
              n=0
              for r in valid:
                  values={m:r['metrics'][m].get(key) for m in modes}
                  finite={m:v for m,v in values.items() if v is not None}
                  if not finite: continue
                  best=min(finite.values())
                  if finite.get(mode) is not None and finite[mode] <= best + 1e-12: n += 1
              return n
          def bin_med(mode,bin_name,key='rgb_rmse'):
              v=[r['metrics'][mode]['bins'][bin_name][key] for r in valid
                 if r['metrics'][mode]['bins'][bin_name][key] is not None]
              return statistics.median(v) if v else None
          def overclip(mode):
              return sum(sum(r['metrics'][mode]['highlight_channel_clipping'][c]['candidate_255_reference_below_250']
                             for c in 'RGB') for r in valid)

          agg={'total':len(rows),'valid':len(valid),'medians':{},'wins':{},'bins':{},'overclip':{},'composite':{}}
          for mode in modes:
              agg['medians'][mode]={k:med(mode,k) for k in all_metrics}
              agg['wins'][mode]={k:metric_wins(mode,k) for k in core}
              agg['bins'][mode]={b:{'rgb_rmse':bin_med(mode,b,'rgb_rmse'),'luma_rmse':bin_med(mode,b,'luma_rmse')}
                                 for b in ('shadow','midtone','highlight','neutral_pixels','colourful_pixels')}
              agg['overclip'][mode]=overclip(mode)

          minima={k:min(agg['medians'][m][k] for m in modes if agg['medians'][m][k] is not None) for k in core}
          for mode in modes:
              agg['composite'][mode]=sum(agg['medians'][mode][k]/max(1e-12,minima[k]) for k in core)/len(core)
          ranking=sorted(modes,key=lambda m:agg['composite'][m])
          agg['ranking']=ranking
          agg['short_ranking']=[short[m] for m in ranking]

          need=max(4, math.ceil(0.67*len(valid))) if valid else 999
          best=ranking[0] if ranking else None
          second=ranking[1] if len(ranking)>1 else None
          min_hue=min(agg['medians'][m]['hue_error_deg_mean'] for m in modes if agg['medians'][m]['hue_error_deg_mean'] is not None)
          min_sat=min(agg['medians'][m]['saturation_error_abs_mean'] for m in modes if agg['medians'][m]['saturation_error_abs_mean'] is not None)
          min_hi=min(agg['bins'][m]['highlight']['rgb_rmse'] for m in modes if agg['bins'][m]['highlight']['rgb_rmse'] is not None)
          min_clip=min(agg['overclip'][m] for m in modes)
          def guards_ok(mode):
              hue=agg['medians'][mode]['hue_error_deg_mean']; sat=agg['medians'][mode]['saturation_error_abs_mean']
              hi=agg['bins'][mode]['highlight']['rgb_rmse']; clips=agg['overclip'][mode]
              return (hue is None or hue <= min_hue*1.10 + 0.5) and \
                     (sat is None or sat <= min_sat*1.10 + 0.005) and \
                     (hi is None or hi <= min_hi*1.10 + 1e-12) and \
                     clips <= max(min_clip*1.05, min_clip+1000)

          verdict='MIXED_DOMAIN_PLACEMENT_EVIDENCE'
          if len(valid)>=4 and best is not None and second is not None:
              separated=agg['composite'][best] <= agg['composite'][second]*0.95
              broad=all(agg['wins'][best][k] >= need for k in core)
              if separated and broad and guards_ok(best):
                  verdict='FULL_RGB_DOMAIN_PLACEMENT_FAVORS_'+short[best]
          agg['verdict']=verdict
          agg['required_sample_wins']=need if valid else None
          agg['guard_minima']={'hue_error_deg_mean':min_hue,'saturation_error_abs_mean':min_sat,
                               'highlight_rgb_rmse':min_hi,'false_highlight_channel_clips':min_clip}
          agg['analysis_input_commit']=os.environ.get('GITHUB_SHA')
          agg['workflow_run_id']=os.environ.get('GITHUB_RUN_ID')

          out=[]
          out.append('M10-R REFERENCE TRANSFER RGB1B — FULL RGB DOMAIN PLACEMENT')
          out.append('')
          out.append('Base: RGB1A result branch; live m10r-capture1b remains untouched.')
          out.append('Frozen upstream: DNG WhiteLevel clamp -> bilinear Bayer -> CA9 neutral clip -> Leica ColorSpec -> linear sRGB.')
          out.append('Nonlinear assets: exact SHA-gated MEDIUM -> Differential Gamma, fixed 14-bit coordinate mapping, shared-gain chroma preservation.')
          out.append('Fit freedom: NONE. No exposure, affine, gamma, tone-power, WB or colour fit.')
          out.append('Encoded domain means bounded standard sRGB code values derived from the same linear-sRGB pixel.')
          out.append('')
          out.append('Modes:')
          out.append('  LL_OETF: linear luma -> MEDIUM/DG -> gain linear RGB -> sRGB OETF (RGB1A ON)')
          out.append('  LL_IDENTITY: linear luma -> MEDIUM/DG -> gain linear RGB -> identity (RGB1A OFF control)')
          out.append('  LE_IDENTITY: linear luma -> MEDIUM/DG -> gain encoded RGB -> identity')
          out.append('  EL_OETF: encoded luma -> MEDIUM/DG -> gain linear RGB -> sRGB OETF')
          out.append('  EE_IDENTITY: encoded luma -> MEDIUM/DG -> gain encoded RGB -> identity')
          out.append('')
          out.append('=== Per-sample core ranking ===')
          for r in rows:
              m=r['metadata']
              rank=sorted(modes,key=lambda x:r['metrics'][x]['encoded_rgb_rmse'])
              out.append(f"sample {r['sample']} identity={m.get('identity_supported')} defaults={m.get('default_jpeg_controls')} align={r['alignment']['score']:.5f}")
              for mode in rank:
                  q=r['metrics'][mode]
                  out.append(f"  {short[mode]} RGB={q['encoded_rgb_rmse']:.4f} Y={q['luma_rmse']:.4f} dE76={q['delta_e76_mean']:.4f} hue={q['hue_error_deg_mean']:.4f} sat={q['saturation_error_abs_mean']:.6f} hi={q['bins']['highlight']['rgb_rmse']}")
          out.append('')
          out.append('=== Aggregate ranking ===')
          for mode in ranking:
              out.append(f"{short[mode]} composite={agg['composite'][mode]:.6f} medians={agg['medians'][mode]} wins={agg['wins'][mode]}")
              out.append(f"  bins={agg['bins'][mode]} false-highlight-clips={agg['overclip'][mode]}")
          out.append('')
          out.append('VERDICT '+verdict)
          out.append('')
          out.append('Interpretation boundary: RGB1B discriminates output-domain placement inside the current reconstructed pipeline. It still does not prove the literal CA9/B2Y hardware mux or the exact live B2Y coordinate source.')
          out.append('Do not change m10r-capture1b unless one domain placement clears both the broad core and colour/highlight guards.')
          out.append(f"Workflow run id: {agg['workflow_run_id']}")
          out.append(f"Analysis input commit: {agg['analysis_input_commit']}")

          Path('research/M10R_REFERENCE_TRANSFER_RGB1B.md').write_text('\n'.join(out)+'\n')
          Path('research/M10R_REFERENCE_TRANSFER_RGB1B.json').write_text(json.dumps({'samples':rows,'aggregate':agg},indent=2,sort_keys=True)+'\n')
          print('\n'.join(out))
          PY

      - name: Upload RGB1B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-REFERENCE-TRANSFER-RGB1B
          path: |
            /tmp/m10r_rgb1b/*_metrics.json
            /tmp/m10r_rgb1b/*_render.txt
            research/M10R_REFERENCE_TRANSFER_RGB1B.md
            research/M10R_REFERENCE_TRANSFER_RGB1B.json
          if-no-files-found: warn

      - name: Commit RGB1B evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_REFERENCE_TRANSFER_RGB1B.md research/M10R_REFERENCE_TRANSFER_RGB1B.json
          git commit -m 'research: record full RGB domain placement audit RGB1B' || exit 0
          git pull --rebase origin m10r-reference-transfer-rgb1b
          git push
          echo "RGB1B result branch head: $(git rev-parse HEAD)"
