name: M10-R output-space transfer 2C
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2c.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode CA9 output-space matrices
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2C.txt
          from pathlib import Path
          import struct,math
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4
          def off(a):return PFX+a-BASE
          def mat(a):return struct.unpack_from('<9d',b,off(a))
          def det(m):
            a,b,c,d,e,f,g,h,i=m
            return a*(e*i-f*h)-b*(d*i-f*g)+c*(d*h-e*g)
          def mul(A,B):return tuple(sum(A[r*3+k]*B[k*3+c] for k in range(3)) for r in range(3) for c in range(3))
          def err_ident(M):return max(abs(M[r*3+c]-(1.0 if r==c else 0.0)) for r in range(3) for c in range(3))
          modes={0:(0x40013ad0,0x40013bf0),1:(0x40013b18,0x40013ba8),2:(0x40013b60,0x40013c38)}
          print('M10-R OUTPUTSPACE TRANSFER2C')
          for mode,(a,bp) in modes.items():
            A=mat(a);B=mat(bp)
            print(f'\n=== MODE {mode} MATRIX A {a:#x} ===')
            for r in range(3):print(' '.join(f'{A[r*3+c]: .12f}' for c in range(3)))
            print('det',f'{det(A):.12g}')
            print(f'=== MODE {mode} MATRIX B {bp:#x} ===')
            for r in range(3):print(' '.join(f'{B[r*3+c]: .12f}' for c in range(3)))
            print('det',f'{det(B):.12g}')
            AB=mul(A,B);BA=mul(B,A)
            print('A*B identity maxerr',f'{err_ident(AB):.12g}')
            print('B*A identity maxerr',f'{err_ident(BA):.12g}')
          # compare against common published linear RGB/XYZ matrices as identification aid only.
          refs={
            'sRGB_D65_RGB_to_XYZ':(0.4124564,0.3575761,0.1804375,0.2126729,0.7151522,0.0721750,0.0193339,0.1191920,0.9503041),
            'AdobeRGB_D65_RGB_to_XYZ':(0.5767309,0.1855540,0.1881852,0.2973769,0.6273491,0.0752741,0.0270343,0.0706872,0.9911085),
            'ECIRGBv2_D50_RGB_to_XYZ':(0.6502043,0.1780774,0.1359384,0.3202499,0.6020711,0.0776791,0.0000000,0.0678390,0.7573710),
          }
          print('\n=== REFERENCE RMS/MAX COMPARISON ===')
          for mode,(a,bp) in modes.items():
            A=mat(a);B=mat(bp)
            for side,M in [('A',A),('B',B)]:
              for name,R in refs.items():
                ds=[M[i]-R[i] for i in range(9)];rms=math.sqrt(sum(x*x for x in ds)/9);mx=max(abs(x) for x in ds)
                # also transpose comparison
                RT=tuple(R[c*3+r] for r in range(3) for c in range(3));dt=[M[i]-RT[i] for i in range(9)];rmst=math.sqrt(sum(x*x for x in dt)/9);mxt=max(abs(x) for x in dt)
                print('MODE',mode,side,name,'rms',f'{rms:.9g}','max',f'{mx:.9g}','transpose_rms',f'{rmst:.9g}','transpose_max',f'{mxt:.9g}')
          print('\n=== DECISION GATE ===')
          print('Matrix pairs that are inverses and numerically identify with sRGB/AdobeRGB/ECI linear RGB<->XYZ transforms close output-space selection as linear color management. This does not by itself locate the nonlinear output OETF.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2C.txt
          git commit -m 'research: record CA9 output-space matrices 2C' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push