name: M10-R v1.43 ASN gain shared block
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v143-asn-gain-shared-block.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace ASN gain shared block
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v143_asn_gain_shared_block.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          th=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);th.detail=True;th.skipdata=True
          ar=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);ar.detail=True;ar.skipdata=True
          def off(a):return PFX+a-BASE
          def cstr(a,limit=260):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+limit));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def dis(md,a,z):return list(md.disasm(b[off(a):off(z)],a))
          def lit(i,thumb=True):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=(((i.address+4)&~3) if thumb else i.address+8)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                a=((i.address+4)&~3)+i.operands[1].imm;return a,cstr(a)
            except:pass
          def fmt(i,thumb=True):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i,thumb)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}';st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            if thumb:
              a=adr(i)
              if a:s+=f' ; ADR_EFF {a[0]:#x}'+(f' STRING={a[1]!r}' if a[1] else '')
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.43 ASN / GAIN SHARED BLOCK')
          print('\n=== helper 0x421A0A44 Thumb/ARM interpretations ===')
          for mode,md,thumb in [('THUMB',th,True),('ARM',ar,False)]:
            print('--',mode,'--')
            for i in dis(md,0x421a09f0,0x421a0ac0):print(fmt(i,thumb))
          print('\n=== literal pools containing shared/global targets ===')
          targets=(0x43705760,0x43705830,0x43705950)
          pools={}
          for t in targets:
            pat=struct.pack('<I',t);q=0;hs=[]
            while True:
              q=b.find(pat,q)
              if q<0:break
              hs.append(BASE+q-PFX);q+=1
            pools[t]=hs;print(hex(t),[hex(x) for x in hs])
          print('\n=== PC-relative code refs to target literal pools in IMG color/WB region ===')
          ins=dis(th,0x42090000,0x420b2000)
          refs=[]
          target_pool_to_val={p:t for t,ps in pools.items() for p in ps}
          for i in ins:
            q=lit(i,True)
            if q and q[0] in target_pool_to_val:
              refs.append((i.address,target_pool_to_val[q[0]],q[0]));print(fmt(i,True))
          print('\n=== narrow neighborhoods around each shared-block code ref ===')
          shown=set()
          for a,t,p in refs:
            key=(max(0x42090000,a-0x50),min(0x420b2000,a+0x90))
            if key in shown:continue
            shown.add(key);print(f'\n-- ref {a:#x} target={t:#x} --')
            for i in dis(th,*key):print(fmt(i,True))
          print('\n=== functions/prologues containing refs and their direct callers ===')
          # nearest preceding push-with-lr within 0x500 bytes
          starts=[]
          for a,_,_ in refs:
            cand=None
            for i in dis(th,max(0x42090000,a-0x500),a+2):
              if i.mnemonic=='push' and 'lr' in i.op_str:cand=i.address
            if cand is not None and cand not in starts:starts.append(cand)
          print('starts',[hex(x) for x in starts])
          for st in starts:
            hs=[]
            for i in ins:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==st:hs.append(i.address)
            print(hex(st),'callers',[hex(x) for x in hs])
          print('\n=== ColorManagementFinished exact ASN->debug gain math ===')
          for i in dis(th,0x420a3ca4,0x420a3d32):print(fmt(i,True))
          print('\n=== TARGET ===')
          print('Identify the writer/owner of 0x43705760, its three ASN double offsets, and the exact semantic role of 0x421A0A44 after 256/ASN.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v143_asn_gain_shared_block.txt
          git commit -m 'research: record v1.43 ASN gain shared block' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push