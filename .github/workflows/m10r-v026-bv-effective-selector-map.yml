name: M10-R v0.26 effective BV and selector mapping trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v026-bv-effective-selector-map.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Effective-offset and selector mapping trace
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v026_bv_effective_selector_map.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC

          def sx(v,bits): return v-(1<<bits) if v&(1<<(bits-1)) else v
          class Sec:
            def __init__(self,path,base,pfx=4):
              self.b=Path(path).read_bytes(); self.base=base; self.pfx=pfx; self.code=self.b[pfx:]; self.end=base+len(self.code)
              self.md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); self.md.detail=True; self.md.skipdata=True
            def off(self,a): return self.pfx+a-self.base
            def u32(self,a):
              o=self.off(a); return struct.unpack_from('<I',self.b,o)[0] if 0<=o<=len(self.b)-4 else None
            def lit(self,i):
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; return la,self.u32(la)
              return None,None
            def fmt(self,i):
              la,v=self.lit(i); ex=f' ; LIT {la:#x}->{v:#x}' if v is not None else ''
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: ex+=f' ; CALL {i.operands[0].imm:#x}'
              return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
            def dis(self,a,n): return [i for i in self.md.disasm(self.b[self.off(a):self.off(a+n)],a) if i.mnemonic!='.byte']
            def literals(self,val):
              pat=struct.pack('<I',val); out=[]; q=0
              while True:
                q=self.b.find(pat,q)
                if q<0: break
                if q>=self.pfx: out.append(self.base+q-self.pfx)
                q+=1
              return out
            def ldrrefs(self,val):
              lits=set(self.literals(val)); out=[]
              for p in range(0,len(self.code)-4,2):
                a=self.base+p; h1=struct.unpack_from('<H',self.code,p)[0]; la=None; rt=None
                if (h1&0xf800)==0x4800: rt=(h1>>8)&7; la=((a+4)&~3)+((h1&0xff)<<2)
                elif h1 in (0xf8df,0xf85f):
                  h2=struct.unpack_from('<H',self.code,p+2)[0];rt=(h2>>12)&15;imm=h2&0xfff;la=((a+4)&~3)+(imm if h1==0xf8df else -imm)
                if la in lits: out.append((a,rt))
              return out
            def blcallers(self,target):
              out=[]
              for p in range(0,len(self.code)-4,2):
                h1,h2=struct.unpack_from('<HH',self.code,p)
                if (h1&0xf800)!=0xf000 or (h2&0xd000)!=0xd000: continue
                s=(h1>>10)&1;imm10=h1&0x3ff;j1=(h2>>13)&1;j2=(h2>>11)&1;imm11=h2&0x7ff;i1=(~(j1^s))&1;i2=(~(j2^s))&1
                imm25=(s<<24)|(i1<<23)|(i2<<22)|(imm10<<12)|(imm11<<1);dst=(self.base+p+4+sx(imm25,25))&0xffffffff
                if (dst&~1)==(target&~1):out.append(self.base+p)
              return out
            def dump(self,a,n,title):
              print(f'\n=== {title} {a:#x} ===')
              for i in self.dis(a,n): print(self.fmt(i))

          img=Sec('/tmp/sections/092_IMG-System.bin',0x42000000)
          print('################ EFFECTIVE PACK OFFSETS ################')
          refs=img.ldrrefs(0x408f0ec0); print('PACK_REFS',[hex(a) for a,_ in refs])
          marked=[]
          for start,basereg in refs:
            seq=img.dis(start,0x260); aliases={basereg:0}; local=[]
            for i in seq:
              # report memory access before processing register overwrite
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.base in aliases:
                  eff=aliases[op.mem.base]+op.mem.disp
                  if 0x20<=eff<=0x40:
                    rw='WRITE' if i.mnemonic.startswith('str') else 'READ'
                    local.append((i.address,eff,rw,img.fmt(i)))
              ops=i.operands
              # propagate simple MOV reg,reg
              if i.mnemonic.startswith('mov') and len(ops)>=2 and ops[0].type==ARM_OP_REG:
                d=ops[0].reg
                if ops[1].type==ARM_OP_REG and ops[1].reg in aliases: aliases[d]=aliases[ops[1].reg]
                else: aliases.pop(d,None)
              # ADD/SUB forms, including adds r0,#imm
              elif (i.mnemonic.startswith('add') or i.mnemonic.startswith('sub')) and ops and ops[0].type==ARM_OP_REG:
                d=ops[0].reg; sign=1 if i.mnemonic.startswith('add') else -1; new=None
                if len(ops)==2 and ops[1].type==ARM_OP_IMM and d in aliases: new=aliases[d]+sign*ops[1].imm
                elif len(ops)>=3 and ops[1].type==ARM_OP_REG and ops[1].reg in aliases and ops[2].type==ARM_OP_IMM: new=aliases[ops[1].reg]+sign*ops[2].imm
                if new is None: aliases.pop(d,None)
                else: aliases[d]=new
              # loads overwrite destination with data, not pointer alias
              elif i.mnemonic.startswith('ldr') and ops and ops[0].type==ARM_OP_REG:
                d=ops[0].reg
                la,v=img.lit(i)
                if i.address==start and v==0x408f0ec0: aliases[d]=0
                elif v==0x408f0ec0: aliases[d]=0
                else: aliases.pop(d,None)
              # calls clobber volatile aliases
              if i.mnemonic in ('bl','blx'):
                for r in list(aliases):
                  if r in (66,67,68,69): aliases.pop(r,None)  # ARM_REG_R0..R3 values in capstone builds commonly contiguous; harmless if not
            if local:
              marked.append(start); print(f'\nPACK_REF {start:#x}')
              for a,e,rw,line in local: print(f'EFFECTIVE {rw} +{e:#04x} @ {a:#x} :: {line}')
          print('\nMARKED_PACK_REFS',[hex(x) for x in marked])

          ctrl=Sec('/tmp/sections/090_CTRL-System.bin',0x08000000)
          helper=0x08007c20; setter=0x0800de28
          print('\n################ SELECTOR CONVERTER ################')
          ctrl.dump(0x08007be0,0x120,'AROUND 0x08007C20')
          hc=ctrl.blcallers(helper); print('\nHELPER_CALLERS',[hex(x) for x in hc])
          for a in hc: ctrl.dump(max(ctrl.base,a-0x40),0xa0,f'HELPER CALLER {a:#x}')
          sc=ctrl.blcallers(setter); print('\nSETTER_CALLERS',[hex(x) for x in sc])
          for a in sc: ctrl.dump(max(ctrl.base,a-0x50),0xb0,f'SETTER CALLER {a:#x}')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v026_bv_effective_selector_map.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.26 effective BV and selector mapping trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
