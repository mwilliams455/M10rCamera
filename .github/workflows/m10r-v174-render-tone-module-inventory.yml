name: M10-R v1.74 rendered tone module inventory
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v174-render-tone-module-inventory.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory tone/gamma/curve/LUT image modules across firmware sections
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v174_render_tone_module_inventory.txt
          from pathlib import Path
          import re
          terms=('GAMMA','TONE','CURVE','LUT','LOOKUP','CONTRAST','SATURATION','HUE','B2Y','YUV','YCC','COLOR CORRECTION','COLOR_CORRECTION','CCM','3D LUT','1D LUT','DYNAMIC RANGE','DYNAMIC_RANGE','DRC','LUMA','CHROMA')
          print('M10-R v1.74 RENDERED TONE/GAMMA MODULE INVENTORY')
          total=0
          for p in sorted(Path('/tmp/sections').glob('*.bin')):
            d=p.read_bytes(); hits=[]
            for m in re.finditer(rb'[ -~]{4,}\x00',d):
              s=m.group()[:-1].decode('ascii','replace')
              u=s.upper()
              if any(t in u for t in terms):hits.append((m.start(),s))
            if hits:
              print(f'\n=== {p.name} hits={len(hits)} ===')
              for o,s in hits[:600]:print(f'{o:#x}',repr(s))
              total+=len(hits)
          print('\nTOTAL_HITS',total)
          print('\n=== asset-like names only ===')
          for p in sorted(Path('/tmp/sections').glob('*.bin')):
            d=p.read_bytes()
            for m in re.finditer(rb'[ -~]{4,}\x00',d):
              s=m.group()[:-1].decode('ascii','replace');u=s.upper()
              if ('.BIN' in u or '.DAT' in u or '.LUT' in u or '.TBL' in u) and any(t in u for t in terms):print(p.name,hex(m.start()),repr(s))
          print('\nTARGET: identify candidate hardware/software stage that owns rendered tone/gamma/curve behavior, separate from CA9 CM and B2Y CC.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v174_render_tone_module_inventory.txt
          git commit -m 'research: record v1.74 rendered tone module inventory' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push