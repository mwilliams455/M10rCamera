name: M10-R CA9 output-space audit1A

on:
  push:
    branches: [m10r-ca9-outputspace-audit1a]
    paths:
      - 'tools/m10r_ca9_outputspace_audit1a.py'
      - '.github/workflows/m10r-ca9-outputspace-audit1a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax
        run: python3 -m py_compile tools/m10r_ca9_outputspace_audit1a.py
      - name: Fetch and verify archived firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode and extract canonical sections
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <string>
          #include <vector>
          using namespace std;
          static uint32_t u32(const vector<uint8_t>& b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);}
          struct BR{const uint8_t* p; size_t n,bit=0; int get(){if(bit>=n*8) throw runtime_error("eof"); int v=(p[bit>>3]>>(7-(bit&7)))&1; ++bit; return v;}};
          static int cat(BR& r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;}
          int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t> fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;if(fw.size()<C+0x160||string((char*)&fw[C],4)!="COMP")return 2;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t* tr=&fw[C+0x54];vector<uint8_t> out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}if(out.size()!=expected)return 3;ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/m10r_sections >/tmp/sections.txt
      - name: Inventory CA9 calibration assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > research/M10R_CA9_CALIB_SECTION_INVENTORY.txt
          import csv, pathlib, hashlib, struct
          root=pathlib.Path('/tmp/m10r_sections')
          rows=list(csv.DictReader((root/'sections.csv').open()))
          print('M10-R CA9/B2Y calibration section inventory')
          print('index\tname\tsize\tkind\timage_base\taux\tsha256')
          for r in rows:
              i=int(r['index']); n=r['name']; p=root/r['file']
              if (60 <= i <= 80) or ('CA9' in n) or ('B2Y' in n):
                  b=p.read_bytes()
                  print(f"{i}\t{n}\t{len(b)}\t{r['kind']}\t{r['image_base']}\t{r['aux']}\t{hashlib.sha256(b).hexdigest()}")
                  if 'CA9' in n:
                      print('HEX='+b.hex())
                      if len(b)%2==0:
                          u16=list(struct.unpack('<'+'H'*(len(b)//2),b)); print('U16_LE='+','.join(map(str,u16)))
                      if len(b)%4==0:
                          u32=list(struct.unpack('<'+'I'*(len(b)//4),b)); print('U32_LE='+','.join(map(str,u32)))
          PY
          cat research/M10R_CA9_CALIB_SECTION_INVENTORY.txt
      - name: Run CA9 output-space audit
        run: |
          set -euo pipefail
          python3 tools/m10r_ca9_outputspace_audit1a.py /tmp/m10r_sections research/M10R_CA9_OUTPUTSPACE_AUDIT1A.json research/M10R_CA9_OUTPUTSPACE_AUDIT1A.md | tee /tmp/summary.txt
          cat /tmp/summary.txt
          cat research/M10R_CA9_OUTPUTSPACE_AUDIT1A.md
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_CA9_OUTPUTSPACE_AUDIT1A.json research/M10R_CA9_OUTPUTSPACE_AUDIT1A.md research/M10R_CA9_CALIB_SECTION_INVENTORY.txt
          if ! git diff --cached --quiet; then
            git commit -m 'research: record CA9 output-space audit1A evidence'
            git push
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10r-ca9-outputspace-audit1a
          path: |
            research/M10R_CA9_OUTPUTSPACE_AUDIT1A.json
            research/M10R_CA9_OUTPUTSPACE_AUDIT1A.md
            research/M10R_CA9_CALIB_SECTION_INVENTORY.txt
            /tmp/summary.txt
          if-no-files-found: warn
