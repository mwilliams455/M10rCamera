name: M10-R v1.56 CA9 mailbox callback dispatch
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v156-ca9-mailbox-callback-dispatch.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace registered CA9 mailbox callback and opcode 0x40 case
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v156_ca9_mailbox_callback_dispatch.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,n=260):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(32<=x<127 for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          ins=list(md.disasm(b[PFX:],BASE))
          print('M10-R v1.56 CA9 MAILBOX CALLBACK DISPATCH')
          print('\n=== register callback function 0x4000BEB8 ===')
          for i in dis(0x4000beb8,0x4000bee4):print(fmt(i))
          print('\n=== direct callers of register function ===')
          callers=[i for i in ins if call(i)==0x4000beb8]
          print([hex(i.address) for i in callers])
          for ci in callers:
            print(f'-- caller {ci.address:#x} --')
            for i in dis(max(BASE,ci.address-0x100),min(BASE+len(b)-PFX,ci.address+0x100)):print(fmt(i))
          print('\n=== literal refs to callback global 0x40026810 ===')
          pat=struct.pack('<I',0x40026810);p=0;pools=[]
          while True:
            p=b.find(pat,p)
            if p<0:break
            pools.append(BASE+p-PFX);p+=4
          print([hex(x) for x in pools])
          for lp in pools:
            for i in dis(max(BASE,lp-0x500),lp):
              q=lit(i)
              if q and q[0]==lp:print(fmt(i))
          # infer direct callback values loaded into r0 immediately before register call
          callbacks=[]
          for ci in callers:
            win=dis(max(BASE,ci.address-0x40),ci.address+4)
            for i in win:
              q=lit(i)
              if q and i.address<ci.address and q[1]>=BASE and q[1]<BASE+len(b)-PFX:
                callbacks.append(q[1])
          callbacks=list(dict.fromkeys(callbacks))
          print('\ncallback_candidates',[hex(x) for x in callbacks])
          for cb in callbacks:
            print(f'\n=== callback candidate {cb:#x} ===')
            for i in dis(cb,min(BASE+len(b)-PFX,cb+0x1200)):print(fmt(i))
            print('-- CMP opcode 0x40 within candidate --')
            for i in dis(cb,min(BASE+len(b)-PFX,cb+0x1200)):
              if i.mnemonic.startswith(('cmp','teq')) and ('#0x40' in i.op_str or '#64' in i.op_str):print(fmt(i))
          print('\n=== all immediate CMP #0x40 in CA9 image and bounded context ===')
          cmps=[i for i in ins if i.mnemonic.startswith(('cmp','teq')) and ('#0x40' in i.op_str or '#64' in i.op_str)]
          print([hex(i.address) for i in cmps])
          for i in cmps:
            print(f'-- cmp40 {i.address:#x} --')
            for j in dis(max(BASE,i.address-0x60),min(BASE+len(b)-PFX,i.address+0xb0)):print(fmt(j))
          print('\n=== mailbox receive ABI ===')
          print('0x4000BF84 reads 9 words from FFF50000-selected bank +0x140..+0x160 and calls *(0x40026810) with those words as C arguments.')
          print('IMG request word0 is 0x40, so callback arg0/opcode must resolve to 0x40 unless an intermediate wrapper changes it.')
          print('\n=== TARGET ===')
          print('Resolve registered callback and its opcode 0x40 branch to the CA9 color-management handler. Use that handler to trace ASN remapping and TF table directly.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v156_ca9_mailbox_callback_dispatch.txt
          git commit -m 'research: record v1.56 CA9 mailbox callback dispatch' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push