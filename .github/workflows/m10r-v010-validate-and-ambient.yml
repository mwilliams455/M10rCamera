name: M10-R v0.10 validate and ambient trace

on:
  push:
    branches: [m10r-metering-latch-trace]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware sections for inspectors
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          mkdir -p firmware/sections
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin firmware/sections >/dev/null
      - name: Run full research tests
        run: python -m unittest discover -s tests -v
      - name: Trace aperture estimate ownership and AV0 calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/m10r-aperture-ownership.txt
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM
          sec=Path('firmware/sections')
          print('=== CROSS-SECTION AV/APERTURE STRING SEARCH ===')
          pats=(b'av0',b'aperture',b'ambient light',b'bv adjust',b'clear bv')
          for p in sorted(sec.glob('*.bin')):
            d=p.read_bytes(); low=d.lower()
            hits=[]
            for pat in pats:
              q=0
              while True:
                q=low.find(pat,q)
                if q<0:break
                a=max(0,d.rfind(b'\x00',0,q)+1);z=d.find(b'\x00',q);z=len(d) if z<0 else z
                hits.append((q,d[a:z].decode('ascii','ignore')));q+=1
            if hits:
              print('\nSECTION',p.name)
              for h,s in hits:print(hex(h),repr(s))

          b=(sec/'090_CTRL-System.bin').read_bytes();base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(v):return pfx+v-base
          def dis(label,s,e):
            print(f'\n=== {label} {s:#010x}..{e:#010x} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte':print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          dis('AE_INPUT_BUILD_AND_CALCULATOR_CALL',0x0800d940,0x0800dbc0)
          dis('CENTRAL_CALCULATOR_ENTRY',0x080203b4,0x08020580)
          print('\n=== ALL CALLS TO APERTURE RAW/TRANSFORM GETTERS ===')
          for target,name in [(0x08011ce2,'AV_RAW_GET'),(0x08011cea,'FNUMBER_GET')]:
            cs=[]
            for i in md.disasm(b[pfx:],base):
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and i.operands[0].imm==target:cs.append(i.address)
            print(name,[hex(x) for x in cs])
          print('\n=== CALIBRATION RECORD GETTER CALLS WITH +0x13 ACCESS NEARBY ===')
          calls=[]
          for i in md.disasm(b[pfx:],base):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and i.operands[0].imm==0x0801124c:calls.append(i.address)
          for a in calls:
            ins=list(md.disasm(b[off(a):off(min(a+420,base+len(b)-pfx))],a))
            matches=[]
            for j in ins:
              if j.mnemonic=='.byte':continue
              if any(op.type==ARM_OP_MEM and op.mem.disp==0x13 for op in j.operands):matches.append(j.address)
            if matches:
              print('getter',hex(a),'offset13_access',[hex(x) for x in matches])
              dis('CAL13_CONTEXT_'+hex(a),max(base,a-80),min(base+len(b)-pfx,a+440))
          print('\n=== DIRECT 0x2001A78F REFERENCES ===')
          target=0x2001a78f;needle=struct.pack('<I',target);q=0
          while True:
            q=b.find(needle,q)
            if q<0:break
            print(hex(base+q-pfx));q+=1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-aperture-ownership
          path: /tmp/m10r-aperture-ownership.txt
          if-no-files-found: error
