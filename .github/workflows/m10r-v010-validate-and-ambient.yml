name: M10-R v0.10 validate and ambient trace

on:
  push:
    branches: [m10r-metering-latch-trace]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware sections for inspectors
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          mkdir -p firmware/sections
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin firmware/sections >/dev/null
      - name: Run full research tests
        run: python -m unittest discover -s tests -v
      - name: Trace external Bv correction state and limits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/m10r-bvext-correction.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('firmware/sections/090_CTRL-System.bin').read_bytes();base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(v):return pfx+v-base
          def dis(label,s,e):
            print(f'\n=== {label} {s:#010x}..{e:#010x} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte': print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          dis('CORRECTION_CONVERTER_801CBFC',0x0801cb80,0x0801cc90)
          dis('CORRECTION_LIMIT_HELPERS',0x08010e80,0x08010f50)
          dis('BVEXT_BLEND',0x0800f98c,0x0800fa72)
          targets={0x08011ccc:'CORR_SET',0x08011ce2:'CORR_GET',0x08011cea:'CORR_XFORM_GET',0x08011cbe:'STATE8_GET',0x08011cc6:'STATE2C_GET'}
          callers={t:[] for t in targets}
          for i in md.disasm(b[pfx:],base):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and i.operands[0].imm in callers:
              callers[i.operands[0].imm].append(i.address)
          print('\n=== CORRECTION ACCESSOR CALLERS ===')
          for t,n in targets.items(): print(n,hex(t),[hex(x) for x in callers[t]])
          seen=set()
          for t,n in targets.items():
            for a in callers[t]:
              if a in seen: continue
              seen.add(a); dis(n+'_CALL_'+hex(a),max(base,a-100),min(base+len(b)-pfx,a+150))
          strings={}
          for m in re.finditer(rb'[ -~]{4,160}\x00',b): strings[base+m.start()-pfx]=m.group()[:-1].decode('ascii','ignore')
          print('\n=== RELATED STRINGS ===')
          for va,s in sorted(strings.items()):
            lo=s.lower()
            if any(k in lo for k in ('bv ext','bvext','ambient','correction bv','bv correction','ir bv','bv_ir','bv value','aperture estimation','estimated aperture')):
              print(hex(va),repr(s))
          print('\n=== TABLE 0x20000040 INITIALIZER POINTER XREFS ===')
          target=0x20000040;needle=struct.pack('<I',target);p=0
          while True:
            p=b.find(needle,p)
            if p<0: break
            lit=base+p-pfx;refs=[]
            for i in md.disasm(b[pfx:],base):
              if i.mnemonic=='.byte': continue
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_PC and (((i.address+4)&~3)+op.mem.disp)==lit: refs.append(i.address)
            print(hex(lit),[hex(x) for x in refs]);p+=1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-bvext-correction
          path: /tmp/m10r-bvext-correction.txt
          if-no-files-found: error
