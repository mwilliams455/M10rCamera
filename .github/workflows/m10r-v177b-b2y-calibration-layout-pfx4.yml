name: M10-R v1.77b B2Y calibration PFX4
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v177b-b2y-calibration-layout-pfx4.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse B2Y calibration with section prefix
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v177b_b2y_calibration_layout_pfx4.txt
          from pathlib import Path
          import struct,hashlib
          d=Path('/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin').read_bytes();P=4
          u32=lambda o:struct.unpack_from('<I',d,o)[0]
          def s64(o):return d[o:o+0x40].split(b'\0',1)[0].decode('ascii','replace')
          magic=u32(P); version=u32(P+4); count=u32(P+8); stride=0xA90; rec0=P+0x10; payload_base=rec0+count*stride
          names={1:'deknee',8:'tone_control',9:'interpolation_gamma',0xb:'differential_gamma_control',0x19:'tone_tbl0',0x1a:'tone_tbl1',0x1c:'differential_gamma_tbl',0x1d:'differential_gamma_tbl_fl'}
          print('M10-R v1.77b B2Y CALIBRATION LAYOUT PFX4')
          print('size',hex(len(d)),'section_prefix',d[:4].hex(),'magic',hex(magic),'version',version,'count',count,'stride',hex(stride),'rec0',hex(rec0),'payload_base',hex(payload_base),'magic_ok',magic==0xca11bf11)
          recs=[]
          for i in range(count):
            o=rec0+i*stride; rid=u32(o); rel=u32(o+4); x8=u32(o+8); nk=u32(o+0xc)
            keys=[s64(o+0x10+j*0x40) for j in range(min(nk,42))]
            ap=payload_base+rel
            recs.append(dict(i=i,o=o,id=rid,rel=rel,x8=x8,nk=nk,keys=keys,ap=ap))
          print('\n=== all selector headers compact ===')
          for r in recs:print(f"i={r['i']:3d} id={r['id']:#04x} rel={r['rel']:#09x} x8={r['x8']:#x} keys={r['nk']:2d} payload={r['ap']:#09x} {names.get(r['id'],'')}")
          starts=sorted(set(r['ap'] for r in recs if payload_base<=r['ap']<=len(d)))
          def extent(ap):
            x=[v for v in starts if v>ap];return (x[0] if x else len(d))-ap
          wants=['_B2YMODE:STILL_ISO:100','_B2YMODE:STILL_ISO:160','_B2YMODE:STILL_ISO:200','_B2YMODE:STILL_ISO:400','_B2YMODE:STILL_ISO:1600']
          print('\n=== target selector details ===')
          for rid,nm in names.items():
            rr=[r for r in recs if r['id']==rid]
            print(f'\nID {rid:#x} {nm} occurrences={len(rr)}')
            for r in rr:
              ex=extent(r['ap']) if r['ap'] in starts else 0
              blob=d[r['ap']:r['ap']+ex] if ex>0 else b''
              print(f" rec={r['i']} rel={r['rel']:#x} payload={r['ap']:#x} extent={ex:#x} x8={r['x8']:#x} keys={r['nk']} sha256={hashlib.sha256(blob).hexdigest() if blob else '-'}")
              for w in wants:
                js=[j for j,k in enumerate(r['keys']) if k==w]
                if js:print('  ',w,'slots',js)
              for j,k in enumerate(r['keys']):
                if k.startswith('_B2YMODE:STILL_') and ('ISO:100' in k or 'ISO:160' in k or 'ISO:200' in k):print(f'   key[{j}] {k}')
              print('  head',d[r['ap']:r['ap']+64].hex() if payload_base<=r['ap']<len(d) else 'OOB')
          print('\n=== key-slot mapping for target ids (all keys) ===')
          for r in recs:
            if r['id'] in names:
              print(f"ID {r['id']:#x} {names[r['id']]} rec={r['i']}")
              for j,k in enumerate(r['keys']):print(j,repr(k))
          print('\nTARGET: corrected exact selector/payload geometry and STILL ISO slot mapping.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v177b_b2y_calibration_layout_pfx4.txt
          git commit -m 'research: record v1.77b corrected B2Y calibration layout' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push