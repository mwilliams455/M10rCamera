name: M10-R output-space transfer 1U
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1u.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover corrected CA9 ADR xrefs and IPC manager
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1U.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4
          tmd=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);tmd.detail=True
          amd=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);amd.detail=True
          def off(a):return PFX+a-BASE
          def dec1(md,a):
            o=off(a)
            if not 0<=o<len(b)-4:return None
            q=list(md.disasm(b[o:o+4],a,count=1));return q[0] if q else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+240));q=b[o:e] if e>o else b''
            try:s=q.decode('ascii')
            except:return None
            return s if len(s)>=4 and all(0x20<=x<=0x7e for x in q) else None
          # raw interesting strings with runtime addresses
          strings=[]
          for o in range(PFX,len(b)):
            if not (0x20<=b[o]<0x7f):continue
            if o>PFX and 0x20<=b[o-1]<0x7f:continue
            e=b.find(b'\0',o,min(len(b),o+240));q=b[o:e] if e>o else b''
            try:s=q.decode('ascii')
            except:continue
            sl=s.lower()
            if len(s)>=5 and any(k in sl for k in ('ca9_control_manager','ca9_cm_','colorspec','colormanagement','color management','shared_memory','ipcu','mailbox','command')):
              strings.append((BASE+o-PFX,s))
          targets={a for a,_ in strings}; smap=dict(strings)
          print('M10-R OUTPUTSPACE TRANSFER1U')
          print('\n=== RELEVANT STRINGS ===')
          for a,s in strings:print(hex(a),repr(s))

          def xrefs_for(mode,md,step):
            out=[]
            for a in range(BASE,BASE+len(b)-PFX-4,step):
              i=dec1(md,a)
              if not i:continue
              vals=[]
              # Correct Thumb ADR: Align(a+4,4)+imm. ARM ADR generally disassembles as add/sub reg,pc,#imm.
              try:
                if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                  imm=i.operands[1].imm
                  v=((a+4)&~3)+imm if mode=='THUMB' else a+8+imm
                  vals.append(v)
                if i.mnemonic in ('add','sub') and len(i.operands)>=3 and i.operands[1].type==ARM_OP_REG and i.operands[1].reg==ARM_REG_PC and i.operands[2].type==ARM_OP_IMM:
                  pc=((a+4)&~3) if mode=='THUMB' else a+8
                  vals.append(pc+i.operands[2].imm if i.mnemonic=='add' else pc-i.operands[2].imm)
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  pc=((a+4)&~3) if mode=='THUMB' else a+8
                  la=pc+i.operands[1].mem.disp;o=off(la)
                  if 0<=o<=len(b)-4:vals.append(struct.unpack_from('<I',b,o)[0])
              except:pass
              for v in vals:
                if v in targets:out.append((mode,a,v,i))
            return out
          hits=xrefs_for('THUMB',tmd,2)+xrefs_for('ARM',amd,4)
          print('\n=== CORRECTED MIXED-MODE STRING XREFS ===')
          print('HIT_COUNT',len(hits))
          for mode,a,v,i in sorted(hits,key=lambda x:x[1]):print(mode,hex(a),'->',hex(v),i.mnemonic,i.op_str,repr(smap[v]))

          # Find a conservative prologue start before each hit, mode-specific.
          def start_for(mode,a):
            md=tmd if mode=='THUMB' else amd;step=2 if mode=='THUMB' else 4
            best=None
            for p in range(a,max(BASE,a-0x400),-step):
              i=dec1(md,p)
              if not i:continue
              s=i.mnemonic+' '+i.op_str
              if (mode=='THUMB' and i.mnemonic=='push' and 'lr' in i.op_str) or (mode=='ARM' and i.mnemonic in ('push','stmdb') and ('lr' in i.op_str or 'sp!' in i.op_str)):
                best=p;break
            return best
          funcs={}
          for mode,a,v,i in hits:
            st=start_for(mode,a)
            if st is not None:funcs.setdefault((mode,st),[]).append((a,v))
          print('\n=== XREF FUNCTION WINDOWS ===')
          for (mode,st),hv in sorted(funcs.items(),key=lambda x:x[0][1]):
            md=tmd if mode=='THUMB' else amd;hi=min(BASE+len(b)-PFX,st+0x700)
            print('\nFUNCTION',mode,hex(st),'HITS',','.join(hex(a)+'->'+smap[v] for a,v in hv))
            for i in md.disasm(b[off(st):off(hi)],st):
              if i.mnemonic in ('bx','pop') and ('pc' in i.op_str or i.mnemonic=='bx') and i.address>max(a for a,_ in hv):
                print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}');break
              print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}')

          print('\n=== MANAGER FUNCTION MMIO / CMP SURFACE ===')
          for (mode,st),hv in sorted(funcs.items(),key=lambda x:x[0][1]):
            if not any('control_Manager' in smap[v] for _,v in hv):continue
            md=tmd if mode=='THUMB' else amd;hi=min(BASE+len(b)-PFX,st+0xa00)
            print('MANAGER',mode,hex(st))
            for i in md.disasm(b[off(st):off(hi)],st):
              line=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
              vals=[]
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  pc=((i.address+4)&~3) if mode=='THUMB' else i.address+8
                  la=pc+i.operands[1].mem.disp;o=off(la)
                  if 0<=o<=len(b)-4:vals.append(struct.unpack_from('<I',b,o)[0])
              except:pass
              if i.mnemonic.startswith(('cmp','tst','b','ldr','str')) or vals:
                if vals:line+=' ; LITS='+','.join(hex(v) for v in vals)
                print(line)
              if i.mnemonic in ('bx','pop') and ('pc' in i.op_str or i.mnemonic=='bx') and i.address>max(a for a,_ in hv):break

          print('\n=== CA9 RAW OCCURRENCES OF LIKELY IPCU PHYSICAL/ALIASES ===')
          # Search exact ARM926 peripheral plus page-aligned/low16 fragments in data.
          for v in (0xfff50100,0xfff50000,0xf50100,0x50100):
            pats=[struct.pack('<I',v & 0xffffffff)]
            pos=[]
            for pat in pats:
              p=0
              while 1:
                p=b.find(pat,p)
                if p<0:break
                pos.append(BASE+p-PFX);p+=1
            print(hex(v),','.join(hex(x) for x in pos[:100]) or 'NONE')

          print('\n=== DECISION GATE ===')
          print('Use corrected ADR xrefs to recover ca9_control_Manager and CM functions. Then map mailbox payload handling to the StartColorManagement tuple 4/5/4/3 and nine-word payload; do not infer mode effects from the ARM926 sender alone.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1U.txt
          git commit -m 'research: record corrected CA9 ADR xrefs and manager trace 1U' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push