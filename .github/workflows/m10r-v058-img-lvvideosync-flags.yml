name: M10-R v0.58 IMG LVVideoSync flag provenance
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v058-img-lvvideosync-flags.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Trace IMG LVVideoSync flag provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v058_img_lvvideosync_flag_provenance.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC

          path='/tmp/sections/092_IMG-System.bin';b=Path(path).read_bytes();base=0x42000000;pfx=4;code=b[pfx:]
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return pfx+a-base
          def u32(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def astr(a,n=260):
            o=off(a)
            if not 0<=o<len(b):return None
            z=b.find(b'\0',o,min(len(b),o+n));z=z if z>=0 else min(len(b),o+n)
            try:s=b[o:z].decode('ascii')
            except:return None
            return s if len(s)>3 and all(c in '\r\n\t' or ' '<=c<='~' for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;return la,u32(la)
            except: pass
            return None,None
          def fmt(i):
            if i.id==0:return f'{i.address:08x}: .byte {i.op_str}'
            ex='';la,v=lit(i)
            if v is not None:
              s=astr(v);ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: ex+=f' ; CALL {i.operands[0].imm:#x}'
            except: pass
            return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
          ins=list(md.disasm(code,base));by={i.address:i for i in ins}
          def dump(a,z,title):
            a=max(base,a);z=min(base+len(code),z);print(f'\n=== {title} {a:#x}..{z:#x} ===')
            for i in md.disasm(b[off(a):off(z)],a):print(fmt(i))
          print('M10-R v0.58 IMG LVVIDEOSYNC FLAG PROVENANCE TRACE')
          print('Known command32 request template = 0x408F0EC9, flags byte = template+4 = 0x408F0ECD')
          targets={0x408f0ec0:'SHARED_BASE',0x408f0ec9:'CMD32_TEMPLATE',0x408f0ecd:'CMD32_FLAGS'}
          refs=[]
          for i in ins:
            la,v=lit(i)
            if v in targets:
              refs.append((i.address,v,targets[v]))
          print('\nDIRECT_LITERAL_REFS',[(hex(a),hex(v),n) for a,v,n in refs])
          for a,v,n in refs: dump(a-0xc0,a+0x180,f'{n} REF {a:#x}')

          # Track straightforward PC-literal base loads and nearby memory accesses through same register.
          print('\nBASE-REGISTER MEMORY ACCESSES NEAR 0x408F0EC0/0x408F0EC9')
          for idx,i in enumerate(ins):
            la,v=lit(i)
            if v not in (0x408f0ec0,0x408f0ec9,0x408f0ecd): continue
            try: reg=i.operands[0].reg
            except: continue
            print('\nBASELOAD',hex(i.address),hex(v),'REG',md.reg_name(reg))
            for j in ins[idx+1:idx+45]:
              if j.address-i.address>0x90: break
              touched=False
              try:
                for op in j.operands:
                  if op.type==ARM_OP_MEM and op.mem.base==reg:
                    touched=True
                    ea=v+op.mem.disp
                    print(fmt(j),'; EFFECTIVE_IF_UNCHANGED',hex(ea))
                # Stop if base register definitely overwritten by a common destination-register op.
                if j.operands and j.operands[0].type==ARM_OP_REG and j.operands[0].reg==reg and j.mnemonic not in ('str','strb','strh','stm','push') and j.address!=i.address:
                  if not touched: break
              except: pass

          # Scan all direct memory disp +0x0d accesses; this is CMD32 flags when base is shared base.
          print('\nALL MEMORY DISP +0x0D ACCESSES')
          for i in ins:
            try:
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.disp==0x0d:
                  print(fmt(i));break
            except: pass

          print('\nRELEVANT STRINGS')
          needles=(b'live finder',b'Live Finder',b'live view',b'Live View',b'LVVideo',b'video',b'Video',b'finder',b'Finder',b'exposure',b'Exposure')
          seen=set()
          for needle in needles:
            q=0
            while True:
              q=b.find(needle,q)
              if q<0:break
              va=base+q-pfx
              z=b.find(b'\0',q,min(len(b),q+240));z=z if z>=0 else min(len(b),q+240)
              s=b[q:z].decode('ascii','replace')
              key=(va,s)
              if key not in seen:
                print(hex(va),repr(s));seen.add(key)
              q+=1

          # Dump command32 builder and the local state helper already seen modifying a flag-like byte.
          dump(0x420bbcbe,0x420bbd30,'COMMAND32 BUILDER FLAG READ')
          dump(0x420aae98,0x420ab0c0,'FLAG-LIKE STATE BUILDER 0x420AAE98')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v058_img_lvvideosync_flag_provenance.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.58 IMG LVVideoSync flag provenance'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
