name: M10-R v1.05 PWCH channel6 schema
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v105-pwch-channel6-schema.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode Prepro write-channel 6 setup and related descriptors
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v105_pwch_channel6_schema.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def u32a(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+260)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all((32<=ord(c)<127) or c in '\r\n\t' for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp;return a,u32a(a)
            except:pass
          def adrvals(i):
            if i.mnemonic!='adr':return []
            vals=[]
            try:
              for op in i.operands:
                if op.type==ARM_OP_IMM:vals.append(op.imm&0xffffffff)
            except:pass
            try:
              v=int(i.op_str.split(',')[-1].strip().lstrip('#'),0);vals += [v&0xffffffff,(((i.address+4)&~3)+v)&0xffffffff,(i.address+4+v)&0xffffffff]
            except:pass
            return list(dict.fromkeys(vals))
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q and q[1] is not None:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=cstr(q[1]);
              if st:s+=f' STRING={st!r}'
            if i.mnemonic=='adr':
              ss=[(a,cstr(a)) for a in adrvals(i) if cstr(a)]
              if ss:s+=' ; ADRSTR '+repr(ss)
            return s
          print('M10-R v1.05 PREPRO WRITE-CHANNEL 6 SCHEMA')
          print('Known: AFAEAWB config calls drv_prepro_driver_pwch_setPWSA(channel=6,address=base+0x80).')
          # enumerate strings containing pwch / PWSA / PWCH
          strings=[];p=0
          while p<len(b):
            if 32<=b[p]<127:
              q=p
              while q<len(b) and 32<=b[q]<127:q+=1
              if q-p>=5 and q<len(b) and b[q]==0:
                try:s=b[p:q].decode('ascii')
                except:s=''
                sl=s.lower()
                if 'pwch' in sl or 'pwsa' in sl or 'write channel' in sl or 'write-channel' in sl:
                  strings.append((BASE+p-PFX,s)); print('STRING',hex(BASE+p-PFX),repr(s))
                p=q+1;continue
            p+=1
          # disassemble driver range and locate refs to those strings
          lo,hi=0x420df000,0x420e1400
          ins=[i for i in md.disasm(b[off(lo):off(hi)],lo) if i.id]
          targets={a:s for a,s in strings}
          refs=[]
          for n,i in enumerate(ins):
            q=lit(i)
            if q and q[1] in targets:refs.append((n,q[1],targets[q[1]]))
            if i.mnemonic=='adr':
              for a in adrvals(i):
                if a in targets:refs.append((n,a,targets[a]))
          print('\n=== PWCH STRING XREF WINDOWS ===')
          funs=[]
          for n,a,s in refs:
            st=None
            for k in range(n,max(-1,n-100),-1):
              if ins[k].mnemonic=='push':st=k;break
            fs=ins[st].address if st is not None else None
            if fs:funs.append(fs)
            print(f'\n--- {s!r} xref={ins[n].address:#x} function={hex(fs) if fs else None} ---')
            for j in range(max(0,(st if st is not None else n-25)),min(len(ins),n+70)):print(fmt(ins[j]))
          print('\nFUNCTIONS',*[hex(x) for x in sorted(set(funs))])
          # exact focused helper bodies
          for t,name in ((0x420e05b4,'descriptor helper 0x420E05B4'),(0x420e0850,'pwch_setPWSA'),(0x420de0f0,'0x420DE0F0 geometry/channel helper')):
            print(f'\n=== {name} ===')
            for i in md.disasm(b[off(t):off(t+0x180)],t):
              if i.id: print(fmt(i))
          # caller windows for descriptor helper and geometry helper
          wide=[i for i in md.disasm(b[off(0x420d8000):off(0x420e3000)],0x420d8000) if i.id]
          print('\n=== DIRECT CALLERS ===')
          for target in (0x420e05b4,0x420e0850,0x420de0f0):
            callers=[]
            for n,i in enumerate(wide):
              if i.mnemonic not in ('bl','blx'):continue
              try:d=int(i.op_str.strip().lstrip('#'),0)
              except:continue
              if d==target:callers.append((n,i.address))
            print(hex(target),'count',len(callers),*[hex(a) for _,a in callers])
            for n,a in callers[:12]:
              print(f'\n--- caller @{a:#x} ---')
              for j in range(max(0,n-18),min(len(wide),n+20)):print(fmt(wide[j]))
          # enumerate accesses to channel6 register slot: 0x20004d00 + 0x600 + fields = 0x20005300 region
          print('\n=== CHANNEL-6 PWCH MMIO LITERALS / USERS ===')
          for p in range(PFX,len(b)-3,4):
            v=struct.unpack_from('<I',b,p)[0]
            if 0x20004d00<=v<0x20005400:
              pa=BASE+p-PFX
              if v in (0x20004d00,0x20005300): print('POOL',hex(pa),'->',hex(v))
          print('\n=== DECISION ===')
          print('Identify additional channel-6 setters (size/stride/height/format) and their arguments from AFAEAWB config. If a setter establishes 352 records or a stable per-cell byte stride, freeze the producer data layout. Keep workflow+0x480 identity unfrozen until a transfer/copy/provenance chain is explicit.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v105_pwch_channel6_schema.txt
          git commit -m 'research: record v1.05 PWCH channel6 schema' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
