name: M10-R v0.31 IMG ADR metering xrefs
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v031-img-adr-meter-xrefs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Resolve ADR xrefs and enclosing functions
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v031_img_adr_meter_xrefs.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC,ARM_REG_LR

          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); base=0x42000000; pfx=4; code=b[pfx:]
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return pfx+a-base
          def u32(a):
              o=off(a); return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def astr(a,n=180):
              o=off(a)
              if not 0<=o<len(b): return None
              out=[]
              for c in b[o:o+n]:
                  if c==0: break
                  if c in (9,10,13) or 32<=c<127: out.append(chr(c))
                  else: return None
              s=''.join(out); return s if len(s)>=4 else None
          def fmt(i):
              ex=''
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  la=((i.address+4)&~3)+i.operands[1].mem.disp; v=u32(la)
                  if v is not None:
                      s=astr(v); ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
              if i.mnemonic.startswith('adr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM:
                  ex+=f' ; ADR_TARGET={i.operands[1].imm:#x} STRING={astr(i.operands[1].imm)!r}'
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: ex+=f' ; CALL {i.operands[0].imm:#x}'
              return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
          def dis(a,z):
              return [i for i in md.disasm(b[off(a):off(z)],a) if i.mnemonic!='.byte']
          def dump(a,z,title):
              print(f'\n=== {title} {a:#x}..{z:#x} ===')
              for i in dis(a,z): print(fmt(i))
          def nearest_prologue(a,maxback=0x100):
              # Find closest halfword-aligned PUSH including LR that can be decoded exactly there.
              candidates=[]
              for s in range(max(base,a-maxback)&~1,a+1,2):
                  ii=list(md.disasm(b[off(s):off(s)+6],s,count=1))
                  if not ii: continue
                  i=ii[0]
                  if i.address==s and i.mnemonic in ('push','push.w') and 'lr' in i.op_str:
                      candidates.append(s)
              return candidates[-1] if candidates else max(base,a-0x40)&~1

          # Runtime addresses from v0.28 file offsets using VA=base+fileoff-4.
          targets={
              0x420b8b28:'BV_Integral',
              0x420b8b3c:'BV_spot',
              0x420b8b4c:'BV_MFM',
              0x420b8b58:'EV_Integral',
              0x420b8b68:'EV_spot',
              0x420b8b78:'EV_MFM',
              0x420b92ec:'meter_mode_diag_A',
              0x420ba234:'SPARAM_EXP_METERING_MODE',
              0x420ba260:'meter_mode_diag_B',
          }
          refs={t:[] for t in targets}
          # Thumb16 ADR T1: 10100 Rd imm8; result Align(PC,4)+imm8*4, where PC=addr+4.
          for p in range(0,len(code)-2,2):
              h=struct.unpack_from('<H',code,p)[0]
              if (h & 0xF800)==0xA000:
                  a=base+p; target=((a+4)&~3)+((h&0xff)<<2)
                  if target in refs: refs[target].append((a,(h>>8)&7,'T1'))
          # Capstone-local scan around every target catches ADR.W and serves as a sanity check without decoding whole image.
          for t in targets:
              st=max(base,t-0x1000)&~1
              for shift in (0,2):
                  for i in md.disasm(b[off(st+shift):off(t+4)],st+shift):
                      if i.mnemonic.startswith('adr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM and i.operands[1].imm==t:
                          tup=(i.address,i.operands[0].reg,'CAPSTONE')
                          if not any(x[0]==i.address for x in refs[t]): refs[t].append(tup)
          print('################ ADR XREFS ################')
          allref=[]
          for t,name in targets.items():
              rr=sorted(refs[t]); print('\nTARGET',name,hex(t),repr(astr(t)),'REFS',[(hex(a),r,k) for a,r,k in rr])
              for a,r,k in rr:
                  s=nearest_prologue(a)
                  print('REF',hex(a),'NEAREST_PROLOGUE',hex(s))
                  dump(s,min(base+len(code),s+0x240),name+' FUNCTION')
                  allref.append(a)
          print('\nALL_REFS',[hex(x) for x in sorted(set(allref))])
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v031_img_adr_meter_xrefs.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.31 IMG ADR metering xrefs'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
