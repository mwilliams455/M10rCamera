name: M10-R Y_BLEND D4480 PRODUCER1A

on:
  push:
    branches: [m10r-yblend-d4480-producer1a]
    paths:
      - '.github/workflows/m10r-yblend-d4480-producer1a.yml'
      - 'tools/m10r_yblend_d4480_producer1a.py'
      - 'tools/m10r_yblend_bit15_audit1a.py'
      - 'tools/m10r_ycc_calib_compact_v086.py'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  producer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned disassembly and emulation dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3
      - name: Fetch and verify original firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2             'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW'             -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode and extract verified sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker)
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
          echo '53e307ad2b241e4684f5f9974c1b9780bcbc9e37ac580d8dcaf45cf72aae80d4  /tmp/sec/092_IMG-System.bin' | sha256sum -c -
          echo 'ea935a8006ea3b0a765660bd1d89f6a52c9f60508ee5ba76650005d80372335b  /tmp/sec/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin' | sha256sum -c -
      - name: Re-extract record 0x0D with retained v086 tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p producer1a_results
          python3 tools/m10r_ycc_calib_compact_v086.py /tmp/sec "$GITHUB_WORKSPACE"             | tee producer1a_results/v086_reextract.txt
          grep -F 'V086_0D_U32=0,32,16383,16383,16383,16383' producer1a_results/v086_reextract.txt
          grep -F 'OVERALL_VERDICT=RECORD_0C_0D_EXACTLY_COMPACT_TO_SAM7_YCC_CONTROL_LAYOUT' producer1a_results/v086_reextract.txt
      - name: Execute D4480 producer audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/m10r_yblend_d4480_producer1a.py /tmp/sec "$GITHUB_WORKSPACE"             --out producer1a_results/d4480_producer1a.json             | tee producer1a_results/d4480_producer1a_stdout.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('producer1a_results/d4480_producer1a.json').read_text())
          assert j['all_assertions_passed'] is True
          assert j['record_0x0d']['u32_le']==[0,32,16383,16383,16383,16383]
          assert j['selector']['driver']=='0xd4480'
          assert j['original_d4480_execution']['bit15_mutations_observed']==0
          print('PASS: D4480 software field producer provenance; pixel semantics remain unresolved.')
          PY
          git rev-parse HEAD > producer1a_results/source_commit.txt
          sha256sum tools/m10r_yblend_d4480_producer1a.py > producer1a_results/script_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-D4480-PRODUCER1A-RESULTS
          path: producer1a_results/
          retention-days: 90
          if-no-files-found: error
