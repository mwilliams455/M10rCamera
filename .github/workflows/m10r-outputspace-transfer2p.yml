name: M10-R output-space transfer 2P
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2p.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace TF remapping owner and consumers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2P.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          m=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);m.detail=True
          def o(a):return P+a-B
          def one(a):return next(iter(m.disasm(b[o(a):o(a)+4],a,count=1)),None)
          def ds(a,z):return list(m.disasm(b[o(a):o(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=o(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic.startswith('adr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM:return i.operands[1].imm
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);x=lit(i);a=adr(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            if a is not None:s+=f' ; ADR={a:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER2P')
          print('\n=== TF CALLER REGION 0x420A5600..0x420A5950 ===')
          reg=ds(0x420a5600,0x420a5950)
          for i in reg:print(fmt(i))
          print('\n=== NEAREST FUNCTION START BEFORE 0x420A583A ===')
          starts=[]
          for a in range(0x420a5838,0x420a5400,-2):
            i=one(a)
            if i and i.mnemonic=='push':
              starts.append(a)
              if len(starts)>=6:break
          print(*[hex(x) for x in starts])
          owner=starts[0] if starts else 0x420a5600
          print('OWNER_CANDIDATE',hex(owner))
          print('\n=== DIRECT CALLERS TO OWNER CANDIDATE ===')
          callers=[]
          for a in range(B,B+len(b)-P,2):
            i=one(a)
            if i and call(i)==owner:
              callers.append(a);print(hex(a))
          print('\n=== CALLER WINDOWS ===')
          for a in callers[:30]:
            print('\n--',hex(a),'--')
            for i in ds(max(B,a-0x90),min(B+len(b)-P,a+0x120)):print(fmt(i))
          print('\n=== TF OWNER STRUCT OFFSETS ===')
          for i in ds(owner,min(B+len(b)-P,owner+0x500)):
            dsps=[]
            for op in i.operands:
              if op.type==ARM_OP_MEM:dsps.append(op.mem.disp)
            if any(x in (0x128,0x12c,0x130,0x134,0x138,0x1b8) for x in dsps) or call(i)==0x420a4884:
              print(fmt(i))
          print('\n=== CODE-WIDE LOAD/STORE OFFSETS 0x128 0x12C 0x134 ===')
          hits=[]
          for lo in range(B,min(B+len(b)-P,0x421c0000),0x10000):
            hi=min(lo+0x10000,B+len(b)-P)
            for i in ds(lo,hi):
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.disp in (0x128,0x12c,0x134):
                  hits.append(i);print(fmt(i));break
          print('COUNT',len(hits))
          print('\n=== B2Y MODE INIT/UPDATE HITS FOR TF-SIZED COUNTS/TABLE LOOPS ===')
          for lo,hi in ((0x42152e80,0x421537c0),(0x42160f00,0x42163000),(0x42169000,0x4216b000)):
            print('\n-- RANGE',hex(lo),hex(hi),'--')
            for i in ds(lo,hi):
              c=call(i)
              text=i.op_str.lower()
              if any(k in text for k in ('#0x1f','#0x100','#0xf8','#0x128','#0x12c','#0x134')) or (i.mnemonic.startswith(('ldr','str')) and any(op.type==ARM_OP_MEM and op.mem.disp in (0x128,0x12c,0x134) for op in i.operands)):
                print(fmt(i))
          print('\n=== NEARBY TF/GAMMA/REMAP STRINGS ===')
          q0=o(0x420a5000);q1=o(0x420a6000);chunk=b[q0:q1]
          for mt in re.finditer(rb'[ -~]{4,}',chunk):
            s=mt.group().decode('ascii','ignore')
            if any(k in s.lower() for k in ('tf','remap','gamma','interp','tone','de-knee','deknee','dg','b2y')):
              print(hex(0x420a5000+mt.start()),repr(s[:200]))
          print('\n=== DECISION GATE ===')
          print('Classify owner/caller structure and find later consumers of control/count/pairs. A register loop consuming count and x/y pairs proves live B2Y remapping programming; stage/order must come from neighboring register writes.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2P.txt
          git commit -m 'research: record TF remapping owner and consumer trace 2P' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push