name: M10-R v1.50 B2Y header CA9 TF consumer
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v150-b2y-header-ca9-tf-consumer.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y header producer and CA9 TF-remap consumer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v150_b2y_header_ca9_tf_consumer.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          def make(path,base,mode,pfx=4):
            b=Path(path).read_bytes(); md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
            def off(a):return pfx+a-base
            def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
            def cstr(a,n=280):
              o=off(a)
              if not 0<=o<len(b):return None
              e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
              return q.decode('ascii','replace') if e>o and all(32<=x<127 for x in q) else None
            def lit(i):
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  pc=((i.address+4)&~3) if mode==CS_MODE_THUMB else i.address+8
                  la=pc+i.operands[1].mem.disp;o=off(la)
                  if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
              except:pass
            def call(i):
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            def fmt(i):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
              if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
              c=call(i)
              if c is not None:s+=f' ; CALL {c:#x}'
              return s
            return b,md,off,dis,cstr,lit,call,fmt
          ib,imd,ioff,idis,icstr,ilit,icall,ifmt=make('/tmp/sections/092_IMG-System.bin',0x42000000,CS_MODE_THUMB)
          cb,cmd,coff,cdis,ccstr,clit,ccall,cfmt=make('/tmp/sections/099_IMG-CA9_System.bin',0x40000000,CS_MODE_ARM)
          print('M10-R v1.50 B2Y HEADER / CA9 TF CONSUMER')
          print('\n=== IMG B2Y header producer 0x420A7FA0..0x420A8120 ===')
          for i in idis(0x420a7fa0,0x420a8120):print(ifmt(i))
          print('\n=== IMG TF loader exact parser 0x420A4884..0x420A4980 ===')
          for i in idis(0x420a4884,0x420a4980):print(ifmt(i))
          print('\n=== IMG TF serialization 0x420A5820..0x420A58D0 ===')
          for i in idis(0x420a5820,0x420a58d0):print(ifmt(i))
          print('\n=== CA9 strings with TF/remap/CC0/color management ===')
          strings=[]
          for m in re.finditer(rb'[ -~]{4,}\x00',cb):
            s=m.group()[:-1].decode('ascii','replace');a=0x40000000+m.start()-4
            if any(k in s.lower() for k in ('remap','tf','cc0','color management','colour management','transfer function')): strings.append((a,s))
          for a,s in strings:print(hex(a),repr(s))
          print('\n=== CA9 one-pass xrefs to those strings ===')
          ins=list(cmd.disasm(cb[4:],0x40000000)); stradd={a for a,_ in strings}; refs=[]
          for i in ins:
            q=clit(i)
            if q and q[1] in stradd:refs.append((i.address,q[1]));print(cfmt(i))
          print('\n=== CA9 functions containing string refs ===')
          starts=[]
          for a,_ in refs:
            cand=None
            # preceding STMFD/PUSH-like prologue within 0x300
            for i in cdis(max(0x40000000,a-0x300),a+4):
              if (i.mnemonic in ('push','stmdb') or (i.mnemonic.startswith('stm') and 'sp' in i.op_str)) and ('lr' in i.op_str):cand=i.address
            if cand is not None and cand not in starts:starts.append(cand)
          print([hex(x) for x in starts])
          for st in starts:
            print(f'-- function {st:#x} --')
            for i in cdis(st,min(st+0x500,0x40000000+len(cb)-4)):print(cfmt(i))
          print('\n=== CA9 accesses to serialized TF offsets +0x128/+0x12C/+0x134 ===')
          hits=[]
          for i in ins:
            try:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in (0x128,0x12c,0x134):hits.append(i.address);break
            except:pass
          print([hex(x) for x in hits])
          shown=set()
          for a in hits:
            lo=max(0x40000000,a-0x70);hi=min(0x40000000+len(cb)-4,a+0xd0)
            key=(lo,hi)
            if key in shown:continue
            shown.add(key);print(f'-- offset hit {a:#x} --')
            for i in cdis(lo,hi):print(cfmt(i))
          print('\n=== CA9 compare-to-31 neighborhoods (possible remap count validation/use) ===')
          cnt=0
          for i in ins:
            if i.mnemonic=='cmp' and '#0x1f' in i.op_str and cnt<30:
              cnt+=1;print(f'-- cmp31 {i.address:#x} --')
              for j in cdis(max(0x40000000,i.address-0x50),min(0x40000000+len(cb)-4,i.address+0xa0)):print(cfmt(j))
          print('\n=== CURRENT PARSED ABI ===')
          print('file word0: treated as boolean enable (nonzero => serialized enable=1)')
          print('file word1: entry_count, must be <=31')
          print('file+8: entry_count pairs of two u32 words, stride 8; remaining 31-slot area zero-filled')
          print('serialized config: byte +0x128 enable; u32 +0x12C count; 0xF8 pair area +0x134..+0x22B')
          print('\n=== TARGET ===')
          print('Name the 0x408FE124 header inputs by producer provenance and determine CA9 semantic use/domain of TF remapping pairs; do not assume tone/gamma without consumer evidence.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v150_b2y_header_ca9_tf_consumer.txt
          git commit -m 'research: record v1.50 B2Y header and CA9 TF consumer' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push