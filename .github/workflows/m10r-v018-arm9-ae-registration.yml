name: M10-R v0.18 ARM9 AE callback registration
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v018-arm9-ae-registration.yml', '.m10r-v018-arm9-ae-registration-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace ARM9 AE registration
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v018-arm9-ae-registration.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();base=0x42000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return pfx+a-base
          def va(o):return base+o-pfx
          def r32(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def one(a):
            o=off(a)
            if o<0 or o>=len(b):return None
            ds=list(md.disasm(b[o:min(len(b),o+4)],a,1));return ds[0] if ds else None
          def lit(i):
            if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              la=((i.address+4)&~3)+i.operands[1].mem.disp;return la,r32(la)
            return None,None
          def dump(label,a,z):
            print(f'\n=== {label} {a:#x}..{z:#x} ===')
            cur=a&~1
            while cur<z:
              i=one(cur)
              if not i:cur+=2;continue
              la,v=lit(i);ex=''
              if v is not None:ex=f' ; LIT {la:#x} -> {v:#x}'
              print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}{ex}')
              cur+=i.size
          callback=0x420a30a4
          targets=[callback,0x420a3104,0x420a3488,0x420a3588]
          print('TARGETS',[hex(x) for x in targets])
          for t in targets:
            hits=[]
            for x in (t,t|1):
              pat=struct.pack('<I',x);q=0
              while True:
                q=b.find(pat,q)
                if q<0:break
                hits.append((va(q),x));q+=1
            print('RAW_PTRS',hex(t),[(hex(a),hex(v)) for a,v in hits])
          # Exact literal values around AE start/callback region.
          print('\n=== RAW_WORDS_420a2fe8_420a30b4 ===')
          for a in range(0x420a2fe8,0x420a30b4,4):
            v=r32(a);print(hex(a),hex(v) if v is not None else None)
          dump('AE_START_1',0x420a2fb4,0x420a3056)
          dump('AE_DEFAULT_CALLBACK',0x420a30a4,0x420a30b2)
          dump('AE_PARAM_BUILD',0x420a3104,0x420a325c)
          dump('CA9_REQUEST_HELPER',0x420a33e4,0x420a3600)
          dump('QUEUE_HELPER_3488',0x420a3488,0x420a3588)
          # Whole-image streaming direct-call scan to the small target set.
          callers={t:[] for t in targets}
          cur=base
          while cur<end:
            i=one(cur)
            if not i:cur+=2;continue
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
              dst=i.operands[0].imm&~1
              if dst in callers:callers[dst].append(i.address)
            cur+=i.size
          for t,xs in callers.items():print('DIRECT_CALLERS',hex(t),[hex(x) for x in xs])
          # Search all PC-literal loads whose literal resolves to callback entry.
          refs=[];cur=base
          while cur<end:
            i=one(cur)
            if not i:cur+=2;continue
            la,v=lit(i)
            if v is not None and (v&~1)==callback:refs.append((i.address,la,v))
            cur+=i.size
          print('CALLBACK_LITERAL_REFS',[(hex(a),hex(la),hex(v)) for a,la,v in refs])
          for a,la,v in refs:dump('CALLBACK_LITERAL_REF_CONTEXT',max(base,a-0x100),min(end,a+0x220))
          PY
          cat /tmp/m10r-v018-arm9-ae-registration.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v018-arm9-ae-registration
          path: /tmp/m10r-v018-arm9-ae-registration.txt
          if-no-files-found: error
