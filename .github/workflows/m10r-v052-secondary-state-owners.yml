name: M10-R v0.52 secondary state owners
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v052-secondary-state-owners.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Trace secondary state owners
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v052_secondary_state_owners.txt
          from pathlib import Path
          import csv,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC
          targets={0x2001adae:'CTRL_2001ADAE',0x2001adbb:'CTRL_2001ADBB',0x2001a92c:'AE_STATE_PLUS_14'}
          rows=list(csv.DictReader(open('/tmp/sections/sections.csv',newline='',encoding='utf-8')))
          class Sec:
            def __init__(self,path,base):
              self.b=Path(path).read_bytes();self.base=base;self.pfx=4
              self.md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);self.md.detail=True;self.md.skipdata=True
            def off(self,a):return self.pfx+a-self.base
            def u32(self,a):
              o=self.off(a); return struct.unpack_from('<I',self.b,o)[0] if 0<=o<=len(self.b)-4 else None
            def astr(self,a,n=220):
              o=self.off(a)
              if not 0<=o<len(self.b): return None
              z=self.b.find(b'\0',o,min(len(self.b),o+n)); z=z if z>=0 else min(len(self.b),o+n)
              s=self.b[o:z]
              if len(s)<4:return None
              try:t=s.decode('ascii')
              except:return None
              return t if all(c in '\r\n\t' or ' '<=c<='~' for c in t) else None
            def fmt(self,i):
              if i.id==0:return f'{i.address:08x}: .byte {i.op_str}'
              ex=''
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  la=((i.address+4)&~3)+i.operands[1].mem.disp;v=self.u32(la)
                  if v is not None:
                    s=self.astr(v); ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
              except:pass
              return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
            def dump(self,a,z,title):
              a=max(self.base,a); z=min(self.base+len(self.b)-self.pfx,z)
              print(f'\n=== {title} {a:#x}..{z:#x} ===')
              for i in self.md.disasm(self.b[self.off(a):self.off(z)],a): print(self.fmt(i))
            def literal_refs(self,target):
              out=[]
              for i in self.md.disasm(self.b[self.pfx:],self.base):
                if i.id==0:continue
                try:
                  if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                    la=((i.address+4)&~3)+i.operands[1].mem.disp
                    if self.u32(la)==target:out.append((i.address,la))
                except:pass
              return out
          secs=[]
          for r in rows:
            base=int(r['image_base'],16)
            if not base:continue
            secs.append((r,Sec('/tmp/sections/'+r['file'],base)))
          print('M10-R v0.52 SECONDARY STATE OWNER TRACE')
          for target,name in targets.items():
            print(f'\n################ {name} {target:#010x} ################')
            pat=struct.pack('<I',target)
            for r,s in secs:
              hits=[];q=0
              while True:
                q=s.b.find(pat,q)
                if q<0:break
                hits.append(q);q+=1
              refs=s.literal_refs(target)
              if hits or refs:
                print('SECTION',r['index'],r['name'],'RAW_LITERAL_OFFSETS',[hex(x) for x in hits],'CODE_REFS',[(hex(a),hex(l)) for a,l in refs])
                for a,l in refs:
                  s.dump(a-0x90,a+0xc0,f'{name} REF @ {a:#x}')
          # Focus known CTRL LVVideoSync occurrence with a larger semantic window.
          ctrl=[s for r,s in secs if r['index']=='90'][0]
          ctrl.dump(0x08003120,0x08003230,'CTRL LVVIDEOSYNC AROUND 2001ADAE')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v052_secondary_state_owners.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.52 secondary state owners'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
