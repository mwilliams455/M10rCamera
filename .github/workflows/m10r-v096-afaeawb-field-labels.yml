name: M10-R v0.96 AFAEAWB field labels
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v096-afaeawb-field-labels.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode AFAEAWB mode-data dump field labels
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v096_afaeawb_field_labels.txt
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_R4
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def cstr(a):
            o=off(a)
            if not (0<=o<len(b)): return None
            x=b[o:min(len(b),o+260)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            if len(s)<3 or not all((32<=ord(c)<127) or c in '\r\n\t' for c in s): return None
            return s
          ins=[i for i in md.disasm(b[off(0x420dae80):off(0x420db220)],0x420dae80) if i.id]
          print('M10-R v0.96 AFAEAWB FIELD LABELS')
          print('v0.94 mode 2 object: +0x18=22, +0x1C=16. Decode firmware dump labels before freezing semantics.')
          print('\n=== DUMP FUNCTION FIELD/LABEL PAIRS ===')
          pairs=[]
          for n,i in enumerate(ins):
            disp=None
            if i.mnemonic.startswith('ldr'):
              try:
                for op in i.operands:
                  if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_R4:
                    disp=op.mem.disp; break
              except: pass
            if disp is None: continue
            # Find the next ADR within 3 instructions; capstone may expose an absolute target or an encoded displacement.
            labels=[]
            for j in range(n+1,min(len(ins),n+4)):
              q=ins[j]
              if q.mnemonic!='adr': continue
              vals=[]
              try:
                for op in q.operands:
                  if op.type==ARM_OP_IMM: vals.append(op.imm & 0xffffffff)
              except: pass
              # Also parse textual immediate and try PC-relative forms.
              try:
                tok=q.op_str.split(',')[-1].strip().lstrip('#')
                v=int(tok,0); vals += [v & 0xffffffff, (((q.address+4)&~3)+v)&0xffffffff, (q.address+4+v)&0xffffffff]
              except: pass
              seen=set()
              for a in vals:
                if a in seen: continue
                seen.add(a); s=cstr(a)
                if s: labels.append((a,s))
              if labels: break
            pairs.append((i.address,disp,labels,i.mnemonic,i.op_str))
            if labels:
              print(f'{i.address:08x} field {disp:+#x} {i.mnemonic} {i.op_str}')
              for a,s in labels: print(f'  LABEL {a:#x} {s!r}')
          print('\n=== TARGET FIELDS ===')
          for target in (0x18,0x1c):
            print(f'FIELD +0x{target:X}')
            found=False
            for a,d,labels,m,o in pairs:
              if d==target:
                found=True; print(f'  use @{a:#x}: {m} {o}')
                for la,s in labels: print(f'    {la:#x}: {s!r}')
            if not found: print('  no labelled dump use found')
          print('\n=== RAW ASCII STRINGS NEAR DUMP FORMAT AREA ===')
          # Enumerate printable NUL-terminated strings in a generous region after the dump function.
          start=off(0x420daf80); end=off(0x420db220); p=start
          while p<end:
            if 32<=b[p]<127:
              q=p
              while q<end and 32<=b[q]<127: q+=1
              if q-p>=4 and q<end and b[q]==0:
                try:s=b[p:q].decode('ascii')
                except:s=''
                if s: print(hex(BASE+p-PFX),repr(s))
                p=q+1; continue
            p+=1
          print('\n=== DECISION RULE ===')
          print('Freeze +0x18=22 and +0x1C=16 as grid counts only if their firmware labels or programming consumers explicitly identify horizontal/vertical AFAEAWB block/window counts.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v096_afaeawb_field_labels.txt
          git commit -m 'research: record v0.96 AFAEAWB field labels' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
