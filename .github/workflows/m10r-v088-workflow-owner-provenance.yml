name: M10-R v0.88 workflow owner provenance
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v088-workflow-owner-provenance.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace saved CA9 workflow pointer provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v088_workflow_owner_provenance.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return [i for i in md.disasm(b[off(a):off(z)],a) if i.id]
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; lo=off(la)
                if 0<=lo<=len(b)-4:return la,struct.unpack_from('<I',b,lo)[0]
            except: pass
          def tgt(i):
            try:
              if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:s+=f' ; LIT {hex(q[0])}->{hex(q[1])}'
            t=tgt(i)
            if t is not None:s+=f' ; CALL {hex(t)}'
            return s
          def ctx(ins,n,b=24,a=34):
            for j in range(max(0,n-b),min(len(ins),n+a+1)): print(fmt(ins[j]))
          print('M10-R v0.88 CA9 WORKFLOW OWNER PROVENANCE')
          print('Anchor: 0x420A2FD2 stores first argument/workflow pointer to global 0x408187EC, then 0x420A2FDE calls 0x420A3104; builder reads workflow+0x480.')
          regions=[(0x42080000,0x420c0000,'CA9 surrounding module'),(0x42140000,0x42170000,'upper IMG workflow/control module')]
          for a,z,name in regions:
            ins=dis(a,z)
            print(f'\n=== {name}: callers of 0x420A2FB4 ===')
            hs=[n for n,i in enumerate(ins) if tgt(i)==0x420a2fb4]
            print('count',len(hs))
            for k,n in enumerate(hs): print(f'\n--- caller {k+1}/{len(hs)} @{hex(ins[n].address)} ---'); ctx(ins,n)
            print(f'\n=== {name}: literal refs to saved workflow global 0x408187EC ===')
            hs=[n for n,i in enumerate(ins) if lit(i) and lit(i)[1]==0x408187ec]
            print('count',len(hs))
            for k,n in enumerate(hs): print(f'\n--- global ref {k+1}/{len(hs)} @{hex(ins[n].address)} ---'); ctx(ins,n,20,40)
            print(f'\n=== {name}: literal refs to sibling callback global 0x408187F0 ===')
            hs=[n for n,i in enumerate(ins) if lit(i) and lit(i)[1]==0x408187f0]
            print('count',len(hs))
            for k,n in enumerate(hs): print(f'\n--- sibling ref {k+1}/{len(hs)} @{hex(ins[n].address)} ---'); ctx(ins,n,16,26)
          print('\n=== INTERPRETATION ===')
          print('Use callers of 0x420A2FB4 to identify the concrete workflow object class/allocation. Then follow any initialization of its +0x480 field. References to 0x408187EC after startup can reveal deferred initialization or consumers that preserve the exact object identity.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v088_workflow_owner_provenance.txt
          git commit -m 'research: record v0.88 workflow owner provenance' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
