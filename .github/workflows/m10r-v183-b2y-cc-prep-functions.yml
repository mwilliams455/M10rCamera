name: M10-R v1.83 B2Y CC prep functions
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v183-b2y-cc-prep-functions.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y CC preparation functions
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v183_b2y_cc_prep_functions.txt
          from pathlib import Path
          import struct,collections
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=False
          def off(a): return P+a-BASE
          def one(a):
            x=list(md.disasm(b[off(a):off(a)+4],a,count=1)); return x[0] if x else None
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: return i.operands[0].imm & ~1
          def btgt(i):
            if i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm & ~1
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'; q=lit(i); c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def cfg(start,span=0x900):
            lo=start; hi=start+span; q=collections.deque([start]); seen=set(); ins={}; edges=[]
            while q:
              a=q.popleft()
              while lo<=a<hi and a not in seen:
                i=one(a)
                if not i: break
                seen.add(a);ins[a]=i;nxt=a+i.size;m=i.mnemonic
                if m in ('bl','blx'):
                  q.append(nxt);break
                if m.startswith('b') and m not in ('bl','blx','bx'):
                  t=btgt(i)
                  if t and lo<=t<hi:q.append(t);edges.append((a,t))
                  if m=='b':break
                  q.append(nxt);break
                if m in ('cbz','cbnz'):
                  t=btgt(i)
                  if t and lo<=t<hi:q.append(t);edges.append((a,t))
                  q.append(nxt);break
                if m=='bx' or (m=='pop' and 'pc' in i.op_str):break
                try:
                  _,wr=i.regs_access()
                  if ARM_REG_PC in wr:break
                except:pass
                a=nxt
            return ins,edges
          print('M10-R v1.83 B2Y CC PREP FUNCTION TRACE')
          for start,name in [(0x420cf488,'prepA'),(0x420d3434,'prepB')]:
            ins,edges=cfg(start)
            print(f'\n=== {name} {start:#x} reachable={len(ins)} range={hex(min(ins)) if ins else None}..{hex(max(ins)) if ins else None} ===')
            for a,i in sorted(ins.items()):print(fmt(i))
            print(f'\n--- {name} memory accesses using r0/r1/r2/r3 ---')
            for a,i in sorted(ins.items()):
              try:
                for op in i.operands:
                  if op.type==ARM_OP_MEM and op.mem.base in (ARM_REG_R0,ARM_REG_R1,ARM_REG_R2,ARM_REG_R3):
                    print(fmt(i),'BASE',md.reg_name(op.mem.base),'DISP',hex(op.mem.disp))
              except:pass
            print(f'\n--- {name} calls ---')
            for a,i in sorted(ins.items()):
              c=call(i)
              if c is not None:print(hex(a),'->',hex(c))
          print('\n=== all direct BL/BLX refs in IMG-System to prepA/prepB ===')
          targets={0x420cf488,0x420d3434}
          for i in md.disasm(b[P:],BASE):
            c=call(i)
            if c in targets:print(fmt(i))
          print('\nTARGET: determine what prepA/prepB do to the SP+0x104 B2Y parameter object, especially coefficient fields +0x0c..+0x58, and whether they import CA9 rendered CC matrices or derive independent coefficients.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v183_b2y_cc_prep_functions.txt
          git commit -m 'research: record v1.83 B2Y CC prep functions' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push