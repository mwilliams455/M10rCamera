name: M10-R v0.63 rlv semantic
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v063-rlv-semantic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - name: Recover firmware and search rlv semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v063_rlv_semantic.txt
          from pathlib import Path
          import csv,re
          print('M10-R v0.63 RLV SEMANTIC TRACE')
          print('Known CTRL behavior: command32 flag bit5 is logged as rlv; bit5 causes 12-entry 0x24-byte LV ring reset and suppresses trailing mask-1 post.')
          rows=list(csv.DictReader(open('/tmp/sections/sections.csv',newline='',encoding='utf-8')))
          pats=[re.compile(x,re.I) for x in [r'reset.{0,40}live',r'live.{0,40}reset',r'restart.{0,40}live',r'live.{0,40}restart',r'reset.{0,40}video',r'video.{0,40}reset',r'rlv',r'live view',r'liveview']]
          for r in rows:
              p=Path('/tmp/sections')/r['file'];data=p.read_bytes();base=int(r['image_base'],16)
              # extract printable strings >= 6 chars
              for m in re.finditer(rb'[\x20-\x7e\t\r\n]{6,}',data):
                  s=m.group().decode('latin1','replace')
                  if any(pat.search(s) for pat in pats):
                      va=(base+m.start()-4) if base else m.start()
                      print(r['index'],r['name'],hex(va),repr(s[:500]))
          print('\nCTRL_RING_RESET_PSEUDOCODE')
          print('if state_0x2001ADAB != 0 or flags.rlv != 0:')
          print('    state_0x2001ADAB = 0')
          print('    for i in range(12): ring[i*0x24].word0 = 0')
          print('    select/reset current ring slot')
          print('normal trailing event post occurs only when (flags & 0x30) == 0')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v063_rlv_semantic.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.63 rlv semantic trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
