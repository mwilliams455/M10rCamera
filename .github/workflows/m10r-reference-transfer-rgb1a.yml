name: M10-R full RGB transfer audit RGB1A
on:
  push:
    branches: [m10r-reference-transfer-rgb1a]
    paths:
      - '.github/workflows/m10r-reference-transfer-rgb1a.yml'
      - 'app/src/main/java/com/m10r/diagnostic/M10RTransferRgbRenderer.java'
      - 'tools/M10RTransferRgbCli.java'
      - 'tools/m10r_reference_transfer_rgb_fit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
          python3 -m pip install --quiet rawpy pillow numpy

      - name: Extract and verify exact M10-R nonlinear assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          rm -rf /tmp/m10r_b2y_assets
          python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/m10r_b2y_assets >/dev/null
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/m10r_b2y_assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/m10r_b2y_assets/dg_expanded_u16le.bin' | sha256sum -c -

      - name: Compile branch-specific full RGB reference renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m10r_rgb_classes
          javac -d /tmp/m10r_rgb_classes \
            app/src/main/java/com/m10r/diagnostic/DngMetadataReader.java \
            app/src/main/java/com/m10r/diagnostic/DngRawDecoder.java \
            app/src/main/java/com/m10r/diagnostic/LosslessJpegDecoder.java \
            app/src/main/java/com/m10r/diagnostic/SensorPreviewCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RColorSpecCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RReferenceColorCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RNeutralClipReferenceRenderer.java \
            app/src/main/java/com/m10r/diagnostic/M10RTransferRgbRenderer.java \
            tools/M10RTransferRgbCli.java

      - name: Render and score six identity-gated same-capture pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m10r_rgb1a
          for id in 01 02 03 04 05 06; do
            echo "=== RGB1A sample $id ==="
            base="https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_${id}"
            curl -L --fail --retry 3 --retry-delay 2 "$base.jpg" -o "/tmp/m10r_rgb1a/${id}.jpg"
            curl -L --fail --retry 3 --retry-delay 2 "$base.dng" -o "/tmp/m10r_rgb1a/${id}.dng"
            exiftool -j -n \
              -Make -Model -SerialNumber -ImageUniqueID -DateTimeOriginal -CreateDate \
              -ExposureTime -FNumber -ISO -FocalLength -ExposureCompensation \
              -WhiteBalance -Contrast -Saturation -Sharpness \
              "/tmp/m10r_rgb1a/${id}.jpg" "/tmp/m10r_rgb1a/${id}.dng" > "/tmp/m10r_rgb1a/${id}_exif.json"
            java -cp /tmp/m10r_rgb_classes com.m10r.diagnostic.M10RTransferRgbCli \
              "/tmp/m10r_rgb1a/${id}.dng" \
              /tmp/m10r_b2y_assets/tone_medium_q15.u32le \
              /tmp/m10r_b2y_assets/dg_expanded_u16le.bin \
              "/tmp/m10r_rgb1a/${id}_on.ppm" "/tmp/m10r_rgb1a/${id}_off.ppm" 2000 \
              | tee "/tmp/m10r_rgb1a/${id}_render.txt"
            python3 tools/m10r_reference_transfer_rgb_fit.py \
              --jpg "/tmp/m10r_rgb1a/${id}.jpg" \
              --dng "/tmp/m10r_rgb1a/${id}.dng" \
              --on "/tmp/m10r_rgb1a/${id}_on.ppm" \
              --off "/tmp/m10r_rgb1a/${id}_off.ppm" \
              --sample "$id" \
              --metadata-json "/tmp/m10r_rgb1a/${id}_exif.json" \
              --out "/tmp/m10r_rgb1a/${id}_metrics.json" >/dev/null
            rm -f "/tmp/m10r_rgb1a/${id}.jpg" "/tmp/m10r_rgb1a/${id}.dng" "/tmp/m10r_rgb1a/${id}_on.ppm" "/tmp/m10r_rgb1a/${id}_off.ppm"
          done

      - name: Aggregate RGB1A evidence and decision gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path

          rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/m10r_rgb1a').glob('*_metrics.json'))]
          valid=[r for r in rows if r.get('metadata',{}).get('identity_supported') is True
                 and r.get('metadata',{}).get('default_jpeg_controls') is True]
          core=['encoded_rgb_rmse','encoded_rgb_mae','luma_rmse','luma_mae','delta_e76_mean']
          guard=['hue_error_deg_mean','saturation_error_abs_mean']
          def vals(mode,key): return [r['metrics'][mode][key] for r in valid if r['metrics'][mode].get(key) is not None]
          def med(mode,key):
              v=vals(mode,key); return statistics.median(v) if v else None
          def wins(key, mode):
              other='oetf_off' if mode=='oetf_on' else 'oetf_on'
              return sum(r['metrics'][mode][key] < r['metrics'][other][key] for r in valid)
          def bin_med(mode,bin_name,key='rgb_rmse'):
              v=[r['metrics'][mode]['bins'][bin_name][key] for r in valid
                 if r['metrics'][mode]['bins'][bin_name][key] is not None]
              return statistics.median(v) if v else None
          def overclip(mode):
              return sum(sum(r['metrics'][mode]['highlight_channel_clipping'][c]['candidate_255_reference_below_250']
                             for c in 'RGB') for r in valid)

          agg={'total':len(rows),'valid':len(valid),'medians':{},'wins':{},'bins':{},'overclip':{}}
          for mode in ('oetf_on','oetf_off'):
              agg['medians'][mode]={k:med(mode,k) for k in core+guard}
              agg['wins'][mode]={k:wins(k,mode) for k in core+guard}
              agg['bins'][mode]={b:{'rgb_rmse':bin_med(mode,b,'rgb_rmse'),'luma_rmse':bin_med(mode,b,'luma_rmse')}
                                 for b in ('shadow','midtone','highlight','neutral_pixels','colourful_pixels')}
              agg['overclip'][mode]=overclip(mode)

          need=max(4, math.ceil(0.67*len(valid))) if valid else 999
          def core_leads(mode, other):
              return all(agg['medians'][mode][k] is not None and agg['medians'][mode][k] < agg['medians'][other][k]
                         and agg['wins'][mode][k] >= need for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean'))
          def guards_ok(mode, other):
              for k in guard:
                  a,b=agg['medians'][mode][k],agg['medians'][other][k]
                  if a is not None and b is not None and a > b*1.05 + 1e-12: return False
              ah=agg['bins'][mode]['highlight']['rgb_rmse']; bh=agg['bins'][other]['highlight']['rgb_rmse']
              if ah is not None and bh is not None and ah > bh*1.02 + 1e-12: return False
              return agg['overclip'][mode] <= agg['overclip'][other]

          verdict='MIXED_FULL_RGB_TRANSFER_EVIDENCE'
          if len(valid)>=4 and core_leads('oetf_off','oetf_on') and guards_ok('oetf_off','oetf_on'):
              verdict='FULL_RGB_REFERENCES_FAVOR_NO_ADDITIONAL_OETF_AFTER_TONE_DG'
          elif len(valid)>=4 and core_leads('oetf_on','oetf_off') and guards_ok('oetf_on','oetf_off'):
              verdict='FULL_RGB_REFERENCES_FAVOR_SRGB_OETF_AFTER_TONE_DG'
          agg['verdict']=verdict
          agg['required_sample_wins']=need if valid else None
          agg['analysis_input_commit']=os.environ.get('GITHUB_SHA')
          agg['workflow_run_id']=os.environ.get('GITHUB_RUN_ID')

          out=[]
          out.append('M10-R REFERENCE TRANSFER RGB1A — FULL RGB OETF ON/OFF')
          out.append('')
          out.append('Branch base: m10r-render-parity1a; promoted upstream highlight policy C.')
          out.append('Upstream held fixed: DNG WhiteLevel clamp -> bilinear Bayer -> CA9 neutral clip -> Leica ColorSpec -> linear sRGB -> TONEDG1B luminance MEDIUM->DG -> shared RGB gain.')
          out.append('Only variable: final standard sRGB OETF ON versus identity/OETF OFF.')
          out.append('Fit freedom: NONE. No exposure, affine, gamma, tone-power, WB or colour fit.')
          out.append('Firmware assets are SHA-gated to the recovered MEDIUM and expanded DG tables.')
          out.append('')
          out.append('=== Per-sample scorecard ===')
          for r in rows:
              m=r['metadata']; a=r['metrics']['oetf_on']; b=r['metrics']['oetf_off']
              out.append(f"sample {r['sample']} identity={m.get('identity_supported')} defaults={m.get('default_jpeg_controls')} align={r['alignment']['score']:.5f}")
              out.append(f"  ON : RGB_RMSE={a['encoded_rgb_rmse']:.4f} LUMA_RMSE={a['luma_rmse']:.4f} dE76={a['delta_e76_mean']:.4f} hue={a['hue_error_deg_mean']:.4f} sat={a['saturation_error_abs_mean']:.6f}")
              out.append(f"  OFF: RGB_RMSE={b['encoded_rgb_rmse']:.4f} LUMA_RMSE={b['luma_rmse']:.4f} dE76={b['delta_e76_mean']:.4f} hue={b['hue_error_deg_mean']:.4f} sat={b['saturation_error_abs_mean']:.6f}")
              out.append(f"  RGB winner={'OFF' if b['encoded_rgb_rmse'] < a['encoded_rgb_rmse'] else 'ON'}; highlight RMSE ON/OFF={a['bins']['highlight']['rgb_rmse']}/{b['bins']['highlight']['rgb_rmse']}")
          out.append('')
          out.append('=== Aggregate medians / wins ===')
          for mode,label in (('oetf_on','ON'),('oetf_off','OFF')):
              out.append(f"{label} medians: "+' '.join(f"{k}={agg['medians'][mode][k]}" for k in core+guard))
              out.append(f"{label} wins: {agg['wins'][mode]}")
              out.append(f"{label} tonal bins: {agg['bins'][mode]}")
              out.append(f"{label} false-highlight channel clips: {agg['overclip'][mode]}")
          out.append('')
          out.append('VERDICT '+verdict)
          out.append('')
          out.append('Interpretation boundary: RGB1A tests the current diagnostic linear-sRGB -> TONEDG1B shared-gain -> transfer placement. It does not prove the firmware B2Y signal coordinate or that JPEG hardware literally consumes linear RGB.')
          out.append('Do not alter m10r-capture1b solely from this run unless OFF wins the broad gate including hue, saturation and highlight guards.')
          out.append(f"Workflow run id: {agg['workflow_run_id']}")
          out.append(f"Analysis input commit: {agg['analysis_input_commit']}")

          Path('research/M10R_REFERENCE_TRANSFER_RGB1A.md').write_text('\n'.join(out)+'\n')
          Path('research/M10R_REFERENCE_TRANSFER_RGB1A.json').write_text(json.dumps({'samples':rows,'aggregate':agg},indent=2,sort_keys=True)+'\n')
          print('\n'.join(out))
          PY

      - name: Upload RGB1A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-REFERENCE-TRANSFER-RGB1A
          path: |
            /tmp/m10r_rgb1a/*_metrics.json
            /tmp/m10r_rgb1a/*_render.txt
            research/M10R_REFERENCE_TRANSFER_RGB1A.md
            research/M10R_REFERENCE_TRANSFER_RGB1A.json
          if-no-files-found: warn

      - name: Commit RGB1A evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_REFERENCE_TRANSFER_RGB1A.md research/M10R_REFERENCE_TRANSFER_RGB1A.json
          git commit -m 'research: record full RGB transfer audit RGB1A' || exit 0
          git pull --rebase origin m10r-reference-transfer-rgb1a
          git push
          echo "RGB1A result branch head: $(git rev-parse HEAD)"
