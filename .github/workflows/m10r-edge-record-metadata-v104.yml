name: M10-R v1.04 edge record metadata probe

on:
  push:
    branches: [m10r-render1a]
    paths:
      - 'tools/m10r_edge_record_metadata_v104.py'
      - '.github/workflows/m10r-edge-record-metadata-v104.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack M10-R firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Extract edge parameter-set metadata
        run: |
          python3 tools/m10r_edge_record_metadata_v104.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin | tee M10R_v104_edge_record_metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-v104-edge-record-metadata
          path: M10R_v104_edge_record_metadata.txt
