name: M10-R v1.69b targeted TF consumer
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v169b-tf-layout-consumer-targeted.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Target structural TF consumers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v169b_tf_layout_consumer_targeted.txt
          from pathlib import Path
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_OP_REG
          TARGETS=(0x128,0x12c,0x130,0x134)
          def run(path,base,mode,ranges,label,pfx=4):
            b=Path(path).read_bytes();md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
            def off(a):return pfx+a-base
            def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
            print('\n###',label)
            for a,z in ranges:
              W=dis(a,z); print(f'\n=== range {a:#x}..{z:#x} ===')
              hits=[]
              for n,i in enumerate(W):
                try:
                  for o in i.operands:
                    if o.type==ARM_OP_MEM and o.mem.disp in TARGETS: hits.append((n,'direct',o.mem.disp))
                except:pass
                # look back up to 5 instructions for same-register immediate ADD chain, then current mem small displacement
                try:
                  memops=[o for o in i.operands if o.type==ARM_OP_MEM]
                except:memops=[]
                for mo in memops:
                  br=i.reg_name(mo.mem.base); total=mo.mem.disp
                  for k in range(n-1,max(-1,n-7),-1):
                    j=W[k]
                    try:
                      oo=j.operands
                      if j.mnemonic in ('add','adds','sub','subs') and oo and oo[0].type==ARM_OP_REG and j.reg_name(oo[0].reg)==br:
                        iv=next((x.imm for x in reversed(oo) if x.type==ARM_OP_IMM),None)
                        if iv is not None: total += (-iv if j.mnemonic.startswith('sub') else iv)
                        if total in TARGETS:hits.append((n,'chain',total));break
                    except:pass
              used=set()
              for n,kind,eff in hits:
                key=(W[n].address,kind,eff)
                if key in used:continue
                used.add(key);print(f'-- {kind} eff={eff:#x} at {W[n].address:#x} --')
                for x in W[max(0,n-10):min(len(W),n+14)]:print(f'{x.address:08x}: {x.mnemonic:10s} {x.op_str}')
          run('/tmp/sections/092_IMG-System.bin',0x42000000,CS_MODE_THUMB,
              [(0x420a2e00,0x420a6100),(0x42152f00,0x42153a00),(0x42161a00,0x42161e20),(0x42169b00,0x42169f80)],'IMG targeted')
          run('/tmp/sections/099_IMG-CA9_System.bin',0x40000000,CS_MODE_ARM,
              [(0x40003000,0x40008000),(0x4000b000,0x4000c000)],'CA9 targeted')
          print('\nTARGET: any non-parser access to +128/+12c/+130/+134 in CM/B2Y paths.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v169b_tf_layout_consumer_targeted.txt
          git commit -m 'research: record v1.69b targeted TF consumer search' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push