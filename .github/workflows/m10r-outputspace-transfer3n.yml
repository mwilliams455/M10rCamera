name: M10-R output-space transfer 3N
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3n.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Identify 0x20022000 B2Y downstream block
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3N.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return P+a-B
          def ds(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);x=lit(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER3N')
          print('\n=== ALL RAW/LITERAL REFERENCES TO 0x20022000 ===')
          pat=struct.pack('<I',0x20022000);p=0;refs=[]
          while True:
            q=b.find(pat,p)
            if q<0:break
            refs.append(B+q-P);p=q+1
          print('RAW',[hex(x) for x in refs],'COUNT',len(refs))
          allins=list(md.disasm(b[P:],B))
          lits=[]
          for i in allins:
            x=lit(i)
            if x and x[1]==0x20022000:
              lits.append(i.address);print(fmt(i))
          print('LITERAL_LOADS',[hex(x) for x in lits])
          print('\n=== WINDOWS AROUND EVERY 0x20022000 LOAD ===')
          for a in lits:
            print('\nREF',hex(a))
            for i in ds(max(B,a-0x100),min(B+len(b)-P,a+0x180)):print(fmt(i))
          print('\n=== FUNCTIONS AROUND 0x420D3000..0x420D3800 ===')
          for i in ds(0x420d3000,0x420d3800):print(fmt(i))
          print('\n=== STRINGS NEAR DRIVER CODE 0x420D2800..0x420D4000 ===')
          raw=b[off(0x420d2800):off(0x420d4000)]
          for m in re.finditer(rb'[ -~]{5,}',raw):print(hex(0x420d2800+m.start()),repr(m.group().decode('latin1','replace')[:220]))
          print('\n=== CALLERS OF DRIVER FUNCTIONS USING 0x20022000 ===')
          starts=[]
          for a in lits:
            # nearest preceding push with lr within 0x180 bytes
            cand=None
            for i in ds(max(B,a-0x180),a+2):
              if i.mnemonic=='push' and 'lr' in i.op_str:cand=i.address
            if cand and cand not in starts:starts.append(cand)
          print('STARTS',[hex(x) for x in starts])
          for s in starts:
            print('\nFUNC',hex(s),'CALLERS')
            for i in allins:
              if call(i)==s:print(fmt(i))
          print('\n=== REGISTER OFFSETS USED WITH BASE 0x20022000 ===')
          # report driver instructions in candidate funcs that memory-access register loaded from literal base
          for s in starts:
            print('\nFUNC',hex(s))
            for i in ds(s,min(B+len(b)-P,s+0x300)):print(fmt(i))
          print('\n=== CROSS-STRINGS FOR YCC/RGB/GAMMA/ENCODE AROUND REFERENCES ===')
          for term in (b'ycc',b'ycbcr',b'yuv',b'rgb',b'gamma',b'encode',b'b2y',b'color',b'colour'):
            for m in re.finditer(rb'[ -~]{4,}',b):
              if term in m.group().lower():
                a=B+m.start()-P
                if any(abs(a-x)<0x20000 for x in lits):print(hex(a),repr(m.group().decode('latin1','replace')[:200]))
          print('\n=== DECISION GATE ===')
          print('Identify semantic owner of hardware base 0x20022000 and whether it is downstream RGB/YCC/transfer state. Correlate register +0x58 flag packing with B2Y snapshot fields; no renderer change from naming alone.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3N.txt
          git commit -m 'research: record B2Y downstream 0x20022000 trace 3N' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push