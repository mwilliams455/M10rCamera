name: M10-R output-space transfer 2D
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2d.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Reconcile IMG and CA9 colorspace enums
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2D.txt
          from pathlib import Path
          import struct,math
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def one(a):
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1));return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            return i.operands[0].imm if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM:
                return ((i.address+4)&~3)+i.operands[1].imm
            except:pass
          def cstr(a):
            o=off(a);e=b.find(b'\0',o,min(len(b),o+100));q=b[o:e] if e>o else b''
            try:return q.decode('ascii')
            except:return None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i);a=adr(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            if a:
              s+=f' ; ADR={a:#x}';cs=cstr(a)
              if cs:s+=f' STRING={cs!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={t:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER2D')
          print('\n=== IMG STRING ENUM 0x42151508 ===')
          for i in dis(0x42151508,0x4215154c):print(fmt(i))
          print('\n=== RAW STRING TARGETS ===')
          for a in (0x42151884,0x42151898,0x421518b0):print(hex(a),repr(cstr(a)))
          print('\n=== CA9 CONFIG ENUM 0x420A5A54 ===')
          for i in dis(0x420a5a48,0x420a5a8a):print(fmt(i))
          print('\n=== ca9_cm_config_fill START / R4 PROVENANCE ===')
          for i in dis(0x420a591c,0x420a5b20):print(fmt(i))
          print('\n=== CALLERS OF ca9_cm_config_fill 0x420A591C ===')
          hits=[]
          for a in range(0x420a2000,0x420a9000,2):
            i=one(a)
            if i and call(i)==0x420a591c:hits.append(a);print(hex(a))
          for a in hits:
            print('\n-- CALL',hex(a),'--')
            for i in dis(a-0x120,a+0x40):print(fmt(i))
          print('\n=== REFERENCES TO +0x44 / +0xB4 IN RELEVANT IMG BUILDERS ===')
          for lo,hi in ((0x42151000,0x42153000),(0x420a5000,0x420a7000)):
            print('\nRANGE',hex(lo),hex(hi))
            for i in dis(lo,hi):
              if any(x in i.op_str for x in ('#0x44','#0xb4')) and i.mnemonic.startswith(('ldr','str','ldrb','strb')):print(fmt(i))
          print('\n=== MATRIX-IDENTIFIED CA9 ORDER ===')
          print('mode0=AdobeRGB_D50_XYZ_to_RGB; mode1=sRGB_D50_XYZ_to_RGB; mode2=ECIRGBv2_D50_XYZ_to_RGB')
          print('\n=== DECISION GATE ===')
          print('Do not equate IMG +0x44 and ca9_cm_config_fill +0xB4 unless dataflow proves it. Matrix identity fixes the CA9 mode byte semantics independently: 0 AdobeRGB, 1 sRGB, 2 ECI.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2D.txt
          git commit -m 'research: record IMG/CA9 colorspace enum reconciliation 2D' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push