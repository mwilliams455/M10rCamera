name: M10-R CAPTURE1 Photon Single-RAW APK

on:
  workflow_dispatch:
  push:
    branches:
      - m10r-capture1

jobs:
  build-capture1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M10-R repo
        uses: actions/checkout@v4

      - name: Verify CAPTURE1 patch syntax
        run: python3 -m py_compile patches/apply-m10r-capture1-foundation.py

      - name: Clone exact Photon baseline proven by current M9 project
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Apply CAPTURE1 single-frame foundation
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1-foundation.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify CAPTURE1 invariants
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/PhotonCamera"
          grep -F "applicationId 'com.m10rproject.m10rcam.photon'" "$ROOT/app/build.gradle"
          grep -F "versionName '0.97-m10rcapture1'" "$ROOT/app/build.gradle"
          grep -F "M10R CAPTURE1: one physical exposure only" "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/FrameNumberSelector.java"
          grep -F "frameCount = 1" "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/FrameNumberSelector.java"
          grep -F "M10R CAPTURE1: one untouched RAW DNG" "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/DefaultSaver.java"
          grep -F "saveSingleRaw" "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/DefaultSaver.java"
          grep -F "capture1Frame.close()" "$ROOT/app/src/main/java/com/particlesdevs/photoncamera/processing/DefaultSaver.java"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build CAPTURE1 debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M10R_CAPTURE1_GRADLE.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-CAPTURE1-buildlog
          path: M10R_CAPTURE1_GRADLE.log
          if-no-files-found: ignore

      - name: Upload CAPTURE1 APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: M10RCam-CAPTURE1-single-raw
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
          if-no-files-found: error
