name: M10-R CAPTURE1B DEVICE1 DNG + JPEG APK

on:
  workflow_dispatch:
  push:
    branches:
      - m10r-capture1b

jobs:
  build-capture1b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M10-R repo
        uses: actions/checkout@v4

      - name: Verify CAPTURE1B patch syntax
        run: |
          python3 -m py_compile patches/apply-m10r-capture1-foundation.py
          python3 -m py_compile patches/apply-m10r-capture1b-renderer.py
          python3 -m py_compile patches/fix-m10r-capture1b-compile1.py
          python3 -m py_compile patches/fix-m10r-capture1b-opencv1.py
          python3 -m py_compile patches/fix-m10r-capture1b-compile2.py
          python3 -m py_compile patches/fix-m10r-capture1b-device1.py
          python3 -m py_compile patches/verify-m10r-capture1b.py

      - name: Clone exact Photon baseline proven by current M9 project
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Apply CAPTURE1 single-frame foundation
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1-foundation.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply CAPTURE1B native-source renderer
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1b-renderer.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-compile1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-opencv1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-compile2.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-device1.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify CAPTURE1B DEVICE1 invariants
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/verify-m10r-capture1b.py" "$GITHUB_WORKSPACE/PhotonCamera"
          grep -F "implementation 'org.opencv:opencv:4.13.0'" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          ! grep -F "org.opencv:opencv:4.10.0" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          grep -F "OpenCVLoader.initDebug()" "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'single_frame_Bayer_EA_demosaic_only' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'Byte ref2Obj = c.get(CameraCharacteristics.SENSOR_REFERENCE_ILLUMINANT2);' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'parameters.sensorPix.left' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DngCreator.java"
          grep -F 'parameters.sensorPix.right' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DngCreator.java"
          grep -F 'device1RenderBeforeDng' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DefaultSaver.java"
          grep -F 'persistFailureDiagnostics' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build CAPTURE1B DEVICE1 debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M10R_CAPTURE1B_DEVICE1_GRADLE.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-CAPTURE1B-DEVICE1-buildlog
          path: M10R_CAPTURE1B_DEVICE1_GRADLE.log
          if-no-files-found: ignore

      - name: Upload CAPTURE1B DEVICE1 APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: M10RCam-CAPTURE1B-DEVICE1-dnggainmap-jpeg-runtime
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
          if-no-files-found: error
