name: M10-R CAPTURE1B RGBORDER1A SOURCECM1A TONEDG1A APK

on:
  workflow_dispatch:
  push:
    branches:
      - m10r-capture1b

jobs:
  build-capture1b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M10-R repo
        uses: actions/checkout@v4

      - name: Verify CAPTURE1B patch syntax
        run: |
          python3 -m py_compile patches/apply-m10r-capture1-foundation.py
          python3 -m py_compile patches/apply-m10r-capture1b-renderer.py
          python3 -m py_compile patches/fix-m10r-capture1b-compile1.py
          python3 -m py_compile patches/fix-m10r-capture1b-opencv1.py
          python3 -m py_compile patches/fix-m10r-capture1b-compile2.py
          python3 -m py_compile patches/fix-m10r-capture1b-device1.py
          python3 -m py_compile patches/fix-m10r-capture1b-jpegsave1.py
          python3 -m py_compile patches/fix-m10r-capture1b-rgborder1a.py
          python3 -m py_compile patches/fix-m10r-capture1b-sourcecm1a.py
          python3 -m py_compile patches/fix-m10r-capture1b-tonedg1a.py
          python3 -m py_compile patches/verify-m10r-capture1b.py
          python3 -m py_compile tools/m10r_sections.py
          python3 -m py_compile tools/m10r_b2y_assets.py

      - name: Clone exact Photon baseline proven by current M9 project
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Extract exact M10-R MEDIUM tone and Differential Gamma assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          rm -rf /tmp/m10r_b2y_assets
          python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/m10r_b2y_assets >/tmp/m10r_b2y_manifest.stdout.json
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/m10r_b2y_assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/m10r_b2y_assets/dg_expanded_u16le.bin' | sha256sum -c -

      - name: Apply CAPTURE1 single-frame foundation
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1-foundation.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Apply CAPTURE1B native-source renderer and device fixes
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1b-renderer.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-compile1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-opencv1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-compile2.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-device1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-jpegsave1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-rgborder1a.py" "$GITHUB_WORKSPACE/PhotonCamera"

      - name: Verify CAPTURE1B RGBORDER1A baseline invariants
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/verify-m10r-capture1b.py" "$GITHUB_WORKSPACE/PhotonCamera"
          grep -F "versionName '0.97-m10rcapture1b-jpegsave1'" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          grep -F "implementation 'org.opencv:opencv:4.13.0'" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          ! grep -F "org.opencv:opencv:4.10.0" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          grep -F "OpenCVLoader.initDebug()" "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'single_frame_Bayer_EA_demosaic_only' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'demosaicOutputChannelOrder", "RGB"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'demosaicChannelOrderFix", "RGBORDER1A"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'postDemosaicRedBlueSwapApplied", false' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'double sr = (bgr[i * 3] & 0xffff)' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'double sb = (bgr[i * 3 + 2] & 0xffff)' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'parameters.sensorPix.left' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DngCreator.java"
          grep -F 'parameters.sensorPix.right' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DngCreator.java"
          grep -F 'capture1Dng.resolveSibling(capture1Stem + ".jpg")' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DefaultSaver.java"
          grep -F 'saveBitmapAsJPGM10R' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/DefaultSaver.java"
          grep -F 'public static boolean saveBitmapAsJPGM10R' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java"
          grep -F 'EXIF finalisation failed but JPEG bytes are preserved' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/processing/ImageSaver.java"
          grep -F 'persistFailureDiagnostics' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"

      - name: Apply and verify SOURCECM1A matrix convention
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-sourcecm1a.py" "$GITHUB_WORKSPACE/PhotonCamera"
          grep -F "versionName '0.97-m10rcapture1b-rgborder1a-sourcecm1a'" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          grep -F 'Converter.convertColorspaceTransform(t, out);' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'sourceMatrixConventionFix", "SOURCECM1A"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'sourceCamera2TransformConversion", "Photon_Converter.convertColorspaceTransform"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'sourceCamera2RawCopyElementsUsed", false' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'sourceColorMatrixRowNormalizationApplied", false' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'sourceForwardMatrixNormalizationApplied", true' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          ! grep -F 't.copyElements(r,0);' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"

      - name: Apply and verify TONEDG1A nonlinear renderer
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-tonedg1a.py" "$GITHUB_WORKSPACE/PhotonCamera" /tmp/m10r_b2y_assets
          grep -F "versionName '0.97-m10rcapture1b-rgborder1a-sourcecm1a-tonedg1a'" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          grep -F 'nonlinearRenderer", "TONEDG1A"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'nonlinearOrder", "MEDIUM_THEN_DIFFERENTIAL_GAMMA"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'b2yLiveSignalNormalizationFrozen", false' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'toneDg1aSignalStatistics' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'TONE_SHA256="2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RToneDg1A.java"
          grep -F 'DG_SHA256="9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d"' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RToneDg1A.java"
          grep -F 'INPUT_MAX=0x3fff' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RToneDg1A.java"
          grep -F 'hdrEnabled", false' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          grep -F 'sourceFrameCount", 1' "$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build CAPTURE1B RGBORDER1A SOURCECM1A TONEDG1A debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M10R_CAPTURE1B_RGBORDER1A_SOURCECM1A_TONEDG1A_GRADLE.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-CAPTURE1B-RGBORDER1A-SOURCECM1A-TONEDG1A-buildlog
          path: M10R_CAPTURE1B_RGBORDER1A_SOURCECM1A_TONEDG1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload CAPTURE1B RGBORDER1A SOURCECM1A TONEDG1A APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: M10RCam-CAPTURE1B-RGBORDER1A-SOURCECM1A-TONEDG1A-debug-apk
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
            /tmp/m10r_b2y_assets/manifest.json
          if-no-files-found: error
