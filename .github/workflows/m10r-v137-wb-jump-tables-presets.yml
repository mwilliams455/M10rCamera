name: M10-R v1.37 WB jump tables presets
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v137-wb-jump-tables-presets.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode WB switches and preset strings
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v137_wb_jump_tables_presets.txt
          from pathlib import Path
          import csv,struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def u32(a):return struct.unpack_from('<I',b,off(a))[0]
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+360));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              z=cstr(q[1])
              if z:s+=f' STRING={z!r}'
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.37 WB JUMP TABLES / PRESETS')
          print('\n=== wb_startWhiteBalance prologue + first dispatch 0x4000B13C..0x4000B240 ===')
          for i in dis(0x4000b13c,0x4000b218):print(fmt(i))
          print('\n=== PRESET JUMP TABLE @0x4000B218 (10 words) ===')
          for n in range(10):print(f'preset_case {n}: {u32(0x4000b218+4*n):#010x}')
          print('\n=== TARGET BLOCKS ===')
          targets=sorted(set(u32(0x4000b218+4*n) for n in range(10)))
          for t in targets:
            if BASE<=t<BASE+len(b)-PFX:
              print(f'\n-- target {t:#x} --')
              for i in dis(t,min(t+0x50,0x4000b340)):print(fmt(i))
          print('\n=== WB/PRESET STRINGS ACROSS EXTRACTED FIRMWARE ===')
          rows=list(csv.DictReader(Path('/tmp/sections/sections.csv').open()))
          needles=[b'DAYLIGHT',b'Daylight',b'CLOUD',b'Cloud',b'SHADOW',b'Shadow',b'TUNGSTEN',b'Tungsten',b'FLUORES',b'Fluores',b'HMI',b'FLASH',b'Flash',b'GREYCARD',b'Greycard',b'GRAYCARD',b'Graycard',b'COLOR TEMPERATURE',b'Color Temperature',b'AUTO WB',b'Auto WB',b'AWB',b'WB Preset']
          for row in rows:
            data=(Path('/tmp/sections')/row['file']).read_bytes();ibase=int(row['image_base'],16)
            for n in needles:
              p=0
              while True:
                p=data.find(n,p)
                if p<0:break
                lo=max(0,p-100);hi=min(len(data),p+len(n)+180)
                q=data[lo:hi].replace(b'\0',b'|').decode('latin1','replace')
                print(f"sec={row['index']} name={row['name']!r} off={p:#x} va={ibase+p:#x} needle={n.decode('latin1')!r} context={q!r}")
                p+=1
          print('\n=== KNOWN SEMANTIC ===')
          print('Top-level mode value 3 is DAYLIGHT from IMG and CA9 fallback diagnostics. Keep preset-case numbers separate until target/table provenance maps them.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v137_wb_jump_tables_presets.txt
          git commit -m 'research: record v1.37 WB jump tables presets' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
