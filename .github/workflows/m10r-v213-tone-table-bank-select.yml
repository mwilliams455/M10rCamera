name: M10-R v2.13 tone table bank select
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v213-tone-table-bank-select.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Probe exact low-level tone bank selector
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v213_tone_table_bank_select.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def ops(i):
            try:return i.operands
            except:return []
          def lit(i):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>=2 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+oo[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(i):
            oo=ops(i)
            try:
              if i.mnemonic=='adr' and len(oo)>=2 and oo[1].type==ARM_OP_IMM:return (((i.address+4)&~3)+oo[1].imm)&0xffffffff
            except:pass
          def call(i):
            oo=ops(i)
            try:
              if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);a=adr(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if a is not None:s+=f' ; ADR->{a:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          lo=0x420d0300;hi=0x420d0460
          ins=list(md.disasm(b[off(lo):off(hi)],lo))
          print('M10-R v2.13 TONE TABLE BANK SELECT')
          print('bounded Thumb window',hex(lo),hex(hi))
          print('\n=== disassembly ===')
          for i in ins:print(fmt(i))
          print('\n=== strings in local binary window ===')
          for s in (b'drv_img_b2y_select_start_tone_table1',b'drv_img_b2y_select_start_tone_table2'):
            p=0
            while True:
              k=b.find(s,p)
              if k<0:break
              print(s.decode(),hex(BASE+k-PFX));p=k+1
          # Simple effective MMIO access tracker for this exact function area.
          regs={}
          print('\n=== effective MMIO ===')
          for i in ins:
            oo=ops(i);q=lit(i)
            if q and oo and oo[0].type==ARM_OP_REG:regs[oo[0].reg]=q[1]
            for op in oo:
              if op.type==ARM_OP_MEM and op.mem.base in regs:
                ea=(regs[op.mem.base]+op.mem.disp)&0xffffffff
                if 0x20000000<=ea<0x21000000:print(hex(i.address),i.mnemonic,hex(ea),i.op_str)
            if i.mnemonic in ('mov','movs') and len(oo)>=2 and oo[0].type==ARM_OP_REG:
              if oo[1].type==ARM_OP_REG and oo[1].reg in regs:regs[oo[0].reg]=regs[oo[1].reg]
              elif oo[1].type==ARM_OP_IMM:regs[oo[0].reg]=oo[1].imm&0xffffffff
              else:regs.pop(oo[0].reg,None)
            elif i.mnemonic in ('add','adds','sub','subs') and oo and oo[0].type==ARM_OP_REG:
              d=oo[0].reg
              if len(oo)==2 and oo[1].type==ARM_OP_IMM and d in regs:regs[d]=(regs[d]+(oo[1].imm if i.mnemonic.startswith('add') else -oo[1].imm))&0xffffffff
              elif len(oo)>=3 and oo[1].type==ARM_OP_REG and oo[1].reg in regs and oo[2].type==ARM_OP_IMM:regs[d]=(regs[oo[1].reg]+(oo[2].imm if i.mnemonic.startswith('add') else -oo[2].imm))&0xffffffff
              else:regs.pop(d,None)
            elif oo and oo[0].type==ARM_OP_REG and i.mnemonic not in ('str','strb','strh','strd','cmp','tst','b','bl','blx','bx','push'):
              if not q:regs.pop(oo[0].reg,None)
          print('\nQUESTION: are table1/table2 selectors alternate start-bank selectors for one tone stage, or evidence of sequential tone stages? Only direct register semantics may answer this.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v213_tone_table_bank_select.txt
          git commit -m 'research: record v2.13 tone table bank select' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push