name: M10-R encoded luma definition audit RGB1D
on:
  push:
    branches: [m10r-reference-transfer-rgb1d]
    paths: ['.github/workflows/m10r-reference-transfer-rgb1d.yml','app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1DRenderer.java','tools/M10RTransferRgb1DCli.java','tools/m10r_reference_transfer_rgb1d_fit.py']
  workflow_dispatch:
permissions: {contents: write}
jobs:
 analyze:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Install dependencies
     run: |
      sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
      python3 -m pip install --quiet rawpy pillow numpy
   - name: Extract exact nonlinear assets
     shell: bash
     run: |
      set -euo pipefail
      curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
      echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      python3 - <<'PY'
      from pathlib import Path
      p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
      PY
      g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
      python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/assets >/dev/null
      echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/assets/tone_medium_q15.u32le' | sha256sum -c -
      echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/assets/dg_expanded_u16le.bin' | sha256sum -c -
   - name: Compile RGB1D
     run: |
      set -euo pipefail
      python3 -m py_compile tools/m10r_reference_transfer_rgb1d_fit.py tools/m10r_reference_transfer_rgb_fit.py tools/m10r_reference_order_fit.py
      mkdir -p /tmp/classes
      javac -d /tmp/classes app/src/main/java/com/m10r/diagnostic/{DngMetadataReader.java,DngRawDecoder.java,LosslessJpegDecoder.java,SensorPreviewCore.java,M10RColorSpecCore.java,M10RReferenceColorCore.java,M10RNeutralClipReferenceRenderer.java,M10RTransferRgb1DRenderer.java} tools/M10RTransferRgb1DCli.java
   - name: Render and score pairs
     shell: bash
     run: |
      set -euo pipefail;mkdir -p /tmp/rgb1d
      for id in 01 02 03 04 05 06; do
       base="https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_${id}"
       curl -L --fail --retry 3 "$base.jpg" -o /tmp/rgb1d/$id.jpg;curl -L --fail --retry 3 "$base.dng" -o /tmp/rgb1d/$id.dng
       exiftool -j -n -Make -Model -SerialNumber -ImageUniqueID -DateTimeOriginal -CreateDate -ExposureTime -FNumber -ISO -FocalLength -ExposureCompensation -WhiteBalance -Contrast -Saturation -Sharpness /tmp/rgb1d/$id.jpg /tmp/rgb1d/$id.dng >/tmp/rgb1d/${id}_exif.json
       java -cp /tmp/classes com.m10r.diagnostic.M10RTransferRgb1DCli /tmp/rgb1d/$id.dng /tmp/assets/tone_medium_q15.u32le /tmp/assets/dg_expanded_u16le.bin /tmp/rgb1d/${id}_ll.ppm /tmp/rgb1d/${id}_cr.ppm /tmp/rgb1d/${id}_or.ppm /tmp/rgb1d/${id}_ct.ppm /tmp/rgb1d/${id}_ot.ppm 2000 | tee /tmp/rgb1d/${id}_render.txt
       python3 tools/m10r_reference_transfer_rgb1d_fit.py --jpg /tmp/rgb1d/$id.jpg --dng /tmp/rgb1d/$id.dng --ll-oetf /tmp/rgb1d/${id}_ll.ppm --component-code-ratio /tmp/rgb1d/${id}_cr.ppm --oetfy-code-ratio /tmp/rgb1d/${id}_or.ppm --component-linear-target /tmp/rgb1d/${id}_ct.ppm --oetfy-linear-target /tmp/rgb1d/${id}_ot.ppm --sample $id --metadata-json /tmp/rgb1d/${id}_exif.json --out /tmp/rgb1d/${id}_metrics.json
       rm -f /tmp/rgb1d/$id.jpg /tmp/rgb1d/$id.dng /tmp/rgb1d/${id}_*.ppm
      done
   - name: Aggregate RGB1D
     shell: bash
     run: |
      python3 - <<'PY'
      import json,os,statistics
      from pathlib import Path
      modes=['ll_oetf','component_code_ratio','oetfy_code_ratio','component_linear_target','oetfy_linear_target'];base='component_code_ratio'
      rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/rgb1d').glob('*_metrics.json'))];valid=[r for r in rows if r['metadata'].get('identity_supported') is True and r['metadata'].get('default_jpeg_controls') is True]
      keys=['encoded_rgb_rmse','luma_rmse','delta_e76_mean','hue_error_deg_mean','saturation_error_abs_mean']
      def med(m,k):return statistics.median(r['metrics'][m][k] for r in valid)
      def hi(m):return statistics.median(r['metrics'][m]['bins']['highlight']['rgb_rmse'] for r in valid)
      def clips(m):return sum(sum(r['metrics'][m]['highlight_channel_clipping'][c]['candidate_255_reference_below_250'] for c in 'RGB') for r in valid)
      agg={'valid':len(valid),'medians':{},'highlight':{},'falseClips':{},'ranking':[],'gate':{}}
      for m in modes:agg['medians'][m]={k:med(m,k) for k in keys};agg['highlight'][m]=hi(m);agg['falseClips'][m]=clips(m)
      mins={k:min(agg['medians'][m][k] for m in modes) for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean')};agg['ranking']=sorted(modes,key=lambda m:sum(agg['medians'][m][k]/mins[k] for k in mins)/3)
      b=agg['medians'][base];bh=agg['highlight'][base];bc=agg['falseClips'][base]
      clear=[]
      for m in modes:
       if m in (base,'ll_oetf'):continue
       q=agg['medians'][m];rat={k:q[k]/b[k] for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean')}
       passv=all(v<=1.05 for v in rat.values()) and agg['highlight'][m]<=bh*.90 and q['hue_error_deg_mean']<=b['hue_error_deg_mean']*1.05+.5 and q['saturation_error_abs_mean']<=b['saturation_error_abs_mean']*1.05+.005 and agg['falseClips'][m]<=bc*1.10
       agg['gate'][m]={'core_ratios':rat,'highlight_ratio':agg['highlight'][m]/bh,'passed':passv};
       if passv:clear.append(m)
      verdict='RGB1D_NO_ALTERNATE_DEFINITION_CLEARS_HIGHLIGHT_GATE'
      if clear:clear.sort(key=lambda m:sum(agg['gate'][m]['core_ratios'].values()));verdict='RGB1D_FAVORS_'+clear[0].upper()
      agg['verdict']=verdict;agg['run']=os.environ.get('GITHUB_RUN_ID');agg['commit']=os.environ.get('GITHUB_SHA')
      out=['M10-R REFERENCE TRANSFER RGB1D — ENCODED LUMA DEFINITION / TARGET RECONSTRUCTION','',
      'Frozen scale: 0.94 from prior scalar/RGB1C evidence. No fitting. Live capture branch untouched.','', '=== Aggregate ===']
      for m in agg['ranking']:out.append(f"{m}: medians={agg['medians'][m]} highlight={agg['highlight'][m]} falseClips={agg['falseClips'][m]}")
      out+=['','=== Gate versus component_code_ratio ===']+[f"{m}: {v}" for m,v in agg['gate'].items()]+['','VERDICT '+verdict,'',f"Workflow run id: {agg['run']}",f"Analysis input commit: {agg['commit']}"]
      Path('research/M10R_REFERENCE_TRANSFER_RGB1D.md').write_text('\n'.join(out)+'\n');Path('research/M10R_REFERENCE_TRANSFER_RGB1D.json').write_text(json.dumps({'samples':rows,'aggregate':agg},indent=2,sort_keys=True)+'\n');print('\n'.join(out))
      PY
   - name: Upload evidence
     if: always()
     uses: actions/upload-artifact@v4
     with: {name: M10R-REFERENCE-TRANSFER-RGB1D, path: "/tmp/rgb1d/*_metrics.json\n/tmp/rgb1d/*_render.txt\nresearch/M10R_REFERENCE_TRANSFER_RGB1D.md\nresearch/M10R_REFERENCE_TRANSFER_RGB1D.json", if-no-files-found: warn}
   - name: Commit evidence
     run: |
      git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add research/M10R_REFERENCE_TRANSFER_RGB1D.*;git commit -m 'research: record encoded luma definition audit RGB1D' || exit 0;git pull --rebase origin m10r-reference-transfer-rgb1d;git push
