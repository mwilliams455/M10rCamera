name: M10-R CA9_PARITY1 B2Y Gain Register Trace
on:
  push:
    branches: [m10r-ca9-parity1]
    paths:
      - '.github/workflows/m10r-ca9-b2y-gain-register-trace.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone

      - name: Recover B2Y WB gain register semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' \
            -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null

          python3 - <<'PY' > research/M10R_ca9_parity1_b2y_gain_register_trace.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM, ARM_OP_IMM, ARM_REG_PC

          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z):
              aa=max(BASE,a); zz=min(BASE+len(b)-PFX,z)
              return [] if zz<=aa else list(md.disasm(b[off(aa):off(zz)],aa))
          def lit(i):
              try:
                  if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      la=((i.address+4)&~3)+i.operands[1].mem.disp; o=off(la)
                      if 0<=o<=len(b)-4: return la,struct.unpack_from('<I',b,o)[0]
              except Exception: pass
          def call(i):
              try:
                  if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
                      return i.operands[0].imm&~1
              except Exception: pass
          def fmt(i):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'; q=lit(i)
              if q: s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              c=call(i)
              if c is not None: s+=f' ; CALL {c:#x}'
              return s
          def raw_occ(val):
              pat=struct.pack('<I',val); pos=0; out=[]
              while True:
                  pos=b.find(pat,pos)
                  if pos<0: break
                  out.append(BASE+pos-PFX); pos+=1
              return out

          # The two known register programmers and their callers are entirely in
          # this narrow IMG window. Avoid full-section Capstone traversal.
          scan=dis(0x42150000,0x42170000)
          targets=(0x20020080,0x20020880,0x408fe124,0x408fe130,0x408fe15c,
                   0x01000100,0x07d007d0,0x00000100,0x000007d0,0xf800ffff,0xf800f800)

          print('M10-R CA9_PARITY1 B2Y WB GAIN REGISTER TRACE — FAST')
          print('Firmware SHA-256 ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498')
          print('\n=== raw IMG occurrences of key words ===')
          for t in targets:
              occ=raw_occ(t)
              print(hex(t),[hex(x) for x in occ[:80]],'count',len(occ))

          print('\n=== narrow code literal refs to key words ===')
          for t in targets:
              hs=[]
              for i in scan:
                  q=lit(i)
                  if q and q[1]==t: hs.append(i.address)
              print(hex(t),[hex(x) for x in hs])

          print('\n=== programmer A gain + CC front end ===')
          for i in dis(0x42152f8c,0x421530b4): print(fmt(i))
          print('\n=== programmer B gain + CC front end ===')
          for i in dis(0x421536bc,0x421537e4): print(fmt(i))

          print('\n=== immediates/masks in programmer A/B relevant to gain field precision ===')
          for st,z in ((0x42152f8c,0x421530b4),(0x421536bc,0x421537e4)):
              print('--',hex(st),'--')
              for i in dis(st,z):
                  q=lit(i); interesting=False
                  if q and q[1] in targets: interesting=True
                  try:
                      if any(o.type==ARM_OP_IMM and o.imm in (8,11,16,21,26,255,256,511,1023,2047,2000) for o in i.operands): interesting=True
                  except Exception: pass
                  if interesting: print(fmt(i))

          print('\n=== callers of register programmers ===')
          for target in (0x42152f8c,0x421536bc):
              hs=[i.address for i in scan if call(i)==target]
              print(hex(target),[hex(x) for x in hs])
              for a in hs:
                  print('-- caller vicinity',hex(a),'--')
                  for i in dis(a-0x40,a+0x60): print(fmt(i))

          print('\n=== packed-unity occurrence survey across extracted sections ===')
          pat=struct.pack('<I',0x01000100)
          for p in sorted(Path('/tmp/sections').glob('*.bin')):
              bb=p.read_bytes(); pos=0; hits=[]
              while True:
                  pos=bb.find(pat,pos)
                  if pos<0: break
                  hits.append(pos); pos+=1
              if hits: print(p.name,'count',len(hits),'first_offsets',[hex(x) for x in hits[:24]])

          print('\n=== established direct-gain facts ===')
          print('R/G/B source gains are clamped to 1..2000 and ASN encodes them as 256.0/gain.')
          print('The same integer values feed B2Y: 0x2002008C low11=R, bits16..26=B; 0x20020090 low11=G, bits16..26=G.')
          print('The programmer masks each gain to 11 bits; this proves unsigned 11-bit storage but not the internal multiplier radix.')
          print('\n=== discriminator ===')
          print('If packed 0x01000100 is connected to B2Y gain initialization/default state, code 256 is directly established as hardware unity storage. Otherwise unity=256 remains strongly implied by the ASN/direct-gain equivalence, not yet independently proven by reset/init state.')
          print('\n=== target ===')
          print('Next isolate multiplier radix, rounding/truncation, saturation width and stage order without changing promoted C.')
          PY

      - name: Commit trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_ca9_parity1_b2y_gain_register_trace.txt
          git commit -m 'research: trace CA9_PARITY1 B2Y gain register semantics' || exit 0
          git pull --rebase origin m10r-ca9-parity1
          git push
