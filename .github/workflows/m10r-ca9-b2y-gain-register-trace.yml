name: M10-R CA9_PARITY1 B2Y Gain Register Trace
on:
  push:
    branches: [m10r-ca9-parity1]
    paths:
      - '.github/workflows/m10r-ca9-b2y-gain-register-trace.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone

      - name: Recover B2Y WB gain register semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' \
            -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null

          python3 - <<'PY' > research/M10R_ca9_parity1_b2y_gain_register_trace.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM, ARM_OP_IMM, ARM_REG_PC

          P=Path('/tmp/sections/092_IMG-System.bin')
          b=P.read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          md.detail=True; md.skipdata=True

          def off(a): return PFX+a-BASE
          def dis(a,z):
              aa=max(BASE,a); zz=min(BASE+len(b)-PFX,z)
              if zz<=aa: return []
              return list(md.disasm(b[off(aa):off(zz)],aa))
          def lit(i):
              try:
                  if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      la=((i.address+4)&~3)+i.operands[1].mem.disp
                      o=off(la)
                      if 0<=o<=len(b)-4:
                          return la,struct.unpack_from('<I',b,o)[0]
              except Exception:
                  pass
              return None
          def call(i):
              try:
                  if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
                      return i.operands[0].imm & ~1
              except Exception:
                  pass
              return None
          def fmt(i):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
              q=lit(i)
              if q: s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              c=call(i)
              if c is not None: s+=f' ; CALL {c:#x}'
              return s
          def prologue_before(a,span=0x500):
              cand=None
              for i in dis(max(BASE,a-span),a+2):
                  if i.mnemonic in ('push','stmdb') and 'lr' in i.op_str:
                      cand=i.address
              return cand

          ins=dis(BASE,BASE+len(b)-PFX)
          targets=(0x20020080,0x2002008c,0x20020090,0x408fe124,0x408fe130,0x408fe15c)
          print('M10-R CA9_PARITY1 B2Y WB GAIN REGISTER TRACE')
          print('Firmware SHA-256 ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498')

          print('\n=== literal references to B2Y / shared-gain targets ===')
          refs={t:[] for t in targets}
          for i in ins:
              q=lit(i)
              if q and q[1] in refs:
                  refs[q[1]].append(i.address)
          for t in targets:
              print(hex(t),[hex(x) for x in refs[t]])
              for a in refs[t]:
                  print('  ref',hex(a),'nearest_prologue',hex(prologue_before(a) or 0))

          print('\n=== exact B2Y programmer A, including gain words ===')
          for i in dis(0x42152f8c,0x42153160): print(fmt(i))
          print('\n=== exact B2Y programmer B, including gain words ===')
          for i in dis(0x421536bc,0x42153890): print(fmt(i))

          print('\n=== functions referencing B2Y base: immediate 256 / masks / shifts ===')
          funcs=[]
          for a in refs[0x20020080]:
              st=prologue_before(a)
              if st and st not in funcs: funcs.append(st)
          for st in funcs:
              block=dis(st,min(st+0x900,BASE+len(b)-PFX))
              print(f'-- function {st:#x} --')
              for i in block:
                  interesting=False
                  q=lit(i)
                  if q and (q[1] in targets or q[1] in (0x01000100,0x07d007d0,0x00000100,0x000007d0,0xf800ffff,0xf800f800)):
                      interesting=True
                  try:
                      if any(o.type==ARM_OP_IMM and o.imm in (8,11,16,26,255,256,511,1023,2047,2000) for o in i.operands): interesting=True
                  except Exception: pass
                  if interesting: print(fmt(i))

          print('\n=== IMG literal-pool occurrences of candidate packed unity/max values ===')
          for val in (0x01000100,0x07d007d0,0x00000100,0x000007d0,0xf800ffff,0xf800f800):
              pat=struct.pack('<I',val); pos=0; occ=[]
              while True:
                  pos=b.find(pat,pos)
                  if pos<0: break
                  occ.append(BASE+pos-PFX); pos+=1
              print(hex(val),[hex(x) for x in occ[:80]],'count',len(occ))
              for i in ins:
                  q=lit(i)
                  if q and q[1]==val:
                      print('  ',fmt(i),'nearest_prologue',hex(prologue_before(i.address) or 0))

          print('\n=== raw firmware-section occurrences of packed unity 0x01000100 ===')
          pat=struct.pack('<I',0x01000100)
          for p in sorted(Path('/tmp/sections').glob('*.bin')):
              bb=p.read_bytes(); pos=0; hits=[]
              while True:
                  pos=bb.find(pat,pos)
                  if pos<0: break
                  hits.append(pos); pos+=1
              if hits:
                  print(p.name,'count',len(hits),'first_offsets',[hex(x) for x in hits[:24]])

          print('\n=== callers of the two known B2Y register programmers ===')
          for target in (0x42152f8c,0x421536bc,0x42152f98,0x421536c8):
              hs=[i.address for i in ins if call(i)==target]
              print(hex(target),[hex(x) for x in hs])
              for a in hs[:24]:
                  print('-- caller vicinity',hex(a),'--')
                  for i in dis(max(BASE,a-0x50),min(BASE+len(b)-PFX,a+0x70)): print(fmt(i))

          print('\n=== PROVEN BEFORE THIS TRACE ===')
          print('same clamped integer R/G/B gains represented by ASN=256/gain are copied into B2Y gain fields')
          print('0x2002008C low11=R, bits16..26=B; 0x20020090 low11=G, bits16..26=G')
          print('\n=== DISCRIMINATOR ===')
          print('A packed/default value of 0x01000100 connected to these B2Y gain words would directly establish code 256 as hardware unity storage. It would still not by itself prove sample*gain>>8 rounding/saturation semantics.')
          print('\n=== TARGET ===')
          print('Prove or reject 256-as-B2Y-unity from register initialization/configuration, then isolate downstream datapath precision/rounding/saturation without changing the promoted renderer.')
          PY

      - name: Commit trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_ca9_parity1_b2y_gain_register_trace.txt
          git commit -m 'research: trace CA9_PARITY1 B2Y gain register semantics' || exit 0
          git pull --rebase origin m10r-ca9-parity1
          git push
