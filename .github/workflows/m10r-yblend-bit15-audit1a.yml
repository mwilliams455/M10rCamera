name: M10-R Y_BLEND BIT15 AUDIT1A
on:
  push:
    branches: [m10r-yblend-bit15-audit1a]
    paths:
      - '.github/workflows/m10r-yblend-bit15-audit1a.yml'
      - 'tools/m10r_yblend_bit15_audit1a.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  register-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned disassembly and emulation dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3
      - name: Fetch and verify original firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode with existing verified extractor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker)
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Verify selector identities and execute 10240 register-programming cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bit15_audit_results
          python3 tools/m10r_yblend_bit15_audit1a.py /tmp/sec --cases 1024 --out bit15_audit_results/register_emulation.json | tee bit15_audit_results/register_emulation_stdout.txt
          cp tools/m10r_yblend_bit15_audit1a.py bit15_audit_results/
          git rev-parse HEAD > bit15_audit_results/source_commit.txt
          sha256sum tools/m10r_yblend_bit15_audit1a.py > bit15_audit_results/script_sha256.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('bit15_audit_results/register_emulation.json').read_text())
          assert j['all_assertions_passed'] is True
          assert j['total_checked_executions']==10240
          assert j['pair_register_RMW_writes_observed']==61440
          assert j['bit15_mutations']==0
          print('PASS: software register programming only; no ISP pixel arithmetic claimed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-BIT15-AUDIT1A-RESULTS
          path: bit15_audit_results/
          retention-days: 90
          if-no-files-found: error
