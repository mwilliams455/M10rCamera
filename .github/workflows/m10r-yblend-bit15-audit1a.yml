name: M10-R Y_BLEND BIT15 AUDIT1A inputs
on:
  push:
    branches: [m10r-yblend-bit15-audit1a]
    paths: ['.github/workflows/m10r-yblend-bit15-audit1a.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify original firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode with existing verified extractor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker)
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Obtain pinned offline audit tool wheels
        run: |
          python3 -m pip download --only-binary=:all: --no-deps capstone==5.0.3 unicorn==2.1.3 -d /tmp/wheels
      - name: Package bounded audit inputs and immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, shutil, subprocess
          from pathlib import Path
          out=Path('bit15_audit_inputs');out.mkdir()
          sec=out/'sections';sec.mkdir()
          root=Path('/tmp/sec')
          rows=list(csv.DictReader((root/'sections.csv').open()))
          selected=[]
          for row in rows:
              if any(k in row['name'].lower() for k in ('img-system','sam7','ca9')):
                  src=root/row['file'];dest=sec/src.name
                  shutil.copy2(src,dest)
                  selected.append(row)
          if not any(r['name']=='IMG-System' for r in selected):
              raise SystemExit('Missing IMG-System')
          shutil.copy2(root/'sections.csv',sec/'sections.csv')
          shutil.copytree('/tmp/wheels',out/'wheels')
          for folder in ('research','tools'):
              d=out/folder;d.mkdir()
              for p in Path(folder).iterdir():
                  if p.is_file() and any(k in p.name.lower() for k in ('b2y','ycc','sam7','wbclip','14bit','yc_','yc2','selector','colorspec')):
                      shutil.copy2(p,d/p.name)
          manifest={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                    'research_base':'12e44a4593688289779e2617b282d811181fd8b9',
                    'firmware_sha256':'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498',
                    'unpacked_sha256':'859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0',
                    'selected_sections':selected,'files':[]}
          for p in sorted(out.rglob('*')):
              if p.is_file():
                  b=p.read_bytes();manifest['files'].append({'path':str(p.relative_to(out)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('AUDIT_INPUTS_READY')
          print('Sections:',[(r['name'],r['file']) for r in selected])
          print('Files:',len(manifest['files']))
          print('Renderer and capture paths unchanged; this is an input package, not a parity result.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-BIT15-AUDIT1A-INPUTS
          path: bit15_audit_inputs/
          retention-days: 14
          if-no-files-found: error
