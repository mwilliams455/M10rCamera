name: M10-R RENDER_PARITY1A Canonical Factorial APK
on:
  push:
    branches: [m10r-render-parity1a]
    paths:
      - 'app/**'
      - 'tools/M10RLinearReferenceCli.java'
      - '.github/workflows/m10r-v244-linear-reference-apk.yml'
  workflow_dispatch:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify frozen decoder and reference cores
        shell: bash
        run: |
          test "$(git hash-object app/src/main/java/com/m10r/diagnostic/DngRawDecoder.java)" = '843dd16a36b16cda81d4a9d29d1e11b3d0943a9d'
          test "$(git hash-object app/src/main/java/com/m10r/diagnostic/LosslessJpegDecoder.java)" = '06bff56fbeb7c7d13e7d7c0b8768c92b9e520cd6'
          test "$(git hash-object app/src/main/java/com/m10r/diagnostic/SensorPreviewCore.java)" = '4e463bc5ad2c33b4ad6bc65a6df61a9b086e90a2'
          test "$(git hash-object app/src/main/java/com/m10r/diagnostic/M10RLinearReferenceRenderer.java)" = '827c71a4cd1d72f63341d5f56685577e83a304e5'
          test "$(git hash-object app/src/main/java/com/m10r/diagnostic/M10RNeutralClipReferenceRenderer.java)" = '0866e3128754459b4950d55ba82220737be043d9'
          echo 'Decoder, sensor sanity, and legacy reference cores remain byte-identical.'

      - name: Verify RENDER_PARITY1A promoted C identity and canonical modes
        shell: bash
        run: |
          grep -F 'versionCode = 10' app/build.gradle.kts
          grep -F 'versionName = "0.5.5-render-parity1a-c-promoted"' app/build.gradle.kts
          grep -F 'M10-R RAW Diagnostic — RENDER_PARITY1A' app/src/main/java/com/m10r/diagnostic/MainActivity.java
          grep -F 'Mode.A_BASELINE' app/src/main/java/com/m10r/diagnostic/MainActivity.java
          grep -F 'Mode.B_HEADROOM' app/src/main/java/com/m10r/diagnostic/MainActivity.java
          grep -F 'M10RProductionRenderer.render(raw, info)' app/src/main/java/com/m10r/diagnostic/MainActivity.java
          grep -F 'Mode.D_HEADROOM_CA9' app/src/main/java/com/m10r/diagnostic/MainActivity.java
          grep -F 'Mode.C_CA9_CLIP' app/src/main/java/com/m10r/diagnostic/M10RProductionRenderer.java
          grep -F 'A_BASELINE(false, false)' app/src/main/java/com/m10r/diagnostic/M10RHighlightFactorialRenderer.java
          grep -F 'B_HEADROOM(true, false)' app/src/main/java/com/m10r/diagnostic/M10RHighlightFactorialRenderer.java
          grep -F 'C_CA9_CLIP(false, true)' app/src/main/java/com/m10r/diagnostic/M10RHighlightFactorialRenderer.java
          grep -F 'D_HEADROOM_CA9(true, true)' app/src/main/java/com/m10r/diagnostic/M10RHighlightFactorialRenderer.java

      - name: Download verified public M10-R DNG
        run: curl -L --fail --retry 3 -o /tmp/m10r.dng 'https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_01.dng'

      - name: Validate public DNG through canonical A/B/C/D
        shell: bash
        run: |
          mkdir -p /tmp/classes
          javac -encoding UTF-8 -d /tmp/classes \
            app/src/main/java/com/m10r/diagnostic/DngMetadataReader.java \
            app/src/main/java/com/m10r/diagnostic/LosslessJpegDecoder.java \
            app/src/main/java/com/m10r/diagnostic/DngRawDecoder.java \
            app/src/main/java/com/m10r/diagnostic/SensorPreviewCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RColorSpecCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RReferenceColorCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RLinearReferenceRenderer.java \
            app/src/main/java/com/m10r/diagnostic/M10RNeutralClipReferenceRenderer.java \
            app/src/main/java/com/m10r/diagnostic/M10RHighlightFactorialRenderer.java \
            app/src/main/java/com/m10r/diagnostic/M10RProductionRenderer.java \
            tools/M10RLinearReferenceCli.java
          java -Xmx1024m -cp /tmp/classes com.m10r.diagnostic.M10RLinearReferenceCli /tmp/m10r.dng | tee /tmp/reference.txt
          grep -F 'Decoded CFA: 7872x5208' /tmp/reference.txt
          grep -F 'SOF3: precision=14, predictor=1, Pt=0' /tmp/reference.txt
          grep -F 'CFA SHA-256 (LE u16): 27814cbc80f92d23d7b975d4833f70525f35bc52917d992b35d0a899829a097a' /tmp/reference.txt
          grep -F 'A — RENDER_PARITY1A A_BASELINE:' /tmp/reference.txt
          grep -F 'B — RENDER_PARITY1A B_HEADROOM:' /tmp/reference.txt
          grep -F 'C — RENDER_PARITY1A C_CA9_CLIP:' /tmp/reference.txt
          grep -F 'D — RENDER_PARITY1A D_HEADROOM_CA9:' /tmp/reference.txt
          grep -F 'A ARGB8 SHA-256:' /tmp/reference.txt
          grep -F 'B ARGB8 SHA-256:' /tmp/reference.txt
          grep -F 'C ARGB8 SHA-256:' /tmp/reference.txt
          grep -F 'D ARGB8 SHA-256:' /tmp/reference.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build RENDER_PARITY1A diagnostic debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-sha256.txt
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RENDER_PARITY1A diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: M10RDiagnostic-v0.5.5-render-parity1a-c-promoted-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
