name: M10-R v0.16 IMG AE command32 fast trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v016-img-ae-command32-fast.yml', '.m10r-v016-img-ae-command32-fast-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and fast-scan IMG command32
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v016-img-ae-command32-fast.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();base=0x42000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=False;md.skipdata=True
          def va(o): return base+o-pfx
          def off(v): return pfx+v-base
          def dis(label,center,r=0x100):
            s=max(base,(center-r)&~1);e=min(end,center+r)
            print(f'\n=== {label} {hex(center)} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte': print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          print('IMG_SIZE',len(b),'END',hex(end))
          # exact AE strings
          for pat in [b'CA9: AE MODULE',b'AE algorithm running',b'AE parameter pointer']:
            q=0
            while True:
              q=b.find(pat,q)
              if q<0:break
              sv=va(q);print('STRING',pat.decode(),hex(sv))
              # exact pointer words to this string
              for x in (sv,sv|1):
                n=struct.pack('<I',x);p=0
                while True:
                  p=b.find(n,p)
                  if p<0:break
                  pv=va(p);print(' STRING_PTR',hex(pv),hex(x));dis('STRING_PTR_WINDOW',pv,0x300);p+=1
              q+=1
          # Raw Thumb MOVS Rd,#0x32 / #0x49 occurrences. 16-bit encoding: 00100ddd imm8.
          hits=[]
          for imm in [0x32,0x49]:
            for rd in range(8):
              hw=0x2000|(rd<<8)|imm;n=struct.pack('<H',hw);q=0
              while True:
                q=b.find(n,q)
                if q<0:break
                if q>=pfx and (q-pfx)%2==0:hits.append((va(q),imm,rd))
                q+=1
          print('RAW_MOVS_HITS',len(hits))
          # Print all 0x32 windows; flag windows containing 0x49 raw MOVS or obvious BL.
          for a,imm,rd in hits:
            if imm==0x32:
              lo=max(0,off(a)-0x100);hi=min(len(b),off(a)+0x180);w=b[lo:hi]
              has49=any(struct.pack('<H',0x2000|(r<<8)|0x49) in w for r in range(8))
              print('\nCMD32_RAW',hex(a),'rd',rd,'NEAR_LEN49',has49)
              dis('CMD32',a,0x140)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v016-img-ae-command32-fast
          path: /tmp/m10r-v016-img-ae-command32-fast.txt
          if-no-files-found: error
