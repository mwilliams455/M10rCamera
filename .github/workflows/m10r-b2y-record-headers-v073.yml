name: M10-R v0.73 B2Y record headers and keys
on:
  push:
    branches: [m10r-reference-transfer-rgb1e]
    paths:
      - 'tools/m10r_b2y_record_headers_v073.py'
      - '.github/workflows/m10r-b2y-record-headers-v073.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verify decode extract
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Dump target record headers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/m10r_b2y_record_headers_v073.py /tmp/sec "$GITHUB_WORKSPACE" | tee research/M10R_v073_b2y_record_headers.txt
          test -s research/M10R_v073_b2y_record_headers.txt
          grep -q 'label=Y_BLEND' research/M10R_v073_b2y_record_headers.txt
          grep -q 'label=YC_CONVERSION' research/M10R_v073_b2y_record_headers.txt
          grep -q 'label=TONE_TBL0' research/M10R_v073_b2y_record_headers.txt
          grep -q '^OVERALL_VERDICT=RECORD_KEYS_AND_SMALL_PAYLOADS_RECORDED_FROM_FROZEN_LOOKUP_LAYOUT$' research/M10R_v073_b2y_record_headers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-V073-B2Y-RECORD-HEADERS
          path: research/M10R_v073_b2y_record_headers.txt
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v073_b2y_record_headers.txt
          git commit -m 'research: record v073 B2Y record header keys' || exit 0
          git pull --rebase origin m10r-reference-transfer-rgb1e && git push
