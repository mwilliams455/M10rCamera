name: M10-R Y BLEND YBPATH1A evidence
on:
  push:
    branches: [m10r-yblend-ybpath1a]
    paths: ['.github/workflows/m10r-yblend-ybpath1a.yml', 'tools/m10r_yblend_ybpath1a.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned research dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3
      - name: Fetch hash-pinned related SDK text without executing it
        run: |
          python3 - <<'PY'
          import importlib.util,hashlib,urllib.request,time
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('paths','tools/m10r_yblend_ybpath1a.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for p,h in m.SDK_HASHES.items():
              url=f'https://raw.githubusercontent.com/ZMlogicL/companyTask/{m.SDK_COMMIT}/{p}'
              for attempt in range(3):
                  try:
                      b=urllib.request.urlopen(url,timeout=60).read()
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2)
              assert hashlib.sha256(b).hexdigest()==h,p
              f=Path('/tmp/sdk')/p;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(b)
          PY
      - name: Obtain hash-verified firmware sections
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker);z=p.index('\n          CPP',a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec > /tmp/sections.txt
      - name: Execute mixed ARM Thumb path tests and retained audit
        run: |
          set -euo pipefail
          mkdir -p evidence/results evidence/tools
          echo '376162e0839b83be755e3726714685d9dcbe124fe14d8237a809d678580cb925  tools/m10r_yblend_ybpath1a.py' | sha256sum -c -
          python3 tools/m10r_yblend_ybpath1a.py /tmp/sec . /tmp/sdk evidence/results --cases 256 > evidence/results/stdout.txt
          python3 tools/m10r_yblend_bit15_audit1a.py /tmp/sec --cases 1024 --out evidence/results/register_emulation.json > evidence/results/bit15_stdout.txt
          cp tools/m10r_yblend_ybpath1a.py tools/m10r_yblend_bit15_audit1a.py tools/m10r_b2y_assets.py evidence/tools/
          cp .github/workflows/m10r-yblend-ybpath1a.yml evidence/
          git rev-parse HEAD > evidence/results/source_commit.txt
          git fetch --no-tags --depth=1 origin febc0dd090a604ca4d5b4c465f5e0ca18853fb9a
          git diff --name-only febc0dd090a604ca4d5b4c465f5e0ca18853fb9a HEAD > evidence/results/changed_paths.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('evidence');j=json.loads((p/'results/ybpath_results.json').read_text())
          assert j['status']=='PASS_CONTROL_PATHS_ONLY' and j['gate_c_passed'] is False
          assert j['tests']['original_entry_executions']==1213
          assert j['tests']['mmio_writes']==32927
          assert j['tests']['paired_bit15_changes']==0
          assert len(j['tests']['isolation_cases'])==45
          assert j['coefficient_rows']['determinant']==376215
          changed=(p/'results/changed_paths.txt').read_text().splitlines()
          assert set(changed)=={'.github/workflows/m10r-yblend-ybpath1a.yml','tools/m10r_yblend_ybpath1a.py'}
          entries=[]
          for f in sorted(p.rglob('*')):
              if f.is_file():
                  b=f.read_bytes();entries.append({'path':str(f.relative_to(p)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (p/'manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          (p/'README.txt').write_text('Original firmware control paths and tone-table copying only. No ISP pixel equation or photographic parity is claimed. Related SDK names remain cross-revision evidence. No firmware binaries, external SDK files, libraries or APK are included.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-YBPATH1A-EVIDENCE
          path: evidence/
          retention-days: 90
          if-no-files-found: error
