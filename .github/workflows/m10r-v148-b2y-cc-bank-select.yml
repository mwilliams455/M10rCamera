name: M10-R v1.48 B2Y CC bank select
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v148-b2y-cc-bank-select.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y rendered CC bank controls
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v148_b2y_cc_bank_select.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,limit=300):
            o=off(a)
            if not 0<=o<len(b): return None
            e=b.find(b'\0',o,min(len(b),o+limit)); q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4: return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                a=((i.address+4)&~3)+i.operands[1].imm; return a,cstr(a)
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'; q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'; st=cstr(q[1])
              if st: s+=f' STRING={st!r}'
            a=adr(i)
            if a: s+=f' ; ADR_EFF {a[0]:#x}'+(f' STRING={a[1]!r}' if a[1] else '')
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.48 B2Y CC BANK SELECT / CONTROL TRACE')
          print('\n=== programmer A register front-end ===')
          for i in dis(0x42152f8c,0x421530c0): print(fmt(i))
          print('\n=== programmer B register front-end ===')
          for i in dis(0x421536bc,0x421537f0): print(fmt(i))
          print('\n=== caller A / LV_MAGNI vicinity ===')
          for i in dis(0x421615b0,0x421616a0): print(fmt(i))
          print('\n=== caller B / LV_SLIVE vicinity ===')
          for i in dis(0x42161990,0x42161a90): print(fmt(i))
          print('\n=== semantic strings around the two call paths ===')
          for a in range(0x42161500,0x42161b00):
            s=cstr(a)
            if s and ('B2Y' in s or 'MAGNI' in s or 'SLIVE' in s or 'STILL' in s): print(hex(a),repr(s))
          print('\n=== exact literal refs for CC header and MMIO banks ===')
          for target in (0x408fe124,0x408fe130,0x408fe15c,0x20020080,0x20020880,0x20022400):
            pat=struct.pack('<I',target); q=0; pools=[]
            while True:
              q=b.find(pat,q)
              if q<0: break
              pools.append(BASE+q-PFX); q+=1
            print(f'{target:#x}',[hex(x) for x in pools])
            for i in dis(0x42000000,0x42860000):
              x=lit(i)
              if x and x[1]==target: print(fmt(i))
          print('\n=== writes/reads of 0x408fe124 header producer vicinity ===')
          refs=[]
          for i in dis(0x420a3000,0x420a4200):
            x=lit(i)
            if x and x[1]==0x408fe124: refs.append(i.address)
          print([hex(x) for x in refs])
          for a in refs:
            print(f'-- around {a:#x} --')
            for i in dis(max(0x420a3000,a-0x50),min(0x420a4200,a+0x80)): print(fmt(i))
          print('\n=== compact proven register map ===')
          print('CC0 source = 0x408FE130, 0x2C-byte rendered record')
          print('CC1 source = 0x408FE15C, 0x2C-byte rendered record')
          print('CC0 packed coefficient words: base 0x20020080 -> effective 0x20020120,24,28,2C,30; control bits at 0x20020100')
          print('CC1 packed coefficient words: base 0x20020880 -> effective 0x200208A0,A4,A8,AC,B0; control bits at 0x20020880')
          print('Both banks are written in each programmer invocation; this trace targets the control/select semantics and caller-mode distinction.')
          print('\n=== TARGET ===')
          print('Resolve CC0 vs CC1 bank control/select semantics, exact role of header 0x408FE124, and label programmer A/B by B2Y workflow mode before moving to TF/tone.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v148_b2y_cc_bank_select.txt
          git commit -m 'research: record v1.48 B2Y CC bank-select trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push