name: M10-R v1.03 live AEAWB window map
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v103-live-aeawb-window-map.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Map mode configuration into live 0x408F03F0 AEAWB window
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v103_live_aeawb_window_map.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def u32a(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+180)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all((32<=ord(c)<127) or c in '\r\n\t' for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp;return a,u32a(a)
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q and q[1] is not None:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            return s
          lo,hi=0x420da160,0x420da460
          ins=[i for i in md.disasm(b[off(lo):off(hi)],lo) if i.id]
          print('M10-R v1.03 LIVE AEAWB WINDOW MAP')
          print('Target: helper 0x420DA1A8 prepares live compact window at 0x408F03F0 before 0x420DC974 programs registers 0x20004000.')
          print('\n=== 0x420DA1A8 REGION ===')
          for i in ins:print(fmt(i))
          # approximate register constants to identify effective global addresses
          regs={}; events=[]
          for i in ins:
            q=lit(i)
            if q and len(i.operands)>=1:
              try:regs[i.operands[0].reg]=q[1]
              except:pass
            if i.mnemonic in ('movs','mov') and len(i.operands)>=2:
              try:
                if i.operands[1].type==ARM_OP_REG and i.operands[1].reg in regs:regs[i.operands[0].reg]=regs[i.operands[1].reg]
              except:pass
            if i.mnemonic in ('adds','subs'):
              try:
                rd=i.operands[0].reg
                if len(i.operands)==2 and i.operands[1].type==ARM_OP_IMM and rd in regs:
                  regs[rd]=(regs[rd]+(i.operands[1].imm if i.mnemonic=='adds' else -i.operands[1].imm))&0xffffffff
                elif len(i.operands)>=3 and i.operands[1].type==ARM_OP_REG and i.operands[1].reg in regs and i.operands[2].type==ARM_OP_IMM:
                  regs[rd]=(regs[i.operands[1].reg]+(i.operands[2].imm if i.mnemonic=='adds' else -i.operands[2].imm))&0xffffffff
              except:pass
            try:
              if (i.mnemonic.startswith('str') or i.mnemonic.startswith('ldr')) and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM:
                rb=i.operands[1].mem.base;d=i.operands[1].mem.disp
                if rb in regs:
                  a=(regs[rb]+d)&0xffffffff
                  if 0x408f0200<=a<0x408f0500:events.append((i.address,a,i.mnemonic,i.op_str))
            except:pass
          print('\n=== RESOLVED PREPRO STATE ACCESSES 0x408F0200..0x408F0500 ===')
          for e in events:print(hex(e[0]),hex(e[1]),e[2],e[3])
          print('\n=== LIVE WINDOW FIELD OFFSETS RELATIVE 0x408F03F0 ===')
          for e in events:
            if 0x408f03f0<=e[1]<0x408f0410:print(hex(e[0]),f'+0x{e[1]-0x408f03f0:X}',e[2],e[3])
          print('\n=== CALLS WITHIN PREPARATION HELPER ===')
          for i in ins:
            if i.mnemonic in ('bl','blx'):print(fmt(i))
          print('\n=== DECISION ===')
          print('Map live-window +0x8/+0xA to frozen h/v block counts if the preparation helper sources them from mode-data +0x18/+0x1C or equivalent named state. Then hardware registers +0x18/+0x1C can be frozen as block-count programming.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v103_live_aeawb_window_map.txt
          git commit -m 'research: record v1.03 live AEAWB window map' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
