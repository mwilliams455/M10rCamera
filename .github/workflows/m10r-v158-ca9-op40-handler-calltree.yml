name: M10-R v1.58 CA9 op40 handler calltree
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v158-ca9-op40-handler-calltree.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace opcode 0x40 handler and direct calltree
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v158_ca9_op40_handler_calltree.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4; END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,n=160):
            o=off(a)
            if o<0 or o>=len(b): return None
            e=b.find(b'\0',o,min(len(b),o+n)); q=b[o:e]
            if e>o and len(q)>=4 and all(32<=x<127 for x in q): return q.decode('ascii','replace')
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4: return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.58 CA9 OPCODE 0x40 HANDLER CALLTREE')
          print('\n=== dispatcher proof ===')
          for i in dis(0x40006320,0x40006464): print(fmt(i))
          print('\n=== op40 handler 0x40004050 bounded ===')
          h=dis(0x40004050,0x40004150)
          for i in h: print(fmt(i))
          calls=[]
          for i in h:
            c=call(i)
            if c is not None and BASE<=c<END and c not in calls:calls.append(c)
          print('\nhandler direct calls', [hex(x) for x in calls])
          for c in calls:
            print(f'\n=== direct callee {c:#x} +/-0x100 ===')
            for i in dis(max(BASE,c-0x40),min(END,c+0x180)): print(fmt(i))
          # Search all direct callers to handler and direct callees.
          allins=dis(BASE,END)
          for target in [0x40004050]+calls:
            hs=[i.address for i in allins if call(i)==target]
            print(f'\n=== direct callers {target:#x} ==='); print([hex(x) for x in hs])
          # Dump data/function region immediately following handler because neighboring funcs often form CM algebra.
          print('\n=== surrounding CM-looking region 0x40004000..0x400055c0 ===')
          for i in dis(0x40004000,0x400055c0): print(fmt(i))
          # Find use of helper 0x40012b68 and related nearby soft-float/vector helpers.
          print('\n=== calls into 0x40012b40..0x40012bc0 ===')
          for i in allins:
            c=call(i)
            if c is not None and 0x40012b40<=c<=0x40012bc0: print(fmt(i))
          print('\n=== TARGET ===')
          print('Decode exact opcode 0x40 handler semantics, request-field usage, and identify next CM/remap function(s).')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v158_ca9_op40_handler_calltree.txt
          git commit -m 'research: record v1.58 CA9 op40 handler calltree' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push