name: M10-R RENDER2F WARMRED1B NATIVE VALIDATION
on:
  push:
    branches: [m10r-render2f-warmred1b]
    paths:
      - '.github/workflows/m10r-render2f-warmred1b-native.yml'
      - 'tools/m10r_warmred1b_native_validate.py'
      - 'native/m10rWarmRed1B.h'
      - 'patches/fix-m10r-render2f-warmred1b.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed validation dependencies
        run: |
          python3 -m pip install numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.13.0.92 rawpy==0.25.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - uses: actions/download-artifact@v4
        with:
          name: M10R-PHOTOAUDIT1A-RESEARCH-INPUTS
          run-id: 35518775600
          github-token: ${{ github.token }}
          path: inputs
      - name: Retrieve unchanged public reference pairs
        run: python3 tools/m10r_tonecal1a_fetch_refs.py inputs
      - name: Validate patch syntax
        run: |
          python3 -m py_compile patches/fix-m10r-render2f-warmred1b.py tools/m10r_warmred1b_native_validate.py
          grep -F 'nonSelectedPixelPolicy' patches/fix-m10r-render2f-warmred1b.py
          grep -F 'yBlendKChanged":False' patches/fix-m10r-render2f-warmred1b.py
          grep -F 'mfm1bChanged":False' patches/fix-m10r-render2f-warmred1b.py
      - name: Run native helper parity and public regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p warmred_native
          python3 tools/m10r_warmred1b_native_validate.py inputs warmred_native
          python3 - <<'PY'
          import json
          d=json.load(open('warmred_native/results.json'))
          assert d['status']=='PASS_WARMRED1B_NATIVE',d['status']
          assert d['gate_passed'] is True
          assert d['max_oracle_code_error']<=1
          print(json.dumps(d['summary'],indent=2))
          PY
      - name: Persist native validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp warmred_native/results.json research/M10R_WARMRED1B_NATIVE_VALIDATE.json
          cp warmred_native/REPORT.md research/M10R_WARMRED1B_NATIVE_VALIDATE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/M10R_WARMRED1B_NATIVE_VALIDATE.*
          git commit -m "Research freeze WARMRED1B native validation" || exit 0
          git pull --rebase origin m10r-render2f-warmred1b
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M10R-WARMRED1B-NATIVE-VALIDATION
          path: |
            warmred_native/
            research/M10R_WARMRED1B_NATIVE_VALIDATE.*
          if-no-files-found: warn
          retention-days: 90
