name: M10-R v2.36b ColorSpec tail and rounding
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v236b-ca9-colorspec-tail-rounding.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace missing ColorSpec tail and Thumb rounding helper
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v236b_ca9_colorspec_tail_rounding.txt
          from pathlib import Path
          import struct,math
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          arm=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); arm.detail=True
          th=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); th.detail=True
          def off(a): return PFX+a-BASE
          def dump(md,a,z,name):
              print(f'=== {name} {a:08x}..{z:08x} ===')
              for i in md.disasm(b[off(a):off(z)],a): print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}')
              print()
          print('M10-R v2.36b CA9 COLORSPEC TAIL / ROUNDING TRACE')
          print('Bounded follow-up only: complete 0x40005E94 white-construction routine and decode BLX target 0x40012940 in Thumb state.')
          print()
          dump(arm,0x40005e94,0x400060f0,'white-construction routine complete')
          dump(th,0x40012940,0x400129a0,'rendered-CC rounding helper in Thumb state')
          dump(arm,0x40012b40,0x40012b80,'rendered-CC clamp helper')
          print('=== DECISION BOUNDARY ===')
          print('Freeze only formulas directly expressed by these bodies. Preserve any remaining helper as unresolved rather than importing SDK behavior.')
          PY
      - name: Commit v2.36b trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v236b_ca9_colorspec_tail_rounding.txt
          git commit -m 'research: record v2.36b ColorSpec tail and rounding' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
