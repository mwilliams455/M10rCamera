name: M10-R v0.90 workflow payload initializer
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v090-workflow-payload-initializer.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace workflow initializer family and payload fields
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v090_workflow_payload_initializer.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;lo=off(la)
                if 0<=lo<=len(b)-4:return la,struct.unpack_from('<I',b,lo)[0]
            except:pass
          def tgt(i):
            try:
              if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);t=tgt(i)
            if q:s+=f' ; LIT {hex(q[0])}->{hex(q[1])}'
            if t is not None:s+=f' ; CALL {hex(t)}'
            return s
          def dump(a,z,title):
            print('\n===',title,hex(a),'..',hex(z),'===')
            for i in md.disasm(b[off(a):off(z)],a):
              if i.id:print(fmt(i))
          def cstr(a,n=240):
            o=off(a)
            if not (0<=o<len(b)):return None
            x=b[o:min(len(b),o+n)].split(b'\0',1)[0]
            try:return x.decode('ascii')
            except:return None
          ins=[i for i in md.disasm(b[off(0x42080000):off(0x420b0000)],0x42080000) if i.id]
          def callers(t):return [n for n,i in enumerate(ins) if tgt(i)==t]
          print('M10-R v0.90 WORKFLOW PAYLOAD INITIALIZER TRACE')
          print('Goal: identify code that initializes the workflow object field later consumed as +0x480, and determine whether its source is Prepro AFAEAWB base+0x80/base+0x14080.')
          for t,name in [(0x420a591c,'workflow pre-request helper'),(0x420a9354,'workflow mode/state helper'),(0x420a835c,'workflow->secondary CA9 block builder'),(0x420a88dc,'completion helper'),(0x420a5de4,'completion helper 2')]:
            hs=callers(t);print(f'\n=== CALLERS {name} {hex(t)} count {len(hs)} ===')
            for n in hs:
              print('\n---',hex(ins[n].address),'---')
              for j in range(max(0,n-22),min(len(ins),n+38)):print(fmt(ins[j]))
          dump(0x420a58c0,0x420a5b80,'0x420A591C helper body and neighborhood')
          dump(0x420a92c0,0x420a9460,'0x420A9354 mode/state helper')
          # Exact workflow payload reads known in the builder family, with enough surrounding logic to infer mode semantics.
          dump(0x420a8330,0x420a8480,'0x420A835C payload extraction cases')
          # Print strings referenced by the relevant entry/helper ranges.
          print('\n=== REFERENCED STRINGS ===')
          for a,z,name in [(0x420a2eb0,0x420a3058,'entry cluster'),(0x420a58c0,0x420a5b80,'591c family'),(0x420a835c,0x420a86c0,'835c family'),(0x420a92c0,0x420a9460,'9354 family')]:
            seen=set()
            for i in md.disasm(b[off(a):off(z)],a):
              q=lit(i)
              if not q or q[1] in seen:continue
              s=cstr(q[1])
              if s and len(s)>=4 and all((32<=ord(ch)<127) or ch in '\r\n\t' for ch in s):
                seen.add(q[1]);print(name,hex(i.address),hex(q[1]),repr(s))
          # Search only the relevant helper bodies for stores whose effective offset construction uses 0x85<<3, 0x90<<3, 0x480 immediate, or nearby 0x47x/0x48x literals.
          print('\n=== LARGE-OFFSET / +0x480-LIKE INSTRUCTIONS IN HELPER RANGES ===')
          for a,z in [(0x420a58c0,0x420a5b80),(0x420a8300,0x420a86c0),(0x420a92c0,0x420a9460)]:
            for i in md.disasm(b[off(a):off(z)],a):
              txt=i.op_str.lower()
              if any(k in txt for k in ['#0x85','#0x90','#0x480','#0x478','#0x47c','#0x484','#0x488']):print(fmt(i))
          print('\n=== INTERPRETATION RULE ===')
          print('A +0x480 read establishes consumption only. Freeze identity only if an initializer/helper writes that field from a pointer whose provenance is explicitly AFAEAWB base+0x80 or base+0x14080.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v090_workflow_payload_initializer.txt
          git commit -m 'research: record v0.90 workflow payload initializer' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
