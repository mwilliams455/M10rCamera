name: M10-R output-space transfer 3W
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3w.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Verify root pointer identity and child colorspace consumers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3W.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return P+a-B
          def ds(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def one(a):
            q=off(a);z=list(md.disasm(b[q:q+4],a,count=1)) if 0<=q<len(b) else []
            return z[0] if z else None
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM:return ((i.address+4)&~3)+i.operands[1].imm
            except:pass
          def cstr(a,n=180):
            q=off(a)
            if not 0<=q<len(b):return None
            z=b.find(b'\0',q,min(len(b),q+n));z=min(len(b),q+n) if z<0 else z;x=b[q:z]
            if x and all(32<=c<127 or c in (9,10,13) for c in x):return x.decode('latin1','replace')
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);x=lit(i);a=adr(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            if a is not None:s+=f' ; ADR={a:#x} STR={repr(cstr(a))}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER3W')
          print('\n=== MODE-INIT FINAL CALL WINDOW ===')
          for i in ds(0x42152e80,0x42152eea):print(fmt(i))
          print('\n=== APPLY PROLOG POINTER SEED ===')
          for i in ds(0x4215220c,0x42152228):print(fmt(i))
          print('\n=== BROAD PROGRAMMER 0x42154F84 DIRECT CHILD CALLS ===')
          broad=ds(0x42154f84,0x42155380)
          children=[]
          for i in broad:
            c=call(i)
            if c is not None and 0x42153000<=c<0x42155000:
              children.append(c);print(fmt(i))
          children=list(dict.fromkeys(children))
          print('CHILDREN',[hex(x) for x in children])
          print('\n=== CHILD FUNCTION FIRST-ARG OFFSET +0x48 ANALYSIS ===')
          helpers={0x4204efd4:'copy',0x4204f1f4:'concat',0x421a0fc0:'resource'}
          for s in children:
            fi=ds(s,min(B+len(b)-P,s+0x500))
            # trim at first pop pc
            out=[]
            for i in fi:
              out.append(i)
              if i.address>s and i.mnemonic=='pop' and 'pc' in i.op_str:break
            # derive simple aliases of r0 in first 12 instructions
            aliases={ARM_REG_R0}
            changed=True
            for i in out[:16]:
              try:
                if i.mnemonic.startswith('mov') and len(i.operands)>=2 and i.operands[0].type==ARM_OP_REG and i.operands[1].type==ARM_OP_REG and i.operands[1].reg in aliases:
                  aliases.add(i.operands[0].reg)
              except:pass
            hits=[]
            for i in out:
              try:
                for o in i.operands:
                  if o.type==ARM_OP_MEM and o.mem.base in aliases and o.mem.disp==0x48:hits.append(i)
                if i.mnemonic not in ('adr',) and any(o.type==ARM_OP_REG and o.reg in aliases for o in i.operands):
                  if any(o.type==ARM_OP_IMM and o.imm==0x48 for o in i.operands):hits.append(i)
              except:pass
            strs=[]
            for i in out:
              a=adr(i)
              if a is not None and cstr(a):strs.append(cstr(a))
            hc=[(i.address,helpers.get(call(i))) for i in out if call(i) in helpers]
            print('\nCHILD',hex(s),'ALIASES',[md.reg_name(x) for x in aliases],'PLUS48',[fmt(x) for x in hits],'HELPERS',hc)
            for t in dict.fromkeys(strs):print('  STR',repr(t))
            if hits:
              print('  FULL_BODY')
              for i in out:print(fmt(i))
          print('\n=== CHILD CALL ARGUMENT WINDOWS ===')
          for k,i in enumerate(broad):
            c=call(i)
            if c in children:
              print('\nCALL',hex(i.address),'->',hex(c))
              for x in broad[max(0,k-5):k+2]:print(fmt(x))
          print('\n=== DECISION GATE ===')
          print('Verify 0x42154F84 root pointer equals mode-init sp+4 so child pointer root+0x2c equals selector sp+0x30. Then identify which child selectors truly read first_arg+0x48, the SRGB/ADOBERGB/ECI C-string.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3W.txt
          git commit -m 'research: verify B2Y root pointer and colorspace child consumers 3W' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
