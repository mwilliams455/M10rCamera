name: M10-R v1.19 color science entry map
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v119-color-science-entry-map.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Map M10-R color science entry points
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v119_color_science_entry_map.txt
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_ARM,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC

          print('M10-R v1.19 COLOR SCIENCE ENTRY MAP')
          print('Firmware SHA256 ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498')
          keys=('color','colour','white balance','whitebalance','awb',' wb','wb ','gamma','matrix','ccm','lut','tone','curve','hue','saturation','satur','vivid','natural','standard','jpeg','jpg','srgb','adobergb','adobe rgb','dng','raw','rgb','ycbcr','chrom','illumin','kelvin','temperature','tint','black level','highlight')

          print('\n=== COLOR-RELATED STRINGS ACROSS EXTRACTED SECTIONS ===')
          catalog=[]
          for p in sorted(Path('/tmp/sections').iterdir()):
            if not p.is_file(): continue
            d=p.read_bytes(); i=0
            while i<len(d):
              if 0x20<=d[i]<=0x7e:
                j=i
                while j<len(d) and 0x20<=d[j]<=0x7e:j+=1
                if j-i>=5:
                  s=d[i:j].decode('ascii','replace'); sl=s.lower()
                  if any(k in sl for k in keys): catalog.append((p.name,i,s))
                i=max(j+1,i+1)
              else:i+=1
          for sec,o,s in catalog:
            print(f'{sec} +0x{o:x}: {s!r}')
          print('TOTAL',len(catalog))

          # Focused IMG-System Thumb disassembly around already identified Leica CA9 colour/WB entry points.
          p=Path('/tmp/sections/092_IMG-System.bin'); b=p.read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; lo=off(la)
                if 0<=lo<=len(b)-4:return la,struct.unpack_from('<I',b,lo)[0]
            except: pass
          def target(i):
            try:
              if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              la,v=q;s+=f' ; LIT {hex(la)}->{hex(v)}'
              if BASE<=v<BASE+len(b)-PFX:
                oo=off(v); e=b.find(b'\0',oo,min(len(b),oo+180))
                if e>oo:
                  raw=b[oo:e]
                  if raw and all(0x20<=x<=0x7e for x in raw):s+=f" STRING={raw.decode('ascii','replace')!r}"
            t=target(i)
            if t is not None:s+=f' ; CALL {hex(t)}'
            return s
          def dump(title,a,z):
            print(f'\n=== {title} {hex(a)}..{hex(z)} ===')
            for i in dis(a,z):print(fmt(i))
          dump('ca9_StartColorManagement',0x420a2e90,0x420a2fb4)
          dump('ca9_cm_fill_parameter',0x420a58c0,0x420a5c40)
          dump('ca9_wb_fill_parameter',0x420a835c,0x420a86d0)

          print('\n=== DIRECT CALLEES OF COLOR/WB ENTRY WINDOWS ===')
          ts=[]
          for a,z in ((0x420a2e90,0x420a2fb4),(0x420a58c0,0x420a5c40),(0x420a835c,0x420a86d0)):
            for i in dis(a,z):
              t=target(i)
              if t is not None and BASE<=t<BASE+len(b)-PFX: ts.append(t)
          seen=[]
          for t in ts:
            if t not in seen:seen.append(t)
          for t in seen:
            print(hex(t))
          for t in seen[:60]:
            if 0x42080000<=t<0x420c0000:
              dump(f'callee {hex(t)}',max(BASE,t-0x20),t+0x100)

          # CA9 ARM-side survey around colour-related strings by raw literal pointer occurrences.
          p2=Path('/tmp/sections/099_IMG-CA9_System.bin'); c=p2.read_bytes(); CBASE=0x40000000; CPFX=4
          print('\n=== CA9 COLOR STRING POINTER POOLS ===')
          for sec,o,s in catalog:
            if sec!='099_IMG-CA9_System.bin':continue
            va=CBASE+o-CPFX; pat=struct.pack('<I',va)
            q=0; hs=[]
            while True:
              q=c.find(pat,q)
              if q<0:break
              hs.append(CBASE+q-CPFX);q+=1
            print(hex(va),repr(s),'POOLS',[hex(x) for x in hs[:40]])

          print('\n=== NEXT DECISION ===')
          print('Prioritize firmware-owned transforms/tables before visual fitting: identify colour-management matrices/LUTs and WB gains first; then isolate tone/JPEG look paths. Keep RAW/DNG calibration separate from JPEG rendering.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v119_color_science_entry_map.txt
          git commit -m 'research: record v1.19 M10-R color science entry map' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
