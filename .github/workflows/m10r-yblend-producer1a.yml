name: M10-R Y BLEND PRODUCER1A
on:
  push:
    branches: [m10r-yblend-producer1a]
    paths:
      - '.github/workflows/m10r-yblend-producer1a.yml'
      - 'tools/m10r_yblend_producer1a.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producer-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned research dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3
      - name: Fetch and verify original firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode using existing verified extractor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker)
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec > /tmp/section_inventory.txt
      - name: Reproduce audit, re-extract records, execute complete producer tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p producer_evidence/results producer_evidence/tools
          python3 tools/m10r_yblend_bit15_audit1a.py /tmp/sec --cases 1024 --out producer_evidence/results/register_emulation.json > producer_evidence/results/audit_stdout.txt
          python3 tools/m10r_ycc_calib_compact_v086.py /tmp/sec . > producer_evidence/results/v086_reextraction.txt
          python3 tools/m10r_yblend_producer1a.py /tmp/sec . producer_evidence/results > producer_evidence/results/producer_stdout.txt
          git rev-parse HEAD > producer_evidence/results/source_commit.txt
          cp /tmp/section_inventory.txt producer_evidence/results/
          cp tools/m10r_yblend_producer1a.py tools/m10r_yblend_bit15_audit1a.py tools/m10r_b2y_assets.py tools/m10r_ycc_calib_compact_v086.py producer_evidence/tools/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('producer_evidence')
          j=json.loads((p/'results/producer_results.json').read_text())
          assert j['status']=='PASS_SOFTWARE_PRODUCER_ONLY'
          assert j['test_execution']['selector_lookup_driver_cases']==1792
          assert j['test_execution']['watched_mmio_writes']==10464
          assert j['test_execution']['bit15_mutations']==0
          assert j['gate_c_passed'] is False
          entries=[]
          for f in sorted(p.rglob('*')):
              if f.is_file():
                  b=f.read_bytes()
                  entries.append({'path':str(f.relative_to(p)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (p/'manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          (p/'README.txt').write_text('Software producer evidence only. Original selector, record lookup, string comparison and register programmer are executed; file-registry resolution and logging are stubbed. No ISP pixel equation or photographic parity is claimed. No firmware binaries or third-party libraries are included.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-PRODUCER1A-EVIDENCE
          path: producer_evidence/
          retention-days: 90
          if-no-files-found: error
