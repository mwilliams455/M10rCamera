name: M10-R v0.83 CA9 AE statistic and reference
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v083-ca9-ae-statistic-reference.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover CA9 statistic/reference provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v083_ca9_ae_statistic_reference.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();base=0x40000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return pfx+a-base
          def va(o):return base+o-pfx
          def one(a):
            o=off(a);ds=list(md.disasm(b[o:o+4],a,1)) if 0<=o<=len(b)-4 else [];return ds[0] if ds else None
          def dump(s,e):
            for a in range(max(base,s)&~3,min(end,e),4):
              i=one(a)
              if i:print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}')
          print('M10-R v0.83 CA9 AE STATISTIC / REFERENCE PROVENANCE')
          target=0x40013498
          print('\n=== EXACT CODE REFS TO GLOBAL 0x40013498 ===')
          refs=[]
          for a in range(base,end,4):
            i=one(a)
            if not i:continue
            vals=[]
            if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              la=a+8+i.operands[1].mem.disp;lo=off(la)
              if 0<=lo<=len(b)-4: vals.append(struct.unpack_from('<I',b,lo)[0]&~1)
            if i.mnemonic in ('add','sub') and len(i.operands)>=3 and i.operands[1].type==ARM_OP_REG and i.operands[1].reg==ARM_REG_PC and i.operands[2].type==ARM_OP_IMM:
              pc=a+8;vals.append(pc+i.operands[2].imm if i.mnemonic=='add' else pc-i.operands[2].imm)
            if target in vals: refs.append(a)
          print([hex(x) for x in refs])
          for a in refs:
            print('\nREF_WINDOW',hex(a));dump(a-0x100,a+0x140)

          print('\n=== RAW BYTES AROUND 0x40013480 ===')
          o=off(0x40013480);d=b[o:o+0x40]
          for i in range(0,len(d),16): print(hex(0x40013480+i),d[i:i+16].hex(' '))
          print('GLOBAL_40013498_U32',hex(struct.unpack_from('<I',b,off(target))[0]))
          print('GLOBAL_40013498_FLOAT',struct.unpack_from('<f',b,off(target))[0])

          print('\n=== CA9 STRINGS RE AE/PREPRO/STATS ===')
          keys=('ae ','ae_','prepro','pre-pro','stat','luma','lum','hist','bright','quantity','meter','grid','average','avg','y ') 
          strings=[];i=0
          while i<len(b):
            if 0x20<=b[i]<=0x7e:
              j=i
              while j<len(b) and 0x20<=b[j]<=0x7e:j+=1
              if j-i>=6:
                s=b[i:j].decode('ascii','replace');lo=s.lower()
                if any(k in lo for k in keys): strings.append((va(i),s))
              i=max(j+1,i+1)
            else:i+=1
          for a,s in strings[:500]:print(hex(a),repr(s))

          print('\n=== STRING CODE REFS FOR STATISTIC-LIKE STRINGS ===')
          selected=[(a,s) for a,s in strings if any(k in s.lower() for k in ('prepro','stat','luma','hist','quantity','ae data','ae module'))]
          for sa,s in selected[:180]:
            hits=[]
            for a in range(base,end,4):
              ins=one(a)
              if not ins:continue
              if ins.mnemonic.startswith('ldr') and len(ins.operands)>=2 and ins.operands[1].type==ARM_OP_MEM and ins.operands[1].mem.base==ARM_REG_PC:
                la=a+8+ins.operands[1].mem.disp;lo=off(la)
                if 0<=lo<=len(b)-4 and (struct.unpack_from('<I',b,lo)[0]&~1)==(sa&~1):hits.append(a)
              if ins.mnemonic=='add' and len(ins.operands)>=3 and ins.operands[1].type==ARM_OP_REG and ins.operands[1].reg==ARM_REG_PC and ins.operands[2].type==ARM_OP_IMM:
                if a+8+ins.operands[2].imm==sa:hits.append(a)
            if hits:print(hex(sa),repr(s),'REFS',[hex(x) for x in hits])

          print('\n=== TOP-LEVEL AE CONFIG BUILD 0x40000800..0x40000948 ===')
          dump(0x40000800,0x40000948)
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v083_ca9_ae_statistic_reference.txt
          git commit -m 'research: record v0.83 CA9 AE statistic/reference provenance' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
