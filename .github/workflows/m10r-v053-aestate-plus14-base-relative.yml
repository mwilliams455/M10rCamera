name: M10-R v0.53 AE state plus14 base relative
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v053-aestate-plus14-base-relative.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Trace AE state plus14 base-relative users
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v053_aestate_plus14_base_relative.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC
          p='/tmp/sections/090_CTRL-System.bin'; b=Path(p).read_bytes(); base=0x08000000; pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return pfx+a-base
          def u32(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def fmt(i):
            if i.id==0:return f'{i.address:08x}: .byte {i.op_str}'
            ex=''
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;v=u32(la)
                if v is not None:ex=f' ; LIT {la:#x}->{v:#x}'
            except:pass
            return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
          def dump(a,z,title):
            a=max(base,a);z=min(base+len(b)-pfx,z);print(f'\n=== {title} {a:#x}..{z:#x} ===')
            for i in md.disasm(b[off(a):off(z)],a):print(fmt(i))
          ins=[i for i in md.disasm(b[pfx:],base) if i.id!=0]
          roots=[]
          for n,i in enumerate(ins):
            try:
              if not i.mnemonic.startswith('ldr') or len(i.operands)<2 or i.operands[1].type!=ARM_OP_MEM or i.operands[1].mem.base!=ARM_REG_PC:continue
              la=((i.address+4)&~3)+i.operands[1].mem.disp;v=u32(la)
              if v is None or not (0x2001a900<=v<=0x2001a940):continue
              rd=i.operands[0].reg if i.operands[0].type==ARM_OP_REG else 0
              roots.append((n,i.address,v,rd,la))
            except:pass
          print('M10-R v0.53 AE STATE +0x14 BASE-RELATIVE TRACE')
          print('AE state known base 0x2001A918; +0x14=0x2001A92C; +0x16 BvCMOS=0x2001A92E')
          print('\nROOT_LITERAL_LOADS',[(hex(a),hex(v),md.reg_name(rd),hex(la)) for _,a,v,rd,la in roots])
          hits=[]
          for n,a,v,rd,la in roots:
            for j in range(n+1,min(len(ins),n+35)):
              x=ins[j]
              # stop at returns or a new assignment to root register when detectable
              try:
                for op in x.operands:
                  if op.type==ARM_OP_MEM and op.mem.base==rd:
                    ea=v+op.mem.disp
                    if ea in (0x2001a92c,0x2001a92e) or op.mem.disp in (0x14,0x16):
                      hits.append((a,v,x.address,op.mem.disp,ea))
              except:pass
              if x.mnemonic in ('bx','pop') and ('pc' in x.op_str or x.mnemonic=='bx'):break
          print('\nBASE_RELATIVE_HITS')
          for root,v,a,d,ea in hits:print('ROOT',hex(root),'BASE',hex(v),'ACCESS',hex(a),'DISP',hex(d),'EFFECTIVE',hex(ea))
          seen=set()
          for root,v,a,d,ea in hits:
            if a in seen:continue
            seen.add(a);dump(a-0xb0,a+0x100,f'AE FIELD ACCESS effective={ea:#x} @ {a:#x}')
          # Also raw halfword/word direct address literals, if any.
          for target in (0x2001a92c,0x2001a92e,0x2001a918):
            pat=struct.pack('<I',target);q=0;arr=[]
            while True:
              q=b.find(pat,q)
              if q<0:break
              arr.append(q);q+=1
            print('RAW_LITERAL',hex(target),[hex(x) for x in arr])
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v053_aestate_plus14_base_relative.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.53 AE state plus14 base-relative trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
