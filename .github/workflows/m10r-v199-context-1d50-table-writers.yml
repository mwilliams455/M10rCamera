name: M10-R v1.99 context 1D50 table writers
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v199-context-1d50-table-writers.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Find all literal-driven context plus 0x1D50 table references
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v199_context_1d50_table_writers.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          def off(a):return P+a-BASE
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            try:
              o=ops(i)
              if i.mnemonic in ('bl','blx') and o and o[0].type==ARM_OP_IMM:return o[0].imm&~1
            except:pass
          def lit(i):
            try:
              o=ops(i)
              if i.mnemonic.startswith('ldr') and len(o)>=2 and o[1].type==ARM_OP_MEM and o[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+o[1].mem.disp;fo=off(la)
                if 0<=fo<=len(b)-4:return la,struct.unpack_from('<I',b,fo)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.99 CONTEXT +0x1D50 TABLE WRITERS')
          needle=struct.pack('<I',0x1d50);pos=[];start=0
          while True:
            x=b.find(needle,start)
            if x<0:break
            pos.append(x);start=x+1
          print('literal_occurrences',len(pos),[hex(BASE+x-P) for x in pos])
          refs=[]
          for x in pos:
            la=BASE+x-P
            a=max(BASE,(la-0x300)&~1);z=min(BASE+len(b)-P,la+0x80)
            ins=list(md.disasm(b[off(a):off(z)],a))
            for k,i in enumerate(ins):
              q=lit(i)
              if q and q[0]==la and q[1]==0x1d50:
                refs.append((la,i.address))
                print(f'\n=== literal {la:#x} referenced at {i.address:#x} ===')
                for j in ins[max(0,k-18):min(len(ins),k+32)]:print(fmt(j))
          print('\nreference_count',len(refs),[(hex(a),hex(i)) for a,i in refs])
          print('\n=== secondary: exact 0x1D50 constant synthesis in known subsystem 0x4215f000..0x42162000 ===')
          # bounded 0x30k region only; find mov/movw values whose arithmetic may synthesize 0x1d50 and print nearby stores
          ins=list(md.disasm(b[off(0x4215f000):off(0x42162000)],0x4215f000))
          for k,i in enumerate(ins):
            o=ops(i)
            if i.mnemonic in ('movw','mov','movs') and len(o)>=2 and o[1].type==ARM_OP_IMM and o[1].imm in (0x1d50,0x1d,0x75,0xea,0x3aa):
              print(f'\nCAND {fmt(i)}')
              for j in ins[max(0,k-8):min(len(ins),k+16)]:print(fmt(j))
          print('\nTARGET: enumerate all code paths that address context+0x1D50, distinguish readers from writers, and identify the routine that stores object pointers into the table. From that writer, expose the pointer source/constructor for the next bounded contrast+0xAC trace.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v199_context_1d50_table_writers.txt
          git commit -m 'research: record v1.99 context 1D50 table writers' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push