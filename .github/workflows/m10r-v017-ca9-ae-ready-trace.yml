name: M10-R v0.17 CA9 AE ready trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v017-ca9-ae-ready-trace.yml', '.m10r-v017-ca9-ae-ready-trace-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace CA9 AE outputs
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v017-ca9-ae-ready-trace.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes()
          print('SIZE',len(b))
          print('FIRST_64',b[:64].hex())
          print('FIRST_WORDS',[hex(struct.unpack_from('<I',b,o)[0]) for o in range(0,min(64,len(b)),4)])
          pats=[b'AE integral ready',b'AE spot ready',b'AE AV field ready',b'AE MFM ready',b'AE algorithm running',b'AE param: AV:']
          sh=[]
          for p in pats:
            q=b.find(p)
            print('STRING',p.decode(),hex(q) if q>=0 else None)
            if q>=0:sh.append((p,q))
          # Try likely 0x40000000 alias and prefix conventions, and report actual pointer hits.
          for p,q in sh:
            for pfx in (0,4):
              va=0x40000000+q-pfx
              for x in (va,va|1):
                needle=struct.pack('<I',x);pos=[];z=0
                while True:
                  z=b.find(needle,z)
                  if z<0:break
                  pos.append(z);z+=1
                if pos: print('PTRHIT',p.decode(),'PFX',pfx,'VA',hex(x),'OFFSETS',[hex(a) for a in pos])
          # Also infer likely image base from absolute words pointing near known string offsets.
          knownoffs={q for _,q in sh}
          guesses={}
          for o in range(0,len(b)-4,4):
            v=struct.unpack_from('<I',b,o)[0]&~1
            for q in knownoffs:
              base=v-q
              if base in (0x40000000,0x40000004,0x42000000,0x42000004):guesses[base]=guesses.get(base,0)+1
          print('BASE_GUESSES', {hex(k):v for k,v in guesses.items()})
          # Disassemble around every pointer hit using ARM and THUMB, with base 0x40000000 and pfx=0/4.
          for p,q in sh:
            for pfx in (0,4):
              sva=0x40000000+q-pfx
              ptrs=[]
              for x in (sva,sva|1):
                n=struct.pack('<I',x);z=0
                while True:
                  z=b.find(n,z)
                  if z<0:break
                  ptrs.append(z);z+=1
              for po in sorted(set(ptrs)):
                center=0x40000000+po-pfx
                print('\n=== XREF',p.decode(),'pfx',pfx,'ptr_off',hex(po),'center',hex(center),'===')
                for mode,name in [(CS_MODE_ARM,'ARM'),(CS_MODE_THUMB,'THUMB')]:
                  md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
                  s=max(0,po-0x180);e=min(len(b),po+0x240);start=0x40000000+s-pfx
                  print('--',name,'--')
                  for i in md.disasm(b[s:e],start):
                    if i.mnemonic!='.byte':print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v017-ca9-ae-ready-trace
          path: /tmp/m10r-v017-ca9-ae-ready-trace.txt
          if-no-files-found: error
