name: M10-R v1.93 default contrast provenance
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v193-default-contrast-provenance.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace tone contrast fields into B2Y selector
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v193_default_contrast_provenance.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return P+a-BASE
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.93 DEFAULT CONTRAST PROVENANCE')
          print('\n=== owner marshalling neighborhood 0x421522d0..0x42152380 ===')
          for i in md.disasm(b[off(0x421522d0):off(0x42152380)],0x421522d0):print(fmt(i))
          print('\n=== owner stack accesses around SP+0x80..SP+0xB0 in 0x4215220c..0x42152480 ===')
          # decode from several known-valid anchors to reduce inline-data contamination
          anchors=[(0x4215220c,0x42152228),(0x421522e0,0x42152380),(0x42152380,0x42152480)]
          seen=set()
          for lo,hi in anchors:
            for i in md.disasm(b[off(lo):off(hi)],lo):
              if i.address in seen:continue
              seen.add(i.address)
              hit=False
              try:
                for op in i.operands:
                  if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_SP and 0x70<=op.mem.disp<=0xb0:hit=True
              except:pass
              if hit:print(fmt(i))
          print('\n=== tone selector exact key build ===')
          for i in md.disasm(b[off(0x42154bb4):off(0x42154c90)],0x42154bb4):print(fmt(i))
          print('\n=== candidate strings containing CONTRAST / LOW / MEDIUM / HIGH ===')
          for m in re.finditer(rb'[ -~]{4,}',b):
            s=m.group().decode('ascii','replace')
            if any(k in s.upper() for k in ('CONTRAST','MEDIUM','HIGH','LOW')):
              print(hex(BASE+m.start()-P),repr(s[:300]))
          print('\n=== helper 0x4204f1f4 and 0x4204efd4 exact neighborhoods ===')
          for lo,hi in [(0x4204efb0,0x4204f040),(0x4204f1d0,0x4204f250)]:
            print('\n--',hex(lo),'--')
            for i in md.disasm(b[off(lo):off(hi)],lo):print(fmt(i))
          print('\nTARGET: identify owner/input fields that become selector +0x68/+0x6C, determine whether +0x6C is a contrast-name string, and find any firmware-proven default LOW/MEDIUM/HIGH selection. Do not assume MEDIUM if only three keys are present.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v193_default_contrast_provenance.txt
          git commit -m 'research: record v1.93 default contrast provenance' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push