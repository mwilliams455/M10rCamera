name: M10-R v1.06 channel6 PWLSIZE provenance
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v106-channel6-pwlsize-provenance.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace channel6 write-line size and all PW init/set callers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v106_channel6_pwlsize_provenance.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def u32a(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+220)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all((32<=ord(c)<127) or c in '\r\n\t' for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp;return a,u32a(a)
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q and q[1] is not None:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=cstr(q[1]);
              if st:s+=f' STRING={st!r}'
            return s
          print('M10-R v1.06 CHANNEL-6 PWLSIZE PROVENANCE')
          print('Targets: pw_init=0x420E05B4, pwch_setPWSA=0x420E0850.')
          # scan principal code interval in chunks to avoid giant object list
          targets=(0x420e05b4,0x420e0850)
          callers={t:[] for t in targets}
          for lo in range(0x42000000,0x42200000,0x20000):
            hi=min(lo+0x20000,0x42200000)
            for i in md.disasm(b[off(lo):off(hi)],lo):
              if not i.id or i.mnemonic not in ('bl','blx'):continue
              try:d=int(i.op_str.strip().lstrip('#'),0)
              except:continue
              if d in callers:callers[d].append(i.address)
          for t in targets:print('CALLERS',hex(t),len(callers[t]),*[hex(x) for x in callers[t]])
          for t in targets:
            for a in callers[t]:
              print(f'\n=== CALLER {a:#x} -> {t:#x} ===')
              for i in md.disasm(b[off(max(BASE,a-0x70)):off(a+0x70)],max(BASE,a-0x70)):
                if i.id:print(fmt(i))
          # Inspect known other setPWSA callers and surrounding function strings.
          for lo,hi,title in ((0x420e5c60,0x420e5d40,'OTHER PWSA CALLERS'),(0x420e0400,0x420e0900,'PW INIT/SET FAMILY'),(0x420e5a80,0x420e5e20,'PREPRO START/BUFFER BINDING')):
            print(f'\n=== {title} ===')
            for i in md.disasm(b[off(lo):off(hi)],lo):
              if i.id:print(fmt(i))
          # Locate PWLSIZE string and exact references; show enclosing function and nearby setters.
          needle=b'PWLSIZE'
          print('\n=== PWLSIZE STRING OCCURRENCES ===')
          pos=0;addrs=[]
          while True:
            p=b.find(needle,pos)
            if p<0:break
            a=BASE+p-PFX;addrs.append(a);print(hex(a),repr(cstr(a) or cstr(a-24) or ''))
            pos=p+1
          # collect all literal pointers to strings containing PWLSIZE / set pw-channel
          pwstrings=[];p=0
          while p<len(b):
            if 32<=b[p]<127:
              q=p
              while q<len(b) and 32<=b[q]<127:q+=1
              if q-p>=5 and q<len(b) and b[q]==0:
                try:s=b[p:q].decode('ascii')
                except:s=''
                if 'PWLSIZE' in s or 'pw-channel' in s or 'pwch_' in s:pwstrings.append((BASE+p-PFX,s))
                p=q+1;continue
            p+=1
          print('\nPW STRINGS')
          for a,s in pwstrings:print(hex(a),repr(s))
          # Search immediate channel=6 nearby all calls into driver family 0x420e04xx..0x420e09xx
          print('\n=== CALLS INTO PW DRIVER FAMILY WITH NEARBY MOVS #6 ===')
          for lo in range(0x42000000,0x42200000,0x20000):
            hi=min(lo+0x20000,0x42200000); arr=[i for i in md.disasm(b[off(lo):off(hi)],lo) if i.id]
            for n,i in enumerate(arr):
              if i.mnemonic not in ('bl','blx'):continue
              try:d=int(i.op_str.strip().lstrip('#'),0)
              except:continue
              if not (0x420e0400<=d<0x420e0900):continue
              win=arr[max(0,n-8):n]
              if any(x.mnemonic=='movs' and re.search(r'#(?:6|0x6)\b',x.op_str) for x in win):
                print(f'\nCALL @{i.address:#x} -> {d:#x}')
                for x in arr[max(0,n-10):min(len(arr),n+5)]:print(fmt(x))
          print('\n=== DECISION ===')
          print('If channel 6 is initialized through pw_init, record descriptor +0x08 and decode resulting PWLSIZE. If channel 6 only receives dynamic PWSA, trace earlier global start-up register programming for channel 6 and recover its persistent line-size/format fields.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v106_channel6_pwlsize_provenance.txt
          git commit -m 'research: record v1.06 channel6 PWLSIZE provenance' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
