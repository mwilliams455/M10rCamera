name: M10-R v2.37 ColorSpec closure
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v237-colorspec-closure.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Extract final bounded ColorSpec closure assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v237_colorspec_closure.txt
          from pathlib import Path
          import struct
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_ARM, CS_MODE_LITTLE_ENDIAN
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN)
          def off(a): return PFX+a-BASE
          def u32(a): return struct.unpack_from('<I',b,off(a))[0]
          def i32(a): return struct.unpack_from('<i',b,off(a))[0]
          def f64(a): return struct.unpack_from('<d',b,off(a))[0]
          def dump(a,z,name):
              print(f'=== {name} {a:08x}..{z:08x} ===')
              for ins in md.disasm(b[off(a):off(z)],a):
                  print(f'{ins.address:08x}: {ins.mnemonic:10s} {ins.op_str}')
              print()
          print('M10-R v2.37 COLORSPEC CLOSURE')
          print('Bounded scope: gain-vector helper, clamp primitive/constants, structured Leica xy->temperature locus table.')
          print()
          dump(0x400048d0,0x40004d00,'gain-vector helper region rooted at 0x400048D0')
          dump(0x40012b30,0x40012bc0,'rendered-CC clamp/minmax helpers')
          print('=== QUANTIZER CONSTANTS @ 0x40013930 ===')
          for a in range(0x40013930,0x40013950,4):
              print(f'{a:08x} u32=0x{u32(a):08x} i32={i32(a)}')
          print()
          p=u32(0x40004c58)
          print(f'LOCUS_BASE_PTR=0x{p:08x}')
          print('=== LEICA LOCUS TABLE: idx,f0,f1,f2,f3,temperature ===')
          if not (BASE <= p < BASE+len(b)):
              raise SystemExit(f'bad locus base 0x{p:08x}')
          for idx in range(31):
              row=[f64(p+idx*32+j*8) for j in range(4)]
              temp=f64(p+0x3e0+idx*8)
              print(f'{idx:02d},' + ','.join(f'{x:.17g}' for x in row) + f',{temp:.17g}')
          print()
          bp=u32(0x40004c98)
          print(f'BOUNDS_PTR=0x{bp:08x}')
          if BASE <= bp < BASE+len(b):
              print('=== BOUNDS WORDS ===')
              for idx in range(16):
                  a=bp+idx*4
                  print(f'{idx:02d} {a:08x} u32=0x{u32(a):08x} i32={i32(a)}')
          print()
          print('CLOSURE_RULE=No semantics are frozen beyond instruction/data evidence in this bounded trace.')
          PY
      - name: Commit v2.37 closure trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v237_colorspec_closure.txt
          git commit -m 'research: record v2.37 ColorSpec closure' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push