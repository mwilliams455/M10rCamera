name: M10-R v0.15 BvCMOS producer and source transition
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v015-bvcmos-producer-transition.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover CTRL
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace producer and transition
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/m10r-v015-bvcmos-producer-transition.txt
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          import struct,string
          b=Path('/tmp/sections/090_CTRL-System.bin').read_bytes(); base=0x08000000; pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(v): return pfx+v-base
          def read32(v):
            o=off(v)
            return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def dis(s,e): return [i for i in md.disasm(b[off(s):off(e)],s) if i.mnemonic!='.byte']
          allins=[i for i in md.disasm(b[pfx:],base) if i.mnemonic!='.byte']
          def dump(label,s,e,lits=True):
            print(f'\n=== {label} {s:#010x}..{e:#010x} ===')
            for i in dis(s,e):
              extra=''
              if lits and i.mnemonic=='ldr' and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                lv=((i.address+4)&~3)+i.operands[1].mem.disp; vv=read32(lv)
                extra=f' ; literal {lv:#010x} -> {vv:#010x}' if vv is not None else ''
              print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}{extra}')
          def callers(t):
            out=[]
            for i in allins:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==(t&~1): out.append(i.address)
            return out
          def contexts(t,pre=0x60,post=0xa0):
            cs=callers(t); print(f'\nCALLERS {t:#010x}: {[hex(x) for x in cs]}')
            for a in cs: dump('CALL_'+hex(a),max(base,a-pre),min(base+len(b)-pfx,a+post))
          def ascii_at(v,maxn=160):
            o=off(v)
            if not(0<=o<len(b)): return None
            out=[]
            for x in b[o:o+maxn]:
              if x==0: break
              if 32<=x<127: out.append(chr(x))
              else: return None
            return ''.join(out) if len(out)>=4 else None
          def string_refs(s,e):
            print(f'\n=== STRING-LIKE LITERALS {s:#x}..{e:#x} ===')
            seen=set()
            for i in dis(s,e):
              if i.mnemonic=='ldr' and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                lv=((i.address+4)&~3)+i.operands[1].mem.disp; vv=read32(lv)
                if vv is not None and vv not in seen:
                  st=ascii_at(vv)
                  if st: seen.add(vv); print(f'{i.address:#010x} -> {vv:#010x}: {st}')

          # BvCMOS setter writers all converge on 0x0800F1C0 for non-copy updates.
          dump('BVCMOS CONVERSION/PRODUCER HELPER',0x0800f100,0x0800f330)
          contexts(0x0800f1c0,0x100,0x160)
          string_refs(0x0800f000,0x0800fa00)

          # Enclosing live-view/CMOS update state machine and its upstream caller(s).
          dump('BVCMOS UPDATE STATE MACHINE',0x0800f760,0x0800f990)
          for t in [0x0800f760,0x0800f780,0x0800f7a0,0x0800f7c0,0x0800f7e0,0x0800f800]:
            cs=callers(t)
            if cs: print('possible-entry',hex(t),'callers',[hex(x) for x in cs])

          # Mode/state predicates used by final-Bv selector before choosing BvCMOS.
          dump('FINAL BV SELECTOR',0x0800d680,0x0800d870)
          for t in [0x080146f6,0x08001a38,0x080184d8,0x0800de58,0x08001884]:
            dump('PREDICATE_OR_HELPER_'+hex(t),t,min(t+0x100,base+len(b)-pfx))
            contexts(t,0x50,0x90)
          string_refs(0x0800d600,0x0800da00)

          # Find likely function prologue immediately preceding known update block.
          print('\n=== PUSH PROLOGUES 0x0800F600..0x0800F900 ===')
          for i in dis(0x0800f600,0x0800f900):
            if i.mnemonic.startswith('push'): print(f'{i.address:#010x}: {i.mnemonic} {i.op_str}')

          # Setter/getter xrefs recapped.
          contexts(0x08011d82,0x60,0xa0)
          contexts(0x08011da8,0x60,0xa0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v015-bvcmos-producer-transition
          path: /tmp/m10r-v015-bvcmos-producer-transition.txt
          if-no-files-found: error
