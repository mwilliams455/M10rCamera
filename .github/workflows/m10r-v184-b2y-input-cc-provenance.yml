name: M10-R v1.84 B2Y input CC provenance
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v184-b2y-input-cc-provenance.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y input structure and CC provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v184_b2y_input_cc_provenance.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return P+a-BASE
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          allins=list(md.disasm(b[P:],BASE))
          print('M10-R v1.84 B2Y INPUT CC PROVENANCE')
          print('\n=== exact input->stack copy 0x42152350..0x42152450 ===')
          for i in allins:
            if 0x42152350<=i.address<0x42152450:print(fmt(i))
          print('\n=== callers of 0x4215220c ===')
          callers=[]
          for i in allins:
            if call(i)==0x4215220c:
              callers.append(i.address);print(fmt(i))
          print('\n=== caller neighborhoods ===')
          for ca in callers:
            print('\n-- caller',hex(ca),'--')
            for i in allins:
              if ca-0x180<=i.address<=ca+0x80:print(fmt(i))
          print('\n=== all refs to rendered CC globals ===')
          for g in (0x408fe130,0x408fe15c):
            print('\nGLOBAL',hex(g))
            for i in allins:
              q=lit(i)
              if q and q[1]==g: print(fmt(i))
          print('\n=== refs to 0x4215220c caller-function region and nearby global CC refs ===')
          for i in allins:
            q=lit(i)
            if q and q[1] in (0x408fe130,0x408fe15c) and 0x42140000<=i.address<=0x42170000:print(fmt(i))
          print('\nTARGET: map input r4 offsets +0xF4..+0x14C to stack B2Y object and identify caller/producers of the input structure, especially any direct copy/use of 0x408FE130/0x408FE15C.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v184_b2y_input_cc_provenance.txt
          git commit -m 'research: record v1.84 B2Y input CC provenance' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push