name: M10-R Y_BLEND CROSSMODEL1A

on:
  push:
    branches: [m10r-yblend-crossmodel1a]
    paths:
      - '.github/workflows/m10r-yblend-crossmodel1a.yml'
      - 'tools/m10r_yblend_crossfirmware1a.py'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned disassembly and emulation dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3

      - name: Build verified Leica M10-family unpacker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker)
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack

      - name: Download M10-R and M10 Monochrom firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fw
          curl -L --fail --retry 3 --retry-delay 2             'https://reddotforum.com/Firmware_files/M10-R-20.20.47.37-Customer.FW'             -o /tmp/fw/M10R-20.20.47.37.FW
          curl -L --fail --retry 3 --retry-delay 2             'https://leica-camera.com/sites/default/files/M10-M-2.12.8.0-SYSTEM_0.FW'             -o /tmp/fw/M10M-2.12.8.0.FW
          curl -L --fail --retry 3 --retry-delay 2             'https://leica-camera.com/sites/default/files/M10-M-3.21.2.50-Customer_0.FW'             -o /tmp/fw/M10M-3.21.2.50.FW
          sha256sum /tmp/fw/* | tee /tmp/fw/firmware_sha256.txt

      - name: Decode and discover M10-family B2Y calibration layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crossmodel1a_results
          for SPEC in \
            'M10R-20.20.47.37|/tmp/fw/M10R-20.20.47.37.FW' \
            'M10M-2.12.8.0|/tmp/fw/M10M-2.12.8.0.FW' \
            'M10M-3.21.2.50|/tmp/fw/M10M-3.21.2.50.FW'
          do
            LABEL="${SPEC%%|*}"
            FW="${SPEC#*|}"
            cp "$FW" /tmp/M10-R.FW
            rm -f /tmp/M10R_unpacked.bin
            /tmp/unpack >"/tmp/unpack_${LABEL}.txt"
            test -s /tmp/M10R_unpacked.bin
            SEC="/tmp/sec_${LABEL}"
            rm -rf "$SEC"
            python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin "$SEC" >"/tmp/sections_${LABEL}.txt"
            cp "$SEC/sections.csv" "crossmodel1a_results/${LABEL}_sections.csv"
            python3 - "$SEC/sections.csv" "crossmodel1a_results/${LABEL}_b2y_candidates.txt" <<'PY'
          import csv,sys
          src,out=sys.argv[1:3]
          rows=list(csv.DictReader(open(src,encoding='utf-8')))
          keys=('b2y','calib','img calibration','ycc','yc_')
          hits=[r for r in rows if any(k in (r['name']+' '+r['file']).lower() for k in keys)]
          with open(out,'w',encoding='utf-8') as f:
              for r in hits:
                  f.write('|'.join([r['index'],r['name'],r['size'],r['kind'],r['image_base'],r['file']])+'\n')
          print(out, 'hits', len(hits))
          PY
            FW_SHA="$(sha256sum "$FW" | awk '{print $1}')"
            DEC_SHA="$(sha256sum /tmp/M10R_unpacked.bin | awk '{print $1}')"
            printf '%s %s %s\n' "$LABEL" "$FW_SHA" "$DEC_SHA" >> crossmodel1a_results/decoded_hashes.txt
            if python3 tools/m10r_yblend_crossfirmware1a.py "$SEC" "$GITHUB_WORKSPACE" \
              --version "$LABEL" --firmware-sha256 "$FW_SHA" --decoded-sha256 "$DEC_SHA" \
              --out "crossmodel1a_results/${LABEL}.json" \
              > "crossmodel1a_results/${LABEL}.stdout.txt" 2>"crossmodel1a_results/${LABEL}.stderr.txt"
            then
              echo "$LABEL ANALYZED" >> crossmodel1a_results/status.txt
            else
              echo "$LABEL B2Y_LAYOUT_NOT_MATCHED" >> crossmodel1a_results/status.txt
            fi
          done
          cp /tmp/fw/firmware_sha256.txt crossmodel1a_results/
          cat crossmodel1a_results/status.txt
          git rev-parse HEAD > crossmodel1a_results/source_commit.txt

      - name: Summarize and assert cross-model constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          labels=["M10R-20.20.47.37","M10M-2.12.8.0","M10M-3.21.2.50"]
          rows={k:json.loads(Path(f"crossmodel1a_results/{k}.json").read_text()) for k in labels}
          def all_same(vals): return len({json.dumps(v,sort_keys=True) for v in vals})==1
          summary={
            "schema":"M10R_YBLEND_CROSSMODEL1A_SUMMARY_V1",
            "labels":labels,
            "record0d_equal_all":all_same([x["record_0x0d"]["u32"] for x in rows.values()]),
            "record0c_equal_all":all_same([x["record_0x0c"]["u32"] for x in rows.values()]),
            "sam7_equal_all":len({x["sections"]["sam7_sha256"] for x in rows.values()})==1,
            "driver_bytes_equal_all":len({x["yblend_selector_driver"]["driver_first_0xf0_sha256"] for x in rows.values()})==1,
            "driver_execution_equal_all":all_same([x["yblend_selector_driver"]["original_thumb_execution"] for x in rows.values()]),
            "b2y_equal_all":len({x["sections"]["b2y_sha256"] for x in rows.values()})==1,
            "monochrom_b2y_equal_between_versions":
              rows["M10M-2.12.8.0"]["sections"]["b2y_sha256"]==rows["M10M-3.21.2.50"]["sections"]["b2y_sha256"],
            "m10r_vs_monochrom_b2y_equal":
              rows["M10R-20.20.47.37"]["sections"]["b2y_sha256"]==rows["M10M-3.21.2.50"]["sections"]["b2y_sha256"],
            "items":{k:{
              "firmware_sha256":v["firmware_sha256"],
              "decoded_sha256":v["decoded_sha256"],
              "b2y_file":v["sections"]["b2y_file"],
              "b2y_identification":v["sections"]["b2y_identification"],
              "b2y_sha256":v["sections"]["b2y_sha256"],
              "img_sha256":v["sections"]["img_sha256"],
              "sam7_sha256":v["sections"]["sam7_sha256"],
              "record0d":v["record_0x0d"]["u32"],
              "record0d_sha256":v["record_0x0d"]["raw_sha256"],
              "record0c_sha256":v["record_0x0c"]["raw_sha256"],
              "driver_sha256":v["yblend_selector_driver"]["driver_first_0xf0_sha256"],
              "driver_execution":v["yblend_selector_driver"]["original_thumb_execution"],
            } for k,v in rows.items()}
          }
          assert summary["record0d_equal_all"] is True
          assert summary["record0c_equal_all"] is True
          assert summary["sam7_equal_all"] is True
          assert summary["driver_bytes_equal_all"] is True
          assert summary["driver_execution_equal_all"] is True
          assert summary["b2y_equal_all"] is False
          assert summary["monochrom_b2y_equal_between_versions"] is False
          assert summary["m10r_vs_monochrom_b2y_equal"] is False
          Path("crossmodel1a_results/summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-CROSSMODEL1A-RESULTS
          path: crossmodel1a_results/
          retention-days: 90
          if-no-files-found: error
