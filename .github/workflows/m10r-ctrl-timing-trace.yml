name: M10-R CTRL timing trace

on:
  pull_request:
    paths:
      - '.m10r-ctrl-timing-trigger'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified firmware and trace timing graph
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <string>
          #include <vector>
          using namespace std;
          static uint32_t u32(const vector<uint8_t>& b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);}
          struct BR{const uint8_t* p; size_t n,bit=0; int get(){if(bit>=n*8) throw runtime_error("eof"); int v=(p[bit>>3]>>(7-(bit&7)))&1; ++bit; return v;}};
          static int cat(BR& r){int a=r.get(); if(!a)return r.get()?7:6; int b=r.get(); if(!b)return r.get()?5:1; int c=r.get(); if(!c)return r.get()?2:0; int d=r.get(); if(!d)return 4; return r.get()?8:3;}
          int main(){ifstream f("/tmp/M10-R.FW",ios::binary); vector<uint8_t> fw((istreambuf_iterator<char>(f)),{}); const size_t C=0x38; uint32_t h=u32(fw,C+8), expected=u32(fw,C+0x10); const uint8_t* tr=&fw[C+0x54]; vector<uint8_t> out; out.reserve(expected); size_t st=C+h; for(int i=0;i<8;i++){size_t e=st+i*16; uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12); BR br{&fw[C+ro],ps}; for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0; for(int z=0;z<k;z++)x=(x<<1)|br.get(); if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1); out.push_back(tr[v+128]);}} if(out.size()!=expected)return 3; ofstream o("/tmp/M10R_unpacked.bin",ios::binary); o.write((char*)out.data(),out.size());}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/m10r_sections >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          ctrl=Path('/tmp/m10r_sections/090_CTRL-System.bin').read_bytes(); img=Path('/tmp/m10r_sections/092_IMG-System.bin').read_bytes()
          def u16(b,o): return struct.unpack_from('<H',b,o)[0]
          def u32(b,o): return struct.unpack_from('<I',b,o)[0]
          def bl_target(addr,h1,h2):
              S=(h1>>10)&1; i10=h1&0x3ff; J1=(h2>>13)&1; J2=(h2>>11)&1; i11=h2&0x7ff
              I1=(~(J1^S))&1; I2=(~(J2^S))&1
              imm=(S<<24)|(I1<<23)|(I2<<22)|(i10<<12)|(i11<<1)
              if S: imm-=1<<25
              return (addr+4+imm)&0xffffffff
          def callers(label,b,base,target,prefix=4):
              hits=[]
              for off in range(prefix,len(b)-3,2):
                  h1=u16(b,off); h2=u16(b,off+2)
                  if (h1&0xf800)==0xf000 and (h2&0xd000)==0xd000:
                      a=base+off-prefix
                      if bl_target(a,h1,h2)==target: hits.append(a)
              print('CALLERS',label,hex(target),' '.join(hex(x) for x in hits),'count',len(hits))
              for a in hits:
                  o=prefix+a-base; print(' CALLSITE',hex(a),b[max(prefix,o-12):min(len(b),o+16)].hex())
          def dump(label,b,base,start,end,prefix=4):
              a=prefix+start-base; z=prefix+end-base; q=b[a:z]
              print('RANGE',label,hex(start),hex(end),len(q))
              for k in range(0,len(q),32): print(f'{start+k:08x}:',q[k:k+32].hex())
          print('HASH CTRL',hashlib.sha256(ctrl).hexdigest(),'IMG',hashlib.sha256(img).hexdigest())
          for label,t in [('build_calc',0x0800d91c),('calculator',0x080203b4),('post_update',0x0800dc4a),('event_send',0x0801cf26),('event_ready',0x08011238)]: callers(label,ctrl,0x08000000,t)
          dump('CTRL_EVENT_READY',ctrl,0x08000000,0x080111e0,0x08011290)
          dump('CTRL_EVENT_SEND',ctrl,0x08000000,0x0801cea0,0x0801d080)
          dump('IMG_EVENT_PRODUCER',img,0x42000000,0x421bc940,0x421bca80)
          dump('IMG_EXPOSURE_PREP',img,0x42000000,0x421bf1c0,0x421bf2c0)
          for label,t in [('img_event_producer',0x421bc9e8),('bstm_dispatch',0x420a274c),('bstm_child',0x420a2840)]: callers(label,img,0x42000000,t)
          print('AE_LITERAL_TABLE')
          for va in range(0x421caab0,0x421caae0,4): print(hex(va),hex(u32(img,4+va-0x42000000)))
          print('D6_TRANSITION_CANDIDATES')
          bias=0x91078
          n=0
          for off in range(4,len(img)-16,4):
              if u16(img,off)!=0xd6: continue
              if u16(img,off+2)!=0: continue
              g,a,t=struct.unpack_from('<III',img,off+4)
              plausible=lambda x: x==0 or 0x40000000<=x<0x43000000
              if not (plausible(g) and plausible(a) and plausible(t)): continue
              foff=off
              rva=0x40000000+(foff-bias)
              print('D6REC file',hex(foff),'runtime_guess',hex(rva),'guard',hex(g),'action',hex(a),'target',hex(t))
              n+=1
          print('D6REC count',n)
          PY
