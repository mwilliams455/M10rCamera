name: M10-R v1.72 live B2Y data plane
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v172-b2y-live-data-plane.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace live B2Y programmer sources and MMIO
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v172_b2y_live_data_plane.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            oo=ops(i)
            if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
          def lit(i):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>1 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+oo[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def function_summary(a,z,name):
            W=dis(a,z); print(f'\n=== {name} {a:#x}..{z:#x} ===')
            lits=[];calls=[];back=[];r4mem=[]
            for i in W:
              q=lit(i)
              if q and q[1] not in lits:lits.append(q[1])
              c=call(i)
              if c is not None and c not in calls:calls.append(c)
              try:
                for o in i.operands:
                  if o.type==ARM_OP_MEM and i.reg_name(o.mem.base)=='r4':r4mem.append((i.address,i.mnemonic,o.mem.disp,i.op_str))
              except:pass
              if i.mnemonic.startswith('b') and i.operands and i.operands[0].type==ARM_OP_IMM and i.operands[0].imm<i.address:back.append((i.address,i.operands[0].imm))
            print('LITERALS', [hex(x) for x in lits])
            print('RAM_LITERALS', [hex(x) for x in lits if 0x40000000<=x<0x44000000])
            print('MMIO_LITERALS', [hex(x) for x in lits if 0x20000000<=x<0x21000000])
            print('CALLS', [hex(x) for x in calls])
            print('BACK_BRANCHES', [(hex(a),hex(t)) for a,t in back])
            print('R4_MEMORY_ACCESSES')
            for x in r4mem:print(hex(x[0]),x[1],hex(x[2]),x[3])
            print('MMIO/RAM literal neighborhoods')
            for n,i in enumerate(W):
              q=lit(i)
              if q and (0x20000000<=q[1]<0x21000000 or q[1] in (0x408fe124,0x408fe130,0x408fe15c)):
                print(f'-- {i.address:#x} -> {q[1]:#x} --')
                for x in W[max(0,n-8):min(len(W),n+20)]:print(fmt(x))
          function_summary(0x42152f8c,0x42153388,'B2Y programmer A')
          function_summary(0x421536bc,0x42153900,'B2Y programmer B')
          print('\n=== relevant strings B2Y/TONE/GAMMA/CURVE/LUT ===')
          strings=[]
          for m in re.finditer(rb'[ -~]{4,}\x00',b):
            s=m.group()[:-1].decode('ascii','replace')
            if any(k in s.upper() for k in ('B2Y','TONE','GAMMA','CURVE','LUT')):
              strings.append((BASE+m.start()-PFX,s))
          for a,s in strings[:300]:print(hex(a),repr(s))
          print('\n=== B2Y.bin string xrefs in selected IMG regions ===')
          targets={a for a,s in strings if 'B2Y.BIN' in s.upper()}
          for a,z in ((0x42000000,0x420b0000),(0x42150000,0x42170000)):
            W=dis(a,z)
            for i in W:
              q=lit(i)
              if q and q[1] in targets:print(fmt(i))
          print('\nTARGET: identify live B2Y tuning blocks beyond rendered CC matrices; locate any curve/LUT upload or B2Y.bin-derived object fields that reach MMIO.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v172_b2y_live_data_plane.txt
          git commit -m 'research: record v1.72 live B2Y data-plane trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push