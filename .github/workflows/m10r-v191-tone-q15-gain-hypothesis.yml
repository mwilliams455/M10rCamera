name: M10-R v1.91 tone Q15 gain hypothesis
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v191-tone-q15-gain-hypothesis.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tone Q15 gain and x>>1 indexing hypothesis
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v191_tone_q15_gain_hypothesis.txt
          from pathlib import Path
          import struct,statistics,collections,math
          D=Path('/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin').read_bytes();P=4
          u32=lambda o:struct.unpack_from('<I',D,o)[0]
          count=u32(P+8);rec0=P+0x10;stride=0xa90;base=rec0+count*stride
          recs=[]
          for i in range(count):
            o=rec0+i*stride;recs.append((i,u32(o),u32(o+4),u32(o+8),base+u32(o+4)))
          def allid(rid):return [r for r in recs if r[1]==rid]
          ctrl=allid(8)[0]; cb=D[ctrl[4]:ctrl[4]+ctrl[3]]; cv=list(struct.unpack('<%dI'%(len(cb)//4),cb))
          code=cv[2]; N={0:0x5000,1:0x2800}.get(code,0x1400); domain=0x5000; stride_x=domain//N
          print('M10-R v1.91 TONE Q15 GAIN HYPOTHESIS')
          print('descriptor_size_code',code,'active_entries',N,'domain_candidate',domain,'stride_candidate',stride_x)
          print('descriptor key fields +0c/+14',cv[3],cv[5],'TBL1 load condition current',cv[5]==0 and cv[3]==1)
          for occ,name in enumerate(('LOW','MEDIUM','HIGH')):
            r=allid(0x19)[occ]; vals=list(struct.unpack('<%dI'%N,D[r[4]:r[4]+N*4]))
            print(f'\n=== {name} ===')
            print('gain_range_Q15',min(vals),max(vals),'normalized',min(vals)/32768,max(vals)/32768,'identity_count',vals.count(0x8000))
            # Candidate Q15 transfer over x=0..0x4fff, table index x>>code for code 0/1/2.
            ys_trunc=[];ys_round=[]
            for x in range(domain):
              idx=min(N-1,x//stride_x); g=vals[idx]
              ys_trunc.append((x*g)>>15)
              ys_round.append((x*g+0x4000)>>15)
            for nm,y in [('trunc',ys_trunc),('round',ys_round)]:
              ds=[y[i+1]-y[i] for i in range(len(y)-1)]
              diff=[y[i]-i for i in range(len(y))]
              crossings=[]
              for i in range(1,len(diff)):
                if (diff[i-1]<0<=diff[i]) or (diff[i-1]>0>=diff[i]):crossings.append(i)
              print(nm,'range',min(y),max(y),'monotone',all(d>=0 for d in ds),'step_range',min(ds),max(ds),'endpoint',y[0],y[-1],
                    'delta_range',min(diff),max(diff),'crossings_first',crossings[:20],'crossing_count',len(crossings))
              print(nm,'samples',[(x,y[x],y[x]-x,vals[min(N-1,x//stride_x)]) for x in (0,256,512,1024,2048,4096,6144,8192,10240,12288,14336,16384,18432,20479)])
            # gain crosses unity and extrema locations
            below=[i for i,v in enumerate(vals) if v<0x8000];above=[i for i,v in enumerate(vals) if v>0x8000]
            print('gain below_identity range', (min(below),max(below)) if below else None,'above_identity range',(min(above),max(above)) if above else None)
            imn=min(range(N),key=vals.__getitem__);imx=max(range(N),key=vals.__getitem__)
            print('gain_min_at',imn,vals[imn],'x~',imn*stride_x,'gain_max_at',imx,vals[imx],'x~',imx*stride_x)
            # Assess direct-output interpretation: LOW would be constant 0x8000.
            print('direct_output_low_or_curve_unique',len(set(vals)))
          print('\n=== resolution-code arithmetic ===')
          for c,n in [(0,0x5000),(1,0x2800),(2,0x1400)]:
            print('code',c,'entries',n,'bytes',hex(n*4),'domain/entries',domain/n,'exact_shift_relation',n==(domain>>c))
          print('\nTARGET: test whether tone data is consistent with Q15 multiplicative gain over a 0x5000-domain indexed at x>>resolution_code. Functional consistency is evidence, but distinguish it from direct hardware arithmetic proof.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v191_tone_q15_gain_hypothesis.txt
          git commit -m 'research: record v1.91 tone Q15 gain hypothesis' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push