name: M10-R v1.96b fast contrast pointer provenance
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v196b-contrast-pointer-provenance-fast.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y input pointer and contrast provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v196b_contrast_pointer_provenance_fast.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          def off(a): return P+a-BASE
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            try:
              o=ops(i)
              if i.mnemonic in ('bl','blx') and o and o[0].type==ARM_OP_IMM:return o[0].imm&~1
            except:pass
          def lit(i):
            try:
              o=ops(i)
              if i.mnemonic.startswith('ldr') and len(o)>=2 and o[1].type==ARM_OP_MEM and o[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+o[1].mem.disp;fo=off(la)
                if 0<=fo<=len(b)-4:return la,struct.unpack_from('<I',b,fo)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def dump(a,z):
            for i in md.disasm(b[off(a):off(z)],a):print(fmt(i))
          def memhit(i,base=None,disp=None):
            try:
              for op in ops(i):
                if op.type==ARM_OP_MEM and (base is None or op.mem.base==base) and (disp is None or op.mem.disp==disp):return True
            except:pass
            return False
          print('M10-R v1.96b FAST CONTRAST POINTER PROVENANCE')
          print('\n=== pre-owner helper 0x42151f28..0x4215220c ===')
          dump(0x42151f28,0x4215220c)
          print('\n=== combined mode6/mode7 caller window 0x42169d80..0x4216a340 ===')
          dump(0x42169d80,0x4216a340)
          print('\n=== stack-slot references to 0x1ac and 0x1a8 in caller window ===')
          ins=list(md.disasm(b[off(0x42169d80):off(0x4216a340)],0x42169d80))
          for target in (0x1ac,0x1a8):
            print(f'\n-- SP+{target:#x} --')
            for k,i in enumerate(ins):
              try:
                if any(op.type==ARM_OP_MEM and op.mem.base==ARM_REG_SP and op.mem.disp==target for op in ops(i)):
                  print(f'\nHIT {fmt(i)}')
                  for j in ins[max(0,k-12):min(len(ins),k+13)]:print(fmt(j))
              except:pass
          print('\n=== candidate memcpy/memset calls before owner calls ===')
          for k,i in enumerate(ins):
            c=call(i)
            if c in (0x4204f2ec,0x4204efd4,0x4204f1f4):
              print(f'\nCALL {c:#x} at {i.address:#x}')
              for j in ins[max(0,k-8):k+3]:print(fmt(j))
          print('\n=== immediate writes of contrast enums 1/2/3 near pointer-producing code ===')
          for k,i in enumerate(ins):
            o=ops(i)
            if i.mnemonic.startswith('mov') and len(o)>=2 and o[1].type==ARM_OP_IMM and o[1].imm in (1,2,3):
              # only print if a store occurs within next 6 instructions
              nxt=ins[k+1:min(len(ins),k+7)]
              if any(j.mnemonic.startswith('str') for j in nxt):
                print(f'\nIMM {fmt(i)}')
                for j in ins[max(0,k-3):min(len(ins),k+8)]:print(fmt(j))
          print('\nTARGET: identify the exact source of pointers saved at SP+0x1AC and SP+0x1A8, determine whether 0x42151F28 mutates input+0xAC, and locate any bounded initialization/copy of contrast enum 1/2/3 feeding 0x4215220C.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v196b_contrast_pointer_provenance_fast.txt
          git commit -m 'research: record v1.96b fast contrast pointer provenance' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push