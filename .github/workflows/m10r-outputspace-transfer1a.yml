name: M10-R output-space transfer 1A
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1a.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CA9 output-space side effects
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1A.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC

          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True
          def off(a): return PFX+a-BASE
          def valid(a): return BASE <= a < BASE+len(b)-PFX
          def dis(a,z):
            a=max(BASE,a); z=min(BASE+len(b)-PFX,z)
            return list(md.disasm(b[off(a):off(z)],a)) if z>a else []
          def astr(v,limit=220):
            if not valid(v): return None
            o=off(v); e=b.find(b'\0',o,min(len(b),o+limit))
            if e<=o:return None
            q=b[o:e]
            if len(q)>=4 and all(0x20<=x<=0x7e for x in q): return q.decode('ascii','replace')
            return None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except Exception: pass
            return None
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                return ((i.address+4)&~3)+i.operands[1].imm
            except Exception: pass
            return None
          def direct_target(i):
            if i.mnemonic in ('bl','blx','b','beq','bne','bhi','bls','bgt','blt','bge','ble') and i.operands and i.operands[0].type==ARM_OP_IMM:
              return i.operands[0].imm
            return None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {hex(q[0])}->{hex(q[1])}'
              st=astr(q[1]);
              if st:s+=f' STRING={st!r}'
            a=adr(i)
            if a:
              s+=f' ; ADR {hex(a)}'; st=astr(a)
              if st:s+=f' STRING={st!r}'
            t=direct_target(i)
            if t is not None and i.mnemonic in ('bl','blx'): s+=f' ; CALL {hex(t)}'
            return s

          print('M10-R OUTPUTSPACE TRANSFER1A')
          print('Scope: bounded CA9 colour-management trace; no global Capstone scan.')
          print('Known semantic mapping from prior trace: CA9 0=sRGB, 1=AdobeRGB, 2=ECI-RGB.')
          print('Known B2Y controls: DG 0x420d15e8; interpolation gamma 0x420d25a4; Tone helper 0x420d3c1c; de-knee helper region 0x420d1170.')

          # 1) Locate only high-value strings as raw data first.
          terms=('B2Y_TF_CA9_CM.bin','B2Y_CC0_CA9_CM.bin','color space','Color Space','ColorSpace','sRGB','AdobeRGB','Adobe RGB','ECI','YCbCr','YCC','JPEG','profile','gamma','transfer')
          strings=[]
          p=0
          while p<len(b):
            if 0x20<=b[p]<=0x7e:
              e=p
              while e<len(b) and 0x20<=b[e]<=0x7e:e+=1
              if e-p>=4:
                s=b[p:e].decode('ascii','replace')
                if any(t.lower() in s.lower() for t in terms): strings.append((BASE+p-PFX,s))
              p=e+1
            else:p+=1
          print('\n=== HIGH-VALUE STRINGS ===')
          for a,s in strings: print(hex(a),repr(s))

          # 2) Disassemble only CA9 CM neighbourhood and match direct ADR/literal references to those strings.
          LO,HI=0x420a2000,0x420a5200
          ins=dis(LO,HI); byaddr={i.address:i for i in ins}; saddrs={a for a,_ in strings}
          refs=[]
          for idx,i in enumerate(ins):
            vals=[]
            q=lit(i)
            if q: vals.append(q[1])
            a=adr(i)
            if a: vals.append(a)
            if any(v in saddrs for v in vals): refs.append((idx,i,vals))
          print('\n=== CA9 STRING XREF NEIGHBOURHOODS 0x420A2000..0x420A5200 ===')
          seen=set()
          for idx,i,vals in refs:
            key=i.address
            if key in seen:continue
            seen.add(key)
            print(f'\n-- xref @{hex(i.address)} values={[hex(v) for v in vals]} --')
            for j in range(max(0,idx-22),min(len(ins),idx+42)): print(fmt(ins[j]))

          # 3) Recover likely function starts containing high-value xrefs, then enumerate calls, stores, mode compares.
          prologues=[]
          for idx,_,_ in refs:
            start=None
            for j in range(idx,max(-1,idx-220),-1):
              ii=ins[j]
              if ii.mnemonic=='push' and 'lr' in ii.op_str:
                start=ii.address;break
            if start is not None: prologues.append(start)
          prologues=sorted(set(prologues))
          print('\n=== CANDIDATE OWNER FUNCTIONS ===')
          for s in prologues: print(hex(s))
          KNOWN={0x420d15e8:'DG_CONTROL',0x420d25a4:'INTERP_GAMMA',0x420d3c1c:'TONE_HELPER',0x420d1170:'DEKNEE_REGION'}
          for s in prologues:
            # Bound each owner to next push-prologue or max 0x700 bytes.
            nxt=min([x for x in prologues if x>s]+[s+0x700])
            owner=[i for i in ins if s<=i.address<nxt]
            print(f'\n=== OWNER {hex(s)}..{hex(nxt)} SIDE-EFFECT SURFACE ===')
            for i in owner:
              t=direct_target(i)
              interesting=False; note=''
              if i.mnemonic.startswith('str'): interesting=True
              if i.mnemonic.startswith('cmp') and any(f'#{n}' in i.op_str for n in ('0','1','2','3')): interesting=True
              if i.mnemonic in ('bl','blx'):
                interesting=True
                if t in KNOWN: note=' ***'+KNOWN[t]+'***'
              q=lit(i)
              if q and (0x20000000<=q[1]<0x21000000 or 0x40800000<=q[1]<0x40900000 or q[1] in saddrs): interesting=True
              if interesting: print(fmt(i)+note)

          # 4) Explicitly test whether CA9 bounded region directly calls known nonlinear programmers.
          print('\n=== DIRECT REACHABILITY TO KNOWN B2Y NONLINEAR PROGRAMMERS ===')
          for target,name in KNOWN.items():
            hits=[]
            for i in ins:
              if i.mnemonic in ('bl','blx') and direct_target(i)==target:hits.append(i.address)
            print(name,hex(target),'direct_calls=',','.join(hex(x) for x in hits) if hits else 'NONE_IN_BOUNDED_CA9_REGION')

          # 5) Find callers of candidate owners within the same bounded CA9 region and dump their local mode branches.
          print('\n=== CALLERS OF CANDIDATE OWNERS ===')
          for s in prologues:
            callers=[]
            for idx,i in enumerate(ins):
              if i.mnemonic in ('bl','blx') and direct_target(i) in (s,s|1):callers.append(idx)
            print(f'\nowner {hex(s)} callers={[hex(ins[x].address) for x in callers]}')
            for idx in callers:
              print(f'-- caller neighbourhood @{hex(ins[idx].address)} --')
              for j in range(max(0,idx-30),min(len(ins),idx+34)): print(fmt(ins[j]))

          # 6) Raw pointer-pool occurrences for key TF/CC0 strings, no disassembly outside bounded CA9 area.
          print('\n=== RAW POINTER POOLS FOR TF / CC0 ===')
          for a,s in strings:
            if s not in ('B2Y_TF_CA9_CM.bin','B2Y_CC0_CA9_CM.bin'):continue
            pat=struct.pack('<I',a); p=0; hits=[]
            while True:
              p=b.find(pat,p)
              if p<0:break
              hits.append(BASE+p-PFX);p+=4
            print(repr(s),hex(a),'pointer_pools=',','.join(hex(x) for x in hits) if hits else 'NONE')

          print('\n=== DECISION GATE ===')
          print('Do not alter renderer. Use this report to identify exact selector/owner function, then trace one hop only if mode-specific side effects remain unresolved.')
          PY
      - name: Commit textual result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1A.txt
          git commit -m 'research: record CA9 output-space transfer trace 1A' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
