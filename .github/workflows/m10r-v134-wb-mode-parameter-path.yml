name: M10-R v1.34 WB mode parameter path
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v134-wb-mode-parameter-path.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace IMG WB parameter fill and CA9 WB entry
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v134_wb_mode_parameter_path.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          def setup(path,base,mode,pfx=4):
            b=Path(path).read_bytes();md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
            return b,md,base,pfx
          ib,it,IB,IP=setup('/tmp/sections/092_IMG-System.bin',0x42000000,CS_MODE_THUMB)
          cb,ca,CB,CP=setup('/tmp/sections/099_IMG-CA9_System.bin',0x40000000,CS_MODE_ARM)
          def helpers(b,md,BASE,PFX,isarm):
            def off(a):return PFX+a-BASE
            def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
            def cstr(a):
              o=off(a)
              if not 0<=o<len(b):return None
              e=b.find(b'\0',o,min(len(b),o+320));q=b[o:e]
              return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
            def lit(i):
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  pc=i.address+(8 if isarm else 4);la=(pc if isarm else (pc&~3))+i.operands[1].mem.disp;o=off(la)
                  if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
              except:pass
            def fmt(i):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
              q=lit(i)
              if q:
                s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
                z=cstr(q[1])
                if z:s+=f' STRING={z!r}'
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
              return s
            return off,dis,cstr,lit,fmt
          io,idis,ics,ilit,ifmt=helpers(ib,it,IB,IP,False)
          co,cdis,ccs,clit,cfmt=helpers(cb,ca,CB,CP,True)
          print('M10-R v1.34 WB MODE / PARAMETER PATH')
          print('\n=== IMG ca9_wb_fill_parameter 0x420A82F0..0x420A8750 ===')
          for i in idis(0x420a82f0,0x420a8750):print(ifmt(i))
          print('\n=== IMG WB-RELATED STRINGS NEAR FUNCTION ===')
          # printable runs in local code/data neighborhood
          o0=io(0x420a82f0);o1=io(0x420a8900);d=ib[o0:o1];p=0
          while p<len(d):
            if 0x20<=d[p]<=0x7e:
              q=p
              while q<len(d) and 0x20<=d[q]<=0x7e:q+=1
              if q-p>=5:print(hex(0x420a82f0+p),repr(d[p:q].decode('ascii','replace')))
              p=q+1
            else:p+=1
          print('\n=== CA9 WB OWNER 0x4000B280..0x4000B448 ===')
          for i in cdis(0x4000b280,0x4000b448):print(cfmt(i))
          print('\n=== CA9 WB POST-STRING / SECONDARY 0x4000B480..0x4000B640 ===')
          for i in cdis(0x4000b480,0x4000b640):print(cfmt(i))
          print('\n=== WB OWNER PROLOGUES / DIRECT CALLERS ===')
          owners=[]
          for a,z in ((0x4000b280,0x4000b448),(0x4000b480,0x4000b640)):
            for i in cdis(a,z):
              if i.mnemonic=='push' and 'lr' in i.op_str and i.address not in owners:owners.append(i.address)
          print('owners',[hex(x) for x in owners])
          for i in cdis(0x40000000,0x40018000):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1) in owners:print(cfmt(i))
          print('\n=== TARGET ===')
          print('Identify WB mode/preset selectors and parameter fields without assigning UI names to numeric modes until strings or switch behavior prove them.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v134_wb_mode_parameter_path.txt
          git commit -m 'research: record v1.34 WB mode parameter path' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
