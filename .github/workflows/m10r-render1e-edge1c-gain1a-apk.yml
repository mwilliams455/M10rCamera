name: M10-R RENDER1E EDGE1C SCALE1A GAIN1A APK

on:
  push:
    branches:
      - m10r-render1e-gain1a-build
    paths:
      - '.github/workflows/m10r-render1e-edge1c-gain1a-apk.yml'
      - 'patches/fix-m10r-render1e-edge1c-gain1a.py'
  workflow_dispatch:

jobs:
  build-render1e-edge1c-gain1a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout M10-R repo
        uses: actions/checkout@v4

      - name: Verify patch syntax
        run: |
          set -euo pipefail
          python3 -m py_compile patches/apply-m10r-capture1-foundation.py
          python3 -m py_compile patches/apply-m10r-capture1b-renderer.py
          python3 -m py_compile patches/fix-m10r-capture1b-compile1.py
          python3 -m py_compile patches/fix-m10r-capture1b-opencv1.py
          python3 -m py_compile patches/fix-m10r-capture1b-compile2.py
          python3 -m py_compile patches/fix-m10r-capture1b-device1.py
          python3 -m py_compile patches/fix-m10r-capture1b-jpegsave1.py
          python3 -m py_compile patches/fix-m10r-capture1b-rgborder1a.py
          python3 -m py_compile patches/fix-m10r-capture1b-sourcecm1a.py
          python3 -m py_compile patches/fix-m10r-capture1b-tonedg1a.py
          python3 -m py_compile patches/fix-m10r-capture1b-tonedg1b.py
          python3 -m py_compile patches/fix-m10r-render1a-stability1.py
          python3 -m py_compile patches/fix-m10r-render1a-stability2.py
          python3 -m py_compile patches/fix-m10r-render1a-stability3-native1.py
          python3 -m py_compile patches/fix-m10r-render1b-look1a-yc1a.py
          python3 -m py_compile patches/fix-m10r-render1b-look1b-yc1b.py
          python3 -m py_compile patches/fix-m10r-render1c-edge1a.py
          python3 -m py_compile patches/fix-m10r-render1d-edge1b-scale1a.py
          python3 -m py_compile patches/fix-m10r-render1e-edge1c-gain1a.py
          python3 -m py_compile patches/verify-m10r-capture1b.py
          python3 -m py_compile tools/m10r_sections.py
          python3 -m py_compile tools/m10r_b2y_assets.py

      - name: Clone exact Photon baseline
        run: |
          set -euo pipefail
          PHOTON_SHA=f0e6425d2509fb8ab834d5d3af593183038b778c
          git clone --depth 1 --branch dev https://github.com/eszdman/PhotonCamera.git PhotonCamera
          git -C PhotonCamera fetch --depth 1 origin "$PHOTON_SHA"
          git -C PhotonCamera checkout --detach FETCH_HEAD
          test "$(git -C PhotonCamera rev-parse HEAD)" = "$PHOTON_SHA"
          git -C PhotonCamera rev-parse HEAD | tee PHOTON_UPSTREAM_COMMIT.txt

      - name: Extract exact M10-R B2Y assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          B2Y=/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin
          test -f "$B2Y"
          rm -rf /tmp/m10r_b2y_assets
          python3 tools/m10r_b2y_assets.py "$B2Y" /tmp/m10r_b2y_assets >/tmp/m10r_b2y_manifest.stdout.json
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/m10r_b2y_assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/m10r_b2y_assets/dg_expanded_u16le.bin' | sha256sum -c -

      - name: Apply frozen baseline, SCALE1A, and GAIN1A
        run: |
          set -euo pipefail
          B2Y=/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1-foundation.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/apply-m10r-capture1b-renderer.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-compile1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-opencv1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-compile2.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-device1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-jpegsave1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-rgborder1a.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/verify-m10r-capture1b.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-sourcecm1a.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-tonedg1a.py" "$GITHUB_WORKSPACE/PhotonCamera" /tmp/m10r_b2y_assets
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-capture1b-tonedg1b.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1a-stability1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1a-stability2.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1a-stability3-native1.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1b-look1a-yc1a.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1b-look1b-yc1b.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1c-edge1a.py" "$GITHUB_WORKSPACE/PhotonCamera"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1d-edge1b-scale1a.py" "$GITHUB_WORKSPACE/PhotonCamera" "$B2Y"
          python3 "$GITHUB_WORKSPACE/patches/fix-m10r-render1e-edge1c-gain1a.py" "$GITHUB_WORKSPACE/PhotonCamera" "$B2Y"

          R="$GITHUB_WORKSPACE/PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java"
          N="$GITHUB_WORKSPACE/PhotonCamera/app/src/main/cpp/m10rRender.cpp"
          grep -F "versionName '0.97-m10rcapture1b-rgborder1a-sourcecm1a-tonedg1b-stability3-native1-look1b-yc1b-render1e-edge1c-scale1a-gain1a'" "$GITHUB_WORKSPACE/PhotonCamera/app/build.gradle"
          grep -F 'renderLook", "RENDER1E_EDGE1C_SCALE1A_GAIN1A"' "$R"
          grep -F 'edgeScaleTableApplied", true' "$R"
          grep -F 'edgeHfRecordGainApplied", true' "$R"
          grep -F 'B2Y_record_0x0F_offset_0x118_10bit' "$R"
          grep -F 'value_over_256_Q8_GAIN_CANDIDATE' "$R"
          grep -F 'edgeHfRecordGainSemanticExactFirmwareParityClaimed", false' "$R"
          grep -F 'lowFrequencyEdgeApplied", false' "$R"
          grep -F 'textureEnhancementBlockEnabled", false' "$R"
          grep -F '160.0/256.0' "$N"
          grep -F '128.0/256.0' "$N"
          grep -F '80.0/256.0' "$N"
          grep -F '*synthGain*edgeScale*hfRecordGain' "$N"
          grep -F 'hdrEnabled", false' "$R"
          grep -F 'sourceFrameCount", 1' "$R"

          printf '%s\n' \
            'M10R_RENDER1E_EDGE1C_SCALE1A_GAIN1A' \
            'Base: photographically accepted RENDER1D EDGE1B SCALE1A' \
            'LOOK1B/YC1B and exact HighEdge Scale table frozen' \
            'Only photographic change: apply exact B2Y HighEdge +0x118 STILL/MEDIUM values as /256 Q8 gain candidate' \
            'ISO100/160=160/256; ISO200..640=128/256; ISO800+=80/256' \
            'v1.21 proves +0x118 is a 10-bit hardware field; v1.22 proves mode/sharpness/ISO dependence and HIGH about 1.6x MEDIUM' \
            '+0x11c is always 1023 across HighEdge records; semantic role not yet claimed' \
            'Inherited EDGE1A 450/1001 shaping remains unchanged and explicitly experimental for one-variable A/B' \
            'Low-frequency edge remains OFF; TEXTURE remains OFF' \
            'Single-frame, HDR disabled; 12MP/JPEG quality preserved' \
            > "$GITHUB_WORKSPACE/M10R_RENDER1E_EDGE1C_SCALE1A_GAIN1A_PROVENANCE.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build RENDER1E EDGE1C GAIN1A debug APK
        run: |
          set -o pipefail
          cd PhotonCamera
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M10R_RENDER1E_EDGE1C_GAIN1A_GRADLE.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-RENDER1E-EDGE1C-GAIN1A-buildlog
          path: M10R_RENDER1E_EDGE1C_GAIN1A_GRADLE.log
          if-no-files-found: ignore

      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: M10RCam-RENDER1E-EDGE1C-SCALE1A-GAIN1A-debug-apk
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            PHOTON_UPSTREAM_COMMIT.txt
            M10R_RENDER1E_EDGE1C_SCALE1A_GAIN1A_PROVENANCE.txt
            /tmp/m10r_b2y_assets/manifest.json
          if-no-files-found: error
