name: M10-R v1.47 B2Y CC register programmer
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v147-b2y-cc-register-programmer.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve B2Y rendered CC register programmer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v147_b2y_cc_register_programmer.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,limit=300):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+limit));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                a=((i.address+4)&~3)+i.operands[1].imm;return a,cstr(a)
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}';st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            a=adr(i)
            if a:s+=f' ; ADR_EFF {a[0]:#x}'+(f' STRING={a[1]!r}' if a[1] else '')
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.47 B2Y RENDERED CC REGISTER PROGRAMMER')
          for title,a,z in [
            ('programmer A',0x42152f8c,0x42153388),
            ('programmer B',0x421536bc,0x42153900),
            ('caller A',0x421615e0,0x421616d0),
            ('caller B',0x421619d0,0x42161aa8),
            ('consumer C',0x42161af0,0x42161d88),
            ('consumer D',0x42169adc,0x42169ec0)]:
            print(f'\n=== {title} {a:#x}..{z:#x} ===')
            for i in dis(a,z):print(fmt(i))
          print('\n=== concise CC0/CC1 data accesses in programmer A/B ===')
          for a,z in ((0x42152f8c,0x42153388),(0x421536bc,0x42153900)):
            print(f'-- {a:#x} --')
            for i in dis(a,z):
              q=lit(i)
              if (q and q[1] in (0x408fe130,0x408fe15c,0x20020080)) or re.search(r'\[r[56](?:,|\])',i.op_str) or (i.mnemonic.startswith('str') and ('0x20020080' in fmt(i) or '[r1' in i.op_str)):
                print(fmt(i))
          print('\n=== nearby B2Y semantic strings / pointer pools ===')
          for needle in (b'IMG: STILL B2Y Ch1',b'IMG: Still Link B2Y Ch1',b'IMG: LV_MAGNI B2Y LINK',b'IMG: LV_SLIVE B2Y LINK',b'IMG: B2Y END'):
            p=b.find(needle)
            if p<0:continue
            a=BASE+p-PFX;print(hex(a),repr(cstr(a)))
            pat=struct.pack('<I',a);q=0;hs=[]
            while True:
              q=b.find(pat,q)
              if q<0:break
              hs.append(BASE+q-PFX);q+=1
            print(' pools',[hex(x) for x in hs])
          print('\n=== MMIO base 0x20020080 literal pools and users near programmers ===')
          pat=struct.pack('<I',0x20020080);q=0;ps=[]
          while True:
            q=b.find(pat,q)
            if q<0:break
            ps.append(BASE+q-PFX);q+=1
          print([hex(x) for x in ps])
          for i in dis(0x42152000,0x42154000):
            q=lit(i)
            if q and q[1]==0x20020080:print(fmt(i))
          print('\n=== TARGET ===')
          print('Freeze whether both rendered CC records are programmed into B2Y MMIO and identify the register layout/order used by firmware.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v147_b2y_cc_register_programmer.txt
          git commit -m 'research: record v1.47 B2Y CC register programmer' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push