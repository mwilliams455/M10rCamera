name: M10-R v1.07 channel6 PWLSIZE decode
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v107-channel6-pwlsize-decode.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode channel6 switch and PWLSIZE arithmetic
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v107_channel6_pwlsize_decode.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN,CS_MODE_ARM
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          thumb=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);thumb.detail=True;thumb.skipdata=True
          arm=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);arm.detail=True;arm.skipdata=True
          def off(a):return PFX+a-BASE
          def u32a(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+200)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all((32<=ord(c)<127) or c in '\r\n\t' for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp;return a,u32a(a)
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q and q[1] is not None:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=cstr(q[1]);
              if st:s+=f' STRING={st!r}'
            return s
          def dump(md,lo,hi,title):
            print(f'\n=== {title} {lo:#x}..{hi:#x} ===')
            for i in md.disasm(b[off(lo):off(hi)],lo):
              if i.id:print(fmt(i))
          print('M10-R v1.07 CHANNEL-6 PWLSIZE DECODE')
          print('Known channel6 startup descriptor +0x08 = [0x408F0410]; mode 0x11 sets that global to 0x1B80 = 7040.')
          dump(thumb,0x4209f940,0x4209fa10,'SWITCH HELPER 0x4209F988')
          dump(thumb,0x420e05d0,0x420e0660,'PW_INIT SWITCH + SIZE ARITHMETIC')
          print('\nRAW BYTES 0x420E05E0..0x420E0600')
          raw=b[off(0x420e05e0):off(0x420e0600)]
          for k in range(0,len(raw),16):print(hex(0x420e05e0+k),raw[k:k+16].hex(' '))
          # math helpers can be Thumb or ARM veneer. Dump both interpretations around exact targets.
          for a,name in ((0x421e6648,'helper 421e6648'),(0x421e61d0,'helper 421e61d0'),(0x421e6050,'helper 421e6050'),(0x421e65a4,'helper 421e65a4')):
            dump(thumb,a,a+0x90,name+' THUMB')
          # Map inline switch table by emulating common __gnu_thumb1_case_uqi patterns after inspecting helper bytes.
          print('\n=== SWITCH TABLE CANDIDATE BYTES ===')
          for a in range(0x420e05e4,0x420e05fa,2):
            o=off(a);print(hex(a),b[o:o+2].hex(), 'u8s',list(b[o:o+2]))
          # Useful exact numeric coincidences.
          n=0x1b80
          print('\n=== NUMERIC FINGERPRINTS ===')
          print('mode11_value',n)
          print('22*16',22*16)
          print('7040/(22*16)',n//(22*16),'remainder',n%(22*16))
          print('2*7040',2*n,'/352=',2*n//352)
          print('12*7040',12*n,'/352=',12*n//352)
          print('3/2*7040',3*n//2,'/352=',3*n//2//352)
          print('\n=== DECISION ===')
          print('Determine channel6 branch through the inline switch and exact math helper semantics. Freeze a per-cell producer stride only if PWLSIZE or its source is demonstrably total 352-cell payload bytes, not merely an unrelated sensor/window dimension.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v107_channel6_pwlsize_decode.txt
          git commit -m 'research: record v1.07 channel6 PWLSIZE decode' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
