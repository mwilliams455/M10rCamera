name: M10-R output-space transfer 1C
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1c.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace live CA9 output-space state field
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1C.txt
          from pathlib import Path
          import struct,glob,os,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC

          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def valid(a):return BASE<=a<BASE+len(b)-PFX
          def one(a):
            if not valid(a):return None
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1));return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a)) if z>a else []
          def astr(v):
            if not valid(v):return None
            o=off(v);e=b.find(b'\0',o,min(len(b),o+220));q=b[o:e] if e>o else b''
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {hex(q[0])}->{hex(q[1])}';st=astr(q[1])
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s

          CA9_BASE=0x43705760; CA9_COLOR=0x43705780; STRING_OWNER=0x42151508
          print('M10-R OUTPUTSPACE TRANSFER1C')
          print('Goal: bridge IMG ColorSpace 1/2/3 to live CA9 color-space byte 0x43705780 and enumerate immediate side effects.')

          # Raw literal references to live CA9 base/field across IMG-System.
          print('\n=== RAW POINTER POOLS CA9 BASE/FIELD ===')
          pools=[]
          for target,name in ((CA9_BASE,'CA9_BASE'),(CA9_COLOR,'CA9_COLOR_BYTE')):
            pat=struct.pack('<I',target);p=0;hits=[]
            while True:
              p=b.find(pat,p)
              if p<0:break
              va=BASE+p-PFX;hits.append(va);p+=4
            pools.extend((x,target,name) for x in hits)
            print(name,hex(target),','.join(hex(x) for x in hits) if hits else 'NONE')

          # Decode around each pool halfword-aligned, finding the actual LDR that resolves it.
          print('\n=== CA9 BASE/FIELD LITERAL XREF NEIGHBOURHOODS ===')
          xrefs=[]
          for pool,target,name in pools:
            for a in range(max(BASE,pool-0x400),min(BASE+len(b)-PFX,pool+4),2):
              i=one(a);q=lit(i) if i else None
              if q and q[0]==pool and q[1]==target:
                xrefs.append((a,target,name))
                print(f'\n-- {name} xref={hex(a)} pool={hex(pool)} --')
                for ii in dis(max(BASE,a-0x80),min(BASE+len(b)-PFX,a+0x180)):print(fmt(ii))

          # Recover nearest valid prologues for CA9 global xrefs and summarize instructions.
          owners=[]
          for a,target,name in xrefs:
            pro=None
            for q in range(a,max(BASE,a-0x1000),-2):
              i=one(q)
              if i and i.mnemonic=='push' and 'lr' in i.op_str:pro=q;break
            if pro:owners.append((pro,name,a))
          print('\n=== CA9 GLOBAL OWNER FUNCTIONS ===')
          for pro,name,a in sorted(set(owners)):print(name,'xref',hex(a),'owner',hex(pro))

          # Find direct callers of string builder 0x42151508 in bounded IMG parameter assembly region.
          print('\n=== CALLERS OF IMG COLORSPACE STRING OWNER 0x42151508 ===')
          callers=[]
          for a in range(0x4214e000,0x42156000,2):
            i=one(a)
            if i and call(i)==STRING_OWNER:
              callers.append(a);print(hex(a),fmt(i))
              for ii in dis(max(0x4214e000,a-0x100),min(0x42156000,a+0x140)):print(fmt(ii))

          # Search local bounded assembly for loads/stores at +0x44 and +0x20 to see struct handoff semantics.
          print('\n=== STRUCT OFFSET +0x44 / +0x20 SURFACE AROUND STRING-BUILDER CALLERS ===')
          for c in callers:
            for ii in dis(max(0x4214e000,c-0x500),min(0x42156000,c+0x500)):
              if ('#0x44' in ii.op_str or '#0x20' in ii.op_str) and ii.mnemonic.startswith(('ldr','str')):print(fmt(ii))

          # Find exact ASCII variants of all CA9 CM assets in entire unpacked image and every section.
          print('\n=== ALL B2Y * CA9_CM ASSET STRINGS ===')
          unpack=Path('/tmp/M10R_unpacked.bin').read_bytes()
          patt=re.compile(rb'[ -~]{4,80}CA9_CM\.bin')
          seen=set()
          for m in patt.finditer(unpack):
            s=m.group(0).decode('ascii','replace')
            # trim back to probable token start
            s=s.split('\x00')[-1]
            if s not in seen:seen.add(s);print('UNPACK',hex(m.start()),repr(s))
          for fn in sorted(glob.glob('/tmp/sections/*')):
            try:data=Path(fn).read_bytes()
            except:continue
            for needle in (b'B2Y_',b'CA9_CM.bin',b'TF_CA9',b'B2Y_TF'):
              p=0
              while True:
                p=data.find(needle,p)
                if p<0:break
                lo=max(0,data.rfind(b'\0',max(0,p-80),p)+1);hi=data.find(b'\0',p,min(len(data),p+120));hi=hi if hi>=0 else min(len(data),p+120)
                q=data[lo:hi]
                if q and all(x==9 or 0x20<=x<=0x7e for x in q):print(os.path.basename(fn),hex(p),repr(q.decode('ascii','replace')))
                p+=1

          # Direct known nonlinear calls from CA9-global owners, one function only each.
          known={0x420d15e8:'DG_CONTROL',0x420d25a4:'INTERP_GAMMA',0x420d3c1c:'TONE_HELPER',0x420d1170:'DEKNEE_REGION'}
          print('\n=== NONLINEAR CALLS FROM CA9 GLOBAL OWNERS ===')
          for pro in sorted(set(x[0] for x in owners)):
            hits=[]
            for ii in dis(pro,min(pro+0x1200,BASE+len(b)-PFX)):
              t=call(ii)
              if t in known:hits.append((ii.address,known[t],t))
            print('owner',hex(pro),[(hex(a),n,hex(t)) for a,n,t in hits] if hits else 'NONE')

          print('\n=== DECISION ===')
          print('Use recovered CA9 field owner and string-builder caller to determine the exact 1/2/3 -> 0/1/2 assignment path. Do not infer nonlinear side effects from parameter-string construction alone.')
          PY
      - name: Commit textual result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1C.txt
          git commit -m 'research: record live CA9 output-space state trace 1C' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
