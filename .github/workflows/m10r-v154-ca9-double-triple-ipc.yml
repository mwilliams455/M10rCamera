name: M10-R v1.54 CA9 ASN double triple IPC
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v154-ca9-double-triple-ipc.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Tight CA9 ASN double-triple and IMG IPC trace
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v154_ca9_double_triple_ipc.txt
          from pathlib import Path
          import struct,collections
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          def make(path,base,mode,pfx=4):
            b=Path(path).read_bytes(); md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
            def off(a):return pfx+a-base
            def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
            def cstr(a,n=280):
              o=off(a)
              if not 0<=o<len(b):return None
              e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
              return q.decode('ascii','replace') if e>o and all(32<=x<127 for x in q) else None
            def lit(i):
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  pc=((i.address+4)&~3) if mode==CS_MODE_THUMB else i.address+8
                  la=pc+i.operands[1].mem.disp;o=off(la)
                  if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
              except:pass
            def call(i):
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            def fmt(i):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
              if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
              c=call(i)
              if c is not None:s+=f' ; CALL {c:#x}'
              return s
            return b,md,off,dis,cstr,lit,call,fmt
          ib,imd,ioff,idis,ics,ilit,icall,ifmt=make('/tmp/sections/092_IMG-System.bin',0x42000000,CS_MODE_THUMB)
          cb,amd,aoff,adis,acs,alit,acall,afmt=make('/tmp/sections/099_IMG-CA9_System.bin',0x40000000,CS_MODE_ARM)
          _,tmd,_,tdis,_,_,_,_=make('/tmp/sections/099_IMG-CA9_System.bin',0x40000000,CS_MODE_THUMB)
          print('M10-R v1.54 CA9 ASN DOUBLE TRIPLE / IPC TRACE')
          print('\n=== IMG transport helper 0x420D4C24 ===')
          for i in idis(0x420d4b60,0x420d4e80):print(ifmt(i))
          print('\n=== strings/literals in IMG transport window ===')
          for a in range(0x420d4b00,0x420d4f00):
            s=ics(a)
            if s and len(s)>=4: print(hex(a),repr(s));a+=len(s)
          print('\n=== ARM-mode VLDR/LDRD exact ASN-layout candidates ===')
          ains=list(amd.disasm(cb[4:],0x40000000)); exact=[]
          for i in ains:
            if not i.mnemonic.startswith(('vldr','ldrd','ldr')):continue
            try:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in (8,0x10,0x18): exact.append((i,o.mem.base,o.mem.disp))
            except:pass
          # group by base register and <=0x80 span; require all three offsets and at least one vldr/ldrd
          groups=[]
          for i,base,d in exact:
            near=[x for x in exact if x[1]==base and abs(x[0].address-i.address)<=0x80]
            ds={x[2] for x in near}
            if {8,0x10,0x18}.issubset(ds) and any(x[0].mnemonic.startswith(('vldr','ldrd')) for x in near):
              lo=min(x[0].address for x in near);hi=max(x[0].address for x in near);key=(lo,hi,base)
              if key not in groups:groups.append(key)
          # coalesce
          out=[]
          for g in sorted(groups):
            if out and g[2]==out[-1][2] and g[0]<=out[-1][1]+0x20:out[-1]=(out[-1][0],max(out[-1][1],g[1]),g[2])
            else:out.append(g)
          print('groups',[(hex(a),hex(z),r) for a,z,r in out])
          for a,z,r in out:
            print(f'-- ARM candidate {a:#x}..{z:#x} base={r} --')
            for i in adis(max(0x40000000,a-0x100),min(0x40000000+len(cb)-4,z+0x200)):print(afmt(i))
          print('\n=== raw ARM VLDR with +8/+10/+18 (for manual triage) ===')
          for i,base,d in exact:
            if i.mnemonic.startswith(('vldr','ldrd')):print(afmt(i),'base',base,'disp',hex(d))
          print('\n=== Thumb-mode VLDR/LDRD exact ASN-layout candidates ===')
          tins=list(tmd.disasm(cb[4:],0x40000000)); tex=[]
          for i in tins:
            if not i.mnemonic.startswith(('vldr','ldrd','ldr')):continue
            try:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in (8,0x10,0x18):tex.append((i,o.mem.base,o.mem.disp))
            except:pass
          tgroups=[]
          for i,base,d in tex:
            near=[x for x in tex if x[1]==base and abs(x[0].address-i.address)<=0x80]
            if {8,0x10,0x18}.issubset({x[2] for x in near}) and any(x[0].mnemonic.startswith(('vldr','ldrd')) for x in near):
              key=(min(x[0].address for x in near),max(x[0].address for x in near),base)
              if key not in tgroups:tgroups.append(key)
          print('thumb_groups',[(hex(a),hex(z),r) for a,z,r in tgroups])
          for a,z,r in tgroups[:20]:
            print(f'-- THUMB candidate {a:#x}..{z:#x} base={r} --')
            for i in tdis(max(0x40000000,a-0x80),min(0x40000000+len(cb)-4,z+0x180)):print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}')
          print('\n=== exact 3-double memcpy-style paired-word patterns in ARM ===')
          # report compact windows with six LDR word accesses from offsets 8,12,16,20,24,28 on same base
          word=[]
          wanted={8,12,16,20,24,28}
          for i in ains:
            if not i.mnemonic.startswith('ldr'):continue
            try:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in wanted:word.append((i,o.mem.base,o.mem.disp))
            except:pass
          wgroups=[]
          for i,base,d in word:
            near=[x for x in word if x[1]==base and abs(x[0].address-i.address)<=0x80]
            if wanted.issubset({x[2] for x in near}):
              key=(min(x[0].address for x in near),max(x[0].address for x in near),base)
              if key not in wgroups:wgroups.append(key)
          print('word_groups',[(hex(a),hex(z),r) for a,z,r in wgroups])
          for a,z,r in wgroups[:30]:
            print(f'-- word candidate {a:#x}..{z:#x} base={r} --')
            for i in adis(max(0x40000000,a-0x80),min(0x40000000+len(cb)-4,z+0x180)):print(afmt(i))
          print('\n=== TARGET ===')
          print('Find a true 3xdouble ASN input reader in CA9 or prove transport repacks it; use IMG transport helper semantics as the fallback anchor.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v154_ca9_double_triple_ipc.txt
          git commit -m 'research: record v1.54 CA9 ASN double-triple IPC trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push