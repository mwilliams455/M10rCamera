name: M10-R output-space transfer 1R
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1r.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CA9 executable color-management core
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1R.txt
          from pathlib import Path
          import re,struct,collections
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;N=len(b)
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return a-BASE
          def one(a):
            o=off(a)
            if not 0<=o<N:return None
            q=list(md.disasm(b[o:o+4],a,count=1));return q[0] if q else None
          def cstr(a,n=220):
            o=off(a)
            if not 0<=o<N:return ''
            e=b.find(b'\0',o,min(N,o+n));q=b[o:e] if e>o else b''
            try:return q.decode('ascii')
            except:return ''
          strings=[]
          for m in re.finditer(rb'[ -~]{4,220}',b):
            s=m.group().decode('ascii','replace');lo=s.lower()
            if any(k in lo for k in ('ca9: %s','cm_temperature','division by zero','matrix not invertible','color','colour','cc0','cc1','tint','remap','ca9_control_manager')):strings.append((BASE+m.start(),s))
          tmap={a:s for a,s in strings}
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=N-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def pcref(i):
            out=[]
            # Capstone ADR generally resolves immediate target.
            try:
              if i.mnemonic.startswith('adr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:out.append(i.operands[1].imm)
              # add/sub Rd, pc, #imm
              if i.mnemonic in ('add','add.w','sub','sub.w') and len(i.operands)>=3:
                if i.operands[1].type==ARM_OP_REG and i.operands[1].reg==ARM_REG_PC and i.operands[2].type==ARM_OP_IMM:
                  pc=(i.address+4)&~3;imm=i.operands[2].imm;out.append(pc+imm if i.mnemonic.startswith('add') else pc-imm)
            except:pass
            x=lit(i)
            if x:out.append(x[1])
            return out
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:11s} {i.op_str}'
            rs=[x for x in pcref(i) if x in tmap]
            if rs:s+=' ; STRREF '+','.join(f'{hex(x)}={tmap[x]!r}' for x in rs)
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER1R')
          print('\n=== RELEVANT STRING ADDRESSES ===')
          for a,s in strings:print(hex(a),repr(s))
          print('\n=== PC-RELATIVE REFERENCES IN THUMB CODE 0x40004000..0x40006800 ===')
          hits=[]
          for a in range(0x40004000,0x40006800,2):
            i=one(a)
            if not i:continue
            rr=[x for x in pcref(i) if x in tmap]
            if rr:
              hits.append((a,rr));print(fmt(i))
          print('HIT_COUNT',len(hits))
          print('\n=== XREF WINDOWS / FUNCTION-START SEARCH ===')
          for a,rr in hits:
            # nearest preceding push including lr in <=0x180 bytes
            fs=None
            for x in range(a,a-0x180,-2):
              j=one(x)
              if j and j.mnemonic=='push' and 'lr' in j.op_str:fs=x;break
            st=fs if fs else max(0x40004000,a-0x60);en=min(0x40006800,a+0x100)
            print(f'\nXREF {hex(a)} refs={[hex(x) for x in rr]} START={hex(fs) if fs else "UNKNOWN"}')
            # continuous decode from start, capped
            o=off(st);ins=list(md.disasm(b[o:off(en)],st))
            for i in ins:print(fmt(i))
          print('\n=== FUNCTION STARTS 0x40004000..0x40006800 ===')
          starts=[]
          for a in range(0x40004000,0x40006800,2):
            i=one(a)
            if i and i.mnemonic=='push' and 'lr' in i.op_str:starts.append(a)
          print(','.join(hex(x) for x in starts))
          print('\n=== CMP 0/1/2/3 SURFACE IN CM-RELATED FUNCTIONS ===')
          # Restrict to functions implicated by string xrefs, expanded around starts.
          fstarts=set()
          for a,_ in hits:
            for x in range(a,a-0x200,-2):
              j=one(x)
              if j and j.mnemonic=='push' and 'lr' in j.op_str:fstarts.add(x);break
          for fs in sorted(fstarts):
            print('\nFUNC',hex(fs))
            for a in range(fs,min(0x40006800,fs+0x500),2):
              i=one(a)
              if not i:continue
              if i.mnemonic.startswith(('cmp','cbz','cbnz')) or (i.mnemonic.startswith('b') and i.mnemonic not in ('bl','blx')) or call(i) is not None:print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Functions identified through actual executable string xrefs are candidates for CA9 CM math. Next intersect their callers/data pointers with the IPC receiver and mode field; do not treat generic temperature/matrix math as output-space switching without mode dataflow.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1R.txt
          git commit -m 'research: record CA9 executable CM core trace 1R' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
