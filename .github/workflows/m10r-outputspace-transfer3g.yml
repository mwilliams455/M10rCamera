name: M10-R output-space transfer 3G
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3g.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace ADR B2Y colorspace parser and callers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3G.txt
          from pathlib import Path
          import re,struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); B=0x42000000; P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True
          def off(a):return P+a-B
          def ds(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def adr_target(i):
            if i.mnemonic!='adr' or len(i.operands)<2:return None
            try:
              imm=i.operands[1].imm
              if B<=imm<B+len(b):return imm
              return (((i.address+4)&~3)+imm)&0xffffffff
            except:return None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}'
            c=call(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            a=adr_target(i)
            if a is not None:
              q=off(a); raw=b[q:q+96] if 0<=q<len(b) else b''
              m=re.match(rb'[ -~]{3,}',raw)
              s+=f' ; ADR={a:#x}'
              if m:s+=f' STR={m.group().decode("latin1","replace")[:80]!r}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER3G')
          print('\n=== RAW COLORSPACE STRING BLOCK ===')
          q0=0x151700;q1=0x151a80
          for m in re.finditer(rb'[ -~]{4,}',b[q0:q1]):
            q=q0+m.start();print(hex(B+q-P),hex(q),repr(m.group().decode('latin1','replace')))
          print('\n=== ADR DECODE 0x42151580..0x42151B80 ===')
          ins=ds(0x42151580,0x42151b80)
          for i in ins:
            if i.mnemonic=='adr' or call(i)==0x42203e56:print(fmt(i))
          print('\n=== PARSER CALL WINDOWS ===')
          for n,i in enumerate(ins):
            if call(i)==0x42203e56:
              print('\nCALL',hex(i.address))
              for j in ins[max(0,n-12):min(len(ins),n+18)]:print(fmt(j))
          print('\n=== FUNCTIONS CONTAINING COLORSPACE ADR TARGETS ===')
          # identify ADR whose target begins with a COLORSPACE string and nearest preceding push{..lr}
          ctargets={0x42151884,0x42151898,0x421518b0}
          starts=[]
          last=None
          for i in ins:
            if i.mnemonic=='push' and 'lr' in i.op_str:last=i.address
            a=adr_target(i)
            if a in ctargets:
              print('HIT',fmt(i),'FUNC',hex(last) if last else None)
              if last and last not in starts:starts.append(last)
          print('STARTS',[hex(x) for x in starts])
          print('\n=== FULL-IMAGE DIRECT CALLERS OF COLORSPACE GETTERS ===')
          allins=list(md.disasm(b[P:],B))
          for s in starts:
            print('\nGETTER',hex(s))
            for n,i in enumerate(allins):
              if call(i)==s:
                print('CALLSITE',hex(i.address))
                for j in allins[max(0,n-14):min(len(allins),n+22)]:print(fmt(j))
          print('\n=== PARSER 0x42203E56 ===')
          for i in ds(0x42203d80,0x42204180):print(fmt(i))
          print('\n=== ALL ADRS TO _COLORSPACE SUBSTRINGS IN IMG-SYSTEM ===')
          for i in allins:
            a=adr_target(i)
            if a is not None:
              q=off(a)
              if 0<=q<len(b) and b'_COLORSPACE:' in b[q:q+64]:print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Recover the B2Y output-space getter(s), parser contract, callers, and destination field. This is prerequisite to proving which B2Y controls change for SRGB/ADOBERGB/ECI.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3G.txt
          git commit -m 'research: record ADR B2Y colorspace parser trace 3G' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push