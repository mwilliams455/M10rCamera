name: M10-R YBLEND REFERENCE1E
on:
  push:
    branches: [m10r-yblend-reference1e]
    paths:
      - '.github/workflows/m10r-yblend-reference1e.yml'
      - 'tools/m10r_yblend_reference1e.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: M10R-PHOTOAUDIT1A-RESEARCH-INPUTS
          run-id: 35518775600
          github-token: ${{ github.token }}
          path: inputs
      - name: Install pinned measurement dependencies
        run: python3 -m pip install --quiet numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.13.0.92
      - name: Run same-RAW Y BLEND discriminator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 tools/m10r_yblend_reference1e.py inputs results | tee results/stdout.txt
          python3 - <<'PY'
          import json
          r=json.load(open('results/results.json'))
          assert r['status']=='PASS_YBLEND_REFERENCE_DISCRIMINATOR'
          assert len(r['scenes'])==6
          assert set(r['models'])=={'ABS_k0','CURRENT_k035','MID_k050','REL_k100'}
          PY
      - name: Persist research results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/generated
          cp results/results.json research/generated/M10R_YBLEND_REFERENCE1E.json
          cp results/REPORT.md research/generated/M10R_YBLEND_REFERENCE1E.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/M10R_YBLEND_REFERENCE1E.*
          git commit -m "Research freeze same-RAW Y BLEND reference discriminator" || exit 0
          git push origin HEAD:m10r-yblend-reference1e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M10R-YBLEND-REFERENCE1E
          path: results/
          retention-days: 90
