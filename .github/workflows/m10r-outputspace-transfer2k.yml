name: M10-R output-space transfer 2K
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2k.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace full ColorManagementFinished callback
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2K.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); B=0x42000000;P=4
          m=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);m.detail=True
          def o(a):return P+a-B
          def ds(a,z):return list(m.disasm(b[o(a):o(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; q=o(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i);c=call(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            if c is not None:s+=f' ; CALL={c:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER2K')
          print('\n=== CALLBACK HEAD 0x420A3638..0x420A3A10 ===')
          for i in ds(0x420a3638,0x420a3a10):print(fmt(i))
          print('\n=== CALLBACK ALL DIRECT CALLS 0x420A3638..0x420A4100 ===')
          calls=[]
          for i in ds(0x420a3638,0x420a4100):
            c=call(i)
            if c is not None:
              calls.append((i.address,c));print(fmt(i))
          print('\n=== DIRECT CALLS TO CC0 / TF LOADERS IN CM NEIGHBORHOOD ===')
          for i in ds(0x420a3000,0x420a5000):
            c=call(i)
            if c in (0x420a4628,0x420a4884):print(fmt(i))
          print('\n=== CALLBACK MESSAGE POINTER / STRUCTURE LOADS ===')
          for i in ds(0x420a3638,0x420a4100):
            if '[sp, #0x68]' in i.op_str or '[sp, #0x64]' in i.op_str or '[sp, #0x60]' in i.op_str or '[sp, #0x5c]' in i.op_str or '[sp, #0x58]' in i.op_str:
              print(fmt(i))
          print('\n=== CALLBACK SHARED BASE 0x43705760 LITERALS ===')
          for i in ds(0x420a3638,0x420a4100):
            x=lit(i)
            if x and x[1]==0x43705760:print(fmt(i))
          print('\n=== LOCAL CALLEES IN 0x420A4000..0x420A5000 ===')
          seen=[]
          for _,c in calls:
            if 0x420a4000<=c<0x420a5000 and c not in seen:
              seen.append(c);print('\n--',hex(c),'--')
              for i in ds(c,min(c+0x240,B+len(b)-P)):print(fmt(i))
          print('\n=== RAW 0x420A45E0..0x420A4B80 ===')
          for i in ds(0x420a45e0,0x420a4b80):print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Identify whether ColorManagementFinished calls or populates the CC0 asset loader, TF loader, or an intermediate B2Y configuration object. Do not infer CC1 from naming symmetry.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2K.txt
          git commit -m 'research: record full ColorManagementFinished callback trace 2K' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push