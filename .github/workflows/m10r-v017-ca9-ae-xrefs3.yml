name: M10-R v0.17 CA9 AE xrefs fixed
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v017-ca9-ae-xrefs3.yml', '.m10r-v017-ca9-ae-xrefs3-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace CA9 AE xrefs
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v017-ca9-ae-xrefs3.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();base=0x40000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def va(o): return base+o-pfx
          def off(a): return pfx+a-base
          names=[('integral',b'AE integral ready'),('spot',b'AE spot ready'),('avfield',b'AE AV field ready'),('mfm',b'AE MFM ready'),('running',b'AE algorithm running'),('param',b'AE param: AV:')]
          strings=[]
          for name,p in names:
            q=b.find(p);strings.append((name,q,va(q)))
          print('STRINGS',[(n,hex(q),hex(v)) for n,q,v in strings])
          # Include exact string starts and up to 32-byte preceding prefix to catch format pointer into prefix.
          target_ranges=[]
          for n,q,v in strings: target_ranges.append((n,v-32,v+8))
          hits=[]
          for o in range(4,len(b)-4,4):
            a=va(o);ds=list(md.disasm(b[o:o+4],a,1))
            if not ds: continue
            i=ds[0];ops=i.operands;cands=[]
            if i.mnemonic in ('add','sub') and len(ops)>=3 and ops[1].type==ARM_OP_REG and ops[1].reg==ARM_REG_PC and ops[2].type==ARM_OP_IMM:
              pc=a+8;cands.append(('ADR',pc+ops[2].imm if i.mnemonic=='add' else pc-ops[2].imm))
            if i.mnemonic.startswith('ldr') and len(ops)>=2 and ops[1].type==ARM_OP_MEM and ops[1].mem.base==ARM_REG_PC:
              la=a+8+ops[1].mem.disp;lo=off(la)
              if 0<=lo<=len(b)-4:cands.append(('LDRLIT',struct.unpack_from('<I',b,lo)[0]&~1))
            for kind,t in cands:
              for n,lo,hi in target_ranges:
                if lo<=t<=hi:hits.append((a,kind,n,t,i.mnemonic,i.op_str))
          print('HITS',[(hex(a),k,n,hex(t),m,o) for a,k,n,t,m,o in hits])
          def dump(a,rpre=0x180,rpost=0x280):
            s=max(base,a-rpre)&~3;e=min(end,a+rpost)&~3
            for o in range(off(s),off(e),4):
              aa=va(o);ds=list(md.disasm(b[o:o+4],aa,1))
              if ds:
                i=ds[0];print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          for a,k,n,t,m,o in hits:
            print('\n=== HIT',hex(a),k,n,hex(t),m,o,'===');dump(a)
          # Always dump known vector targets and code windows around string pools for manual function-boundary recovery.
          for n,q,v in strings:
            print('\n=== RAW_WINDOW',n,'string',hex(v),'===');dump(v-0x100,0x300,0x180)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v017-ca9-ae-xrefs3
          path: /tmp/m10r-v017-ca9-ae-xrefs3.txt
          if-no-files-found: error
