name: M10-R v2.08b exact B2Y link/control xrefs
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v208b-b2y-link-xrefs-control.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve exact named B2Y driver xrefs and controls
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v208b_b2y_link_xrefs_control.txt
          from pathlib import Path
          import struct, collections
          from capstone import *
          from capstone.arm import *

          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4; END=BASE+len(b)-PFX
          th=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); th.detail=True; th.skipdata=True
          ar=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); ar.detail=True; ar.skipdata=True
          def off(a): return PFX+a-BASE
          def ops(i):
            try:return i.operands
            except:return []
          def lit(i,mode):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>=2 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((((i.address+4)&~3) if mode=='T' else i.address+8)+oo[1].mem.disp)
                o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr_target(i,mode):
            oo=ops(i)
            try:
              if i.mnemonic=='adr' and len(oo)>=2 and oo[1].type==ARM_OP_IMM:
                imm=oo[1].imm
                # Capstone reports the Thumb ADR immediate as a displacement here.
                if mode=='T': return (((i.address+4)&~3)+imm)&0xffffffff
                return (i.address+8+imm)&0xffffffff
            except:pass
          def call(i):
            oo=ops(i)
            try:
              if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
            except:pass
          def dis(lo,hi,mode):
            md=th if mode=='T' else ar; lo=max(BASE,lo);hi=min(END,hi)
            return list(md.disasm(b[off(lo):off(hi)],lo))
          def fmt(i,mode):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i,mode);a=adr_target(i,mode);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if a is not None:s+=f' ; ADR->{a:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def find_ascii(s):
            raw=s.encode('ascii'); out=[]; p=0
            while True:
              k=b.find(raw,p)
              if k<0:break
              out.append(BASE+(k-PFX));p=k+1
            return out

          labels=[
            'drv_img_b2y_set_operation_mode',
            'drv_img_b2y_set_tone_control1',
            'drv_img_b2y_set_wbgain1',
            'drv_img_b2y_set_wbgain2',
            'drv_img_b2y_start_link_mode_clk()',
            'drv_img_b2y_start_sdram_mode_clk()',
            '_B2YMODE:STILL',
            '_B2YMODE:STILLLINK',
            'LV_MAGNI B2Y LINK',
            'LV_SLIVE B2Y LINK',
          ]
          targets={}
          print('M10-R v2.08b EXACT B2Y LINK/CONTROL XREFS')
          print('scope: exact named-string xrefs plus their local functions only')
          print('\n=== string addresses from firmware bytes ===')
          for s in labels:
            aa=find_ascii(s); print(s,[hex(x) for x in aa])
            for a in aa: targets[a]=s

          # Only two narrow executable territories: B2Y low-level driver and high-level B2Y state/mode handlers.
          territories=[('driver',0x420d0000,0x420d4b00),('b2y_state',0x42151000,0x42161c00)]
          xrefs=[]
          for tn,lo,hi in territories:
            for mode in ('T','A'):
              for i in dis(lo,hi,mode):
                vals=[];q=lit(i,mode);a=adr_target(i,mode)
                if q:vals.append(q[1])
                if a is not None:vals.append(a)
                for v in vals:
                  # Allow exact start plus a tiny alignment tolerance only.
                  for ta,s in targets.items():
                    if abs(v-ta)<=1:xrefs.append((tn,mode,i.address,ta,s,i))
          print('\n=== exact/±1 named xrefs ===')
          for tn,mode,a,ta,s,i in xrefs:print(tn,mode,hex(a),'->',hex(ta),s,'::',fmt(i,mode))

          def has_lr_push(i):
            if i.mnemonic=='push' and 'lr' in i.op_str:return True
            if i.mnemonic.startswith('stm') and 'sp' in i.op_str and 'lr' in i.op_str:return True
            return False
          def is_ret(i):
            if i.mnemonic=='pop' and 'pc' in i.op_str:return True
            if i.mnemonic=='bx' and i.op_str.strip()=='lr':return True
            return False
          def local_function(addr,mode):
            ins=dis(addr-0x180,addr+0x220,mode)
            prior=[i for i in ins if i.address<=addr and has_lr_push(i)]
            start=prior[-1].address if prior else max(BASE,addr-0x80)
            after=[i for i in ins if i.address>=addr and is_ret(i)]
            end=(after[0].address+4) if after else addr+0x100
            return start,end,dis(start,end,mode)

          # Lightweight constant propagation for exact effective MMIO addresses in each named function.
          def mmio(ins,mode):
            regs={}; out=[]
            for i in ins:
              oo=ops(i);q=lit(i,mode)
              if q and oo and oo[0].type==ARM_OP_REG:regs[oo[0].reg]=q[1]
              for op in oo:
                if op.type==ARM_OP_MEM and op.mem.base in regs:
                  ea=(regs[op.mem.base]+op.mem.disp)&0xffffffff
                  if (0x20000000<=ea<0x21000000) or (0xd0000000<=ea<0xd1000000):out.append((i,ea))
              if i.mnemonic in ('mov','movs') and len(oo)>=2 and oo[0].type==ARM_OP_REG:
                if oo[1].type==ARM_OP_REG and oo[1].reg in regs:regs[oo[0].reg]=regs[oo[1].reg]
                elif oo[1].type==ARM_OP_IMM:regs[oo[0].reg]=oo[1].imm&0xffffffff
                else:regs.pop(oo[0].reg,None)
              elif i.mnemonic in ('add','adds','sub','subs') and oo and oo[0].type==ARM_OP_REG:
                d=oo[0].reg
                if len(oo)==2 and oo[1].type==ARM_OP_IMM and d in regs:regs[d]=(regs[d]+(oo[1].imm if i.mnemonic.startswith('add') else -oo[1].imm))&0xffffffff
                elif len(oo)>=3 and oo[1].type==ARM_OP_REG and oo[1].reg in regs and oo[2].type==ARM_OP_IMM:regs[d]=(regs[oo[1].reg]+(oo[2].imm if i.mnemonic.startswith('add') else -oo[2].imm))&0xffffffff
                else:regs.pop(d,None)
              elif oo and oo[0].type==ARM_OP_REG and i.mnemonic not in ('str','strb','strh','strd','stm','cmp','cmn','tst','teq','b','bl','blx','bx','push'):
                if not q:regs.pop(oo[0].reg,None)
            return out

          seen=set()
          print('\n=== named local functions and MMIO ===')
          for tn,mode,a,ta,s,i in xrefs:
            key=(mode,a,s)
            if key in seen:continue
            seen.add(key)
            st,en,ins=local_function(a,mode)
            print(f'\n--- {s} xref={a:#x} mode={mode} local={st:#x}..{en:#x} ---')
            for j in ins:print(fmt(j,mode))
            print('MMIO_EFFECTIVE')
            for j,ea in mmio(ins,mode):print(hex(j.address),j.mnemonic,hex(ea),j.op_str)

          print('\nEVIDENCE RULE: a named link/operation routine that only manipulates clock/status registers does not establish a pixel-stage edge.')
          print('TARGET: determine whether STILLLINK/link-mode or operation-mode code contains an explicit B2Y source/mux selector; otherwise keep pixel-stage order unresolved.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v208b_b2y_link_xrefs_control.txt
          git commit -m 'research: record v2.08b exact B2Y link/control xrefs' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push