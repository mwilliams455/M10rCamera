name: M10-R v1.75 B2Y selector gamma/deknee trace
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v175-b2y-selector-gamma-deknee.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace B2Y calibration selectors and live gamma/deknee routines
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v175_b2y_selector_gamma_deknee.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4; END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return PFX+a-BASE
          def cstr(a,lim=400):
            o=off(a)
            if not 0<=o<len(b): return None
            e=b.find(b'\0',o,min(len(b),o+lim)); q=b[o:e]
            if e<=o or not all(0x20<=x<=0x7e for x in q): return None
            return q.decode('ascii','replace')
          def dis(a,z): return list(md.disasm(b[off(max(BASE,a)):off(min(END,z))],max(BASE,a)))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            except: pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
                a=((i.address+4)&~3)+i.operands[1].imm; return a
            except: pass
          strings={}
          for m in re.finditer(rb'[ -~]{4,}\x00',b):
            a=BASE+m.start()-PFX
            if 0x42153900<=a<0x42155100: strings[a]=m.group()[:-1].decode('ascii','replace')
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=strings.get(q[1]) or cstr(q[1])
              if st:s+=f' STRING={st!r}'
            a=adr(i)
            if a:
              st=strings.get(a) or cstr(a)
              s+=f' ; ADR {a:#x}'+(f' STRING={st!r}' if st else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.75 B2Y SELECTOR / GAMMA / DEKNEE TRACE')
          print('\n=== strings in selector block ===')
          for a,s in strings.items(): print(hex(a),repr(s))
          ins=dis(0x42153900,0x42155100)
          print('\n=== full selector block disassembly ===')
          for i in ins: print(fmt(i))
          print('\n=== references to semantic strings ===')
          interesting=('COLORCORRECTION','DEKNEE','DIFFERENTIAL GAMMA','EDGE SYNTHESIS','INTERPLOATION','INTERPOLATION GAMMA','B2Y.bin')
          for i in ins:
            vals=[]
            q=lit(i)
            if q: vals.append(q[1])
            a=adr(i)
            if a: vals.append(a)
            for v in vals:
              st=strings.get(v) or cstr(v)
              if st and any(k in st.upper() for k in interesting): print(fmt(i))
          print('\n=== calls in selector block ===')
          calls={}
          for i in ins:
            c=call(i)
            if c is not None:calls.setdefault(c,[]).append(i.address)
          for c,aa in sorted(calls.items()):print(hex(c),[hex(x) for x in aa])
          print('\n=== likely selector function starts (push) ===')
          for i in ins:
            if i.mnemonic=='push': print(hex(i.address),i.op_str)
          print('\nTARGET: prove live B2Y.bin selectors for deknee/differential gamma/interpolation gamma, identify selected-record ABI and where selected parameters are written into the B2Y runtime object/MMIO path.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v175_b2y_selector_gamma_deknee.txt
          git commit -m 'research: record v1.75 B2Y selector gamma/deknee trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push