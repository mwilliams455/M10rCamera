name: M10-R v1.29 WB white-point bridge
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v129-wb-whitepoint-bridge.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace x/y, remapped gains, and named white-point helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v129_wb_whitepoint_bridge.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_IMM, ARM_OP_MEM, ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          mdT=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); mdT.detail=True; mdT.skipdata=True
          mdA=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); mdA.detail=True; mdA.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(md,a,z): return list(md.disasm(b[off(a):off(z)],a))
          def fmt(i): return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
          def cstr(a,limit=220):
            o=off(a)
            if not 0<=o<len(b): return None
            e=b.find(b'\0',o,min(len(b),o+limit))
            if e<=o: return None
            q=b[o:e]
            if len(q)<4 or not all(0x20<=x<=0x7e for x in q): return None
            return q.decode('ascii','replace')
          def findstr(s):
            out=[]; q=s.encode(); p=0
            while True:
              p=b.find(q,p)
              if p<0: break
              out.append(BASE+p-PFX); p+=1
            return out
          print('M10-R v1.29 WB / WHITE-POINT BRIDGE')
          print('Goal: freeze callback x/y + remapped-gain representation and anchor named white-point helpers.')
          print('\n=== FLOAT HELPER CONTROL: 0x421E61D0 (ARM) ===')
          for i in dis(mdA,0x421e61d0,0x421e6250): print(fmt(i))
          print('\n=== U16/INT TO DOUBLE HELPER CONTROL: 0x421E6648 (ARM) ===')
          for i in dis(mdA,0x421e6648,0x421e66c0): print(fmt(i))
          print('\n=== ColorManagementFinished WB/GAIN WINDOW ===')
          for i in dis(mdT,0x420a3d50,0x420a44f0):
            print(fmt(i))
          print('\n=== TARGET STRINGS / ADDRESSES ===')
          needles=[
            'gain remapped','Gain remapped','gain Remapped','Gain R','[out] x','[out] y',
            'ca9_cm_ColorSpec_NeutralToXY','ca9_cm_ColorSpec_SetWhiteXY','ca9_cm_ColorSpec_MapWhiteMatrix',
            'ca9_cm_Temperature_ToXYCoord','ca9_cm_Temperature_FromXYCoord'
          ]
          targets={}
          for n in needles:
            xs=findstr(n); targets[n]=xs
            print(n, [hex(x) for x in xs])
          print('\n=== NARROW COLOR-MANAGEMENT XREFS TO TARGET STRINGS ===')
          # Only scan the CA9 color-management neighborhood. Raw string matching above avoids broad whole-image archaeology.
          ins=dis(mdT,0x42090000,0x420c8000)
          string_addrs=set(a for xs in targets.values() for a in xs)
          hits=[]
          for idx,i in enumerate(ins):
            refs=[]
            # ADR immediate target in Thumb: Capstone exposes absolute target on this build for ADR; also test pc-relative form manually if needed.
            if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
              refs.append(i.operands[1].imm)
              refs.append(((i.address+4)&~3)+i.operands[1].imm)
            # PC-relative literal load pointing to a string pointer.
            if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              la=((i.address+4)&~3)+i.operands[1].mem.disp; o=off(la)
              if 0<=o<=len(b)-4: refs.append(struct.unpack_from('<I',b,o)[0])
            if any(r in string_addrs for r in refs): hits.append(idx)
          for idx in hits:
            i=ins[idx]
            print(f'\n-- string xref @{i.address:#x} --')
            for j in ins[max(0,idx-24):min(len(ins),idx+28)]: print(fmt(j))
          print('xref_count',len(hits))
          print('\n=== DIRECT CALLS TO NAMED-CANDIDATE FUNCTIONS AROUND STRING XREFS ===')
          # Function-name strings commonly sit in the debug body of their function; give larger bounded slices around each xref.
          for idx in hits:
            i=ins[idx]
            print(f'\n-- bounded owner neighborhood @{i.address:#x} --')
            for j in ins[max(0,idx-70):min(len(ins),idx+90)]: print(fmt(j))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v129_wb_whitepoint_bridge.txt
          git commit -m 'research: record v1.29 WB white-point bridge' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
