name: M10-R v2.00 context 1D50 store classifier
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v200-context-1d50-store-classifier.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Classify exact stores to context plus 0x1D50 table
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v200_context_1d50_store_classifier.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          def off(a):return P+a-BASE
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def ops(i):
            try:return i.operands
            except:return []
          def lit(i):
            try:
              o=ops(i)
              if i.mnemonic.startswith('ldr') and len(o)>=2 and o[0].type==ARM_OP_REG and o[1].type==ARM_OP_MEM and o[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+o[1].mem.disp;fo=off(la)
                if 0<=fo<=len(b)-4:return o[0].reg,la,struct.unpack_from('<I',b,fo)[0]
            except:pass
          def call(i):
            try:
              o=ops(i)
              if i.mnemonic in ('bl','blx') and o and o[0].type==ARM_OP_IMM:return o[0].imm&~1
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[1]:#x}->{q[2]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          needle=struct.pack('<I',0x1d50);lits=[];p=0
          while True:
            x=b.find(needle,p)
            if x<0:break
            lits.append(BASE+x-P);p=x+1
          print('M10-R v2.00 CONTEXT +0x1D50 STORE CLASSIFIER')
          print('literal_count',len(lits))
          writers=[];readers=[]
          for la in lits:
            a=max(BASE,(la-0x320)&~1);z=min(BASE+len(b)-P,la+0x40)
            ins=list(md.disasm(b[off(a):off(z)],a))
            for k,i in enumerate(ins):
              q=lit(i)
              if not q or q[1]!=la or q[2]!=0x1d50:continue
              constreg=q[0]
              # Find ADD/ADDS dest,base,constreg within 3 instructions.
              table_regs=[]
              for kk in range(k+1,min(len(ins),k+5)):
                j=ins[kk];o=ops(j)
                if not j.mnemonic.startswith('add') or len(o)<2:continue
                regs=[x.reg for x in o if x.type==ARM_OP_REG]
                if constreg in regs and o[0].type==ARM_OP_REG: table_regs.append((kk,o[0].reg))
              for kk,tr in table_regs:
                for nn in range(kk+1,min(len(ins),kk+10)):
                  j=ins[nn]
                  # stop if table register definitely overwritten as destination of common arithmetic/load
                  o=ops(j)
                  mems=[x.mem for x in o if x.type==ARM_OP_MEM]
                  if any(m.base==tr for m in mems):
                    rec=(la,i.address,j.address,fmt(j))
                    if j.mnemonic.startswith('str'):writers.append(rec)
                    elif j.mnemonic.startswith('ldr'):readers.append(rec)
                  if o and o[0].type==ARM_OP_REG and o[0].reg==tr and j.mnemonic.startswith(('mov','ldr','add','sub','mul','and','orr','eor')) and not any(x.type==ARM_OP_MEM and x.mem.base==tr for x in o):
                    break
          # dedup
          def uniq(a):
            seen=set();out=[]
            for r in a:
              key=(r[1],r[2],r[3])
              if key not in seen:seen.add(key);out.append(r)
            return out
          writers=uniq(writers);readers=uniq(readers)
          print('\nWRITERS',len(writers))
          for r in writers:print(tuple(hex(x) if isinstance(x,int) else x for x in r))
          print('\nREADERS',len(readers))
          for r in readers[:80]:print(tuple(hex(x) if isinstance(x,int) else x for x in r))
          print('\n=== writer contexts ===')
          for _,ref,wa,_ in writers:
            print(f'\n--- writer {wa:#x}, literal ref {ref:#x} ---')
            a=max(BASE,(wa-0x50)&~1);z=min(BASE+len(b)-P,wa+0x70)
            for j in md.disasm(b[off(a):off(z)],a):print(fmt(j))
          print('\nTARGET: isolate only stores whose address is computed from context+0x1D50, identify pointer-table initialization/update routines, and expose the stored pointer source for the next object+0xAC/default-contrast trace.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v200_context_1d50_store_classifier.txt
          git commit -m 'research: record v2.00 context 1D50 store classifier' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push