name: M10-R output-space transfer 2G
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2g.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Narrow trace CA9 config enum producer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2G.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def dec(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            return i.operands[0].imm if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            t=call(i)
            if t is not None:s+=f' ; CALL={t:#x}'
            return s
          ins=dec(0x420a0000,0x420b0000)
          print('M10-R OUTPUTSPACE TRANSFER2G')
          print('\n=== CALLERS OF 0x420A2EB0 IN LOCAL CA9 WRAPPER REGION ===')
          hits=[i for i in ins if call(i)==0x420a2eb0]
          for i in hits:print(fmt(i))
          print('COUNT',len(hits))
          for h in hits:
            print('\n-- WINDOW',hex(h.address),'--')
            for i in ins:
              if h.address-0x180<=i.address<=h.address+0x80:print(fmt(i))
          print('\n=== DIRECT +0xB4 ACCESSES LOCAL REGION ===')
          b4=[i for i in ins if '#0xb4' in i.op_str and i.mnemonic.startswith(('ldr','str','ldrb','strb','ldrh','strh'))]
          for i in b4:print(fmt(i))
          print('COUNT',len(b4))
          for h in b4:
            print('\n-- B4 WINDOW',hex(h.address),'--')
            for i in ins:
              if h.address-0x90<=i.address<=h.address+0x60:print(fmt(i))
          print('\n=== DIRECT +0x44 ACCESSES LOCAL REGION ===')
          for i in ins:
            if '#0x44' in i.op_str and i.mnemonic.startswith(('ldr','str','ldrb','strb','ldrh','strh')):print(fmt(i))
          print('\n=== CALLS INTO CM START FAMILY 0x420A2E00..0x420A3600 ===')
          for i in ins:
            t=call(i)
            if t and 0x420a2e00<=t<0x420a3600:print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Use local caller chain and +0xB4 accesses only. If no local +0xB4 producer exists, field belongs to upstream IMG/job struct and must be traced from the specific caller argument rather than broad instruction scans.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2G.txt
          git commit -m 'research: record narrow CA9 config enum producer trace 2G' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push