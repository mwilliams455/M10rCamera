name: M10-R v1.95 contrast enum and default provenance
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v195-contrast-enum-default-provenance.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve contrast switch and owner +0xAC provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v195_contrast_enum_default_provenance.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          def off(a): return P+a-BASE
          def mk(mode):
            m=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);m.detail=True;m.skipdata=True;return m
          th=mk(CS_MODE_THUMB); ar=mk(CS_MODE_ARM)
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          def dump(md,a,z):
            for i in md.disasm(b[off(a):off(z)],a): print(fmt(i))
          print('M10-R v1.95 CONTRAST ENUM + DEFAULT PROVENANCE')
          print('\n=== switch helper 0x4209f940..0x4209fa20 THUMB ===');dump(th,0x4209f940,0x4209fa20)
          print('\n=== switch helper same ARM sanity ===');dump(ar,0x4209f940,0x4209fa20)
          print('\n=== contrast-switch raw bytes / words 0x4215154c..0x421515b0 ===')
          raw=b[off(0x4215154c):off(0x421515b0)];print(raw.hex())
          for i in range(0,len(raw)-3,4): print(hex(0x4215154c+i),hex(struct.unpack_from('<I',raw,i)[0]))
          print('\n=== strings around mapper pool ===')
          lo=off(0x421518b0);hi=off(0x42151940)
          for m in re.finditer(rb'[ -~]{2,}',b[lo:hi]):print(hex(BASE+lo+m.start()-P),repr(m.group().decode('ascii','replace')))
          print('\n=== owner callers exact BL references and +/-96 bytes THUMB ===')
          calls=[]
          for i in th.disasm(b[off(0x42169000):off(0x4216c000)],0x42169000):
            if call(i)==0x4215220c:calls.append(i.address)
          print('calls',list(map(hex,calls)))
          for a in calls:
            print(f'\n--- caller {a:#x} ---')
            start=max(0x42169000,(a-96)&~1);end=min(0x4216c000,a+48)
            dump(th,start,end)
          print('\n=== all +0xAC memory accesses in caller region ===')
          for i in th.disasm(b[off(0x42169000):off(0x4216c000)],0x42169000):
            hit=False
            for op in i.operands:
              if op.type==ARM_OP_MEM and op.mem.disp==0xac:hit=True
            if hit: print(fmt(i))
          print('\n=== stores of immediate-ish 0/1/2/3 near +0xAC accesses (+/-40) ===')
          ins=list(th.disasm(b[off(0x42169000):off(0x4216c000)],0x42169000));by={i.address:k for k,i in enumerate(ins)}
          for k,i in enumerate(ins):
            if any(op.type==ARM_OP_MEM and op.mem.disp==0xac for op in i.operands):
              print(f'\n--- around {i.address:#x} ---')
              for j in ins[max(0,k-18):min(len(ins),k+19)]:print(fmt(j))
          print('\nTARGET: recover exact numeric contrast enum -> _CONTRAST suffix mapping from the switch helper/table; then identify the producer/default value feeding owner input +0xAC at the four live 0x4215220C call sites. If default cannot be proven, state precisely what remains unresolved.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v195_contrast_enum_default_provenance.txt
          git commit -m 'research: record v1.95 contrast enum/default provenance' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push