name: M10-R v1.55 CA9 mailbox40 handler
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v155-ca9-mailbox40-handler.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CA9 mailbox request 0x40 handler
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v155_ca9_mailbox40_handler.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,n=260):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(32<=x<127 for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          ins=list(md.disasm(b[PFX:],BASE))
          print('M10-R v1.55 CA9 MAILBOX 0x40 HANDLER TRACE')
          print('\n=== mailbox-family literal words in CA9 data ===')
          vals=[]
          for o in range(PFX,len(b)-3,4):
            v=struct.unpack_from('<I',b,o)[0]
            if 0xfff4f000<=v<=0xfff51000:vals.append((BASE+o-PFX,v))
          for a,v in vals:print(hex(a),hex(v))
          print('\n=== code xrefs to mailbox-family literals ===')
          mailbox_refs=[]
          valmap={a:v for a,v in vals}
          for i in ins:
            q=lit(i)
            if q and q[0] in valmap:
              mailbox_refs.append(i.address);print(fmt(i))
          print('\n=== bounded neighborhoods around mailbox refs ===')
          for a in mailbox_refs:
            print(f'-- mailbox ref {a:#x} --')
            for i in dis(max(BASE,a-0x100),min(BASE+len(b)-PFX,a+0x240)):print(fmt(i))
          print('\n=== direct literal refs to exact IMG mailbox bases ===')
          for target in (0xfff50100,0xfff50080,0xfff50000,0xfff50180,0xfff50200,0xfff50300):
            pools=[a for a,v in vals if v==target]
            print(hex(target),[hex(x) for x in pools])
            for lp in pools:
              for i in dis(max(BASE,lp-0x600),lp):
                q=lit(i)
                if q and q[0]==lp:print(fmt(i))
          print('\n=== CMP/TEQ against request opcode 0x40 near mailbox refs ===')
          for a in mailbox_refs:
            for i in dis(max(BASE,a-0x180),min(BASE+len(b)-PFX,a+0x500)):
              if i.mnemonic.startswith(('cmp','teq','tst')) and ('#0x40' in i.op_str or '#64' in i.op_str):print(fmt(i))
          print('\n=== potential request-word loads from +0x40..+0x60 near mailbox refs ===')
          for a in mailbox_refs:
            for i in dis(max(BASE,a-0x180),min(BASE+len(b)-PFX,a+0x500)):
              try:
                if any(o.type==ARM_OP_MEM and o.mem.disp in (0x40,0x44,0x48,0x4c,0x50,0x54,0x58,0x5c,0x60) for o in i.operands):print(fmt(i))
              except:pass
          print('\n=== call targets from mailbox neighborhoods and global callers ===')
          targets=[]
          for a in mailbox_refs:
            for i in dis(max(BASE,a-0x100),min(BASE+len(b)-PFX,a+0x500)):
              c=call(i)
              if c is not None and BASE<=c<BASE+len(b)-PFX and c not in targets:targets.append(c)
          for t in targets:
            callers=[i.address for i in ins if call(i)==t]
            print(hex(t),'callers',[hex(x) for x in callers[:50]])
          print('\n=== IMG-side known request ABI for correlation ===')
          print('StartColorManagement calls mailbox helper with r0=4, r1=5, r2=4.')
          print('helper uses bank offset r2<<7 = 0x200 from base 0xFFF50100 and copies request words to bank +0x40..+0x60.')
          print('request word0 = 0x40; subsequent words include callback 0x420A3639, shared parameter pointer 0x43705760, and caller/output pointers.')
          print('\n=== TARGET ===')
          print('Resolve the CA9 receiver for mailbox bank 4 and request opcode 0x40, then name its color-management handler and follow remap/config use directly.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v155_ca9_mailbox40_handler.txt
          git commit -m 'research: record v1.55 CA9 mailbox 0x40 handler trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push