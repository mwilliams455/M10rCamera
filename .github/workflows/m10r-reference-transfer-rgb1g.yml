name: M10-R YC preservation topology audit RGB1G
on:
  push:
    branches: [m10r-reference-transfer-rgb1g]
    paths:
      - '.github/workflows/m10r-reference-transfer-rgb1g.yml'
      - 'app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1GRenderer.java'
      - 'tools/M10RTransferRgb1GCli.java'
      - 'tools/m10r_reference_transfer_rgb1g_fit.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
          python3 -m pip install --quiet rawpy pillow numpy
      - name: Extract exact nonlinear assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/assets >/dev/null
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/assets/dg_expanded_u16le.bin' | sha256sum -c -
      - name: Compile RGB1G
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m10r_reference_transfer_rgb1g_fit.py tools/m10r_reference_transfer_rgb_fit.py tools/m10r_reference_order_fit.py
          mkdir -p /tmp/classes
          javac -d /tmp/classes app/src/main/java/com/m10r/diagnostic/{DngMetadataReader.java,DngRawDecoder.java,LosslessJpegDecoder.java,SensorPreviewCore.java,M10RColorSpecCore.java,M10RReferenceColorCore.java,M10RNeutralClipReferenceRenderer.java,M10RTransferRgb1GRenderer.java} tools/M10RTransferRgb1GCli.java
      - name: Render and score pairs
        shell: bash
        run: |
          set -euo pipefail; mkdir -p /tmp/rgb1g
          for id in 01 02 03 04 05 06; do
            base="https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_${id}"
            curl -L --fail --retry 3 "$base.jpg" -o /tmp/rgb1g/$id.jpg
            curl -L --fail --retry 3 "$base.dng" -o /tmp/rgb1g/$id.dng
            exiftool -j -n -Make -Model -SerialNumber -ImageUniqueID -DateTimeOriginal -CreateDate -ExposureTime -FNumber -ISO -FocalLength -ExposureCompensation -WhiteBalance -Contrast -Saturation -Sharpness /tmp/rgb1g/$id.jpg /tmp/rgb1g/$id.dng >/tmp/rgb1g/${id}_exif.json
            java -cp /tmp/classes com.m10r.diagnostic.M10RTransferRgb1GCli /tmp/rgb1g/$id.dng /tmp/assets/tone_medium_q15.u32le /tmp/assets/dg_expanded_u16le.bin /tmp/rgb1g/${id}_control.ppm /tmp/rgb1g/${id}_fwshared.ppm /tmp/rgb1g/${id}_ycpreserve.ppm 2000 | tee /tmp/rgb1g/${id}_render.txt
            python3 tools/m10r_reference_transfer_rgb1g_fit.py --jpg /tmp/rgb1g/$id.jpg --dng /tmp/rgb1g/$id.dng --control /tmp/rgb1g/${id}_control.ppm --fw-shared /tmp/rgb1g/${id}_fwshared.ppm --fw-yc-preserve /tmp/rgb1g/${id}_ycpreserve.ppm --sample $id --metadata-json /tmp/rgb1g/${id}_exif.json --out /tmp/rgb1g/${id}_metrics.json
            rm -f /tmp/rgb1g/$id.jpg /tmp/rgb1g/$id.dng /tmp/rgb1g/${id}_*.ppm
          done
      - name: Aggregate RGB1G
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,statistics
          from pathlib import Path
          modes=['rec709_shared_linear','fw_component_shared_linear','fw_yc_preserve_chroma'];base='rec709_shared_linear'
          rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/rgb1g').glob('*_metrics.json'))]
          valid=[r for r in rows if r['metadata'].get('identity_supported') is True and r['metadata'].get('default_jpeg_controls') is True]
          if len(valid)!=6: raise SystemExit(f'expected 6 valid pairs, got {len(valid)}')
          keys=['encoded_rgb_rmse','encoded_rgb_mae','luma_rmse','luma_mae','delta_e76_mean','hue_error_deg_mean','saturation_error_abs_mean']
          bins=('shadow','midtone','highlight','neutral_pixels','colourful_pixels')
          def med(m,k):return statistics.median(r['metrics'][m][k] for r in valid)
          def bm(m,b):return statistics.median(r['metrics'][m]['bins'][b]['rgb_rmse'] for r in valid)
          def clips(m):return sum(sum(r['metrics'][m]['highlight_channel_clipping'][c]['candidate_255_reference_below_250'] for c in 'RGB') for r in valid)
          agg={'valid':6,'medians':{},'bins':{},'falseClips':{},'sampleWins':{},'gate':{}}
          for m in modes:
            agg['medians'][m]={k:med(m,k) for k in keys};agg['bins'][m]={b:bm(m,b) for b in bins};agg['falseClips'][m]=clips(m)
          for m in modes[1:]:
            agg['sampleWins'][m]={
              'rgb':sum(r['metrics'][m]['encoded_rgb_rmse']<r['metrics'][base]['encoded_rgb_rmse'] for r in valid),
              'luma':sum(r['metrics'][m]['luma_rmse']<r['metrics'][base]['luma_rmse'] for r in valid),
              'de':sum(r['metrics'][m]['delta_e76_mean']<r['metrics'][base]['delta_e76_mean'] for r in valid),
              'highlight':sum(r['metrics'][m]['bins']['highlight']['rgb_rmse']<r['metrics'][base]['bins']['highlight']['rgb_rmse'] for r in valid)}
          b=agg['medians'][base];bh=agg['bins'][base]['highlight'];bc=agg['falseClips'][base]
          cand='fw_yc_preserve_chroma';q=agg['medians'][cand]
          ratios={k:q[k]/b[k] for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean')};hr=agg['bins'][cand]['highlight']/bh;fr=agg['falseClips'][cand]/bc if bc else None
          passed=(ratios['encoded_rgb_rmse']<=0.99 and ratios['luma_rmse']<=0.99 and ratios['delta_e76_mean']<=1.02 and hr<=0.95 and q['hue_error_deg_mean']<=b['hue_error_deg_mean']*1.05+0.5 and q['saturation_error_abs_mean']<=b['saturation_error_abs_mean']*1.05+0.005 and agg['falseClips'][cand]<=bc*1.10 and agg['sampleWins'][cand]['rgb']>=4 and agg['sampleWins'][cand]['highlight']>=4)
          agg['gate'][cand]={'core_ratios':ratios,'highlight_ratio':hr,'false_clip_ratio':fr,'passed':passed}
          # Also isolate reconstruction against the same firmware-component-Y input.
          old='fw_component_shared_linear';qo=agg['medians'][old]
          agg['reconstruction_delta_vs_fw_shared']={
            'rgb_ratio':q['encoded_rgb_rmse']/qo['encoded_rgb_rmse'],
            'luma_ratio':q['luma_rmse']/qo['luma_rmse'],
            'de_ratio':q['delta_e76_mean']/qo['delta_e76_mean'],
            'highlight_ratio':agg['bins'][cand]['highlight']/agg['bins'][old]['highlight'],
            'false_clip_ratio':agg['falseClips'][cand]/agg['falseClips'][old] if agg['falseClips'][old] else None}
          verdict='RGB1G_FAVORS_FIRMWARE_YC_PRESERVE_CHROMA' if passed else 'RGB1G_YC_PRESERVE_DOES_NOT_CLEAR_PROMOTION_GATE'
          agg['verdict']=verdict;agg['run']=os.environ.get('GITHUB_RUN_ID');agg['commit']=os.environ.get('GITHUB_SHA')
          out=['M10-R REFERENCE TRANSFER RGB1G — YC PRESERVATION TOPOLOGY AUDIT','',
               'No fitting. Scale 0.94, exact MEDIUM->DG, exact B2Y record 0x0C RGB->YC matrix. YC inverse is mathematical only.','', '=== Aggregate ===']
          for m in modes:out.append(f"{m}: medians={agg['medians'][m]} bins={agg['bins'][m]} falseClips={agg['falseClips'][m]} wins={agg['sampleWins'].get(m,'control')}")
          out+=['','=== YC preserve gate versus RGB1D control ===',str(agg['gate'][cand]),'','=== Reconstruction-only delta versus firmware-component shared-linear ===',str(agg['reconstruction_delta_vs_fw_shared']),'','VERDICT '+verdict,'',f"Workflow run id: {agg['run']}",f"Analysis input commit: {agg['commit']}"]
          Path('research/M10R_REFERENCE_TRANSFER_RGB1G.md').write_text('\n'.join(out)+'\n');Path('research/M10R_REFERENCE_TRANSFER_RGB1G.json').write_text(json.dumps({'samples':rows,'aggregate':agg},indent=2,sort_keys=True)+'\n');print('\n'.join(out))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-REFERENCE-TRANSFER-RGB1G
          path: |
            /tmp/rgb1g/*_metrics.json
            /tmp/rgb1g/*_render.txt
            research/M10R_REFERENCE_TRANSFER_RGB1G.md
            research/M10R_REFERENCE_TRANSFER_RGB1G.json
          if-no-files-found: warn
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_REFERENCE_TRANSFER_RGB1G.*
          git commit -m 'research: record YC preservation topology audit RGB1G' || exit 0
          git pull --rebase origin m10r-reference-transfer-rgb1g
          git push
