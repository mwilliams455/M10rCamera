name: M10-R v0.25 surgical BV reader and selector caller trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v025-surgical-bv-selector.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Surgical trace
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std;
          static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);}
          struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}};
          static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;}
          int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v025_surgical_bv_selector.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC

          def sx(v,bits):
              return v-(1<<bits) if v&(1<<(bits-1)) else v

          class S:
              def __init__(self,path,base,pfx=4):
                  self.b=Path(path).read_bytes(); self.base=base; self.pfx=pfx
                  self.code=self.b[pfx:]; self.end=base+len(self.code)
                  self.md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); self.md.detail=True; self.md.skipdata=True
              def foff(self,a): return self.pfx+a-self.base
              def u16a(self,a):
                  o=self.foff(a); return struct.unpack_from('<H',self.b,o)[0] if 0<=o<=len(self.b)-2 else None
              def u32a(self,a):
                  o=self.foff(a); return struct.unpack_from('<I',self.b,o)[0] if 0<=o<=len(self.b)-4 else None
              def astr(self,a,n=160):
                  o=self.foff(a)
                  if not 0<=o<len(self.b): return None
                  out=[]
                  for c in self.b[o:o+n]:
                      if c==0: break
                      if c in (9,10,13) or 32<=c<127: out.append(chr(c))
                      else: return None
                  s=''.join(out); return s if len(s)>=4 else None
              def fmt(self,i):
                  ex=''
                  if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      la=((i.address+4)&~3)+i.operands[1].mem.disp; v=self.u32a(la)
                      if v is not None:
                          st=self.astr(v); ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={st!r}' if st else '')
                  if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: ex+=f' ; CALL {i.operands[0].imm:#x}'
                  return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
              def dump_forward(self,a,nbytes,title):
                  print(f'\n=== {title} FROM {a:#x} ===')
                  o=self.foff(a)
                  for i in self.md.disasm(self.b[o:o+nbytes],a):
                      if i.mnemonic!='.byte': print(self.fmt(i))
              def dump_context(self,a,pre=0x40,post=0x60,title='CTX'):
                  # Try several halfword starts and choose the earliest stream that lands exactly on a.
                  best=None
                  for st in range(max(self.base,a-pre)&~1,a+1,2):
                      o=self.foff(st); seq=[]; hit=False
                      for i in self.md.disasm(self.b[o:self.foff(a+post)],st):
                          if i.mnemonic=='.byte': continue
                          if i.address>a+post: break
                          seq.append(i)
                          if i.address==a: hit=True
                      if hit and (best is None or st<best[0]): best=(st,seq)
                  print(f'\n=== {title} @ {a:#x} ===')
                  if best:
                      for i in best[1]: print(self.fmt(i))
                  else:
                      self.dump_forward(a,post,title+' FORWARD_ONLY')
              def literal_locations(self,val):
                  pat=struct.pack('<I',val); out=[]; q=0
                  while True:
                      q=self.b.find(pat,q)
                      if q<0: break
                      if q>=self.pfx: out.append(self.base+q-self.pfx)
                      q+=1
                  return out
              def raw_ldr_literal_refs(self,literal_addresses):
                  lits=set(literal_addresses); refs=[]
                  # Scan halfword-aligned code only; no whole-section Capstone decode.
                  for p in range(0,len(self.code)-4,2):
                      a=self.base+p; h1=struct.unpack_from('<H',self.code,p)[0]
                      la=None; rt=None; size=2
                      if (h1 & 0xF800)==0x4800: # LDR Rt,[PC,#imm8*4]
                          rt=(h1>>8)&7; la=((a+4)&~3)+((h1&0xff)<<2)
                      elif h1 in (0xF8DF,0xF85F): # LDR.W literal +/- imm12
                          h2=struct.unpack_from('<H',self.code,p+2)[0]; rt=(h2>>12)&0xf; imm=h2&0xfff; size=4
                          la=((a+4)&~3)+(imm if h1==0xF8DF else -imm)
                      if la in lits: refs.append((a,la,rt,size))
                  return refs
              def raw_bl_callers(self,target):
                  out=[]
                  for p in range(0,len(self.code)-4,2):
                      h1,h2=struct.unpack_from('<HH',self.code,p)
                      # Thumb-2 BL immediate T1: 11110 S imm10 / 11 J1 1 J2 imm11
                      if (h1 & 0xF800)!=0xF000 or (h2 & 0xD000)!=0xD000: continue
                      s=(h1>>10)&1; imm10=h1&0x3ff; j1=(h2>>13)&1; j2=(h2>>11)&1; imm11=h2&0x7ff
                      i1=(~(j1^s))&1; i2=(~(j2^s))&1
                      imm25=(s<<24)|(i1<<23)|(i2<<22)|(imm10<<12)|(imm11<<1)
                      d=sx(imm25,25); a=self.base+p; dst=(a+4+d)&0xffffffff
                      if (dst&~1)==(target&~1): out.append(a)
                  return out

          img=S('/tmp/sections/092_IMG-System.bin',0x42000000)
          pack=0x408f0ec0
          plits=img.literal_locations(pack); prefs=img.raw_ldr_literal_refs(plits)
          print('################ IMG PACKED BV READERS ################')
          print('PACK',hex(pack),'LITERALS',[hex(x) for x in plits])
          print('LDR_REFS',[(hex(a),hex(la),r,s) for a,la,r,s in prefs])
          for a,la,r,s in prefs:
              img.dump_forward(a,0x180,f'PACK REF {a:#x} r{r}')
          print('\nKNOWN BV BYTE OFFSETS: +2A/+2B Integral, +2C/+2D Spot, +2E/+2F MFM, +30/+31 AV-field')

          ctrl=S('/tmp/sections/090_CTRL-System.bin',0x08000000)
          setter=0x0800de28; callers=ctrl.raw_bl_callers(setter)
          print('\n################ CTRL SELECTOR SETTER CALLERS ################')
          print('SETTER',hex(setter),'DIRECT_BL_CALLERS',[hex(x) for x in callers])
          for a in callers: ctrl.dump_context(a,0x60,0x50,f'SELECTOR SETTER CALLER {a:#x}')
          ctrl.dump_forward(setter,0x20,'SELECTOR SETTER BODY')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v025_surgical_bv_selector.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.25 surgical BV reader and selector caller trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
