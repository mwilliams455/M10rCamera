name: M10-R RENDER1R TONECAL1A candidate
on:
  push:
    branches: [m10r-render1r-tonecal1a]
    paths:
      - 'native/m10rToneCal1A.h'
      - 'tools/m10r_tonecal1a_validate.py'
      - 'tools/m10r_tonecal1a_fetch_refs.py'
      - 'patches/fix-m10r-render1r-tonecal1a.py'
      - '.github/workflows/m10r-render1r-tonecal1a.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  photographic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install fixed measurement dependencies
        run: |
          python3 -m pip install numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.13.0.92 rawpy==0.25.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - uses: actions/download-artifact@v4
        with:
          name: M10R-PHOTOAUDIT1A-RESEARCH-INPUTS
          run-id: 35518775600
          github-token: ${{ github.token }}
          path: inputs
      - name: Fetch predeclared new published reference pairs
        run: python3 tools/m10r_tonecal1a_fetch_refs.py inputs
      - name: Check unchanged core, original validation, and new test-only scenes
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 tools/m10r_tonecal1a_validate.py inputs validation --fresh
          python3 - <<'PY'
          import json
          r=json.load(open('validation/results.json'))
          assert r['apk_gate_passed'] is True and r['training_fit_reproduced'] is True
          assert r['status']=='PASS_NATIVE_TONECAL1A_TEST_CANDIDATE'
          PY
      - name: Upload photographic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-RENDER1R-TONECAL1A-EVIDENCE
          path: |
            validation/results.json
            validation/REPORT.md
            validation/manifest.json
            validation/*.jpg
            inputs/fresh/provenance.json
            native/m10rToneCal1A.h
            tools/m10r_tonecal1a_validate.py
            tools/m10r_tonecal1a_fetch_refs.py
            patches/fix-m10r-render1r-tonecal1a.py
          retention-days: 90
          if-no-files-found: error
  build-candidate:
    needs: photographic-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct and verify exact frozen RENDER1Q
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess,hashlib
          p=Path('.github/workflows/m10r-render1q-yblend1b-k035-apk.yml')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='791f7ed52cd27e1785a9d41abf3401995ee96ad01ad9a322c70d18dcd0cccd06'
          steps=next(iter(yaml.safe_load(p.read_text())['jobs'].values()))['steps']
          count=0
          for s in steps:
              if s.get('uses','').startswith('actions/setup-java@'): break
              if 'run' in s:
                  print('REPRODUCE BASELINE:',s.get('name'),flush=True)
                  subprocess.run(['bash','-euo','pipefail','-c',s['run']],check=True)
                  count+=1
          assert count>=3,count
          PY
      - name: Apply bounded native tone-only candidate
        run: |
          python3 patches/fix-m10r-render1r-tonecal1a.py PhotonCamera
          grep -F 'm10r_tonecal1a::apply' PhotonCamera/app/src/main/cpp/m10rRender.cpp
          grep -F 'RENDER1R_TONECAL1A' PhotonCamera/app/src/main/java/com/particlesdevs/photoncamera/m10r/M10RNativeRenderer.java
          cp PhotonCamera/M10R_RENDER1R_TONECAL1A_PROVENANCE.json .
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install fixed Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Build candidate APK
        run: |
          set -o pipefail
          chmod +x PhotonCamera/gradlew
          cd PhotonCamera
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/M10R_RENDER1R_TONECAL1A_GRADLE.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-RENDER1R-TONECAL1A-BUILDLOG
          path: M10R_RENDER1R_TONECAL1A_GRADLE.log
          if-no-files-found: ignore
      - name: Upload test APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: M10RCam-RENDER1R-TONECAL1A-TEST-APK
          path: |
            PhotonCamera/app/build/outputs/apk/debug/*.apk
            M10R_RENDER1R_TONECAL1A_PROVENANCE.json
            PHOTON_UPSTREAM_COMMIT.txt
          if-no-files-found: error
