name: M10-R output-space transfer 3A
on:
  push:
    paths: ['.github/workflows/m10r-outputspace-transfer3a.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CA9 CCT table and CM call chain
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3A.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();B=0x40000000;P=4
          m=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);m.detail=True
          def o(a):return P+a-B
          def ds(a,z):return list(m.disasm(b[o(a):o(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
            return None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;q=o(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
            return None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';c=call(i);x=lit(i)
            if c is not None:s+=f' ; CALL={c:#x}'
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            return s
          allins=ds(B,B+len(b)-P)
          print('M10-R OUTPUTSPACE TRANSFER3A')
          print('\n=== CCT REGION 0x40005000..0x40005720 ===')
          rr=ds(0x40005000,0x40005720)
          for i in rr:print(fmt(i))
          starts=[i.address for i in rr if i.mnemonic=='push' and 'lr' in i.op_str]
          print('\nSTARTS',[hex(x) for x in starts])
          for s in starts:
            print('\nCALLERS',hex(s))
            for i in allins:
              if call(i)==s:print(fmt(i))
          print('\n=== CCT TABLE 0x40013D48: 31 x 32-BYTE RECORDS AS 4 DOUBLES ===')
          q=o(0x40013d48)
          for n in range(31):
            vals=struct.unpack_from('<4d',b,q+n*32)
            print(n, *(f'{x:.12g}' for x in vals))
          print('\n=== AUX TABLE 0x40014128: 31 x 16? BYTES AS DOUBLES ===')
          q=o(0x40014128)
          for n in range(31):
            vals=struct.unpack_from('<2d',b,q+n*16)
            print(n, *(f'{x:.12g}' for x in vals))
          print('\n=== KELVIN LOOKUP FUNCTION EXTENDED 0x4000A900..0x4000AE30 ===')
          kr=ds(0x4000a900,0x4000ae30)
          for i in kr:print(fmt(i))
          ks=[i.address for i in kr if i.mnemonic=='push' and 'lr' in i.op_str]
          print('\nKSTARTS',[hex(x) for x in ks])
          for s in ks:
            print('\nKCALLERS',hex(s))
            for i in allins:
              if call(i)==s:print(fmt(i))
          print('\n=== CM CORE CALLS TO CCT REGION ===')
          targets=set(starts+ks)
          for i in ds(0x40003000,0x40005000):
            c=call(i)
            if c is not None and (c in targets or 0x40005000<=c<0x40005720):print(fmt(i))
          print('\n=== DECISION ===')
          print('Establish whether the CA9 CM core calls temperature conversion during output CC construction and whether its 31-point domain explains eTfRemappingData.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3A.txt
          git commit -m 'research: record CA9 CCT call chain 3A' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
