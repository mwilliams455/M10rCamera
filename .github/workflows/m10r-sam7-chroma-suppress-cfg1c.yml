name: M10-R SAM7 CHROMA SUPPRESS CFG1C
on:
  push:
    branches: [m10r-b2y-chromasuppress-sam7-1a]
    paths:
      - '.github/workflows/m10r-sam7-chroma-suppress-cfg1c.yml'
      - 'tools/m10r_sam7_chroma_suppress_cfg1c.py'
      - 'tools/m10r_sections.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone==5.0.3
      - name: Decode canonical firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker);z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Walk chroma suppress CFG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg1c_results
          python3 tools/m10r_sam7_chroma_suppress_cfg1c.py /tmp/sec --out cfg1c_results/M10R_SAM7_CHROMA_SUPPRESS_CFG1C.json | tee cfg1c_results/M10R_SAM7_CHROMA_SUPPRESS_CFG1C.txt
          python3 - <<'PY'
          import json
          d=json.load(open('cfg1c_results/M10R_SAM7_CHROMA_SUPPRESS_CFG1C.json'))
          assert d['reaches_main_programmer'] is True,d
          assert d['page_refs'],d
          print('CFG reaches main programmer and 0x20021100 page')
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/generated
          cp cfg1c_results/M10R_SAM7_CHROMA_SUPPRESS_CFG1C.* research/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/M10R_SAM7_CHROMA_SUPPRESS_CFG1C.*
          git commit -m "Research freeze SAM7 chroma suppression CFG1C" || exit 0
          git push origin HEAD:m10r-b2y-chromasuppress-sam7-1a
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-SAM7-CHROMA-SUPPRESS-CFG1C
          path: cfg1c_results/
          retention-days: 90
