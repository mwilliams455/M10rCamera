name: M10-R v0.19 AE final callback trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v019-ae-final-callback-trace.yml']
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace AE caller and final callback
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); base=0x42000000; pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return pfx+a-base
          def va(o): return base+o-pfx
          def r32(a):
              o=off(a)
              return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def lit(i):
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  la=((i.address+4)&~3)+i.operands[1].mem.disp
                  return la,r32(la)
              return None,None
          def dump(label,a,z):
              print(f'\n=== {label} {a:#010x}..{z:#010x} ===')
              for i in md.disasm(b[off(a):off(z)],a):
                  if i.mnemonic=='.byte': continue
                  la,v=lit(i); ex=f' ; LIT {la:#010x}->{v:#010x}' if v is not None else ''
                  print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}')
          def rawrefs(v):
              pat=struct.pack('<I',v); hits=[]; q=0
              while True:
                  q=b.find(pat,q)
                  if q<0:break
                  hits.append(va(q));q+=1
              return hits
          def bl_calls(target):
              out=[]
              for o in range(pfx,len(b)-4,2):
                  h1,h2=struct.unpack_from('<HH',b,o)
                  if (h1 & 0xF800)!=0xF000 or (h2 & 0xD000)!=0xD000: continue
                  S=(h1>>10)&1; imm10=h1&0x3ff; J1=(h2>>13)&1; J2=(h2>>11)&1; imm11=h2&0x7ff
                  I1=(~(J1^S))&1; I2=(~(J2^S))&1
                  imm=(S<<24)|(I1<<23)|(I2<<22)|(imm10<<12)|(imm11<<1)
                  if imm&(1<<24): imm-=1<<25
                  a=va(o); d=(a+4+imm)&0xffffffff
                  if d==target: out.append(a)
              return out
          def ascii_near(a,radius=0x200):
              s=b[max(0,off(a)-radius):min(len(b),off(a)+radius)]
              vals=[]
              for m in re.finditer(rb'[ -~]{8,}',s): vals.append(m.group().decode('ascii','replace'))
              return vals
          targets=[0x420a2fb4,0x420a789c,0x420a2ffc,0x420a78bc,0x420a2eb0,0x420a78d4]
          print('=== DIRECT_BL_CALLS ===')
          for t in targets: print(hex(t), [hex(x) for x in bl_calls(t)])
          print('\n=== RAW POINTER REFS ===')
          for t in [0x420a2fb5,0x420a789d,0x420a78bd,0x420a78d5,0x408187f0,0x408187ec,0x408ced00,0x43705a60]: print(hex(t),[hex(x) for x in rawrefs(t)])
          dump('AE_START_CALLERS',0x4216b760,0x4216ba20)
          dump('AE_REAL_CALLBACK',0x420a7800,0x420a79c0)
          dump('AE_START_AND_NEIGHBORS',0x420a2f50,0x420a3060)
          # For each literal pool word containing state globals, decode +/-0x180 around pool to reveal PC-relative users.
          for g in [0x408187f0,0x408187ec,0x408ced00,0x43705a60]:
              for h in rawrefs(g): dump('GLOBAL_POOL_'+hex(g)+'_AT_'+hex(h),max(base,h-0x180),min(base+len(b)-pfx,h+0x100))
          print('\n=== ASCII NEAR CALLER ===')
          for s in ascii_near(0x4216b8c0,0x500): print(s)
          print('\n=== ASCII NEAR CALLBACK ===')
          for s in ascii_near(0x420a789c,0x500): print(s)
          PY