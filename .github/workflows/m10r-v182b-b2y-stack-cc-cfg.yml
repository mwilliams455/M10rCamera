name: M10-R v1.82b B2Y stack CC CFG
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v182b-b2y-stack-cc-cfg.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Reachable-CFG trace of B2Y stack CC window
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v182b_b2y_stack_cc_cfg.txt
          from pathlib import Path
          import struct,collections
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=False
          def off(a):return P+a-BASE
          def one(a):
            x=list(md.disasm(b[off(a):off(a)+4],a,count=1));return x[0] if x else None
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def btgt(i):
            if i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          lo,hi=0x4215220c,0x42152eec
          q=collections.deque([lo]);seen=set();ins={};edges=[]
          while q:
            a=q.popleft()
            while lo<=a<hi and a not in seen:
              i=one(a)
              if not i:break
              seen.add(a);ins[a]=i; nxt=a+i.size
              m=i.mnemonic
              if m in ('bl','blx'):
                q.append(nxt);break
              if m.startswith('b') and m not in ('bl','blx','bx'):
                t=btgt(i)
                if t and lo<=t<hi:q.append(t);edges.append((a,t))
                # unconditional plain b stops, conditional branches keep fallthrough
                if m=='b':break
                q.append(nxt);break
              if m in ('cbz','cbnz'):
                t=btgt(i)
                if t and lo<=t<hi:q.append(t);edges.append((a,t))
                q.append(nxt);break
              if m=='bx' or (m=='pop' and 'pc' in i.op_str):break
              # branch-table / indirect PC writes: stop conservatively
              try:
                _,wr=i.regs_access()
                if ARM_REG_PC in wr:break
              except:pass
              a=nxt
          print('M10-R v1.82b B2Y STACK CC REACHABLE CFG')
          print('reachable_instruction_count',len(ins),'range',hex(min(ins)),hex(max(ins)))
          print('\n=== reachable r6 writes/refs ===')
          for a,i in sorted(ins.items()):
            try:
              rr,rw=i.regs_access()
              if ARM_REG_R6 in rr or ARM_REG_R6 in rw:print(fmt(i),'R6R',ARM_REG_R6 in rr,'R6W',ARM_REG_R6 in rw)
            except:pass
          print('\n=== SP stack-window accesses 0x100..0x170 ===')
          hits=[]
          for a,i in sorted(ins.items()):
            try:
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_SP and 0x100<=op.mem.disp<=0x170:
                  hits.append(a);print(fmt(i),'SPDISP',hex(op.mem.disp))
              # add/sub reg, sp, #imm pointer formation
              if i.mnemonic in ('add','adds','sub','subs') and len(i.operands)>=3 and i.operands[1].type==ARM_OP_REG and i.operands[1].reg==ARM_REG_SP and i.operands[2].type==ARM_OP_IMM and 0x100<=i.operands[2].imm<=0x170:
                hits.append(a);print(fmt(i),'SPPTR',hex(i.operands[2].imm))
            except:pass
          print('\n=== neighborhoods around stack-window hits ===')
          aa=sorted(ins)
          for h in sorted(set(hits)):
            print('\n-- hit',hex(h),'--')
            near=[a for a in aa if h-0x40<=a<=h+0x60]
            for a in near:print(fmt(ins[a]))
          print('\n=== calls on reachable path ===')
          for a,i in sorted(ins.items()):
            c=call(i)
            if c is not None:print(hex(a),'->',hex(c))
          print('\n=== branches to central-call tail ===')
          for a,t in edges:
            if 0x42152e80<=t<hi or 0x42152e80<=a<hi:print(hex(a),'->',hex(t))
          print('\nTARGET: identify exact reachable producers/copy calls for stack SP+0x110..0x158 (central B2Y +0x10C..+0x154), excluding inline data.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v182b_b2y_stack_cc_cfg.txt
          git commit -m 'research: record v1.82b B2Y stack CC CFG trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push