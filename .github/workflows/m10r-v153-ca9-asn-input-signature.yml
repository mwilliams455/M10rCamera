name: M10-R v1.53 CA9 ASN input signature
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v153-ca9-asn-input-signature.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Find CA9 color-management routine from ASN input signature
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v153_ca9_asn_input_signature.txt
          from pathlib import Path
          import struct,collections
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,n=260):
            o=off(a)
            if not 0<=o<len(b): return None
            e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(32<=x<127 for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          ins=list(md.disasm(b[PFX:],BASE))
          print('M10-R v1.53 CA9 ASN INPUT SIGNATURE')
          # Collect vldr/ldr pairs using offsets 8/10/18 on same base register in compact windows.
          mem=[]
          for i in ins:
            try:
              for o in i.operands:
                if o.type==ARM_OP_MEM and o.mem.disp in (8,0x10,0x18):
                  mem.append((i,o.mem.base,o.mem.disp))
            except:pass
          print('\n=== compact regions containing all +8/+10/+18 offsets on same base reg ===')
          candidates=[]
          for idx,(i,base,disp) in enumerate(mem):
            near=[x for x in mem if abs(x[0].address-i.address)<=0x140 and x[1]==base]
            ds={x[2] for x in near}
            if ds=={8,0x10,0x18} or {8,0x10,0x18}.issubset(ds):
              lo=min(x[0].address for x in near);hi=max(x[0].address for x in near)
              key=(lo,hi,base)
              if key not in candidates:candidates.append(key)
          # coalesce overlaps
          merged=[]
          for lo,hi,base in sorted(candidates):
            if merged and base==merged[-1][2] and lo<=merged[-1][1]+0x40: merged[-1]=(merged[-1][0],max(hi,merged[-1][1]),base)
            else: merged.append((lo,hi,base))
          for x in merged: print(hex(x[0]),hex(x[1]),'base_reg',x[2])
          print('\n=== candidate windows ===')
          for lo,hi,base in merged:
            a=max(BASE,lo-0x180);z=min(BASE+len(b)-PFX,hi+0x300)
            print(f'-- candidate {a:#x}..{z:#x} base={base} --')
            for i in dis(a,z):print(fmt(i))
          print('\n=== triple double-like loads specifically (vldr/vldm or paired ldr words) ===')
          for lo,hi,base in merged:
            for i in dis(max(BASE,lo-0x100),min(BASE+len(b)-PFX,hi+0x180)):
              if i.mnemonic.startswith(('vldr','vldm','ldm','ldr')):
                try:
                  if any(o.type==ARM_OP_MEM and o.mem.base==base and o.mem.disp in (8,0x10,0x18) for o in i.operands):print(fmt(i))
                except:pass
          print('\n=== likely call targets inside candidate windows and their callers ===')
          targets=[]
          for lo,hi,base in merged:
            for i in dis(max(BASE,lo-0x180),min(BASE+len(b)-PFX,hi+0x300)):
              c=call(i)
              if c is not None and BASE<=c<BASE+len(b)-PFX and c not in targets:targets.append(c)
          for t in targets:
            callers=[i.address for i in ins if call(i)==t]
            print(hex(t),'callers',[hex(x) for x in callers[:40]])
          print('\n=== functions using 256.0 and candidate ASN input offsets ===')
          # literal 256.0 high word; report local references and overlap with merged regions
          pat=struct.pack('<I',0x40700000);p=0;pools=[]
          while True:
            p=b.find(pat,p)
            if p<0:break
            pools.append(BASE+p-PFX);p+=4
          print('256_literals',[hex(x) for x in pools])
          refs=[]
          for i in ins:
            q=lit(i)
            if q and q[1]==0x40700000:refs.append(i.address)
          print('256_refs',[hex(x) for x in refs])
          for a in refs:
            print(f'-- 256 ref {a:#x} --')
            for i in dis(max(BASE,a-0x100),min(BASE+len(b)-PFX,a+0x180)):print(fmt(i))
          print('\n=== searches for 3-output double stores at 0/8/16 or B8/C0/C8 near candidates ===')
          for lo,hi,base in merged:
            a=max(BASE,lo-0x200);z=min(BASE+len(b)-PFX,hi+0x500)
            for i in dis(a,z):
              if i.mnemonic.startswith(('str','vstr','stm')):
                try:
                  ds=[o.mem.disp for o in i.operands if o.type==ARM_OP_MEM]
                  if any(d in (0,8,0x10,0xb8,0xbc,0xc0,0xc4,0xc8,0xcc) for d in ds):print(fmt(i))
                except:pass
          print('\n=== TARGET ===')
          print('Identify the CA9 per-frame color-management routine from the proven ASN input layout +8/+10/+18. Then trace its remap-table consumer and output triplet rather than matching ambiguous output offsets globally.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v153_ca9_asn_input_signature.txt
          git commit -m 'research: record v1.53 CA9 ASN input signature trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push