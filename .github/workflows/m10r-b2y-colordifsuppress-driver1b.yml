name: M10-R B2Y COLORDIFSUPPRESS DRIVER1B
on:
  push:
    branches: [m10r-b2y-colordifsuppress1b]
    paths:
      - '.github/workflows/m10r-b2y-colordifsuppress-driver1b.yml'
      - 'tools/m10r_b2y_colordifsuppress_driver1b.py'
      - 'tools/m10r_sections.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone==5.0.3
      - name: Decode canonical M10-R firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker);z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Decode color-difference suppression driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 tools/m10r_b2y_colordifsuppress_driver1b.py /tmp/sec --out results/M10R_B2Y_COLORDIFSUPPRESS_DRIVER1B.json | tee results/M10R_B2Y_COLORDIFSUPPRESS_DRIVER1B.txt
      - name: Assert page/function evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('results/M10R_B2Y_COLORDIFSUPPRESS_DRIVER1B.json'))
          assert d['selected_isa'] in ('THUMB','ARM')
          best=next(x for x in d['decodes'] if x['isa']==d['selected_isa'])
          assert best['instruction_count']>20,best['instruction_count']
          assert any(int(x['value'],16)>=0x20021100 and int(x['value'],16)<0x20021200 for x in best['mmio_literals'])
          print('decoded',d['selected_isa'],best['instruction_count'],'instructions')
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/generated
          cp results/M10R_B2Y_COLORDIFSUPPRESS_DRIVER1B.* research/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/M10R_B2Y_COLORDIFSUPPRESS_DRIVER1B.*
          git commit -m "Research freeze color-difference suppression driver" || exit 0
          git push origin HEAD:m10r-b2y-colordifsuppress1b
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-B2Y-COLORDIFSUPPRESS-DRIVER1B
          path: results/
          retention-days: 90
