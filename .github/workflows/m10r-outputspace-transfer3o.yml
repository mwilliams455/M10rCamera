name: M10-R output-space transfer 3O
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer3o.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Map 0x20022000 B2Y driver family and named setters
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER3O.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a): return P+a-B
          def ds(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except: pass
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=off(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except: pass
          def pcrel(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>1 and i.operands[1].type==ARM_OP_IMM:
                return ((i.address+4)&~3)+i.operands[1].imm
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i);c=call(i);p=pcrel(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            if p is not None:s+=f' ; PCREL={p:#x}'
            if c is not None:s+=f' ; CALL={c:#x}'
            return s
          allins=list(md.disasm(b[P:],B))
          print('M10-R OUTPUTSPACE TRANSFER3O')
          print('\n=== 0x20022000 LITERAL WORDS AND TRUE LOAD SITES ===')
          pat=struct.pack('<I',0x20022000);q=0;words=[]
          while True:
            x=b.find(pat,q)
            if x<0:break
            words.append(B+x-P);q=x+1
          print('WORDS',[hex(x) for x in words])
          loads=[]
          for i in allins:
            x=lit(i)
            if x and x[0] in words and x[1]==0x20022000:
              loads.append(i.address);print(fmt(i))
          print('LOADS',[hex(x) for x in loads])
          print('\n=== OWNER FUNCTIONS FOR TRUE LOADS ===')
          owners=[]
          for a in loads:
            cand=None
            for i in ds(max(B,a-0x300),a+2):
              if i.mnemonic=='push' and 'lr' in i.op_str:cand=i.address
            if cand is not None and cand not in owners:owners.append(cand)
          print('OWNERS',[hex(x) for x in owners])
          for s in owners:
            print('\nOWNER',hex(s))
            for i in ds(s,min(B+len(b)-P,s+0x380)):
              print(fmt(i))
              if i.address>s and i.mnemonic=='pop' and 'pc' in i.op_str:break
          print('\n=== ALL drv_img_b2y_* STRINGS ===')
          strings=[]
          for m in re.finditer(rb'[ -~]{5,}',b):
            t=m.group().decode('latin1','replace')
            if 'drv_img_b2y_' in t.lower():
              a=B+m.start()-P;strings.append((a,t));print(hex(a),repr(t[:240]))
          print('\n=== ADR/LITERAL REFERENCES TO NAMED B2Y STRINGS ===')
          string_ranges=[]
          for a,t in strings:string_ranges.append((a,a+len(t)+1,t))
          refs=[]
          for i in allins:
            p=pcrel(i)
            if p is not None:
              for lo,hi,t in string_ranges:
                if lo<=p<hi:
                  refs.append((i.address,p,t));print(fmt(i),'STR=',repr(t[:180]))
            x=lit(i)
            if x:
              for lo,hi,t in string_ranges:
                if lo<=x[1]<hi:
                  refs.append((i.address,x[1],t));print(fmt(i),'STRPTR=',repr(t[:180]))
          print('\n=== NAMED-STRING REFERENCE WINDOWS ===')
          for a,p,t in refs:
            print('\nREF',hex(a),'STR',repr(t[:160]))
            for i in ds(max(B,a-0x80),min(B+len(b)-P,a+0xa0)):print(fmt(i))
          print('\n=== CALLERS OF 0x20022000 OWNER FUNCTIONS ===')
          for s in owners:
            print('\nOWNER',hex(s))
            for i in allins:
              if call(i)==s:print(fmt(i))
          print('\n=== ALL 0x20022xxx CONSTANTS IN DRIVER AREA ===')
          vals=[]
          for q in range(off(0x420c0000),off(0x420e0000)-3):
            v=struct.unpack_from('<I',b,q)[0]
            if 0x20022000<=v<0x20023000:
              a=B+q-P
              if not vals or vals[-1]!=(a,v): vals.append((a,v))
          for a,v in vals: print(hex(a),hex(v))
          print('\n=== DRIVER-AREA STRINGS WITH B2Y/YCC/GAMMA/CC/TONE/DG ===')
          raw=b[off(0x420c0000):off(0x420e0000)]
          for m in re.finditer(rb'[ -~]{5,}',raw):
            t=m.group().decode('latin1','replace');tl=t.lower()
            if any(k in tl for k in ('b2y','ycc','ycbcr','gamma','tone','color','colour','cc0','cc1',' dg','dg_')):
              print(hex(0x420c0000+m.start()),repr(t[:240]))
          print('\n=== DECISION GATE ===')
          print('Name each 0x20022000 B2Y driver setter and separate operation-mode/output-format controls from any gamma/tone/DG/color-management setters. Determine whether any output-space-dependent snapshot data reaches a nonlinear-transfer setter.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER3O.txt
          git commit -m 'research: map 0x20022000 B2Y driver family 3O' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
