name: M10-R v0.17 ARM9 AE callback bridge
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v017-arm9-ae-callback.yml', '.m10r-v017-arm9-ae-callback-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace ARM9 AE callback
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 tools/m10r_unpack.py /tmp/M10-R.FW /tmp/M10R_unpacked.bin >/tmp/unpack.log
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v017-arm9-ae-callback.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC

          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();base=0x42000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a): return pfx+a-base
          def one(a,n=4):
            o=off(a)
            if o<0 or o>=len(b): return None
            ds=list(md.disasm(b[o:min(len(b),o+n)],a,1))
            return ds[0] if ds else None
          def r32(a):
            o=off(a)
            return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def dump(label,a,pre=0x180,post=0x380):
            print(f'\n=== {label} {a:#x} ===')
            s=max(base,a-pre)&~1;e=min(end,a+post)&~1
            cur=s
            while cur<e:
              i=one(cur,4)
              if not i:
                cur+=2;continue
              print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}')
              cur+=i.size

          needle=b'ARM9: AE MODULE: AE algorithm finished default call back!!!'
          q=b.find(needle)
          if q<0: raise SystemExit('callback string missing')
          target=base+q-pfx
          print('CALLBACK_STRING',hex(target),'file_off',hex(q))

          refs=[]
          # 1) Exact Thumb16 ADR T1 scan. Encoding 10100 Rd imm8; address is Align(PC,4)+imm8*4.
          lo=max(pfx,q-0x20000);hi=min(len(b)-2,q+0x1000)
          lo += lo&1
          for o in range(lo,hi,2):
            hw=struct.unpack_from('<H',b,o)[0]
            a=base+o-pfx
            if (hw & 0xF800)==0xA000:
              calc=((a+4)&~3)+((hw&0xff)<<2)
              if calc==target: refs.append((a,'ADR_T1'))

          # 2) Capstone one-instruction scan for ADR / PC arithmetic / PC literal loads.
          for a in range((base+lo-pfx)&~1,(base+hi-pfx)&~1,2):
            i=one(a,4)
            if not i: continue
            ops=i.operands
            if i.mnemonic=='adr' and len(ops)>=2 and ops[1].type==ARM_OP_IMM and (ops[1].imm&~1)==target:
              refs.append((a,'ADR_CAPSTONE'))
            if i.mnemonic in ('add','sub') and len(ops)>=3 and ops[1].type==ARM_OP_REG and ops[1].reg==ARM_REG_PC and ops[2].type==ARM_OP_IMM:
              pc=(a+4)&~3;calc=pc+ops[2].imm if i.mnemonic=='add' else pc-ops[2].imm
              if calc==target: refs.append((a,'PC_ARITH'))
            if i.mnemonic.startswith('ldr') and len(ops)>=2 and ops[1].type==ARM_OP_MEM and ops[1].mem.base==ARM_REG_PC:
              la=((a+4)&~3)+ops[1].mem.disp;v=r32(la)
              if v is not None and (v&~1)==target: refs.append((a,'LDR_LITERAL'))

          # 3) Raw absolute pointers to string.
          ptrs=[]
          for x in (target,target|1):
            pat=struct.pack('<I',x);s=0
            while True:
              k=b.find(pat,s)
              if k<0: break
              ptrs.append(base+k-pfx);s=k+1
          print('RAW_POINTERS',[hex(x) for x in sorted(set(ptrs))])
          refs=sorted(set(refs))
          print('CODE_REFS',[(hex(a),k) for a,k in refs])
          for a,k in refs: dump('CALLBACK_STRING_REF_'+k,a)
          for a in sorted(set(ptrs)): dump('RAW_POINTER_CONTEXT',a,0x100,0x180)

          # Search each ref's neighbourhood for likely function prologue and direct calls.
          for a,k in refs:
            print('\n=== LOCAL_CALLS near',hex(a),'===')
            s=max(base,a-0x300)&~1;e=min(end,a+0x500)&~1
            cur=s
            while cur<e:
              i=one(cur,4)
              if not i:cur+=2;continue
              if i.mnemonic in ('bl','blx'): print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}')
              cur+=i.size
          PY
          cat /tmp/unpack.log
          cat /tmp/m10r-v017-arm9-ae-callback.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v017-arm9-ae-callback
          path: /tmp/m10r-v017-arm9-ae-callback.txt
          if-no-files-found: error
