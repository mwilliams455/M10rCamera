name: M10-R v0.17 ARM9 AE callback bridge
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v017-arm9-ae-callback.yml', '.m10r-v017-arm9-ae-callback-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace ARM9 AE callback
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v017-arm9-ae-callback.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();base=0x42000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def va(o):return base+o-pfx
          def off(a):return pfx+a-base
          pats=[b'ARM9: AE MODULE: AE algorithm finished default call back!!!',b'ca9_StartWhiteBalance() - white balance module not active']
          strings=[]
          for p in pats:
            q=b.find(p);print('STRING',p.decode(),hex(q) if q>=0 else None,hex(va(q)) if q>=0 else None)
            if q>=0:strings.append((p.decode(),q,va(q)))
          targets={v:n for n,q,v in strings}
          # Limit scan to +-0x20000 around strings, enough for PC-relative Thumb references.
          hits=[]
          for name,q,t in strings:
            s=max(pfx,q-0x20000);e=min(len(b),q+0x20000)
            start=va(s)
            for i in md.disasm(b[s:e],start):
              if i.mnemonic=='.byte':continue
              ops=i.operands
              # Thumb ADR generally ADD Rd,PC,#imm; capstone can also mnemonic adr.
              if i.mnemonic=='adr' and len(ops)>=2 and ops[1].type==ARM_OP_IMM and ops[1].imm==t:
                hits.append((i.address,'ADR',t,i.mnemonic,i.op_str))
              if i.mnemonic in ('add','sub') and len(ops)>=3 and ops[1].type==ARM_OP_REG and ops[1].reg==ARM_REG_PC and ops[2].type==ARM_OP_IMM:
                pc=(i.address+4)&~3;calc=pc+ops[2].imm if i.mnemonic=='add' else pc-ops[2].imm
                if calc==t:hits.append((i.address,'PCADD',t,i.mnemonic,i.op_str))
              if i.mnemonic.startswith('ldr') and len(ops)>=2 and ops[1].type==ARM_OP_MEM and ops[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+ops[1].mem.disp;lo=off(la)
                if 0<=lo<=len(b)-4:
                  w=struct.unpack_from('<I',b,lo)[0]&~1
                  if w==t:hits.append((i.address,'LDRLIT',t,i.mnemonic,i.op_str))
          print('HITS',[(hex(a),k,targets[t],m,o) for a,k,t,m,o in hits])
          def context(a):
            s=max(base,a-0x300);e=min(end,a+0x500);s&=~1
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte':print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          for a,k,t,m,o in hits:
            print('\n=== HIT',hex(a),k,targets[t],m,o,'===');context(a)
          # Also find raw absolute target pointers (if any), and dump nearby code.
          for name,q,t in strings:
            for x in (t,t|1):
              n=struct.pack('<I',x);z=0
              while True:
                z=b.find(n,z)
                if z<0:break
                a=va(z);print('\nRAW_PTR',name,hex(x),'at',hex(a));context(a);z+=1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v017-arm9-ae-callback
          path: /tmp/m10r-v017-arm9-ae-callback.txt
          if-no-files-found: error
