name: M10-R v1.01 AFAEAWB grid programming
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v101-afaeawb-grid-programming.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace frozen 22x16 fields into Prepro programming
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v101_afaeawb_grid_programming.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def u32a(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            x=b[o:min(len(b),o+220)].split(b'\0',1)[0]
            try:s=x.decode('ascii')
            except:return None
            return s if len(s)>=4 and all((32<=ord(c)<127) or c in '\r\n\t' for c in s) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                a=((i.address+4)&~3)+i.operands[1].mem.disp;return a,u32a(a)
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q and q[1] is not None:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            return s
          # bounded Prepro core disassembly
          lo,hi=0x420d8000,0x420e8000
          ins=[i for i in md.disasm(b[off(lo):off(hi)],lo) if i.id]
          print('M10-R v1.01 AFAEAWB GRID PROGRAMMING TRACE')
          print('Frozen: mode-data +0x18 = horizontal blocks = 22; +0x1C = vertical blocks = 16.')
          targets=[0x420dae48,0x420d9304,0x420d9014,0x420d9ad0]
          for t in targets:
            callers=[n for n,i in enumerate(ins) if i.mnemonic in ('bl','blx') and i.op_str.strip()==hex(t)]
            print(f'\n=== CALLERS {t:#x} count {len(callers)} ===')
            for n in callers:
              print(f'\n--- caller @{ins[n].address:#x} ---')
              for j in range(max(0,n-28),min(len(ins),n+45)):print(fmt(ins[j]))
          # All direct loads of +0x18/+0x1c following 0x420D9304 within 120 instructions.
          print('\n=== MODE OBJECT +0x18/+0x1C CONSUMERS AFTER GETTER ===')
          getter_idxs=[n for n,i in enumerate(ins) if i.mnemonic in ('bl','blx') and i.op_str.strip()==hex(0x420d9304)]
          for n in getter_idxs:
            hit=[]
            for j in range(n+1,min(len(ins),n+121)):
              q=ins[j]
              try:
                if q.mnemonic.startswith('ldr') and len(q.operands)>=2 and q.operands[1].type==ARM_OP_MEM and q.operands[1].mem.disp in (0x18,0x1c):hit.append(j)
              except:pass
              if q.mnemonic=='pop':break
            if hit:
              print(f'\nGETTER @{ins[n].address:#x}')
              for h in hit:
                print('HIT',fmt(ins[h]))
                for j in range(max(n,h-10),min(len(ins),h+14)):print(fmt(ins[j]))
          # Search driver strings for programming/API names mentioning block/count/window AFAEAWB.
          print('\n=== RELEVANT DRIVER STRINGS ===')
          p=0
          while p<len(b):
            if 32<=b[p]<127:
              q=p
              while q<len(b) and 32<=b[q]<127:q+=1
              if q-p>=5 and q<len(b) and b[q]==0:
                try:s=b[p:q].decode('ascii')
                except:s=''
                sl=s.lower()
                if ('afaeawb' in sl or 'aeawb' in sl) and any(k in sl for k in ('block','window','config','set','get','mode')):
                  print(hex(BASE+p-PFX),repr(s))
                p=q+1;continue
            p+=1
          # Find exact literals 22 and 16 in data structures around known prepro globals and code immediates close to AFAEAWB routines.
          print('\n=== IMMEDIATE 22/16 IN PREPRO CORE ===')
          for n,i in enumerate(ins):
            if i.mnemonic in ('movs','mov','cmp') and re.search(r'#0x16\b|#0x10\b|#22\b|#16\b',i.op_str):
              # print only if local window has AFAEAWB-related call/global/string signature
              win=ins[max(0,n-20):min(len(ins),n+25)]
              if any(('0x420d93' in x.op_str or '0x420d90' in x.op_str or '0x420d9a' in x.op_str or (lit(x) and lit(x)[1] and cstr(lit(x)[1]) and ('AEAWB' in cstr(lit(x)[1]) or 'AFAEAWB' in cstr(lit(x)[1])))) for x in win):
                print(f'\n-- @{i.address:#x} {i.mnemonic} {i.op_str} --')
                for x in win:print(fmt(x))
          print('\n=== NEXT DECISION ===')
          print('If a non-debug path consumes +0x18/+0x1C to program block iteration/registers, follow that path to the statistic buffer base and per-block stride. Otherwise trace the named AFAEAWB Set/Window APIs found in strings.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v101_afaeawb_grid_programming.txt
          git commit -m 'research: record v1.01 AFAEAWB grid programming' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
