name: M10-R v1.36 color owner layout
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v136-color-owner-layout.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace owner of NeutralToXY SetWhiteXY bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12;)}return 0;}
          CPP
          # use known-good unpack source from a prior workflow instead of compiling the stub above
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v136_color_owner_layout.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+360));q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              z=cstr(q[1])
              if z:s+=f' STRING={z!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL {t:#x}'
            return s
          print('M10-R v1.36 COLOR OWNER LAYOUT')
          print('\n=== OWNER WINDOW 0x40003800..0x40004080 ===')
          ins=dis(0x40003800,0x40004080)
          for i in ins:print(fmt(i))
          print('\n=== PROLOGUES IN WINDOW ===')
          starts=[]
          for i in ins:
            if (i.mnemonic=='push' and 'lr' in i.op_str) or (i.mnemonic.startswith('stm') and 'sp!' in i.op_str and 'lr' in i.op_str):
              starts.append(i.address);print(hex(i.address),i.mnemonic,i.op_str)
          print('\n=== DIRECT CALLERS OF WINDOW PROLOGUES ===')
          for i in dis(0x40000000,0x40018000):
            if call(i) in starts:print(fmt(i))
          print('\n=== SOURCE-STATE R4 FIELD ACCESSES +0x00..+0xD0 ===')
          # print contexts around explicit memory ops based on r4; this owner uses r4 as the color result/source object through the NeutralToXY bridge.
          for idx,i in enumerate(ins):
            try:
              hit=any(op.type==ARM_OP_MEM and op.mem.disp in tuple(range(0,0xd1,4)) for op in i.operands)
            except: hit=False
            if hit and 'r4' in i.op_str:
              print(f'\n-- @{i.address:#x} --')
              for j in ins[max(0,idx-4):min(len(ins),idx+6)]:print(fmt(j))
          print('\n=== STRING-BACKED NAME CANDIDATES ===')
          for i in ins:
            q=lit(i)
            if q and cstr(q[1]):print(fmt(i))
          print('\n=== TARGET ===')
          print('Pin the owner function start/name and determine which frozen output fields (CC0/CC1, x/y, gains) it writes directly after NeutralToXY -> SetWhiteXY.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v136_color_owner_layout.txt
          git commit -m 'research: record v1.36 color owner layout' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
