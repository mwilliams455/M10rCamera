name: M10-R v0.73 SAM7 WBCLIPLEVEL local xref trace
on:
  push:
    branches: [m10r-wbcliplevel-v073]
    paths:
      - 'tools/m10r_wbcliplevel_sam7_local_v073.py'
      - '.github/workflows/m10r-wbcliplevel-v073.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet 'capstone==5.0.3'
      - name: Fetch and verify firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode and extract sections
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/u.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return b[o]|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");return(p[bit>>3]>>(7-(bit++&7)))&1;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>w((istreambuf_iterator<char>(f)),{});size_t C=0x38;uint32_t h=u32(w,C+8),e=u32(w,C+0x10);const uint8_t*t=&w[C+0x54];vector<uint8_t>o;o.reserve(e);size_t st=C+h;for(int i=0;i<8;i++){size_t q=st+i*16;uint32_t ro=u32(w,q+4),ps=u32(w,q+8),us=u32(w,q+12);BR br{&w[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=x>=(1<<(k-1))?x:x-((1<<k)-1);o.push_back(t[v+128]);}}ofstream g("/tmp/M10R_unpacked.bin",ios::binary);g.write((char*)o.data(),o.size());}
          CPP
          g++ -O3 -std=c++17 /tmp/u.cpp -o /tmp/u && /tmp/u
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Trace SAM7 WB clip local xrefs
        run: python3 tools/m10r_wbcliplevel_sam7_local_v073.py /tmp/sec | tee research/M10R_v073_wbcliplevel_sam7_local.txt
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v073_wbcliplevel_sam7_local.txt
          git commit -m 'research: record v073 SAM7 WBCLIPLEVEL local trace' || exit 0
          git pull --rebase origin m10r-wbcliplevel-v073 && git push
