name: M10-R v1.79 B2Y fixed CC trace
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v179-b2y-fixed-cc.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode fixed B2Y CC0 and CC1 apply helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v179_b2y_fixed_cc.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC
          B=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return P+a-BASE
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(B)-4:return la,struct.unpack_from('<I',B,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            return s
          print('M10-R v1.79 B2Y FIXED COLOR CORRECTION')
          for a,n,z in ((0x420d0c70,'cc0',0x420d0ed4),(0x420d0ed4,'cc1',0x420d1170)):
            print(f'\n=== {n} helper {a:#x} ===')
            ins=list(md.disasm(B[off(a):off(z)],a))
            for i in ins:print(fmt(i))
            print('MMIO')
            for i in ins:
              q=lit(i)
              if q and 0x20000000<=q[1]<0x21000000:print(fmt(i))
          D=Path('/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin').read_bytes();BP=4
          u32=lambda o:struct.unpack_from('<I',D,o)[0]
          count=u32(BP+8);rec0=BP+0x10;stride=0xa90;base=rec0+count*stride
          print('\n=== CC payload decode ===')
          for rid in (6,0xa):
            for i in range(count):
              o=rec0+i*stride
              if u32(o)!=rid:continue
              rel=u32(o+4);sz=u32(o+8);ap=base+rel;blob=D[ap:ap+sz]
              print('id',hex(rid),'rec',i,'size',hex(sz),'payload',hex(ap),'bytes',blob.hex())
              print('u32',[hex(struct.unpack_from('<I',blob,j)[0]) for j in range(0,sz,4)])
              print('s32',[struct.unpack_from('<i',blob,j)[0] for j in range(0,sz,4)])
              print('u16',[struct.unpack_from('<H',blob,j)[0] for j in range(0,sz,2)])
              print('s16',[struct.unpack_from('<h',blob,j)[0] for j in range(0,sz,2)])
          print('\nTARGET: determine whether B2Y.bin CC0/CC1 are additional fixed matrix/offset stages, their register destinations, coefficient representation, and relationship to dynamic 0x408FE130/15C matrices.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v179_b2y_fixed_cc.txt
          git commit -m 'research: record v1.79 B2Y fixed CC trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push