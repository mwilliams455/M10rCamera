name: M10-R firmware Y-row audit RGB1F
on:
  push:
    branches: [m10r-reference-transfer-rgb1f]
    paths:
      - '.github/workflows/m10r-reference-transfer-rgb1f.yml'
      - 'app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1FRenderer.java'
      - 'tools/M10RTransferRgb1FCli.java'
      - 'tools/m10r_reference_transfer_rgb1f_fit.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
          python3 -m pip install --quiet rawpy pillow numpy
      - name: Extract exact nonlinear assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/assets >/dev/null
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/assets/dg_expanded_u16le.bin' | sha256sum -c -
      - name: Compile RGB1F
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m10r_reference_transfer_rgb1f_fit.py tools/m10r_reference_transfer_rgb_fit.py tools/m10r_reference_order_fit.py
          mkdir -p /tmp/classes
          javac -d /tmp/classes app/src/main/java/com/m10r/diagnostic/{DngMetadataReader.java,DngRawDecoder.java,LosslessJpegDecoder.java,SensorPreviewCore.java,M10RColorSpecCore.java,M10RReferenceColorCore.java,M10RNeutralClipReferenceRenderer.java,M10RTransferRgb1FRenderer.java} tools/M10RTransferRgb1FCli.java
      - name: Render and score pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rgb1f
          for id in 01 02 03 04 05 06; do
            base="https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_${id}"
            curl -L --fail --retry 3 "$base.jpg" -o /tmp/rgb1f/$id.jpg
            curl -L --fail --retry 3 "$base.dng" -o /tmp/rgb1f/$id.dng
            exiftool -j -n -Make -Model -SerialNumber -ImageUniqueID -DateTimeOriginal -CreateDate -ExposureTime -FNumber -ISO -FocalLength -ExposureCompensation -WhiteBalance -Contrast -Saturation -Sharpness /tmp/rgb1f/$id.jpg /tmp/rgb1f/$id.dng >/tmp/rgb1f/${id}_exif.json
            java -cp /tmp/classes com.m10r.diagnostic.M10RTransferRgb1FCli /tmp/rgb1f/$id.dng /tmp/assets/tone_medium_q15.u32le /tmp/assets/dg_expanded_u16le.bin /tmp/rgb1f/${id}_rec709.ppm /tmp/rgb1f/${id}_fw_oetfy.ppm /tmp/rgb1f/${id}_fw_component.ppm 2000 | tee /tmp/rgb1f/${id}_render.txt
            python3 tools/m10r_reference_transfer_rgb1f_fit.py --jpg /tmp/rgb1f/$id.jpg --dng /tmp/rgb1f/$id.dng --rec709-oetfy /tmp/rgb1f/${id}_rec709.ppm --fw601-oetfy /tmp/rgb1f/${id}_fw_oetfy.ppm --fw601-component-y /tmp/rgb1f/${id}_fw_component.ppm --sample $id --metadata-json /tmp/rgb1f/${id}_exif.json --out /tmp/rgb1f/${id}_metrics.json
            rm -f /tmp/rgb1f/$id.jpg /tmp/rgb1f/$id.dng /tmp/rgb1f/${id}_*.ppm
          done
      - name: Aggregate RGB1F
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path
          modes=['rec709_oetfy','fw601_oetfy','fw601_component_y']
          base='rec709_oetfy'
          rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/rgb1f').glob('*_metrics.json'))]
          valid=[r for r in rows if r['metadata'].get('identity_supported') is True and r['metadata'].get('default_jpeg_controls') is True]
          if len(valid) != 6:
              raise SystemExit(f'expected 6 identity/default pairs, got {len(valid)}')
          core=['encoded_rgb_rmse','encoded_rgb_mae','luma_rmse','luma_mae','delta_e76_mean']
          chroma=['hue_error_deg_mean','saturation_error_abs_mean']
          def med(m,k): return statistics.median(r['metrics'][m][k] for r in valid)
          def binmed(m,b): return statistics.median(r['metrics'][m]['bins'][b]['rgb_rmse'] for r in valid)
          def clips(m): return sum(sum(r['metrics'][m]['highlight_channel_clipping'][c]['candidate_255_reference_below_250'] for c in 'RGB') for r in valid)
          agg={'valid':len(valid),'medians':{},'bins':{},'falseClips':{},'sampleWins':{},'gate':{},'ranking':[]}
          bin_names=('shadow','midtone','highlight','neutral_pixels','colourful_pixels')
          for m in modes:
              agg['medians'][m]={k:med(m,k) for k in core+chroma}
              agg['bins'][m]={b:binmed(m,b) for b in bin_names}
              agg['falseClips'][m]=clips(m)
          for cand in modes[1:]:
              wins={k:sum(r['metrics'][cand][k] < r['metrics'][base][k] for r in valid) for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean')}
              wins['highlight_rgb_rmse']=sum(r['metrics'][cand]['bins']['highlight']['rgb_rmse'] < r['metrics'][base]['bins']['highlight']['rgb_rmse'] for r in valid)
              agg['sampleWins'][cand]=wins
          mins={k:min(agg['medians'][m][k] for m in modes) for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean')}
          agg['ranking']=sorted(modes,key=lambda m:sum(agg['medians'][m][k]/mins[k] for k in mins)/3)
          b=agg['medians'][base]; bh=agg['bins'][base]['highlight']; bc=agg['falseClips'][base]
          clear=[]
          for m in modes[1:]:
              q=agg['medians'][m]
              ratios={k:q[k]/b[k] for k in ('encoded_rgb_rmse','luma_rmse','delta_e76_mean')}
              hratio=agg['bins'][m]['highlight']/bh
              passed=(ratios['encoded_rgb_rmse']<=0.99 and ratios['luma_rmse']<=0.99 and ratios['delta_e76_mean']<=1.02
                      and hratio<=0.95
                      and q['hue_error_deg_mean']<=b['hue_error_deg_mean']*1.05+0.5
                      and q['saturation_error_abs_mean']<=b['saturation_error_abs_mean']*1.05+0.005
                      and agg['falseClips'][m]<=bc*1.05
                      and agg['sampleWins'][m]['encoded_rgb_rmse']>=4
                      and agg['sampleWins'][m]['highlight_rgb_rmse']>=4)
              agg['gate'][m]={'core_ratios':ratios,'highlight_ratio':hratio,'false_clip_ratio':(agg['falseClips'][m]/bc if bc else None),'passed':passed}
              if passed: clear.append(m)
          verdict='RGB1F_FIRMWARE_Y_DOES_NOT_CLEAR_PROMOTION_GATE'
          if clear:
              clear.sort(key=lambda m:sum(agg['gate'][m]['core_ratios'].values())+agg['gate'][m]['highlight_ratio'])
              verdict='RGB1F_FAVORS_'+clear[0].upper()
          agg['verdict']=verdict; agg['run']=os.environ.get('GITHUB_RUN_ID'); agg['commit']=os.environ.get('GITHUB_SHA')
          out=['M10-R REFERENCE TRANSFER RGB1F — FIRMWARE YC_CONVERSION Y-ROW AUDIT','',
               'No fitting. Frozen coordinate scale 0.94, exact MEDIUM->DG, shared code-ratio gain on linear RGB, final standard sRGB OETF.','Firmware Y row: [1224,2403,469]/4096 from recovered B2Y record 0x0C.','', '=== Aggregate ===']
          for m in agg['ranking']:
              out.append(f"{m}: medians={agg['medians'][m]} bins={agg['bins'][m]} falseClips={agg['falseClips'][m]} sampleWins={agg['sampleWins'].get(m,'control')}")
          out += ['', '=== Promotion gate versus rec709_oetfy ==='] + [f"{m}: {v}" for m,v in agg['gate'].items()] + ['', 'VERDICT '+verdict, '', f"Workflow run id: {agg['run']}", f"Analysis input commit: {agg['commit']}"]
          Path('research/M10R_REFERENCE_TRANSFER_RGB1F.md').write_text('\n'.join(out)+'\n')
          Path('research/M10R_REFERENCE_TRANSFER_RGB1F.json').write_text(json.dumps({'samples':rows,'aggregate':agg},indent=2,sort_keys=True)+'\n')
          print('\n'.join(out))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-REFERENCE-TRANSFER-RGB1F
          path: |
            /tmp/rgb1f/*_metrics.json
            /tmp/rgb1f/*_render.txt
            research/M10R_REFERENCE_TRANSFER_RGB1F.md
            research/M10R_REFERENCE_TRANSFER_RGB1F.json
          if-no-files-found: warn
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_REFERENCE_TRANSFER_RGB1F.*
          git commit -m 'research: record firmware Y-row audit RGB1F' || exit 0
          git pull --rebase origin m10r-reference-transfer-rgb1f
          git push
