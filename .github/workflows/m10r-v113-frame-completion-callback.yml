name: M10-R v1.13 frame completion callback provenance
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v113-frame-completion-callback.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace callback at 0x408F025C
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v113_frame_completion_callback.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def raw(a,n):
            o=off(a);return b[o:o+n] if 0<=o<len(b) else b''
          def u32(a):
            x=raw(a,4);return struct.unpack('<I',x)[0] if len(x)==4 else None
          def insns(lo,hi):return [i for i in md.disasm(raw(lo,hi-lo),lo) if i.id]
          def dump(lo,hi,title):
            print(f'\n=== {title} {lo:#x}..{hi:#x} ===')
            for i in insns(lo,hi):
              ex=''
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  lit=((i.address+4)&~3)+i.operands[1].mem.disp;v=u32(lit);ex=f' ; LIT {lit:#x}->{v:#x}' if v is not None else ''
              except:pass
              print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}')
          print('M10-R v1.13 PREPRO FRAME-COMPLETION CALLBACK PROVENANCE')
          print('Known: successful aggregate PW completion eventually executes callback [0x408F0254+8] with r0=current frame/index [0x408EFE90].')
          target=0x408f0254;pat=struct.pack('<I',target);p=0;pools=[]
          while True:
            q=b.find(pat,p)
            if q<0:break
            pools.append(BASE+(q-PFX));p=q+1
          print('literal_pools',*[hex(x) for x in pools])
          xrefs=[]
          for pool in pools:
            for i in insns(max(BASE,pool-0x700),min(BASE+len(b)-PFX,pool+0x60)):
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  lit=((i.address+4)&~3)+i.operands[1].mem.disp
                  if lit==pool:xrefs.append(i.address)
              except:pass
          print('code_xrefs',*[hex(x) for x in sorted(set(xrefs))])
          # Group xrefs into small function-neighborhood dumps.
          groups=[]
          for x in sorted(set(xrefs)):
            if not groups or x-groups[-1][-1]>0x180:groups.append([x])
            else:groups[-1].append(x)
          for g in groups:
            lo=max(BASE,g[0]-0x100);hi=g[-1]+0x140
            dump(lo,hi,'GLOBAL 0x408F0254 USER xrefs='+','.join(hex(x) for x in g))
          # One-document completion invocation proof.
          dump(0x420e5e18,0x420e5e38,'FRAME COMPLETION CALLBACK INVOCATION')
          print('\n=== WRITE-LIKE USERS SUMMARY ===')
          for x in sorted(set(xrefs)):
            rg=insns(max(BASE,x-0x30),x+0x90)
            print('XREF',hex(x))
            for i in rg:
              if i.mnemonic.startswith('str') or i.mnemonic in ('bl','blx'):
                print(f' {i.address:#x}: {i.mnemonic} {i.op_str}')
          print('\n=== DECISION ===')
          print('Identify which xref writes callback slot +0x08 and resolve the registered function pointer. Then trace that frame-completion callback to the object/pointer selection used by CA9 workflow+0x480.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v113_frame_completion_callback.txt
          git commit -m 'research: record v1.13 frame completion callback provenance' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
