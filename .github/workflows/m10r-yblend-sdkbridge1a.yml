name: M10-R Y BLEND SDKBRIDGE1A evidence
on:
  push:
    branches: [m10r-yblend-sdkbridge1a]
    paths: ['.github/workflows/m10r-yblend-sdkbridge1a.yml', 'tools/m10r_yblend_sdkbridge1a.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned research dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3
      - name: Fetch six hash-pinned public comparison sources without executing them
        run: |
          python3 - <<'PY'
          import importlib.util,hashlib,urllib.request
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('bridge','tools/m10r_yblend_sdkbridge1a.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for p,h in m.SDK_HASHES.items():
              url=f'https://raw.githubusercontent.com/{m.SDK_REPO}/{m.SDK_COMMIT}/{p}'
              b=urllib.request.urlopen(url,timeout=60).read()
              assert hashlib.sha256(b).hexdigest()==h,p
              f=Path('/tmp/sdk')/p;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(b)
          PY
      - name: Obtain verified original firmware sections
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker);z=p.index('\n          CPP',a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec > /tmp/sections.txt
      - name: Execute original-instruction comparison and retained audit
        run: |
          set -euo pipefail
          mkdir -p evidence/results evidence/tools
          python3 tools/m10r_yblend_sdkbridge1a.py /tmp/sec . /tmp/sdk evidence/results > evidence/results/sdkbridge_stdout.txt
          python3 tools/m10r_yblend_bit15_audit1a.py /tmp/sec --cases 1024 --out evidence/results/register_emulation.json > evidence/results/bit15_stdout.txt
          cp tools/m10r_yblend_sdkbridge1a.py tools/m10r_yblend_bit15_audit1a.py evidence/tools/
          git rev-parse HEAD > evidence/results/source_commit.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('evidence');j=json.loads((p/'results/sdkbridge_results.json').read_text())
          assert j['status']=='PASS_REGISTER_LAYOUT_COMPARISON_ONLY'
          assert j['gate_c_passed'] is False and j['renderer_changed'] is False
          assert j['exhaustive_six_bit_control_sweep']['original_executions']=={'img':4096,'sam7':4096}
          entries=[]
          for f in sorted(p.rglob('*')):
              if f.is_file():
                  b=f.read_bytes();entries.append({'path':str(f.relative_to(p)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (p/'manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          (p/'README.txt').write_text('Related SDK source comparison and original firmware register tests only. No M10-R ISP equation recovered. This artifact contains no external SDK files, firmware binaries or APK. Sources are identified by immutable commit and hashes.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-SDKBRIDGE1A-EVIDENCE
          path: evidence/
          retention-days: 90
          if-no-files-found: error
