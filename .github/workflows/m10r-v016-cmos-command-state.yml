name: M10-R v0.16 CMOS command and source-state trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v016-cmos-command-state.yml', '.m10r-v016-cmos-command-state-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace command/state ownership
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v016-cmos-command-state.txt
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/090_CTRL-System.bin').read_bytes();base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(v):return pfx+v-base
          def dis(label,s,e):
            print(f'\n=== {label} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte':print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          def callers(t):
            out=[]
            for i in md.disasm(b[pfx:],base):
              if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==(t&~1):out.append(i.address)
            return out
          def data_ptrs(t):
            out=[]
            for val in (t,t|1):
              nd=struct.pack('<I',val);q=0
              while True:
                q=b.find(nd,q)
                if q<0:break
                out.append(base+q-pfx);q+=1
            return sorted(set(out))
          def literal_refs(target):
            lits=[];q=0;needle=struct.pack('<I',target)
            while True:
              q=b.find(needle,q)
              if q<0:break
              lits.append(base+q-pfx);q+=1
            refs=[]
            for i in md.disasm(b[pfx:],base):
              if i.mnemonic=='.byte':continue
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_PC and (((i.address+4)&~3)+op.mem.disp) in lits:
                  refs.append(i.address)
            return lits,sorted(set(refs))
          # command wrapper ownership
          for t in [0x08009b2c,0x080093dc,0x08003068]:
            cs=callers(t);ps=data_ptrs(t)
            print('\nTARGET',hex(t),'CALLERS',[hex(x) for x in cs],'DATA_PTRS',[hex(x) for x in ps])
            dis('FUNC_'+hex(t),max(base,t-0x60),min(base+len(b)-pfx,t+0x180))
            for a in cs:dis('CALLER_'+hex(a),max(base,a-0x160),min(base+len(b)-pfx,a+0x220))
            for a in ps[:20]:dis('PTR_NEAR_'+hex(a),max(base,a-0x60),min(base+len(b)-pfx,a+0xa0))
          # source-state bytes and helper functions
          for target in [0x2001adbb,0x2001adae]:
            lits,refs=literal_refs(target)
            print('\nSTATE',hex(target),'LITERALS',[hex(x) for x in lits],'REFS',[hex(x) for x in refs])
            for a in refs:dis('STATE_REF_'+hex(target)+'_'+hex(a),max(base,a-0x1a0),min(base+len(b)-pfx,a+0x260))
          for t in [0x080146f6,0x08001a38,0x0800d6a8]:
            print('\nHELPER',hex(t),'CALLERS',[hex(x) for x in callers(t)],'DATA_PTRS',[hex(x) for x in data_ptrs(t)])
            dis('HELPER_FUNC_'+hex(t),max(base,t-0x80),min(base+len(b)-pfx,t+0x180))
            for a in callers(t):dis('HELPER_CALLER_'+hex(a),max(base,a-0x140),min(base+len(b)-pfx,a+0x1e0))
          # useful nearby strings
          strings=[]
          for m in re.finditer(rb'[ -~]{5,180}\x00',b):
            va=base+m.start()-pfx;s=m.group()[:-1].decode('ascii','ignore')
            if any(k in s.lower() for k in ('live','view','preview','sensor','cmos','ae ','exposure','release','display','evf','meter','monitor','video','lv')):strings.append((va,s))
          print('\nINTERESTING_STRINGS')
          for va,s in strings:print(hex(va),repr(s))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v016-cmos-command-state
          path: /tmp/m10r-v016-cmos-command-state.txt
          if-no-files-found: error
