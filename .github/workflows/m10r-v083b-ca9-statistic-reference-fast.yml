name: M10-R v0.83b CA9 statistic reference fast
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v083b-ca9-statistic-reference-fast.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Fast recover CA9 statistic/reference provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v083b_ca9_statistic_reference_fast.txt
          from pathlib import Path
          import struct
          from collections import defaultdict
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();base=0x40000000;pfx=4;end=base+len(b)-pfx
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return pfx+a-base
          def va(o):return base+o-pfx
          ins=[];xref=defaultdict(list)
          for o in range(4,len(b)-4,4):
            a=va(o);ds=list(md.disasm(b[o:o+4],a,1))
            if not ds:continue
            i=ds[0];ins.append(i)
            if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              la=a+8+i.operands[1].mem.disp;lo=off(la)
              if 0<=lo<=len(b)-4:xref[struct.unpack_from('<I',b,lo)[0]&~1].append(a)
            if i.mnemonic in ('add','sub') and len(i.operands)>=3 and i.operands[1].type==ARM_OP_REG and i.operands[1].reg==ARM_REG_PC and i.operands[2].type==ARM_OP_IMM:
              pc=a+8;t=pc+i.operands[2].imm if i.mnemonic=='add' else pc-i.operands[2].imm;xref[t&~1].append(a)
          amap={i.address:i for i in ins}
          def dump(a,pre=0x80,post=0x100):
            for aa in range(max(base,a-pre)&~3,min(end,a+post),4):
              i=amap.get(aa)
              if i:print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}')
          print('M10-R v0.83b CA9 STATISTIC/REFERENCE FAST')
          target=0x40013498
          print('REF_40013498',[hex(x) for x in xref.get(target,[])])
          for a in xref.get(target,[]):print('\nREF_WINDOW',hex(a)) or dump(a)
          o=off(target);print('GLOBAL_U32',hex(struct.unpack_from('<I',b,o)[0]),'FLOAT',struct.unpack_from('<f',b,o)[0])
          # Extract semantic strings and use prebuilt xref map.
          print('\nSEMANTIC_STRINGS_WITH_REFS')
          keys=('prepro','statistic','statistics','luma','lumin','histogram','ae data','quantity table','ae module','brightness','grid')
          p=0
          while p<len(b):
            if 0x20<=b[p]<=0x7e:
              q=p
              while q<len(b) and 0x20<=b[q]<=0x7e:q+=1
              if q-p>=6:
                s=b[p:q].decode('ascii','replace');sa=va(p)
                if any(k in s.lower() for k in keys):
                  hs=xref.get(sa&~1,[])
                  print(hex(sa),repr(s),'REFS',[hex(x) for x in hs])
              p=max(q+1,p+1)
            else:p+=1
          print('\nTOP_CONFIG_BUILD')
          for aa in range(0x40000800,0x40000948,4):
            i=amap.get(aa)
            if i:print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v083b_ca9_statistic_reference_fast.txt
          git commit -m 'research: record v0.83b CA9 statistic/reference fast' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
