name: M10-R v2.17 STILL de-knee interpolation-gamma enable proof
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v217-still-deknee-interpgamma-enable.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Prove default STILL enable state of de-knee and interpolation gamma
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v217_still_deknee_interpgamma_enable.txt
          from pathlib import Path
          import struct,hashlib
          from capstone import *
          from capstone.arm import *

          cal=Path('/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin').read_bytes();P=4
          count=struct.unpack_from('<I',cal,P+8)[0]; rec0=P+0x10; stride=0xa90; payload_base=rec0+count*stride
          print('M10-R v2.17 STILL DE-KNEE / INTERPOLATION-GAMMA ENABLE PROOF')
          print('record_count',count,'payload_base',hex(payload_base))
          targets={1:'deknee',9:'interpolation_gamma',11:'differential_gamma_control'}
          found={}
          for n in range(count):
            o=rec0+n*stride; rid,rel,size=struct.unpack_from('<III',cal,o)
            if rid in targets:
              blob=cal[payload_base+rel:payload_base+rel+size]
              found[rid]=blob
              print('\nrecord',targets[rid],'id',hex(rid),'index',n,'size',hex(size),'sha256',hashlib.sha256(blob).hexdigest())
              print('all_zero',all(x==0 for x in blob),'nonzero_count',sum(x!=0 for x in blob))
              print('head64',blob[:64].hex())
              if size>=8: print('u32_0_1',struct.unpack_from('<II',blob,0))
          assert 1 in found and 9 in found and 11 in found

          img=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;IP=4
          arm=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);arm.detail=True;arm.skipdata=True
          thumb=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);thumb.detail=True;thumb.skipdata=True
          def off(a):return IP+a-BASE
          def dis(lo,hi,mode):
            md=arm if mode=='A' else thumb
            return list(md.disasm(img[off(lo):off(hi)],lo))
          def lit(i,mode):
            try:
              oo=i.operands
              if i.mnemonic.startswith('ldr') and len(oo)>=2 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((i.address+8) if mode=='A' else ((i.address+4)&~3))+oo[1].mem.disp
                oo2=off(la)
                if 0<=oo2<=len(img)-4:return la,struct.unpack_from('<I',img,oo2)[0]
            except:pass
          def fmt(i,mode):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i,mode)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            return s

          print('\n=== de-knee helper head 0x420d1170 ARM ===')
          for i in dis(0x420d1170,0x420d11c8,'A'):print(fmt(i,'A'))
          print('\n=== interpolation-gamma helper 0x420d25a4 decode candidates ===')
          for mode in ('T','A'):
            print('-- mode',mode,'--')
            for i in dis(0x420d25a4,0x420d2700,mode):print(fmt(i,mode))

          # Automatic first-parameter-to-enable signature report.
          print('\n=== control signature ===')
          print('deknee_record_byte0',found[1][0],'expected helper reads [r0] bit0 -> 0x20020040 bit0')
          print('interpgamma_record_byte0',found[9][0])
          print('dg_record_u32_0_1',struct.unpack_from('<II',found[11],0))
          print('TARGET: prove whether zero default records disable de-knee/interpolation gamma while DG remains enabled; only report interpolation result if helper code directly maps record +0 to an enable bit.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v217_still_deknee_interpgamma_enable.txt
          git commit -m 'research: record v2.17 STILL nonlinear enable proof' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push