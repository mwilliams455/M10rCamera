name: M10-R v1.23 color finished DNG layout
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v123-color-finished-dng-layout.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace ColorManagementFinished callback
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v123_color_finished_dng_layout.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def st(va):
            o=off(va)
            if o<0 or o>=len(b):return None
            e=b.find(b'\0',o,min(len(b),o+220))
            if e<=o:return None
            q=b[o:e]
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:
              s+=f' ; LIT {hex(q[0])}->{hex(q[1])}'
              z=st(q[1])
              if z:s+=f' STRING={z!r}'
            if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
              # Capstone Thumb ADR operand is an immediate displacement in this firmware.
              va=((i.address+4)&~3)+i.operands[1].imm
              z=st(va);s+=f' ; ADR_TARGET={hex(va)}'
              if z:s+=f' STRING={z!r}'
            return s
          print('M10-R v1.23 COLOR MANAGEMENT FINISHED / DNG LAYOUT')
          print('Known callback passed by ca9_StartColorManagement: 0x420A3639 (Thumb).')
          print('\n=== CALLBACK 0x420A3638..0x420A3AF8 ===')
          for i in dis(0x420a3638,0x420a3af8):print(fmt(i))
          print('\n=== MEMORY ACCESSES IN CALLBACK ===')
          for i in dis(0x420a3638,0x420a3af8):
            try:
              if any(o.type==ARM_OP_MEM for o in i.operands):print(fmt(i))
            except:pass
          print('\n=== DNG/CM ADR SITES ===')
          for i in dis(0x420a3638,0x420a3af8):
            if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:
              va=((i.address+4)&~3)+i.operands[1].imm;z=st(va)
              if z and ('DNG CM' in z or 'Color Temperature CM' in z):print(fmt(i))
          print('\n=== CALLBACK POINTER RAW OCCURRENCES ===')
          for v in (0x420a3638,0x420a3639):
            pat=struct.pack('<I',v);p=0;hits=[]
            while True:
              p=b.find(pat,p)
              if p<0:break
              hits.append(BASE+p-PFX);p+=1
            print(hex(v),[hex(x) for x in hits])
          print('\n=== DECISION ===')
          print('Map callback argument/result fields to DNG CM1, CM2, illuminant temperatures and rendered outputs; identify whether matrices arrive from CA9 result or are reconstructed on IMG side.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v123_color_finished_dng_layout.txt
          git commit -m 'research: record v1.23 color finished DNG layout' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
