name: M10-R v0.50 command32 framing
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v050-command32-framing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Trace command 0x32 request-response framing
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v050_command32_framing.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_OP_REG,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();base=0x42000000;pfx=4;code=b[pfx:]
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def sx(v,bits):return v-(1<<bits) if v&(1<<(bits-1)) else v
          def off(a):return pfx+a-base
          def u32(a):
            o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def astr(a,n=260):
            o=off(a)
            if not 0<=o<len(b):return None
            out=[]
            for c in b[o:o+n]:
              if c==0:break
              if c in (9,10,13) or 32<=c<127:out.append(chr(c))
              else:return None
            s=''.join(out);return s if len(s)>=4 else None
          def fmt(i):
            if i.id==0:return f'{i.address:08x}: .byte      {i.op_str}'
            ex=''
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;v=u32(la)
                if v is not None:
                  s=astr(v);ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
              if i.mnemonic in ('bl','blx') and i.operands:
                if i.operands[0].type==ARM_OP_IMM:ex+=f' ; CALL {i.operands[0].imm:#x}'
                elif i.operands[0].type==ARM_OP_REG:ex+=' ; INDIRECT_CALL'
            except Exception as e: ex+=f' ; DETAIL_ERR={e}'
            return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
          def dump(a,z,title):
            print(f'\n=== {title} {a:#x}..{z:#x} ===')
            for i in md.disasm(b[off(a):off(z)],a): print(fmt(i))
          def blcallers(target):
            out=[]
            for p in range(0,len(code)-4,2):
              h1,h2=struct.unpack_from('<HH',code,p)
              if (h1&0xf800)!=0xf000 or (h2&0xd000)!=0xd000:continue
              s=(h1>>10)&1;imm10=h1&0x3ff;j1=(h2>>13)&1;j2=(h2>>11)&1;imm11=h2&0x7ff;i1=(~(j1^s))&1;i2=(~(j2^s))&1
              imm25=(s<<24)|(i1<<23)|(i2<<22)|(imm10<<12)|(imm11<<1);dst=(base+p+4+sx(imm25,25))&0xffffffff
              if (dst&~1)==(target&~1):out.append(base+p)
            return out
          def callees(a,z):
            out=[]
            for i in md.disasm(b[off(a):off(z)],a):
              if i.id==0:continue
              try:
                if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:out.append((i.address,i.operands[0].imm))
              except: pass
            return out
          print('HYPOTHESIS TEST: command 0x32 0x51 request versus 0x49 response, not assumed header stripping')
          dump(0x420b83d8,0x420b847c,'COMMAND32 POST-BUILD CALL SITE')
          print('\nPOST_BUILD_STATIC_LAYOUT')
          print('sp+0x26c = request frame pointer passed to 0x420BEF5C')
          print('sp+0x26d = command id (r6 = 0x32)')
          print('sp+0x26e = request data length (r7 = 0x51)')
          print('sp+0x26f = first byte of 0x51-byte builder output')
          for t,name,rng in [
            (0x420bef5c,'SYNC REQUEST/RESPONSE ROUTINE 0x420BEF5C',(0x420beed0,0x420bf300)),
            (0x420bf5f4,'ALTERNATE REQUEST ROUTINE 0x420BF5F4',(0x420bf540,0x420bf980)),
            (0x420b7580,'GENERIC COMMAND API 0x420B7580',(0x420b7500,0x420b7740))]:
              dump(*rng,name)
              print(f'\nCALLERS {name}:',[hex(x) for x in blcallers(t)])
              cs=callees(*rng)
              print(f'CALLEES {name}:',[(hex(a),hex(x)) for a,x in cs])
          # One-level dump of local callees from the central request/response routines.
          local=set()
          for a,z in [(0x420beed0,0x420bf300),(0x420bf540,0x420bf980),(0x420b7500,0x420b7740)]:
            for _,t in callees(a,z):
              if 0x420b0000<=t<0x420c8000 and t not in (0x420bef5c,0x420bf5f4,0x420b7580): local.add(t&~1)
          for t in sorted(local): dump(max(base,t-0x20),min(base+len(code),t+0x120),'LOCAL CALLEE '+hex(t))
          print('\n=== IMMEDIATE 0x49 / 0x51 / 0x08 SITES IN COMMAND/TRANSPORT REGION ===')
          for i in md.disasm(b[off(0x420b6000):off(0x420c2000)],0x420b6000):
            if i.id==0:continue
            try:
              ims=[op.imm for op in i.operands if op.type==ARM_OP_IMM]
              if any(v in (0x49,0x51,8,-8) for v in ims): print(fmt(i))
            except: pass
          print('\n=== POINTER/LENGTH ADJUSTMENTS NEAR 0x420BEF5C ===')
          for i in md.disasm(b[off(0x420beed0):off(0x420bf300)],0x420beed0):
            if i.id==0:continue
            if i.mnemonic.startswith(('add','sub')) or i.mnemonic.startswith(('ldr','str')): print(fmt(i))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v050_command32_framing.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.50 command32 framing'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
