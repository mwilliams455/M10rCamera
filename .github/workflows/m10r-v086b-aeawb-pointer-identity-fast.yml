name: M10-R v0.86b AEAWB pointer identity fast
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v086b-aeawb-pointer-identity-fast.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Surgical AFAEAWB to CA9 pointer trace
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v086b_aeawb_pointer_identity_fast.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC,ARM_OP_IMM
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); base=0x42000000; pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return pfx+a-base
          def u16(p): return struct.unpack_from('<H',b,p)[0]
          def u32(p): return struct.unpack_from('<I',b,p)[0]
          def dump(s,e,title):
            s=max(base,s); e=min(base+len(b)-pfx,e); print('\n===',title,hex(s),'..',hex(e),'===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.id==0: continue
              extra=''
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  la=((i.address+4)&~3)+i.operands[1].mem.disp; lo=off(la)
                  if 0<=lo<=len(b)-4: extra=f' ; LIT {hex(la)}->{hex(u32(lo))}'
                if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM: extra+=f' ; CALL {hex(i.operands[0].imm&~1)}'
              except Exception: pass
              print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{extra}')
          def signext(x,bits): return x-(1<<bits) if x&(1<<(bits-1)) else x
          def bl_target(p):
            if p+4>len(b): return None
            h1=u16(p); h2=u16(p+2)
            if (h1&0xf800)!=0xf000 or (h2&0xd000)!=0xd000:return None
            S=(h1>>10)&1; J1=(h2>>13)&1; J2=(h2>>11)&1
            I1=1-(J1^S); I2=1-(J2^S)
            imm=(S<<24)|(I1<<23)|(I2<<22)|((h1&0x3ff)<<12)|((h2&0x7ff)<<1)
            imm=signext(imm,25); a=base+p-pfx
            return (a+4+imm)&0xffffffff
          def direct_callers(target):
            out=[]
            for p in range(pfx,len(b)-3,2):
              if bl_target(p)==target: out.append(base+p-pfx)
            return out
          def raw32(v):
            pat=struct.pack('<I',v); out=[]; p=0
            while True:
              p=b.find(pat,p)
              if p<0:break
              out.append(base+p-pfx);p+=1
            return out
          def ldr16_xrefs(pool_addr):
            po=off(pool_addr); lo=max(pfx,po-1100); hi=min(len(b)-2,po+2); out=[]
            for p in range(lo+(lo-pfx)%2,hi,2):
              h=u16(p)
              if (h&0xf800)==0x4800:
                a=base+p-pfx; la=((a+4)&~3)+((h&0xff)<<2)
                if la==pool_addr:out.append(a)
            return out
          def show_callers(t,name):
            xs=direct_callers(t);print('\nDIRECT CALLERS',name,hex(t),'count',len(xs),*[hex(x) for x in xs])
            for x in xs:dump(x-0x50,x+0x70,f'{name} CALLER @ {hex(x)}')
          def show_literal(v,name):
            pools=raw32(v);print('\nRAW LITERAL',name,hex(v),'count',len(pools),*[hex(x) for x in pools[:80]])
            allx=[]
            for pa in pools:
              xs=ldr16_xrefs(pa);allx+=xs
              if xs:print(' pool',hex(pa),'ldr16 xrefs',*[hex(x) for x in xs])
            for x in sorted(set(allx))[:100]:dump(x-0x30,x+0x50,f'{name} LDR XREF @ {hex(x)}')
          print('M10-R v0.86b FAST AFAEAWB -> CA9 POINTER IDENTITY')
          print('IMG bytes',len(b))
          dump(0x420dac40,0x420dad00,'AFAEAWB CONFIG POINTER DERIVATION')
          dump(0x420dadb0,0x420dadcc,'BASE+0x14080 HELPER')
          dump(0x420a3104,0x420a3210,'CA9 PARAMETER BUILDER')
          for t,n in [(0x420dadb6,'base+0x14080 helper'),(0x420a3104,'CA9 parameter builder'),(0x420dca28,'Prepro driver call 420DCA28'),(0x420dc974,'Prepro driver call 420DC974'),(0x420e0850,'Prepro driver call 420E0850'),(0x420de0f0,'Prepro driver call 420DE0F0'),(0x420e05b4,'Prepro driver call 420E05B4')]:show_callers(t,n)
          for v,n in [(0x408efe10,'AFAEAWB global root'),(0x14080,'sub-buffer offset +0x14080'),(0x408f0390,'Prepro AEAWB pointer-state base'),(0x408f0410,'Prepro AEAWB callback-state'),(0x43705a60,'CA9 parameter block')]:show_literal(v,n)
          for t,n in [(0x420dadb7,'Thumb pointer to base+0x14080 helper'),(0x420a3105,'Thumb pointer to CA9 parameter builder')]:
            xs=raw32(t);print('\nRAW FUNCTION POINTER',n,hex(t),'count',len(xs),*[hex(x) for x in xs[:100]])
            for x in xs[:30]:dump(x-0x40,x+0x50,f'{n} TABLE/POOL @ {hex(x)}')
          # Find every MOVS Rd,#0x85; only narrow-disassemble those sites. This captures known +0x480 construction and peer accesses.
          hits=[]
          for p in range(pfx,len(b)-2,2):
            h=u16(p)
            if (h&0xf800)==0x2000 and (h&0xff)==0x85:hits.append(base+p-pfx)
          print('\nMOVS #0x85 count',len(hits),*[hex(x) for x in hits[:200]])
          for x in hits[:120]:dump(x-0x24,x+0x48,f'MOVS #0x85 CONTEXT @ {hex(x)}')
          print('\n=== FREEZE RULE ===')
          print('Only freeze AFAEAWB->workflow+0x480 identity when an explicit store/copy path connects one of the producer pointers to the object field read by 0x420A3104.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v086b_aeawb_pointer_identity_fast.txt
          git commit -m 'research: record v0.86b fast AEAWB pointer identity' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
