name: M10-R v0.13 meter integration
on:
  push:
    branches: [m10r-meter-integration-trace]
    paths: ['.github/workflows/m10r-v013-meter-integration.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover CTRL
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace sampling kernel and delay/ADC helpers
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/m10r-v013-integration.txt
          from pathlib import Path
          from collections import defaultdict
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          import struct
          b=Path('/tmp/sections/090_CTRL-System.bin').read_bytes();base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          code=list(md.disasm(b[pfx:],base));calls=defaultdict(list)
          for i in code:
            if i.id and i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:calls[i.operands[0].imm].append(i.address)
          def off(v):return pfx+v-base
          def dis(name,s,e):
            print(f'\n=== {name} {s:#010x}..{e:#010x} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.id:print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          def callees(s,e):
            out=[]
            for i in md.disasm(b[off(s):off(e)],s):
              if i.id and i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
                if i.operands[0].imm not in out:out.append(i.operands[0].imm)
            return out
          regions=[
            ('TLOG',0x0802d650,0x0802d6dc),
            ('TRAD_BV',0x0802d6dc,0x0802d790),
            ('CAL_20_SAMPLE',0x0802d790,0x0802d810),
            ('ADC_GETTER',0x08018220,0x08018330),
          ]
          for n,s,e in regions:
            dis(n,s,e)
            cs=callees(s,e);print('CALLEES',n,[hex(x) for x in cs])
            for t in cs:
              print('  TARGET',hex(t),'global callers',[hex(x) for x in calls.get(t,[])[:30]])
          # Inspect each non-float helper called by normal traditional Bv around likely timing functions.
          candidates=callees(0x0802d6dc,0x0802d790)+callees(0x08018220,0x08018330)
          for t in sorted(set(candidates)):
            if base <= t < base+len(b)-pfx:
              dis('HELPER_'+hex(t),max(base,t-0x20),min(base+len(b)-pfx,t+0x120))
          # List immediate 1/3 arguments around calls inside traditional producer.
          print('\n=== TRADITIONAL PRODUCER CALL ARG CONTEXT ===')
          ins=list(md.disasm(b[off(0x0802d6dc):off(0x0802d790)],0x0802d6dc))
          for idx,i in enumerate(ins):
            if i.id and i.mnemonic in ('bl','blx'):
              print('CALL',hex(i.address),i.op_str)
              for q in ins[max(0,idx-5):idx+2]:
                if q.id:print(' ',hex(q.address),q.mnemonic,q.op_str)
          # ADC peripheral helper at 0x08032238 and its immediate callees.
          dis('ADC_CHANNEL_CONFIG',0x080321e0,0x08032320)
          print('ADC_CONFIG_CALLEES',[hex(x) for x in callees(0x080321e0,0x08032320)])
          # Look for obvious SysTick/timer-frequency constants in delay helper call graph later.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v013-integration
          path: /tmp/m10r-v013-integration.txt
          if-no-files-found: error
