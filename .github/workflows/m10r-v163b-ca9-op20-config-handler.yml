name: M10-R v1.63b CA9 op20 config handler
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v163b-ca9-op20-config-handler.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CA9 opcode 0x20 handler safely
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v163b_ca9_op20_config_handler.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):
            a=max(BASE,a);z=min(END,z)
            return list(md.disasm(b[off(a):off(z)],a)) if z>a else []
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            oo=ops(i)
            if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
          def lit(i):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>1 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=i.address+8+oo[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.63b CA9 OPCODE 0x20 CONFIG HANDLER')
          for i in dis(0x40006354,0x400063b8):print(fmt(i))
          A=0x4000b59c; W=dis(A,A+0x900)
          print('\n=== handler first 0x900 bytes ===')
          for i in W:print(fmt(i))
          calls=[]
          for i in W:
            c=call(i)
            if c is not None and BASE<=c<END and c not in calls:calls.append(c)
          print('\n=== direct calls ===');print([hex(x) for x in calls])
          for c in calls:
            print(f'\n-- callee {c:#x} first 0x300 --')
            for i in dis(c,c+0x300):print(fmt(i))
          wanted={0x128,0x12c,0x134}
          print('\n=== handler target displacements ===')
          for i in W:
            if any(o.type==ARM_OP_MEM and o.mem.disp in wanted for o in ops(i)):print(fmt(i))
          print('\n=== handler broad config-sized displacements 0x100..0x240 ===')
          for i in W:
            if any(o.type==ARM_OP_MEM and 0x100<=o.mem.disp<=0x240 for o in ops(i)):print(fmt(i))
          print('\n=== TARGET ===')
          print('Establish opcode 0x20 request semantics and whether this handler imports/uses config+128/count/pairs.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v163b_ca9_op20_config_handler.txt
          git commit -m 'research: record v1.63b CA9 op20 config handler' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push