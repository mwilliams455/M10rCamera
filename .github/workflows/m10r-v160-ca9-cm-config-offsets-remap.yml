name: M10-R v1.60 CA9 CM config offsets remap
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v160-ca9-cm-config-offsets-remap.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace config-relative CM accesses and remap helpers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v160_ca9_cm_config_offsets_remap.txt
          from pathlib import Path
          import struct,re,collections
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();BASE=0x40000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.60 CA9 CM CONFIG OFFSETS / REMAP HELPERS')
          core=dis(0x40003af4,0x40004050)
          print('\n=== config-pointer load sites and following windows ===')
          loads=[]
          for n,i in enumerate(core):
            if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM:
              m=i.operands[1].mem
              if i.reg_name(m.base)=='r4' and m.disp==0x24:
                loads.append((n,i.address,i.reg_name(i.operands[0].reg)))
          print([(hex(a),r) for _,a,r in loads])
          derived=[]
          for n,a,r in loads:
            print(f'\n-- config load {a:#x} into {r} --')
            offv=0
            for j in core[n:min(len(core),n+14)]:
              print(fmt(j))
              if j.address==a:continue
              # track simple add/sub immediate on same register
              if j.operands and j.operands[0].type==ARM_OP_REG and j.reg_name(j.operands[0].reg)==r:
                if j.mnemonic in ('add','adds','sub','subs') and len(j.operands)>=3 and j.operands[-1].type==ARM_OP_IMM:
                  v=j.operands[-1].imm; offv += v if j.mnemonic.startswith('add') else -v
              c=call(j)
              if c is not None:
                derived.append((a,r,offv,j.address,c)); print(f'CONFIG_DERIVED offset={offv:#x} passed-near-call {c:#x} at {j.address:#x}');break
          print('\n=== derived config offset -> helper summary ===')
          for x in derived:print(tuple(hex(v) if isinstance(v,int) else v for v in x))
          # dump all unusual direct callees from core with a larger bounded body
          calls=[]
          for i in core:
            c=call(i)
            if c is not None and BASE<=c<END and c not in calls:calls.append(c)
          interesting=[c for c in calls if c in (0x400038b0,0x40013230,0x40013454,0x400134ac,0x40013658) or c>=0x40013200]
          print('\n=== interesting helper bodies ===')
          for c in interesting:
            print(f'\n-- helper {c:#x} --')
            for i in dis(c,min(END,c+0x900)):print(fmt(i))
          # Full CA9: identify functions with tight loops bounded by 31 and pair-stride 8.
          allins=dis(BASE,END)
          print('\n=== all exact CMP #31 ===')
          cmp31=[]
          for i in allins:
            if i.mnemonic.startswith('cmp'):
              try:
                if any(o.type==ARM_OP_IMM and o.imm==31 for o in i.operands):cmp31.append(i)
              except:pass
          print([hex(i.address) for i in cmp31])
          for ci in cmp31:
            print(f'\n-- cmp31 {ci.address:#x} --')
            for x in dis(max(BASE,ci.address-0x100),min(END,ci.address+0x180)):print(fmt(x))
          # Identify loops with add index,#1 and address scale <<3 in same ~0x100-byte region near cmp31.
          print('\n=== cmp31 regions containing <<3/pair-stride clues ===')
          for ci in cmp31:
            w=dis(max(BASE,ci.address-0x100),min(END,ci.address+0x180))
            clues=[x for x in w if ('lsl #3' in x.op_str or 'lsl #0x3' in x.op_str or '#8' in x.op_str)]
            if clues:
              print(hex(ci.address),[fmt(x) for x in clues[:30]])
          # Core stores back to original parameter pointer r4.
          print('\n=== stores to parameter block r4 ===')
          for i in core:
            if i.mnemonic.startswith('str'):
              for o in i.operands:
                if o.type==ARM_OP_MEM and i.reg_name(o.mem.base)=='r4':print(fmt(i))
          print('\n=== TARGET ===')
          print('Separate fixed CM matrix blocks from 31-entry remap table and identify the table consumer/interpolation path.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v160_ca9_cm_config_offsets_remap.txt
          git commit -m 'research: record v1.60 CM config offsets and remap helpers' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push