name: M10-R component DG topology audit RGB1E
on:
  push:
    branches: [m10r-reference-transfer-rgb1e]
    paths:
      - '.github/workflows/m10r-reference-transfer-rgb1e.yml'
      - 'app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1ERenderer.java'
      - 'tools/M10RTransferRgb1ECli.java'
      - 'tools/m10r_reference_transfer_rgb1e_fit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
          python3 -m pip install --quiet rawpy pillow numpy

      - name: Extract and verify exact nonlinear assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          rm -rf /tmp/assets
          python3 tools/m10r_b2y_assets.py /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin /tmp/assets >/dev/null
          echo '2fd6ca209f290c75aa96976b3d7692e55c41a55c0017a063aba9808da3b41a00  /tmp/assets/tone_medium_q15.u32le' | sha256sum -c -
          echo '9e65de24d52271be0783f4e2728f20f482c0ba43b63159b75033b4a4fc75457d  /tmp/assets/dg_expanded_u16le.bin' | sha256sum -c -

      - name: Compile RGB1E topology renderer
        run: |
          set -euo pipefail
          python3 -m py_compile tools/m10r_reference_transfer_rgb1e_fit.py tools/m10r_reference_transfer_rgb_fit.py tools/m10r_reference_order_fit.py
          mkdir -p /tmp/classes
          javac -d /tmp/classes \
            app/src/main/java/com/m10r/diagnostic/DngMetadataReader.java \
            app/src/main/java/com/m10r/diagnostic/DngRawDecoder.java \
            app/src/main/java/com/m10r/diagnostic/LosslessJpegDecoder.java \
            app/src/main/java/com/m10r/diagnostic/SensorPreviewCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RColorSpecCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RReferenceColorCore.java \
            app/src/main/java/com/m10r/diagnostic/M10RNeutralClipReferenceRenderer.java \
            app/src/main/java/com/m10r/diagnostic/M10RTransferRgb1ERenderer.java \
            tools/M10RTransferRgb1ECli.java

      - name: Render and score six same-capture pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rgb1e
          for id in 01 02 03 04 05 06; do
            echo "=== RGB1E sample $id ==="
            base="https://img.photographyblog.com/reviews/leica_m10_r/sample_images/leica_m10_r_${id}"
            curl -L --fail --retry 3 --retry-delay 2 "$base.jpg" -o "/tmp/rgb1e/$id.jpg"
            curl -L --fail --retry 3 --retry-delay 2 "$base.dng" -o "/tmp/rgb1e/$id.dng"
            exiftool -j -n \
              -Make -Model -SerialNumber -ImageUniqueID -DateTimeOriginal -CreateDate \
              -ExposureTime -FNumber -ISO -FocalLength -ExposureCompensation \
              -WhiteBalance -Contrast -Saturation -Sharpness \
              "/tmp/rgb1e/$id.jpg" "/tmp/rgb1e/$id.dng" > "/tmp/rgb1e/${id}_exif.json"
            java -cp /tmp/classes com.m10r.diagnostic.M10RTransferRgb1ECli \
              "/tmp/rgb1e/$id.dng" /tmp/assets/tone_medium_q15.u32le /tmp/assets/dg_expanded_u16le.bin \
              "/tmp/rgb1e/${id}_baseline.ppm" "/tmp/rgb1e/${id}_rec_id.ppm" "/tmp/rgb1e/${id}_rec_oetf.ppm" \
              "/tmp/rgb1e/${id}_fw_id.ppm" "/tmp/rgb1e/${id}_fw_oetf.ppm" 2000 | tee "/tmp/rgb1e/${id}_render.txt"
            python3 tools/m10r_reference_transfer_rgb1e_fit.py \
              --jpg "/tmp/rgb1e/$id.jpg" --dng "/tmp/rgb1e/$id.dng" \
              --baseline "/tmp/rgb1e/${id}_baseline.ppm" --rec-id "/tmp/rgb1e/${id}_rec_id.ppm" \
              --rec-oetf "/tmp/rgb1e/${id}_rec_oetf.ppm" --fw-id "/tmp/rgb1e/${id}_fw_id.ppm" --fw-oetf "/tmp/rgb1e/${id}_fw_oetf.ppm" \
              --sample "$id" --metadata-json "/tmp/rgb1e/${id}_exif.json" --out "/tmp/rgb1e/${id}_metrics.json" >/dev/null
            rm -f "/tmp/rgb1e/$id.jpg" "/tmp/rgb1e/$id.dng" /tmp/rgb1e/${id}_*.ppm
          done

      - name: Aggregate RGB1E architecture evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path

          modes=['baseline_oetfy_code_ratio','rec709_component_dg_identity','rec709_component_dg_oetf','fw_tone_component_dg_identity','fw_tone_component_dg_oetf']
          short={'baseline_oetfy_code_ratio':'BASELINE','rec709_component_dg_identity':'REC_ID','rec709_component_dg_oetf':'REC_OETF','fw_tone_component_dg_identity':'FW_ID','fw_tone_component_dg_oetf':'FW_OETF'}
          rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/rgb1e').glob('*_metrics.json'))]
          valid=[r for r in rows if r['metadata'].get('identity_supported') is True and r['metadata'].get('default_jpeg_controls') is True]
          keys=['encoded_rgb_rmse','encoded_rgb_mae','luma_rmse','luma_mae','delta_e76_mean','hue_error_deg_mean','saturation_error_abs_mean']
          core=['encoded_rgb_rmse','luma_rmse','delta_e76_mean']
          def med(m,k):
              v=[r['metrics'][m][k] for r in valid if r['metrics'][m].get(k) is not None]
              return statistics.median(v) if v else None
          def binmed(m,b,k='rgb_rmse'):
              v=[r['metrics'][m]['bins'][b][k] for r in valid if r['metrics'][m]['bins'][b][k] is not None]
              return statistics.median(v) if v else None
          def clips(m):
              return sum(sum(r['metrics'][m]['highlight_channel_clipping'][c]['candidate_255_reference_below_250'] for c in 'RGB') for r in valid)
          def wins_vs_base(m,k):
              return sum(r['metrics'][m][k] < r['metrics']['baseline_oetfy_code_ratio'][k] for r in valid)

          agg={'total':len(rows),'valid':len(valid),'medians':{},'bins':{},'falseClips':{},'winsVsBaseline':{},'composite':{}}
          for m in modes:
              agg['medians'][m]={k:med(m,k) for k in keys}
              agg['bins'][m]={b:{'rgb_rmse':binmed(m,b,'rgb_rmse'),'luma_rmse':binmed(m,b,'luma_rmse')} for b in ('shadow','midtone','highlight','neutral_pixels','colourful_pixels')}
              agg['falseClips'][m]=clips(m)
              agg['winsVsBaseline'][m]={k:wins_vs_base(m,k) for k in core} if m!='baseline_oetfy_code_ratio' else {}
          minima={k:min(agg['medians'][m][k] for m in modes) for k in core}
          for m in modes:agg['composite'][m]=sum(agg['medians'][m][k]/max(1e-12,minima[k]) for k in core)/len(core)
          ranking=sorted(modes,key=lambda m:agg['composite'][m]);agg['ranking']=ranking;agg['shortRanking']=[short[m] for m in ranking]

          base='baseline_oetfy_code_ratio';b=agg['medians'][base];bh=agg['bins'][base]['highlight']['rgb_rmse'];bc=agg['falseClips'][base]
          need=max(4,math.ceil(.67*len(valid))) if valid else 999
          gate={};clear=[]
          for m in modes:
              if m==base:continue
              q=agg['medians'][m]
              ratios={k:q[k]/b[k] for k in core}
              broad=all(agg['winsVsBaseline'][m][k]>=need for k in core)
              core_ok=all(v<=.98 for v in ratios.values())
              hue_ok=q['hue_error_deg_mean']<=b['hue_error_deg_mean']*1.07+.5
              sat_ok=q['saturation_error_abs_mean']<=b['saturation_error_abs_mean']*1.07+.005
              high_ok=agg['bins'][m]['highlight']['rgb_rmse']<=bh*1.05
              clip_ok=agg['falseClips'][m]<=max(bc*1.10,bc+1000)
              passed=broad and core_ok and hue_ok and sat_ok and high_ok and clip_ok
              gate[m]={'coreRatios':ratios,'broadCoreWins':broad,'coreMedianImproves2pct':core_ok,'hueGuard':hue_ok,'saturationGuard':sat_ok,'highlightGuard':high_ok,'clipGuard':clip_ok,'passed':passed}
              if passed:clear.append(m)
          agg['gate']=gate
          verdict='RGB1E_COMPONENT_DG_TOPOLOGY_NOT_PROMOTED'
          if clear:
              clear.sort(key=lambda m:agg['composite'][m]);verdict='RGB1E_FAVORS_'+short[clear[0]]
          elif ranking and ranking[0]!=base:
              verdict='RGB1E_COMPONENT_DG_LEADS_CORE_BUT_FAILS_GUARD_'+short[ranking[0]]
          agg['verdict']=verdict;agg['requiredWins']=need if valid else None;agg['run']=os.environ.get('GITHUB_RUN_ID');agg['commit']=os.environ.get('GITHUB_SHA')

          out=['M10-R REFERENCE TRANSFER RGB1E — SHARED MEDIUM GAIN / COMPONENT-WISE DG','',
               'Firmware hypothesis under test: weighted linear RGB scalar -> MEDIUM Q15 gain -> shared tone gain on RGB component coordinates -> Differential Gamma independently per component.','Working-space boundary: current ColorSpec linear sRGB is used as the component basis; literal Leica B2Y working RGB remains OPEN.','No fitting. Exact firmware MEDIUM/DG assets. Live m10r-capture1b untouched.','',
               'Scalar weights: REC709=0.2126/0.7152/0.0722; FW_TONE=1024/2661/410 normalized by 4095.','Final transfer crossed: identity vs textbook sRGB OETF.','BASELINE is RGB1D OETF(linear Rec709 Y) code-ratio scalar topology at fixed scale 0.94.','', '=== Per-sample RGB ranking ===']
          for r in rows:
              rank=sorted(modes,key=lambda m:r['metrics'][m]['encoded_rgb_rmse'])
              out.append(f"sample {r['sample']} identity={r['metadata'].get('identity_supported')} defaults={r['metadata'].get('default_jpeg_controls')} align={r['alignment']['score']:.5f}")
              for m in rank:
                  q=r['metrics'][m]
                  out.append(f"  {short[m]} RGB={q['encoded_rgb_rmse']:.4f} Y={q['luma_rmse']:.4f} dE={q['delta_e76_mean']:.4f} hue={q['hue_error_deg_mean']:.4f} sat={q['saturation_error_abs_mean']:.6f} hi={q['bins']['highlight']['rgb_rmse']}")
          out+=['','=== Aggregate ranking ===']
          for m in ranking:
              out.append(f"{short[m]} composite={agg['composite'][m]:.6f} medians={agg['medians'][m]} winsVsBaseline={agg['winsVsBaseline'][m]}")
              out.append(f"  bins={agg['bins'][m]} falseHighlightClips={agg['falseClips'][m]}")
          out+=['','=== Promotion gate versus BASELINE ===']
          for m,v in gate.items():out.append(f"{short[m]}: {v}")
          out+=['','VERDICT '+verdict,'',
                'Interpretation boundary: photographic evidence can discriminate this reconstructed topology but cannot prove that linear sRGB is the firmware component basis or establish literal hardware routing.',
                f"Workflow run id: {agg['run']}",f"Analysis input commit: {agg['commit']}"]
          Path('research/M10R_REFERENCE_TRANSFER_RGB1E.md').write_text('\n'.join(out)+'\n')
          Path('research/M10R_REFERENCE_TRANSFER_RGB1E.json').write_text(json.dumps({'samples':rows,'aggregate':agg},indent=2,sort_keys=True)+'\n')
          print('\n'.join(out))
          PY

      - name: Upload RGB1E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M10R-REFERENCE-TRANSFER-RGB1E
          path: |
            /tmp/rgb1e/*_metrics.json
            /tmp/rgb1e/*_render.txt
            research/M10R_REFERENCE_TRANSFER_RGB1E.md
            research/M10R_REFERENCE_TRANSFER_RGB1E.json
          if-no-files-found: warn

      - name: Commit RGB1E evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_REFERENCE_TRANSFER_RGB1E.md research/M10R_REFERENCE_TRANSFER_RGB1E.json
          git commit -m 'research: record component DG topology audit RGB1E' || exit 0
          git pull --rebase origin m10r-reference-transfer-rgb1e
          git push
