name: M10-R v1.68 TF runtime consumer
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v168-tf-runtime-consumer.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace IMG request/config TF consumers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v168_tf_runtime_consumer.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return PFX+a-BASE
          def dis(a,z):return list(md.disasm(b[off(max(BASE,a)):off(min(END,z))],max(BASE,a)))
          def ops(i):
            try:return i.operands
            except:return []
          def call(i):
            oo=ops(i)
            if i.mnemonic in ('bl','blx') and oo and oo[0].type==ARM_OP_IMM:return oo[0].imm&~1
          def lit(i):
            oo=ops(i)
            try:
              if i.mnemonic.startswith('ldr') and len(oo)>1 and oo[1].type==ARM_OP_MEM and oo[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+oo[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i);c=call(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          print('M10-R v1.68 TF RUNTIME CONSUMER')
          # Every direct literal ref to per-frame request block. These are the only places that can recover config pointer +0x24 without carrying it from args.
          refs=[];a=BASE
          while a<END:
            for i in dis(a,min(END,a+0x10000)):
              q=lit(i)
              if q and q[1]==0x43705760: refs.append(i.address)
            a+=0x10000
          print('\n=== refs to request block 0x43705760 ===');print([hex(x) for x in refs])
          for h in refs:
            print(f'\n-- request ref {h:#x} context --')
            for i in dis(h-0x180,h+0x300):print(fmt(i))
          print('\n=== exact completion callback 0x420a3638 tail ===')
          for i in dis(0x420a3638,0x420a3aa8): print(fmt(i))
          # Functions just after callback, especially 0x420a3cxx/0x420a40xx request refs.
          print('\n=== post-callback color routines 0x420a3aa8..0x420a4140 ===')
          for i in dis(0x420a3aa8,0x420a4140): print(fmt(i))
          print('\n=== config fill TF overlay exact ===')
          for i in dis(0x420a57e0,0x420a5910):print(fmt(i))
          print('\n=== TARGET ===')
          print('Find runtime reader of request+0x24 config pointer that reaches config+0x128/+0x12c/+0x134, or prove no IMG consumer exists after initialization.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v168_tf_runtime_consumer.txt
          git commit -m 'research: record v1.68 TF runtime consumer trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push