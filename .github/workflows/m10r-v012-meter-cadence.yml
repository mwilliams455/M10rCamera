name: M10-R v0.12 traditional meter cadence
on:
  push:
    branches: [m10r-meter-cadence-trace]
    paths: ['.github/workflows/m10r-v012-meter-cadence.yml', '.m10r-v012-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover CTRL and IMG sections
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace cadence, latch, and release linkage
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/m10r-v012-meter-cadence.txt
          from pathlib import Path
          import struct,re
          from collections import defaultdict
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC

          def analyze(path,base,pfx,label):
            b=Path(path).read_bytes();md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
            code=list(md.disasm(b[pfx:],base))
            calls=defaultdict(list)
            for i in code:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
                calls[i.operands[0].imm].append(i.address)
            def off(v): return pfx+v-base
            def dis(name,s,e):
              print(f'\n=== {label} {name} {s:#010x}..{e:#010x} ===')
              for i in md.disasm(b[off(s):off(e)],s):
                if i.mnemonic!='.byte': print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
            def direct_callers(t): return calls.get(t,[])
            def ptr_xrefs(t):
              out=[]
              for val in (t,t|1):
                needle=struct.pack('<I',val);q=0
                while True:
                  q=b.find(needle,q)
                  if q<0:break
                  lit=base+q-pfx
                  refs=[]
                  for i in code:
                    if i.mnemonic=='.byte':continue
                    for op in i.operands:
                      if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_PC and (((i.address+4)&~3)+op.mem.disp)==lit: refs.append(i.address)
                  out.append((val,lit,refs));q+=1
              return out
            def global_xrefs(addr):
              needle=struct.pack('<I',addr);q=0;ans=[]
              while True:
                q=b.find(needle,q)
                if q<0:break
                lit=base+q-pfx;refs=[]
                for i in code:
                  if i.mnemonic=='.byte':continue
                  for op in i.operands:
                    if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_PC and (((i.address+4)&~3)+op.mem.disp)==lit: refs.append(i.address)
                ans.append((lit,refs));q+=1
              return ans
            return b,md,code,calls,dis,direct_callers,ptr_xrefs,global_xrefs

          b,md,code,calls,dis,dcall,px,gx=analyze('/tmp/sections/090_CTRL-System.bin',0x08000000,4,'CTRL')
          targets={
            0x0800d6a8:'FINAL_BV_SELECTOR',
            0x080184d8:'SELECTOR5_CONSTRUCTOR',
            0x0800e1ec:'AE_RESULT_HANDLER',
            0x080203b4:'EXPOSURE_CALCULATOR',
          }
          print('=== CTRL DIRECT CALLERS ===')
          for t,n in targets.items(): print(n,hex(t),[hex(x) for x in dcall(t)])
          for t,n in targets.items():
            print('\nPOINTER_XREFS',n,[(hex(v),hex(l),[hex(x) for x in r]) for v,l,r in px(t)])
          # disassemble target functions and all direct callers
          dis('FINAL_BV_SELECTOR',0x0800d640,0x0800d820)
          dis('SELECTOR5_CONSTRUCTOR',0x08018470,0x08018720)
          for t,n in targets.items():
            for a in dcall(t): dis(n+'_CALL_'+hex(a),max(0x08000000,a-180),min(0x08000000+len(b)-4,a+240))
          # one more caller generation above final-selector callers
          print('\n=== SECOND LEVEL CALLERS OF FINAL SELECTOR CALLERS ===')
          for a in dcall(0x0800d6a8):
            parents=dcall(a|1)+dcall(a)
            print(hex(a),[hex(x) for x in parents])
          # negative-Bv and related state xrefs
          globals_={0x2001ad76:'NEG_BV_DELAY_LATCH',0x2001ad72:'TRAD_ACCEPT',0x2001ad79:'RECALC_ONESHOT',0x2001adae:'LV_PREP',0x2001adbb:'SENSOR_PROCESS'}
          for g,n in globals_.items():
            refs=gx(g);print('\nGLOBAL',n,hex(g),[(hex(l),[hex(x) for x in r]) for l,r in refs])
            seen=set()
            for l,rs in refs:
              for a in rs:
                if a not in seen:
                  seen.add(a);dis(n+'_REF_'+hex(a),max(0x08000000,a-220),min(0x08000000+len(b)-4,a+320))
          # 300 decimal immediate and timer-ish strings near latch refs
          print('\n=== IMMEDIATE 300 / 0x12C IN CTRL ===')
          for i in code:
            for op in i.operands:
              if op.type==ARM_OP_IMM and op.imm in (300,0x12c): print(hex(i.address),i.mnemonic,i.op_str)
          strings={}
          for m in re.finditer(rb'[ -~]{4,140}\x00',b): strings[0x08000000+m.start()-4]=m.group()[:-1].decode('ascii','ignore')
          print('\n=== RELEVANT CTRL STRINGS ===')
          for va,s in sorted(strings.items()):
            lo=s.lower()
            if any(k in lo for k in ('negative','meter','measure','300','bv','release','ae update','timeout')):
              print(hex(va),repr(s))

          # IMG release/event context for D6/D7/D5 and any meter-oriented names nearby.
          ib,imd,icode,icalls,idis,idcall,ipx,igx=analyze('/tmp/sections/092_IMG-System.bin',0x42000000,4,'IMG')
          idis('RELEASE_TRANSLATOR',0x421866e0,0x42186980)
          idis('AE_ENTRY_CALLBACKS',0x421bd520,0x421bd680)
          idis('EXTERNAL_EXPOSURE_ACTIONS',0x421be200,0x421be780)
          print('\n=== IMG D5/D6/D7 HALFWORD OCCURRENCES NEAR BSTM DATA ARE NOT CODE-PROOF; STRING SURVEY ===')
          istr={}
          for m in re.finditer(rb'[ -~]{4,160}\x00',ib): istr[0x42000000+m.start()-4]=m.group()[:-1].decode('ascii','ignore')
          for va,s in sorted(istr.items()):
            lo=s.lower()
            if any(k in lo for k in ('lightmeter','light-meter','meter','release','exposure start','ae lock','measure')):
              print(hex(va),repr(s))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v012-meter-cadence
          path: /tmp/m10r-v012-meter-cadence.txt
          if-no-files-found: error
