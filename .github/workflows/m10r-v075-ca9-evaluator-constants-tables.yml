name: M10-R v0.75 CA9 evaluator constants and tables
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v075-ca9-evaluator-constants-tables.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Trace evaluator constants and quantity tables
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v075_ca9_evaluator_constants_tables.txt
          from pathlib import Path
          import struct,math
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();base=0x40000000;pfx=4;code=b[pfx:];end=base+len(code)
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return pfx+a-base
          def one(a):
              o=off(a);x=list(md.disasm(b[o:o+4],a,1)) if 0<=o<=len(b)-4 else [];return x[0] if x else None
          def u32(a):
              o=off(a);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def f32(a):
              o=off(a);return struct.unpack_from('<f',b,o)[0] if 0<=o<=len(b)-4 else None
          def f64(a):
              o=off(a);return struct.unpack_from('<d',b,o)[0] if 0<=o<=len(b)-8 else None
          def fmt(i):return f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}'
          def dump(a,z,title):
              print(f'\n=== {title} ===')
              for aa in range(a&~3,z&~3,4):
                  i=one(aa)
                  if i:print(fmt(i))
          print('M10-R v0.75 CA9 EVALUATOR CONSTANTS / QUANTITY TABLES')
          for a in range(0x40000390,0x400003c0,4):
              print('DATA',hex(a),'u32',hex(u32(a)),'f32',repr(f32(a)))
          for a in range(0x40000398,0x400003b8,4):
              if a+8<=0x400003c0: print('DOUBLE',hex(a),repr(f64(a)))
          dump(0x40000610,0x40000790,'QUANTITY TABLE SELECTOR 0x40000610')
          # candidate call preparation up through table-selector result and evaluator call
          for a,z,name in ((0x40000864,0x40000954,'INTEGRAL'),(0x400009ac,0x40000a90,'SPOT'),(0x40000ac8,0x40000bac,'AV_FIELD'),(0x40000be4,0x40000cc8,'MFM_TOPLEVEL')):
              dump(a,z,name+' TOPLEVEL CONFIG')
          # Decode known quantity table pointers around 0x40000610 selector literals.
          print('\nSELECTOR_LITERAL_WORDS')
          for a in range(0x40000c80,0x40000cc0,4):
              v=u32(a)
              if v is not None: print(hex(a),hex(v))
          # Determine whether 0x400126e8 behaves as log via call-neighbor strings and first instructions.
          dump(0x400126e8,0x40012840,'MATH HELPER 0x400126e8')
          dump(0x400132a8,0x40013390,'UINT64 TO DOUBLE HELPER 0x400132a8')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v075_ca9_evaluator_constants_tables.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.75 CA9 evaluator constants and tables'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
