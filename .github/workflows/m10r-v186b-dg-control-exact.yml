name: M10-R v1.86b exact differential gamma control
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v186b-dg-control-exact.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode exact DG control helper
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v186b_dg_control_exact.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;P=4
          def off(a):return P+a-BASE
          def run(mode,name):
            md=Cs(CS_ARCH_ARM,mode|CS_MODE_LITTLE_ENDIAN);md.detail=True
            print('\n===',name,'exact 0x420d15e8..0x420d1648 ===')
            for i in md.disasm(b[off(0x420d15e8):off(0x420d1648)],0x420d15e8):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
              try:
                if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                  la=(((i.address+4)&~3) if mode&CS_MODE_THUMB else i.address+8)+i.operands[1].mem.disp
                  o=off(la)
                  if 0<=o<=len(b)-4:s+=f" ; LIT {la:#x}->{struct.unpack_from('<I',b,o)[0]:#x}"
              except:pass
              print(s)
          print('M10-R v1.86b EXACT DG CONTROL HELPER')
          run(CS_MODE_THUMB,'THUMB')
          run(CS_MODE_ARM,'ARM')
          print('\nraw',b[off(0x420d15e8):off(0x420d1648)].hex())
          print('\nTARGET: choose correct instruction state by valid prologue/control flow and freeze how ID0B payload words +0/+4 map to 0x20020800 bit24/bit25.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v186b_dg_control_exact.txt
          git commit -m 'research: record v1.86b exact DG control helper' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push