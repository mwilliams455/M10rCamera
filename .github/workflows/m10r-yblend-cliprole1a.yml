name: M10-R Y BLEND CLIPROLE1A evidence
on:
  push:
    branches: [m10r-yblend-cliprole1a]
    paths: ['.github/workflows/m10r-yblend-cliprole1a.yml', 'tools/m10r_yblend_cliprole1a.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  named-clip-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned research dependencies
        run: python3 -m pip install --quiet capstone==5.0.3 unicorn==2.1.3
      - name: Obtain hash-verified firmware sections
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker);z=p.index('\n          CPP',a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec > /tmp/sections.txt
      - name: Execute named-clip comparison and retained regression
        run: |
          set -euo pipefail
          mkdir -p evidence/results evidence/tools
          echo '569fa810aebefa1a94ee750e6e90a1411a4e66a3e57bfa89eedc205bf49080e4  tools/m10r_yblend_cliprole1a.py' | sha256sum -c -
          python3 tools/m10r_yblend_cliprole1a.py /tmp/sec evidence/results --cases 128 > evidence/results/stdout.txt
          python3 tools/m10r_yblend_bit15_audit1a.py /tmp/sec --cases 1024 --out evidence/results/register_emulation.json > evidence/results/audit_stdout.txt
          echo 'dcd88257979b44de4ee7b577773b60a9338322155d0b83fe911a7a38ce15fbb1  evidence/results/cliprole_results.json' | sha256sum -c -
          echo '50eb66d4091436c76bd90d9fff94d89214c945089e4b27e95d5cba7792e747e3  evidence/results/register_emulation.json' | sha256sum -c -
          cp tools/m10r_yblend_cliprole1a.py tools/m10r_yblend_bit15_audit1a.py evidence/tools/
          cp .github/workflows/m10r-yblend-cliprole1a.yml evidence/
          git rev-parse HEAD > evidence/results/source_commit.txt
          git fetch --depth=1 origin a1a32af288e6c74835c9d3cff7bf0e7f18e35f5a
          git diff --name-only a1a32af288e6c74835c9d3cff7bf0e7f18e35f5a HEAD > evidence/results/changed_paths.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('evidence');j=json.loads((p/'results/cliprole_results.json').read_text())
          assert j['status']=='PASS_NAMED_CLIP_ANALOGUE_ONLY' and j['gate_c_passed'] is False
          assert j['tests']['complete_SAM7_clip_entries']==512
          assert j['tests']['bounded_SUPPRE_slice_entries']==516
          assert j['tests']['source_parameter_writes']==0
          assert set((p/'results/changed_paths.txt').read_text().splitlines())=={'.github/workflows/m10r-yblend-cliprole1a.yml','tools/m10r_yblend_cliprole1a.py'}
          entries=[]
          for f in sorted(p.rglob('*')):
              if f.is_file():
                  b=f.read_bytes();entries.append({'path':str(f.relative_to(p)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (p/'manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          (p/'README.txt').write_text('Same-firmware named clip analogue evidence only. Separate register banks are not connected by these tests. The proposed signed-magnitude limiter is an explicit candidate, not recovered ISP arithmetic. No firmware binaries, third-party code or APK included.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-CLIPROLE1A-EVIDENCE
          path: evidence/
          retention-days: 90
          if-no-files-found: error
