name: M10-R v1.59 CA9 CM core remap
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v159-ca9-cm-core-remap.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode CM core and TF-remap consumer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text(); a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n"); z=p.index("\n          CPP",a); Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v159_ca9_cm_core_remap.txt
          from pathlib import Path
          import struct,collections
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000;PFX=4;END=BASE+len(b)-PFX
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a,n=180):
            o=off(a)
            if not 0<=o<len(b):return None
            e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e]
            return q.decode('ascii','replace') if e>o and len(q)>=4 and all(32<=x<127 for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
            if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'+(f' STRING={cstr(q[1])!r}' if cstr(q[1]) else '')
            c=call(i)
            if c is not None:s+=f' ; CALL {c:#x}'
            return s
          A=0x40003af4; Z=0x40004050; ins=dis(A,Z)
          print('M10-R v1.59 CA9 CM CORE / TF-REMAP TRACE')
          print('\n=== exact CM core 0x40003AF4..0x40004050 ===')
          for i in ins:print(fmt(i))
          calls=[]
          for i in ins:
            c=call(i)
            if c is not None and BASE<=c<END and c not in calls:calls.append(c)
          print('\n=== direct calls from CM core ===');print([hex(x) for x in calls])
          # memory displacement summary by base register in core
          dd=collections.defaultdict(set)
          for i in ins:
            for o in i.operands:
              if o.type==ARM_OP_MEM: dd[i.reg_name(o.mem.base)].add(o.mem.disp)
          print('\n=== CM core memory displacements by base register ===')
          for r,ds in sorted(dd.items()):print(r,[hex(x) if x>=0 else '-'+hex(-x) for x in sorted(ds)])
          # Focus on r4 because handler hands request.word2 to core and core starts mov r4,r0.
          print('\n=== all r4 memory accesses ===')
          for i in ins:
            if any(o.type==ARM_OP_MEM and i.reg_name(o.mem.base)=='r4' for o in i.operands):print(fmt(i))
          # Dump bounded direct callees; enough to identify interpolation/remap helpers.
          for c in calls:
            print(f'\n=== callee {c:#x} window ===')
            for i in dis(max(BASE,c-0x20),min(END,c+0x240)):print(fmt(i))
          # Search full CA9 for literal/config-like constants known from IMG serialization sizes/limits: 31, 0xF8, 0x100.
          print('\n=== exact compare #31 inside CM core/callees ===')
          targets=set(calls)
          for i in ins:
            if i.mnemonic.startswith('cmp') and any(o.type==ARM_OP_IMM and o.imm==31 for o in i.operands):print('CORE',fmt(i))
          for c in calls:
            for i in dis(c,min(END,c+0x600)):
              if i.mnemonic.startswith('cmp') and any(o.type==ARM_OP_IMM and o.imm==31 for o in i.operands):print(hex(c),fmt(i))
          print('\n=== known mathematical helper identities near 0x40012b20 ===')
          for i in dis(0x40012b20,0x40012ba0):print(fmt(i))
          print('\n=== TARGET ===')
          print('Identify exact ASN remap table consumer, interpolation equation, enable/count fields, and resulting remapped ASN triplet.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v159_ca9_cm_core_remap.txt
          git commit -m 'research: record v1.59 CA9 CM core remap trace' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push