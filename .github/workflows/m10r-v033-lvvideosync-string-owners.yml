name: M10-R v0.33 LVVideoSync string owners
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v033-lvvideosync-string-owners.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - run: python3 -m pip install --quiet capstone
      - name: Resolve LVVideoSync string owners
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          mkdir -p research
          python3 - <<'PY' > research/M10R_v033_lvvideosync_string_owners.txt
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC

          class Sec:
            def __init__(self,path,base,pfx=4):
              self.b=Path(path).read_bytes();self.base=base;self.pfx=pfx;self.code=self.b[pfx:]
              self.md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);self.md.detail=True;self.md.skipdata=True
            def off(self,a):return self.pfx+a-self.base
            def u32(self,a):
              o=self.off(a);return struct.unpack_from('<I',self.b,o)[0] if 0<=o<=len(self.b)-4 else None
            def astr(self,a,n=220):
              o=self.off(a)
              if not 0<=o<len(self.b):return None
              out=[]
              for c in self.b[o:o+n]:
                if c==0:break
                if c in (9,10,13) or 32<=c<127:out.append(chr(c))
                else:return None
              s=''.join(out);return s if len(s)>=4 else None
            def fmt(self,i):
              ex=''
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;v=self.u32(la)
                if v is not None:
                  s=self.astr(v);ex=f' ; LIT {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:ex+=f' ; CALL {i.operands[0].imm:#x}'
              return f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}{ex}'
            def dump(self,a,z,title):
              print(f'\n=== {title} {a:#x}..{z:#x} ===')
              for i in self.md.disasm(self.b[self.off(a):self.off(z)],a):
                if i.mnemonic!='.byte':print(self.fmt(i))
            def refs_to(self,target):
              refs=[]
              # Thumb16 ADR
              for p in range(0,len(self.code)-2,2):
                h=struct.unpack_from('<H',self.code,p)[0]
                if (h&0xf800)==0xa000:
                  a=self.base+p;t=((a+4)&~3)+((h&0xff)<<2)
                  if t==target:refs.append((a,'ADR16'))
              # absolute literal pointers + LDR refs in local ±4K window around pointer literal
              pat=struct.pack('<I',target);q=0;lits=[]
              while True:
                q=self.b.find(pat,q)
                if q<0:break
                if q>=self.pfx:lits.append(self.base+q-self.pfx)
                q+=1
              for la in lits:
                st=max(self.base,la-0x1000)&~1;en=min(self.base+len(self.code),la+4)
                for shift in (0,2):
                  for i in self.md.disasm(self.b[self.off(st+shift):self.off(en)],st+shift):
                    if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                      got=((i.address+4)&~3)+i.operands[1].mem.disp
                      if got==la:refs.append((i.address,'LDRPTR'))
              return sorted(set(refs)),lits
            def nearest_push(self,a,maxback=0xc0):
              out=[]
              for s in range(max(self.base,a-maxback)&~1,a+1,2):
                ii=list(self.md.disasm(self.b[self.off(s):self.off(s)+6],s,count=1))
                if ii and ii[0].address==s and ii[0].mnemonic.startswith('push') and 'lr' in ii[0].op_str:out.append(s)
              return out[-1] if out else max(self.base,a-0x50)&~1

          ctrl=Sec('/tmp/sections/090_CTRL-System.bin',0x08000000)
          img=Sec('/tmp/sections/092_IMG-System.bin',0x42000000)

          print('################ CTRL LVVIDEOSYNC DIAGNOSTIC OWNERS ################')
          ctrl_targets={0x0803a814:'LVVideoSync last frame received',0x0803a9c0:'LVVideoSync received'}
          for t,n in ctrl_targets.items():
            rr,ll=ctrl.refs_to(t);print('\nTARGET',n,hex(t),repr(ctrl.astr(t)),'REFS',[(hex(a),k) for a,k in rr],'LITS',[hex(x) for x in ll])
            for a,k in rr:
              s=ctrl.nearest_push(a);ctrl.dump(s,min(ctrl.base+len(ctrl.code),s+0x380),n+' OWNER')

          print('\n################ IMG LVVIDEO* STRING OWNERS ################')
          for m in re.finditer(rb'(?:LVVIDEO_SYNC|LVVIDEO_PARAM|LVVIDEO)',img.b):
            q=m.start()
            # only beginning of a C string/token
            if q>0 and 32<=img.b[q-1]<127:continue
            t=img.base+q-img.pfx
            end=img.b.find(b'\0',q,min(len(img.b),q+220));end=end if end>=0 else min(len(img.b),q+220)
            text=img.b[q:end].decode('latin1','replace')
            rr,ll=img.refs_to(t)
            print('\nTARGET',hex(t),'fileoff',hex(q),repr(text),'REFS',[(hex(a),k) for a,k in rr],'LITS',[hex(x) for x in ll])
            for a,k in rr:
              s=img.nearest_push(a);img.dump(s,min(img.base+len(img.code),s+0x300),'IMG STRING OWNER '+hex(t))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v033_lvvideosync_string_owners.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: record v0.33 LVVideoSync string owners'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
