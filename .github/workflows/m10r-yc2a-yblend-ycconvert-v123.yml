name: M10-R YC2A v1.23 Y_BLEND Yc_Convert semantic probe

on:
  push:
    branches: [m10r-yc2a-research]
    paths:
      - 'tools/m10r_yc2a_yblend_ycconvert_v123.py'
      - '.github/workflows/m10r-yc2a-yblend-ycconvert-v123.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: pip install capstone
      - name: Download and unpack M10-R firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Probe Y_BLEND and Yc_Convert
        run: |
          set -euo pipefail
          python3 tools/m10r_yc2a_yblend_ycconvert_v123.py \
            /tmp/sections \
            /tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin \
            | tee M10R_v123_yblend_ycconvert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-v123-yblend-ycconvert
          path: M10R_v123_yblend_ycconvert.txt
