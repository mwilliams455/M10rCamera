name: M10-R v0.15 CA9 Bv pack trace
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v015-img-ca9-bv-pack-trace.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover IMG
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace CA9 Bv packing
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/m10r-v015-img-ca9-bv-pack-trace.txt
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          import struct
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); base=0x42000000;p=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(v):return p+v-base
          def r32(v):
            o=off(v);return struct.unpack_from('<I',b,o)[0] if 0<=o<=len(b)-4 else None
          def astr(v,n=240):
            o=off(v)
            if not 0<=o<len(b):return None
            s=[]
            for c in b[o:o+n]:
              if c==0:break
              if c in (9,10,13) or 32<=c<127:s.append(chr(c))
              else:return None
            q=''.join(s);return q if len(q)>=4 else None
          def dis(a,z):return [i for i in md.disasm(b[off(a):off(z)],a) if i.mnemonic!='.byte']
          def lit(i):
            if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
              la=((i.address+4)&~3)+i.operands[1].mem.disp; return la,r32(la)
            return None,None
          def dump(tag,a,z):
            print(f'\n=== {tag} {a:#x}..{z:#x} ===')
            for i in dis(a,z):
              la,v=lit(i);ex=''
              if v is not None:
                s=astr(v);ex=f' ; literal {la:#x}->{v:#x}'+(f' STRING={s!r}' if s else '')
              print(f'{i.address:08x}: {i.mnemonic:9s} {i.op_str}{ex}')
          # Main CA9 Bv update region around known diagnostic.
          dump('CA9_BV_UPDATE',0x420a8100,0x420a8c20)
          # Find direct callers of likely function entries/prologues in this region by global single-pass calls only.
          print('\n=== PROLOGUES/CALLERS ===')
          region=dis(0x420a8100,0x420a8c20)
          pro=[i.address for i in region if i.mnemonic.startswith('push')]
          # single whole-image pass for BL targets
          callers={x:[] for x in pro}
          for i in md.disasm(b[p:],base):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:
              t=i.operands[0].imm&~1
              if t in callers:callers[t].append(i.address)
          for t in pro:
            if callers[t]:print(hex(t),[hex(x) for x in callers[t][:40]])
          # Raw xrefs to known global addresses appearing in literals in the CA9 region, so we can find pack/transmit owners cheaply.
          vals=[]
          for i in region:
            _,v=lit(i)
            if v is not None and 0x40000000<=v<0x43000000:vals.append(v)
          vals=sorted(set(vals))
          print('\n=== CA9 REGION GLOBALS RAW POINTER OCCURRENCES ===')
          for v in vals:
            pat=struct.pack('<I',v);hits=[];s=0
            while True:
              k=b.find(pat,s)
              if k<0:break
              hits.append(base+k-p);s=k+1
            if len(hits)<=80:print(hex(v),[hex(x) for x in hits])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v015-img-ca9-bv-pack-trace
          path: /tmp/m10r-v015-img-ca9-bv-pack-trace.txt
          if-no-files-found: error
