name: M10-R output-space transfer 1N
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1n.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace CA9 output-space to CC1 matrix
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1N.txt
          from pathlib import Path
          import struct,re
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def one(a):
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1)) if BASE<=a<BASE+len(b)-PFX else []
            return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def cstr(a,n=220):
            if not BASE<=a<BASE+len(b)-PFX:return ''
            o=off(a);e=b.find(b'\0',o,min(len(b),o+n));q=b[o:e] if e>o else b''
            try:return q.decode('ascii')
            except:return ''
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i)
            if x:
              s+=f' ; LIT {hex(x[0])}->{hex(x[1])}';st=cstr(x[1])
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s
          def win(a,bb=24,aa=12):
            return [j for j in (one(x) for x in range(a-bb*2,a+aa*2,2)) if j]
          core=dis(0x420a3a00,0x420a4520)
          print('M10-R OUTPUTSPACE TRANSFER1N')
          print('\n=== COLOR MANAGEMENT OUTPUT CORE 0x420A3A00..0x420A4520 ===')
          for i in core:print(fmt(i))
          print('\n=== LIVE OUTPUTSPACE BYTE READS IN CORE ===')
          mode_reads=[]
          for idx,i in enumerate(core):
            x=lit(i)
            if x and x[1]==0x43705760:
              nearby=core[idx:idx+5]
              if any('#0x20' in j.op_str for j in nearby):
                mode_reads.append(i.address)
                print('\nBASELOAD',hex(i.address));[print(fmt(j)) for j in core[max(0,idx-8):min(len(core),idx+16)]]
          print('COUNT',len(mode_reads))
          print('\n=== MODE-READ CONTROL-FLOW USE ===')
          for a in mode_reads:
            seq=[j for j in core if a<=j.address<a+0x50]
            print('\nFROM',hex(a))
            for j in seq:
              if j.mnemonic.startswith(('cmp','tst','cb','b')) or call(j) is not None or 'str' in j.mnemonic:print(fmt(j))

          markers=('CC1 default data','CC1 T[K]','CC1 R0','CC1 R1','CC1 R2','CC0')
          print('\n=== CC1/CC0 DIAGNOSTIC DATAFLOW WINDOWS ===')
          for i in core:
            # detect ADR string targets manually from operand target via Capstone immediate where possible
            st=''
            if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM: st=cstr(i.operands[1].imm)
            x=lit(i)
            if not st and x:st=cstr(x[1])
            if st and any(m in st for m in markers):
              print('\nMARK',hex(i.address),repr(st))
              [print(fmt(j)) for j in win(i.address,32,10)]

          print('\n=== CALL SURFACE IN OUTPUT CORE ===')
          cs=[]
          for i in core:
            t=call(i)
            if t is not None:
              cs.append((i.address,t));print(fmt(i))
          print('\n=== REPEATED NON-LIBRARY CALL TARGETS ===')
          from collections import Counter
          cnt=Counter(t for _,t in cs)
          for t,n in cnt.most_common():
            if n>=2:print(hex(t),n)

          print('\n=== ASCII CC/MATRIX/HARDWARE SYMBOL INVENTORY ===')
          # Inventory only strings from IMG-System that look semantically relevant.
          data=b;pos=0;seen=0
          while pos<len(data):
            if 0x20<=data[pos]<0x7f and (pos==0 or data[pos-1]==0):
              e=data.find(b'\0',pos,min(len(data),pos+220))
              if e>pos:
                q=data[pos:e]
                try:s=q.decode('ascii')
                except:s=''
                low=s.lower()
                if len(s)>=5 and any(k in low for k in ('cc0','cc1','color correction','colour correction','matrix')):
                  print(hex(BASE+pos-PFX),repr(s));seen+=1
                pos=e+1;continue
            pos+=1
          print('STRING_COUNT',seen)
          print('\n=== DECISION GATE ===')
          print('Positive output-space-to-CC evidence requires the live mode byte or a value derived from it to control CC1/CC0 source selection, matrix calculation, or programming. Logging alone is not functional evidence. Keep Tone/DG/interp-gamma/de-knee frozen absent an explicit call/data dependency.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1N.txt
          git commit -m 'research: record CA9 output-space to CC1 trace 1N' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
