name: M10-R v2.36e CA9 temperature assets
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v236e-ca9-temperature-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Extract exact ColorSpec temperature assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v236e_ca9_temperature_assets.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM,CS_MODE_LITTLE_ENDIAN
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN)
          def off(a): return PFX+a-BASE
          def u32(a): return struct.unpack_from('<I',b,off(a))[0]
          def f64(a): return struct.unpack_from('<d',b,off(a))[0]
          def dump(a,z,name):
              print(f'=== {name} {a:08x}..{z:08x} ===')
              for i in md.disasm(b[off(a):off(z)],a): print(f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}')
              print()
          print('M10-R v2.36e CA9 TEMPERATURE ASSETS')
          print('Exact bounded assets for xy->temperature and xy->XYZ; no generic CCT substitution.')
          print()
          dump(0x40004870,0x400048d0,'xy-to-XYZ successful tail')
          dump(0x40004d00,0x40005160,'xy-to-temperature complete')
          for la in [0x40004c58,0x40004c98,0x40005160,0x40005164,0x40005168,0x4000516c,0x40005170]:
              try: print(f'LITERAL {la:08x} u32={u32(la):08x}')
              except Exception as e: print(f'LITERAL {la:08x} ERROR {e}')
          p=u32(0x40004c58)
          print(f'LOCUS_BASE_PTR={p:08x}')
          if BASE <= p < BASE+len(b):
              print('LOCUS_BASE_FIRST_160_DOUBLES:')
              for i in range(160):
                  a=p+i*8
                  try: print(f'{i:03d} {a:08x} {f64(a):.17g}')
                  except: break
          bp=u32(0x40004c98)
          print(f'BOUNDS_PTR={bp:08x}')
          if BASE <= bp < BASE+len(b):
              for i in range(16):
                  a=bp+i*4
                  print(f'BOUND_WORD {i:02d} {a:08x} {u32(a):08x} signed={struct.unpack_from("<i",b,off(a))[0]}')
          print('ROUND_CONSTANT_RAW:')
          for a in [0x400129c8,0x400129d0,0x400129d8]:
              try: print(f'{a:08x} f64={f64(a):.17g} raw={b[off(a):off(a)+8].hex()}')
              except Exception as e: print(e)
          PY
      - name: Commit v2.36e trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v236e_ca9_temperature_assets.txt
          git commit -m 'research: record v2.36e CA9 temperature assets' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
