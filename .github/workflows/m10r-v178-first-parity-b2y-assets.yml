name: M10-R v1.78 first-parity B2Y assets
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v178-first-parity-b2y-assets.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve B2Y first-parity records and copy primitive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text();a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n");z=p.index("\n          CPP",a);Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v178_first_parity_b2y_assets.txt
          from pathlib import Path
          import struct,hashlib,statistics
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_REG_PC
          D=Path('/tmp/sections/074_IMG_Calibration_Data_data_calib_B2Y.bin.bin').read_bytes(); P=4
          u32=lambda o:struct.unpack_from('<I',D,o)[0]
          def key(o):return D[o:o+0x40].split(b'\0',1)[0].decode('ascii','replace')
          count=u32(P+8); stride=0xa90; rec0=P+0x10; payload_base=rec0+count*stride
          recs=[]
          for i in range(count):
            o=rec0+i*stride;rid=u32(o);rel=u32(o+4);size=u32(o+8);nk=u32(o+0xc)
            keys=[key(o+0x10+j*0x40) for j in range(min(nk,42))]
            recs.append((i,rid,rel,size,nk,keys,payload_base+rel))
          names={1:'deknee',6:'colorcorrection0',8:'tone_control',9:'interpolation_gamma',0xa:'colorcorrection1',0xb:'differential_gamma_control',0x19:'tone_tbl0',0x1a:'tone_tbl1',0x1c:'differential_gamma_tbl',0x1d:'differential_gamma_tbl_fl'}
          print('M10-R v1.78 FIRST-PARITY B2Y ASSET MAP')
          print('file_size',hex(len(D)),'selector_count',count,'payload_base',hex(payload_base))
          for rid,nm in names.items():
            print(f'\n=== {rid:#x} {nm} ===')
            rr=[r for r in recs if r[1]==rid]
            for i,_,rel,size,nk,keys,ap in rr:
              blob=D[ap:ap+size]
              print('record',i,'rel',hex(rel),'size',hex(size),'payload',hex(ap),'sha256',hashlib.sha256(blob).hexdigest())
              print('keys',keys)
              print('head128',blob[:128].hex())
              if size>=16 and size%4==0:
                vals=list(struct.unpack('<%dI'%(size//4),blob))
                sample_idx=sorted(set([0,1,2,3,len(vals)//8,len(vals)//4,len(vals)//2,(3*len(vals))//4,len(vals)-4,len(vals)-2,len(vals)-1]))
                print('u32_samples',[(j,hex(vals[j])) for j in sample_idx if 0<=j<len(vals)])
                print('u32_minmax_unique',hex(min(vals)),hex(max(vals)),len(set(vals)))
          # decode copy helpers with correct ARM state: memcpy-like 0x4204f218 and 0x4204f2ec
          B=Path('/tmp/sections/092_IMG-System.bin').read_bytes();BASE=0x42000000;BP=4;END=BASE+len(B)-BP
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(a):return BP+a-BASE
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(B)-4:return la,struct.unpack_from('<I',B,o)[0]
            except:pass
          for a,n in ((0x4204f218,'copy_f218'),(0x4204f2ec,'copy_f2ec')):
            print(f'\n=== {n} ARM {a:#x} ===')
            for i in md.disasm(B[off(a):off(a+0x180)],a):
              s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';q=lit(i)
              if q:s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
              print(s)
          print('\n=== inferred active tone upload ===')
          tc=[r for r in recs if r[1]==8][0];blob=D[tc[6]:tc[6]+tc[3]]
          words=[struct.unpack_from('<I',blob,o)[0] for o in range(0,min(len(blob),0x40),4)]
          print('tone_control_words_0_3c',[hex(x) for x in words])
          mode=words[2] if len(words)>2 else None
          upload_words={0:0x5000,1:0x2800}.get(mode,0x1400); print('tone_size_enum',mode,'upload_words',hex(upload_words),'upload_bytes',hex(upload_words*4))
          print('\nTARGET: freeze exact first-parity B2Y asset IDs, aliases, byte sizes/hashes, CC payloads, and verify transfer-size units.')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v178_first_parity_b2y_assets.txt
          git commit -m 'research: record v1.78 first-parity B2Y asset map' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push