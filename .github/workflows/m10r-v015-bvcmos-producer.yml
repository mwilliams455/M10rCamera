name: M10-R v0.15 BvCMOS producer upstream
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v015-bvcmos-producer.yml', '.m10r-v015-bvcmos-producer-trigger']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover firmware and trace BvCMOS producer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' >/tmp/m10r-v015-bvcmos-producer.txt
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/090_CTRL-System.bin').read_bytes(); base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          def off(v):return pfx+v-base
          def dis(label,s,e):
            print(f'\n=== {label} {s:08x}-{e:08x} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.mnemonic!='.byte': print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          def callers(target):
            out=[]
            for i in md.disasm(b[pfx:],base):
              if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM and (i.operands[0].imm&~1)==(target&~1): out.append(i.address)
            return out
          def literal_value(ins):
            for op in ins.operands:
              if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_PC:
                a=((ins.address+4)&~3)+op.mem.disp
                q=off(a)
                if 0<=q<=len(b)-4:return a,struct.unpack_from('<I',b,q)[0]
            return None
          TARGETS=[0x0800F1C0,0x0800DE58,0x08001884,0x08008EE0]
          for t in TARGETS:
            cs=callers(t);print('\nCALLERS',hex(t),[hex(x) for x in cs])
            for a in cs:dis('CALLER_'+hex(a)+'_TO_'+hex(t),max(base,a-240),min(base+len(b)-pfx,a+340))
          dis('BVCMOS_PRODUCER_F1C0',0x0800F080,0x0800F320)
          dis('BVCMOS_UPDATE_REGION',0x0800F700,0x0800F990)
          dis('MODE_HELPER_DE58',0x0800DDA0,0x0800DED0)
          dis('STATE_HELPER_1884',0x080017C0,0x08001920)

          # Resolve PC literals in producer/update region to expose data pointers/tables.
          print('\nLITERALS_F080_F990')
          for i in md.disasm(b[off(0x0800F080):off(0x0800F990)],0x0800F080):
            if i.mnemonic=='.byte':continue
            lv=literal_value(i)
            if lv: print(hex(i.address),i.mnemonic,i.op_str,'literal@',hex(lv[0]),'=',hex(lv[1]))

          # Function-pointer references to F1C0 as raw words across CTRL, plus likely packet/data strings nearby.
          needle=struct.pack('<I',0x0800F1C1)
          needle2=struct.pack('<I',0x0800F1C0)
          for n,label in ((needle,'F1C1'),(needle2,'F1C0')):
            q=0;arr=[]
            while True:
              q=b.find(n,q)
              if q<0:break
              arr.append(base+q-pfx);q+=1
            print(label+'_RAW_REFS',[hex(x) for x in arr])

          keys=('ae','live','cmos','brightness','lumin','ev','meter','histogram','preview','image','sensor')
          print('\nSTRINGS_NEAR_F000')
          for m in re.finditer(rb'[ -~]{5,180}\x00',b):
            va=base+m.start()-pfx;s=m.group()[:-1].decode('ascii','ignore')
            if 0x0800C000<=va<=0x08013000 and any(k in s.lower() for k in keys): print(hex(va),repr(s))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v015-bvcmos-producer
          path: /tmp/m10r-v015-bvcmos-producer.txt
          if-no-files-found: error
