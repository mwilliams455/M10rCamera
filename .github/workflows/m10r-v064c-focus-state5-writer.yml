name: M10-R v0.64c focus state5 writer
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v064c-focus-state5-writer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m10r-metering-latch-trace
          fetch-depth: 0
      - name: Extract focused windows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > research/M10R_v064c_state5_writer_focus.txt
          from pathlib import Path
          L=Path('research/M10R_v064_workflow_state5_owner.txt').read_text(errors='replace').splitlines()
          print('M10-R v0.64c STATE-5 WRITER FOCUS')
          for key in ('42161ec6:','42161e7e:','42161ee8:','42161d42:','42161d46:','42161f00:','42161fa0:'):
              hits=[i for i,x in enumerate(L) if key in x]
              print('\n###',key,'hits',hits[:20])
              for i in hits[:6]:
                  for x in L[max(0,i-90):min(len(L),i+130)]: print(x)
          # Print section titles around any line containing an immediate 5 near the 0x42161d00..0x42161f40 area.
          print('\n### ALL 0x42161D00..0x42161F40 LINES')
          seen=set()
          for x in L:
              if x[:8].lower()>='42161d00' and x[:8].lower()<='42161f40' and x not in seen:
                  print(x);seen.add(x)
          PY
      - name: Commit focused summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v064c_state5_writer_focus.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: focus v0.64 state-5 writer trace'
          git pull --rebase origin m10r-metering-latch-trace
          git push origin HEAD:m10r-metering-latch-trace
