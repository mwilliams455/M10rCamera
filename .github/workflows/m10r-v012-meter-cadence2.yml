name: M10-R v0.12 cadence callbacks
on:
  push:
    branches: [m10r-meter-cadence-trace]
    paths: ['.github/workflows/m10r-v012-meter-cadence2.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover CTRL
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace callback ownership and timer semantics
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/m10r-v012-cadence2.txt
          from pathlib import Path
          import struct,re
          from collections import defaultdict
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM,ARM_REG_PC
          b=Path('/tmp/sections/090_CTRL-System.bin').read_bytes();base=0x08000000;pfx=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True;md.skipdata=True
          code=list(md.disasm(b[pfx:],base));calls=defaultdict(list);pc=defaultdict(list)
          for i in code:
            if i.id==0:continue
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:calls[i.operands[0].imm].append(i.address)
            for op in i.operands:
              if op.type==ARM_OP_MEM and op.mem.base==ARM_REG_PC:pc[((i.address+4)&~3)+op.mem.disp].append(i.address)
          def off(v):return pfx+v-base
          def dis(name,s,e):
            print(f'\n=== {name} ===')
            for i in md.disasm(b[off(s):off(e)],s):
              if i.id!=0:print(f'{i.address:08x}: {i.mnemonic:8s} {i.op_str}')
          def litrefs(v):
            ans=[]
            for val in (v,v|1):
              q=0;needle=struct.pack('<I',val)
              while True:
                q=b.find(needle,q)
                if q<0:break
                lit=base+q-pfx;ans.append((val,lit,pc.get(lit,[])));q+=1
            return ans
          targets={
            0x0800dcc6:'METER_EVENT_CONSUMER',
            0x080141f8:'CTRL_STATE_ACTION_A',
            0x0801424c:'NEG_BV_ARM_ACTION_1',
            0x080142b2:'NEG_BV_ARM_ACTION_2',
            0x0800e16c:'NEG_BV_CHECK_AND_TIMER',
            0x0800e166:'NEG_BV_LATCH_SETTER',
            0x0801077e:'TIMER_PRIMITIVE',
            0x0800d91c:'AE_INPUT_BUILD',
          }
          print('=== TARGET CALLERS / POINTER XREFS ===')
          for t,n in targets.items():
            print(n,hex(t),'callers',[hex(x) for x in calls.get(t,[])])
            print(' ptrs',[(hex(v),hex(l),[hex(x) for x in rs]) for v,l,rs in litrefs(t)])
          dis('METER_EVENT_CONSUMER',0x0800dcc0,0x0800ddb0)
          dis('NEG_BV_ACTION_CLUSTER',0x080141d0,0x08014310)
          dis('NEG_BV_CHECK_AND_TIMER',0x0800e150,0x0800e190)
          dis('TIMER_PRIMITIVE',0x080106e0,0x08010840)
          for t,n in targets.items():
            for a in calls.get(t,[])[:20]:dis(n+'_CALL_'+hex(a),max(base,a-130),min(base+len(b)-pfx,a+170))
          # Direct/literal references to latch setter plus latch global.
          for value,name in [(0x2001ad76,'NEG_BV_LATCH_GLOBAL'),(0x0800e166,'SETTER_ARM'),(0x0800e167,'SETTER_THUMB')]:
            print('\nREFS',name,hex(value),[(hex(v),hex(l),[hex(x) for x in rs]) for v,l,rs in litrefs(value)])
          # Show all timer primitive callers with nearby immediate argument setup.
          print('\n=== TIMER PRIMITIVE ALL CALLERS ===')
          print([hex(x) for x in calls.get(0x0801077e,[])])
          for a in calls.get(0x0801077e,[]):dis('TIMER_CALL_'+hex(a),max(base,a-70),min(base+len(b)-pfx,a+90))
          strings={}
          for m in re.finditer(rb'[ -~]{4,160}\x00',b):strings[base+m.start()-pfx]=m.group()[:-1].decode('ascii','ignore')
          print('\n=== TIMER / STATE STRINGS ===')
          for va,s in sorted(strings.items()):
            lo=s.lower()
            if any(k in lo for k in ('timer','timeout','delay','sleep','measure','shutter','release','low light')):print(hex(va),repr(s))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10r-v012-cadence2
          path: /tmp/m10r-v012-cadence2.txt
          if-no-files-found: error
