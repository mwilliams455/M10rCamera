name: M10-R output-space transfer 1Y
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1y.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Map CM IPC payload to CA9 parameter struct
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1Y.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          ib=Path('/tmp/sections/092_IMG-System.bin').read_bytes();IB=0x42000000;IP=4
          cb=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes();CB=0x40000000;CP=4
          tm=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);tm.detail=True
          am=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN);am.detail=True
          def io(a):return IP+a-IB
          def co(a):return CP+a-CB
          def idis(a,z):return list(tm.disasm(ib[io(a):io(z)],a))
          def cdis(a,z):return list(am.disasm(cb[co(a):co(z)],a))
          def tcall(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def acall(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def tlit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=io(la)
                if 0<=o<=len(ib)-4:return la,struct.unpack_from('<I',ib,o)[0]
            except:pass
          def alit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp;o=co(la)
                if 0<=o<=len(cb)-4:return la,struct.unpack_from('<I',cb,o)[0]
            except:pass
          def fmt(i,thumb=True):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=tlit(i) if thumb else alit(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            t=tcall(i) if thumb else acall(i)
            if t is not None:s+=f' ; CALL={t:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER1Y')
          print('\n=== ARM926 StartColorManagement wrapper ===')
          for i in idis(0x420a3488,0x420a36d0):print(fmt(i,True))
          print('\n=== CALLSITE(S) TO IPC SEND 0x420D4C24 IN CM AREA ===')
          for a in range(0x420a3000,0x420a7000,2):
            q=list(tm.disasm(ib[io(a):io(a)+4],a,count=1))
            if q and tcall(q[0])==0x420d4c24:
              print('CALL',hex(a))
              for i in idis(max(0x420a3000,a-0x90),min(0x420a7000,a+0x60)):print(fmt(i,True))
          print('\n=== CA9 manager 0x40 thunk and target ===')
          for i in cdis(0x400063a0,0x400063bc):print(fmt(i,False))
          for i in cdis(0x40004050,0x40004058):print(fmt(i,False))
          print('\n=== CA9 CM parameter-struct direct accesses ===')
          for i in cdis(0x40003af4,0x40004050):
            if i.mnemonic.startswith(('ldr','ldrb','ldrh','str','strb','strh')) and any(r in i.op_str for r in ('[r4', '[r0', '[sb', '[r8')):
              print(fmt(i,False))
          print('\n=== OUTPUTSPACE/CM GLOBALS ON ARM926 ===')
          for i in idis(0x420a5900,0x420a5b20):
            x=tlit(i)
            if x and x[1] in (0x43705760,0x43705780):print(fmt(i,True))
          print('\n=== ARM926 SHARED/POINTER-LIKE FIELDS AROUND START ===')
          for i in idis(0x420a3488,0x420a36d0):
            if i.mnemonic.startswith(('ldr','str','add')) and ('#0x20' in i.op_str or '#0x24' in i.op_str or '#8' in i.op_str or '#0x40' in i.op_str or '#0x44' in i.op_str):print(fmt(i,True))
          print('\n=== DECISION GATE ===')
          print('Map StartColorManagement payload words to CA9 manager record. Prove whether record+8 points at the same CM config object containing output-space mode and whether mode selects matrix-only state versus any nonlinear transfer operation.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1Y.txt
          git commit -m 'research: record CM IPC payload to CA9 struct mapping 1Y' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push