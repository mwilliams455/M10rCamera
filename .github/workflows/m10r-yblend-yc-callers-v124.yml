name: M10-R v1.24 Y_BLEND/Yc boundary and caller trace

on:
  push:
    branches: [m10r-render1e-gain1a-build]
    paths:
      - 'tools/m10r_yblend_yc_callers_v124.py'
      - '.github/workflows/m10r-yblend-yc-callers-v124.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install capstone
      - name: Download and unpack M10-R firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
      - name: Trace Y_BLEND/Yc boundaries and callers
        run: python3 tools/m10r_yblend_yc_callers_v124.py /tmp/sections | tee M10R_v124_yblend_yc_callers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-v124-yblend-yc-callers
          path: M10R_v124_yblend_yc_callers.txt
