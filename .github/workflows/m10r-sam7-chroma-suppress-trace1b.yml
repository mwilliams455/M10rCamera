name: M10-R SAM7 CHROMA SUPPRESS TRACE1B
on:
  push:
    branches: [m10r-b2y-chromasuppress-sam7-1a]
    paths:
      - '.github/workflows/m10r-sam7-chroma-suppress-trace1b.yml'
      - 'tools/m10r_sam7_chroma_suppress_trace1b.py'
      - 'tools/m10r_sections.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone==5.0.3
      - name: Build unpacker and decode canonical M10-R
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker); z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Trace candidate function
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trace1b_results
          python3 tools/m10r_sam7_chroma_suppress_trace1b.py /tmp/sec --out trace1b_results/M10R_SAM7_CHROMA_SUPPRESS_TRACE1B.json | tee trace1b_results/M10R_SAM7_CHROMA_SUPPRESS_TRACE1B.txt
          python3 - <<'PY'
          import json
          d=json.load(open('trace1b_results/M10R_SAM7_CHROMA_SUPPRESS_TRACE1B.json'))
          assert d['candidate_functions'], d
          print(json.dumps(d['candidate_functions'],indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/generated
          cp trace1b_results/M10R_SAM7_CHROMA_SUPPRESS_TRACE1B.* research/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/M10R_SAM7_CHROMA_SUPPRESS_TRACE1B.*
          git commit -m "Research freeze SAM7 chroma suppression trace1b" || exit 0
          git push origin HEAD:m10r-b2y-chromasuppress-sam7-1a
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-SAM7-CHROMA-SUPPRESS-TRACE1B
          path: trace1b_results/
          retention-days: 90
