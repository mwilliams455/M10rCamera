name: M10-R v1.31 CA9 WB helper xrefs
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v131-ca9-wb-helper-xrefs.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Resolve CA9 color helper function xrefs and WB call graph
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v131_ca9_wb_helper_xrefs.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4: return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM: return i.operands[0].imm&~1
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q: s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'
            t=call(i)
            if t is not None: s+=f' ; CALL {t:#x}'
            return s
          names=[
            'ca9_cm_Temperature_FromXYCoord','ca9_cm_Temperature_FromXYCoord_binarySearch','ca9_cm_Temperature_ToXYCoord',
            'ca9_cm_ColorSpec_MapWhiteMatrix','ca9_cm_ColorSpec_SetWhiteXY','ca9_cm_ColorSpec_NeutralToXY','ca9_cm_ColorSpec_MatrixInterpolate'
          ]
          print('M10-R v1.31 CA9 WB HELPER XREFS / CALL GRAPH')
          print('\n=== STRING ADDRESSES / POINTER POOLS ===')
          addrs={}
          for n in names:
            p=b.find(n.encode())
            if p<0:
              print(n,'NOT_FOUND'); continue
            va=BASE+p-PFX; addrs[n]=va; pat=struct.pack('<I',va); pools=[]; q=0
            while True:
              q=b.find(pat,q)
              if q<0: break
              pools.append(BASE+q-PFX); q+=1
            print(n,hex(va),'pools',[hex(x) for x in pools])
          print('\n=== ARM PC-LITERAL XREFS TO NAME POINTERS ===')
          ins=dis(0x40000000,0x40018000)
          byname={n:[] for n in addrs}
          for idx,i in enumerate(ins):
            q=lit(i)
            if not q: continue
            for n,va in addrs.items():
              if q[1]==va: byname[n].append(idx)
          for n,idxs in byname.items():
            print(f'\n## {n} xrefs={len(idxs)}')
            for idx in idxs:
              print(f'-- xref @{ins[idx].address:#x} --')
              for j in ins[max(0,idx-30):min(len(ins),idx+32)]: print(fmt(j))
          print('\n=== CANDIDATE FUNCTION STARTS (nearest push including lr within 0x500 bytes) ===')
          starts={}
          for n,idxs in byname.items():
            ss=[]
            for idx in idxs:
              base=None
              for k in range(idx,max(-1,idx-0x140),-1):
                j=ins[k]
                if j.mnemonic=='push' and 'lr' in j.op_str:
                  base=j.address; break
                if j.mnemonic.startswith('stm') and 'sp!' in j.op_str and 'lr' in j.op_str:
                  base=j.address; break
              if base is not None and base not in ss:ss.append(base)
            starts[n]=ss;print(n,[hex(x) for x in ss])
          # White Balance started exact string and xrefs.
          print('\n=== WHITE BALANCE START STRING / OWNER ===')
          needle=b'CA9: %s() - White Balance started'; p=b.find(needle)
          if p>=0:
            va=BASE+p-PFX; print('string',hex(va))
            pat=struct.pack('<I',va); pools=[]; q=0
            while True:
              q=b.find(pat,q)
              if q<0:break
              pools.append(BASE+q-PFX);q+=1
            print('pools',[hex(x) for x in pools])
            wbidx=[]
            for idx,i in enumerate(ins):
              q=lit(i)
              if q and q[1]==va:wbidx.append(idx)
            for idx in wbidx:
              print(f'-- WB string xref @{ins[idx].address:#x} --')
              for j in ins[max(0,idx-60):min(len(ins),idx+100)]:print(fmt(j))
          print('\n=== CALLS IN KNOWN WB CORE 0x4000B300..0x4000B800 ===')
          for i in dis(0x4000b300,0x4000b800):
            if call(i) is not None: print(fmt(i))
          print('\n=== CALLS INTO RESOLVED WHITE/COLOR HELPER STARTS FROM 0x40000000..0x40018000 ===')
          targets=set(x for xs in starts.values() for x in xs)
          for i in ins:
            t=call(i)
            if t in targets: print(fmt(i))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v131_ca9_wb_helper_xrefs.txt
          git commit -m 'research: record v1.31 CA9 WB helper xrefs' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push
