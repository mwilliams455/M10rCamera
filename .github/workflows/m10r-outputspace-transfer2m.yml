name: M10-R output-space transfer 2M
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer2m.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace job descriptor consumers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int bb=r.get();if(!bb)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER2M.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import *
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes();B=0x42000000;P=4
          m=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);m.detail=True
          def o(a):return P+a-B
          def ds(a,z):return list(m.disasm(b[o(a):o(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>1 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;q=o(la)
                if 0<=q<=len(b)-4:return la,struct.unpack_from('<I',b,q)[0]
            except:pass
          def call(i):
            try:
              if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
            except:pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}';x=lit(i);c=call(i)
            if x:s+=f' ; LIT {x[0]:#x}->{x[1]:#x}'
            if c is not None:s+=f' ; CALL={c:#x}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER2M')
          print('\n=== RAW OCCURRENCES OF MIRRORED GLOBAL ADDRESSES ===')
          occ=[]
          for t in (0x408fe130,0x408fe15c):
            pat=struct.pack('<I',t);p=0;arr=[]
            while True:
              q=b.find(pat,p)
              if q<0:break
              a=B+(q-P);arr.append(a);occ.append((a,t));p=q+1
            print(hex(t),*[hex(x) for x in arr] if arr else ['NONE'])
          print('\n=== WINDOWS AROUND RAW GLOBAL POINTER OCCURRENCES ===')
          for a,t in occ:
            print('\n-- literal/raw',hex(a),'->',hex(t),'--')
            for start in range(max(B,a-0x100),a+1,2):
              ins=ds(start,min(B+len(b)-P,a+0x100))
              if any(i.address<=a<i.address+0x180 for i in ins):
                # print one conservative nearby decode from nearest 4-byte aligned earlier point
                pass
            for i in ds(max(B,a-0x60),min(B+len(b)-P,a+0x80)):print(fmt(i))
          print('\n=== MEMORY OPERANDS WITH JOB-OFFSET CANDIDATES ===')
          wanted={0xfc,0x128,0x154,0x17c,0x1a4}
          hits=[]
          # scan known code-rich IMG region rather than data tail
          for lo in range(0x42000000,0x42180000,0x10000):
            hi=min(lo+0x10000,B+len(b)-P)
            if hi<=lo:break
            for i in ds(lo,hi):
              ok=False
              for op in i.operands:
                if op.type==ARM_OP_MEM and op.mem.disp in wanted:ok=True
              if ok:hits.append(i);print(fmt(i))
          print('\n=== WINDOWS AROUND JOB-OFFSET CANDIDATES ===')
          for h in hits[:200]:
            print('\n--',hex(h.address),'--')
            for i in ds(max(B,h.address-0x40),min(B+len(b)-P,h.address+0x80)):print(fmt(i))
          print('\n=== CALLBACK POST-COPY CALL SEQUENCE ===')
          for i in ds(0x420a36c0,0x420a44e4):
            c=call(i)
            if c is not None:print(fmt(i))
          print('\n=== DECISION GATE ===')
          print('Find downstream consumers of job +0xFC and +0x128. The +0x128 source is the mode-selected packed output-space matrix. A B2Y fill/register consumer identifies its hardware CC bank.')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER2M.txt
          git commit -m 'research: record CM job descriptor consumer trace 2M' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push