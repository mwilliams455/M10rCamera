name: M10-R Y_BLEND SEMANTICTRACE1A

on:
  push:
    branches: [m10r-yblend-semantictrace1a]
    paths:
      - '.github/workflows/m10r-yblend-semantictrace1a.yml'
      - 'tools/m10r_yblend_semantictrace1a.py'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  semantic-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned disassembly dependency
        run: python3 -m pip install --quiet capstone==5.0.3
      - name: Fetch and verify original firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2             'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW'             -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
      - name: Decode and extract verified sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          marker="cat >/tmp/unpack.cpp <<'CPP'\n"
          a=p.index(marker)+len(marker)
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack
          /tmp/unpack
          echo '859c936b6ac8efe0bc4ce7f05623013644fc5d8aee3c6835f09860f452adc2e0  /tmp/M10R_unpacked.bin' | sha256sum -c -
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sec >/dev/null
      - name: Run semantic trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p semantictrace1a_results
          python3 tools/m10r_yblend_semantictrace1a.py /tmp/sec             --out semantictrace1a_results/semantictrace1a.json             | tee semantictrace1a_results/semantictrace1a_stdout.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('semantictrace1a_results/semantictrace1a.json').read_text())
          assert j['all_assertions_passed'] is True
          assert '0x154e68' in j['direct_thumb_calls']['IMG_D4480']
          print('PASS: bounded Y_BLEND semantic trace; no pixel-equation claim.')
          PY
          git rev-parse HEAD > semantictrace1a_results/source_commit.txt
          sha256sum tools/m10r_yblend_semantictrace1a.py > semantictrace1a_results/script_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M10R-YBLEND-SEMANTICTRACE1A-RESULTS
          path: semantictrace1a_results/
          retention-days: 90
          if-no-files-found: error
