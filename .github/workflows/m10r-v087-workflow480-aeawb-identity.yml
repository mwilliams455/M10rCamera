name: M10-R v0.87 workflow480 AEAWB identity
on:
  push:
    branches: [m10r-metering-latch-trace]
    paths: ['.github/workflows/m10r-v087-workflow480-aeawb-identity.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Trace workflow plus480 writers and AEAWB helper callers
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v087_workflow480_aeawb_identity.txt
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def dis(a,z): return [i for i in md.disasm(b[off(a):off(z)],a) if i.id]
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp; lo=off(la)
                if 0<=lo<=len(b)-4:return la,struct.unpack_from('<I',b,lo)[0]
            except: pass
          def tgt(i):
            try:
              if i.mnemonic.startswith('bl') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm&~1
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            q=lit(i)
            if q:s+=f' ; LIT {hex(q[0])}->{hex(q[1])}'
            t=tgt(i)
            if t is not None:s+=f' ; CALL {hex(t)}'
            return s
          def ctx(ins,n,before=14,after=18):
            for j in range(max(0,n-before),min(len(ins),n+after+1)): print(fmt(ins[j]))
          print('M10-R v0.87 WORKFLOW+0x480 / AFAEAWB POINTER IDENTITY')
          print('Known consumer: 0x420A3116..20 computes workflow+0x480, loads pointer, stores to CA9 block 0x43705A60+0.')
          print('Known AFAEAWB helper: 0x420DADB6 stores [0x408EFE10+0x7C] + 0x14080 through caller-supplied output pointer.')
          for a,z,name in [(0x42090000,0x420b8000,'CA9/workflow module'),(0x420d8000,0x420e3000,'AFAEAWB/prepro module')]:
            ins=dis(a,z)
            print(f'\n=== {name}: candidate workflow+0x480 WRITES ===')
            hits=[]
            for n,i in enumerate(ins):
              if i.mnemonic not in ('str','str.w'): continue
              try:
                mem=[op for op in i.operands if op.type==ARM_OP_MEM]
                if not mem or mem[-1].mem.disp!=0x58: continue
              except: continue
              near=ins[max(0,n-8):n+1]
              has85=False
              for q in near:
                try:
                  if q.mnemonic.startswith('mov') and any(op.type==ARM_OP_IMM and op.imm==0x85 for op in q.operands): has85=True
                except: pass
              if has85:hits.append(n)
            print('count',len(hits))
            for k,n in enumerate(hits):
              print(f'\n--- write candidate {k+1}/{len(hits)} @{hex(ins[n].address)} ---'); ctx(ins,n,16,22)
            print(f'\n=== {name}: direct callers of 0x420DADB6 ===')
            calls=[n for n,i in enumerate(ins) if tgt(i)==0x420dadb6]
            print('count',len(calls))
            for k,n in enumerate(calls):
              print(f'\n--- helper caller {k+1}/{len(calls)} @{hex(ins[n].address)} ---'); ctx(ins,n,22,28)
            print(f'\n=== {name}: direct callers of 0x420A3104 ===')
            calls=[n for n,i in enumerate(ins) if tgt(i)==0x420a3104]
            print('count',len(calls))
            for k,n in enumerate(calls):
              print(f'\n--- CA9 builder caller {k+1}/{len(calls)} @{hex(ins[n].address)} ---'); ctx(ins,n,22,28)
          print('\n=== DECISION RULE ===')
          print('Identity is closed only if a workflow+0x480 writer receives the exact AFAEAWB-derived pointer (base+0x80 or base+0x14080), directly or through a traceable copy chain. If the writer source is different, reject identity and trace that source instead.')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v087_workflow480_aeawb_identity.txt
          git commit -m 'research: record v0.87 workflow480 AEAWB identity' || exit 0
          git pull --rebase origin m10r-metering-latch-trace
          git push
