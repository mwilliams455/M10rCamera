name: M10-R v1.38 WB mode preset semantic map
on:
  push:
    branches: [m10r-color-science-trace]
    paths: ['.github/workflows/m10r-v138-wb-mode-preset-semantic-map.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Decode WB mode and preset semantics
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/m10r-v135-wb-mode-switch.yml').read_text()
          a=p.index("cat >/tmp/unpack.cpp <<'CPP'\n")+len("cat >/tmp/unpack.cpp <<'CPP'\n")
          z=p.index("\n          CPP",a)
          Path('/tmp/unpack.cpp').write_text(p[a:z])
          PY
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_v138_wb_mode_preset_semantic_map.txt
          from pathlib import Path
          import csv,struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/099_IMG-CA9_System.bin').read_bytes(); BASE=0x40000000; PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_ARM|CS_MODE_LITTLE_ENDIAN); md.detail=True; md.skipdata=True
          def off(a): return PFX+a-BASE
          def u32(a): return struct.unpack_from('<I',b,off(a))[0]
          def dis(a,z): return list(md.disasm(b[off(a):off(z)],a))
          def cstr(a):
            o=off(a)
            if not 0<=o<len(b): return None
            e=b.find(b'\0',o,min(len(b),o+320)); q=b[o:e]
            return q.decode('ascii','replace') if e>o and all(0x20<=x<=0x7e for x in q) else None
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=i.address+8+i.operands[1].mem.disp; o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except: pass
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'; q=lit(i)
            if q:
              s+=f' ; LIT {q[0]:#x}->{q[1]:#x}'; st=cstr(q[1])
              if st:s+=f' STRING={st!r}'
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:s+=f' ; CALL {(i.operands[0].imm&~1):#x}'
            return s
          print('M10-R v1.38 WB MODE / PRESET SEMANTIC MAP')
          print('\n=== TOP-LEVEL WB MODE JUMP TABLE @0x4000B178 (14 words) ===')
          mode_targets=[u32(0x4000b178+4*n) for n in range(14)]
          for n,t in enumerate(mode_targets):print(f'mode {n:2d} -> {t:#010x}')
          print('\n=== UNIQUE MODE TARGET BLOCKS ===')
          for t in sorted(set(mode_targets)):
            if BASE<=t<BASE+len(b)-PFX:
              print(f'\n-- target {t:#x}; modes {[i for i,x in enumerate(mode_targets) if x==t]} --')
              for i in dis(t,min(t+0xa0,0x4000b59c)):print(fmt(i))
          print('\n=== PRESET JUMP TABLE @0x4000B218 ===')
          presets=[u32(0x4000b218+4*n) for n in range(10)]
          for n,t in enumerate(presets):print(f'preset {n} -> {t:#010x}')
          print('\n=== PRESET RUNTIME TABLE ACCESSES ===')
          print('r7 loads runtime base 0x4004324c; it is outside static section 099 and values are not firmware-image-readable here')
          pairs={1:(0x1c8,0x1d8),2:(0x1ce,0x1de),3:(0x1cc,0x1dc),4:(0x1c2,0x1d2),5:(0x1c4,0x1d4),6:(0x1c6,0x1d6),7:(0x1ca,0x1da),8:(0x1d0,0x1e0)}
          for n,(a,c) in pairs.items():print(f'preset {n}: halfwords at runtime_base+{a:#x} and +{c:#x}')
          print('preset 9 uses input+0x1c -> helper 0x4000aa34 -> indexed halfwords at runtime_base+0x1e2 and +0x262 families')
          print('\n=== STRING-BACKED WB START REFERENCES ===')
          for i in dis(0x4000b13c,0x4000b700):
            q=lit(i)
            if q and cstr(q[1]):print(fmt(i))
          print('\n=== SEMANTIC WB STRINGS ACROSS EXTRACTED SECTIONS ===')
          rows=list(csv.DictReader(Path('/tmp/sections/sections.csv').open()))
          terms=('daylight','cloud','shadow','tungsten','incandescent','fluores','hmi','flash','greycard','graycard','color temperature','colour temperature','automatic white','auto white','awb','white balance','wb preset','preset daylight')
          for row in rows:
            data=(Path('/tmp/sections')/row['file']).read_bytes(); low=data.lower(); ibase=int(row['image_base'],16); hits=[]
            for term in terms:
              q=0; nb=term.encode()
              while True:
                q=low.find(nb,q)
                if q<0:break
                lo=max(0,q-90);hi=min(len(data),q+len(nb)+180);ctx=data[lo:hi].replace(b'\0',b'|').decode('latin1','replace')
                hits.append((q,term,ctx));q+=1
            for q,term,ctx in sorted(hits)[:120]:print(f"sec={row['index']} name={row['name']!r} va={ibase+q:#x} term={term!r} ctx={ctx!r}")
          print('\n=== FROZEN SO FAR ===')
          print('top-level WB mode 3 = DAYLIGHT is firmware-proven; input+0x18 is a separate 10-way preset selector')
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_v138_wb_mode_preset_semantic_map.txt
          git commit -m 'research: record v1.38 WB mode preset semantic map' || exit 0
          git pull --rebase origin m10r-color-science-trace
          git push