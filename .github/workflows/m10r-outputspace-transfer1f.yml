name: M10-R output-space transfer 1F
on:
  push:
    branches: [m10r-outputspace-transfer1a]
    paths: ['.github/workflows/m10r-outputspace-transfer1f.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - name: Recover YC selector and TF destination
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://reddotforum.com/Firmware_files/M10-R/M10-R-30.22.23.34-Customer.FW' -o /tmp/M10-R.FW
          echo 'ec8df72dc7d4c90332abb3cdbc07c6db837ffed802c1a9712b6f3d6e0edf6498  /tmp/M10-R.FW' | sha256sum -c -
          cat >/tmp/unpack.cpp <<'CPP'
          #include <cstdint>
          #include <fstream>
          #include <stdexcept>
          #include <vector>
          using namespace std; static uint32_t u32(const vector<uint8_t>&b,size_t o){return uint32_t(b[o])|(uint32_t(b[o+1])<<8)|(uint32_t(b[o+2])<<16)|(uint32_t(b[o+3])<<24);} struct BR{const uint8_t*p;size_t n,bit=0;int get(){if(bit>=n*8)throw runtime_error("eof");int v=(p[bit>>3]>>(7-(bit&7)))&1;++bit;return v;}}; static int cat(BR&r){int a=r.get();if(!a)return r.get()?7:6;int b=r.get();if(!b)return r.get()?5:1;int c=r.get();if(!c)return r.get()?2:0;int d=r.get();if(!d)return 4;return r.get()?8:3;} int main(){ifstream f("/tmp/M10-R.FW",ios::binary);vector<uint8_t>fw((istreambuf_iterator<char>(f)),{});const size_t C=0x38;uint32_t h=u32(fw,C+8),expected=u32(fw,C+0x10);const uint8_t*tr=&fw[C+0x54];vector<uint8_t>out;out.reserve(expected);size_t st=C+h;for(int i=0;i<8;i++){size_t e=st+i*16;uint32_t ro=u32(fw,e+4),ps=u32(fw,e+8),us=u32(fw,e+12);BR br{&fw[C+ro],ps};for(uint32_t j=0;j<us;j++){int k=cat(br),x=0,v=0;for(int z=0;z<k;z++)x=(x<<1)|br.get();if(k)v=(x>=(1<<(k-1)))?x:x-((1<<k)-1);out.push_back(tr[v+128]);}}ofstream o("/tmp/M10R_unpacked.bin",ios::binary);o.write((char*)out.data(),out.size());return out.size()==expected?0:3;}
          CPP
          g++ -O3 -std=c++17 /tmp/unpack.cpp -o /tmp/unpack && /tmp/unpack
          python3 tools/m10r_sections.py /tmp/M10R_unpacked.bin /tmp/sections >/dev/null
          python3 - <<'PY' > research/M10R_OUTPUTSPACE_TRANSFER1F.txt
          from pathlib import Path
          import struct
          from capstone import *
          from capstone.arm import ARM_OP_MEM,ARM_OP_IMM,ARM_REG_PC
          b=Path('/tmp/sections/092_IMG-System.bin').read_bytes(); BASE=0x42000000;PFX=4
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.detail=True
          def off(a):return PFX+a-BASE
          def one(a):
            if not (BASE<=a<BASE+len(b)-PFX):return None
            q=list(md.disasm(b[off(a):off(a)+4],a,count=1));return q[0] if q else None
          def dis(a,z):return list(md.disasm(b[off(a):off(z)],a))
          def lit(i):
            try:
              if i.mnemonic.startswith('ldr') and len(i.operands)>=2 and i.operands[1].type==ARM_OP_MEM and i.operands[1].mem.base==ARM_REG_PC:
                la=((i.address+4)&~3)+i.operands[1].mem.disp;o=off(la)
                if 0<=o<=len(b)-4:return la,struct.unpack_from('<I',b,o)[0]
            except:pass
          def adr(i):
            try:
              if i.mnemonic=='adr' and len(i.operands)>=2 and i.operands[1].type==ARM_OP_IMM:return ((i.address+4)&~3)+i.operands[1].imm
            except:pass
          def call(i):
            if i.mnemonic in ('bl','blx') and i.operands and i.operands[0].type==ARM_OP_IMM:return i.operands[0].imm
          def astr(v):
            if not (BASE<=v<BASE+len(b)-PFX):return None
            o=off(v);e=b.find(b'\0',o,min(len(b),o+180));q=b[o:e] if e>o else b''
            return q.decode('ascii','replace') if len(q)>=4 and all(0x20<=x<=0x7e for x in q) else None
          def fmt(i):
            s=f'{i.address:08x}: {i.mnemonic:10s} {i.op_str}'
            x=lit(i)
            if x:
              s+=f' ; LIT {hex(x[0])}->{hex(x[1])}';st=astr(x[1])
              if st:s+=f' STRING={st!r}'
            a=adr(i)
            if a:
              s+=f' ; ADR={hex(a)}';st=astr(a)
              if st:s+=f' STRING={st!r}'
            t=call(i)
            if t is not None:s+=f' ; CALL={hex(t)}'
            return s
          print('M10-R OUTPUTSPACE TRANSFER1F')

          print('\n=== TF CALL FULL SURROUND 0x420A57A0..0x420A591C ===')
          for i in dis(0x420a57a0,0x420a591c):print(fmt(i))

          print('\n=== TF STACK LOCAL ACCESS SURFACE ===')
          # loader destination begins sp+0x28. List accesses to offsets in its possible 0x100-byte local range after call.
          for i in dis(0x420a583e,0x420a591c):
            if '[sp' in i.op_str and i.mnemonic.startswith(('ldr','str','add')):print(fmt(i))

          print('\n=== RAW THUMB DECODE YC SELECTOR 0x42154D80..0x42154F80 ===')
          # decode each halfword independently, avoiding loss after embedded literals/strings
          for a in range(0x42154d80,0x42154f80,2):
            i=one(a)
            if i:print(fmt(i))

          print('\n=== DIRECT LINEAR WINDOWS AROUND YC DIAGNOSTIC STRINGS ===')
          for lo,hi in ((0x42154dc0,0x42154e90),(0x42154e90,0x42154f28)):
            print('--',hex(lo),hex(hi),'--')
            for i in dis(lo,hi):print(fmt(i))

          # Search every halfword in a tight region for ADR/LDR that lands on the two exact YC strings.
          ys=[0x42154f28,0x42154f4c]
          print('\n=== EXACT YC STRING XREFS ADR+LITERAL ===')
          xrefs=[]
          for a in range(0x42154800,0x42154f28,2):
            i=one(a)
            if not i:continue
            vals=[];x=lit(i)
            if x:vals.append(x[1])
            q=adr(i)
            if q:vals.append(q)
            if any(v in ys for v in vals):xrefs.append(a);print(fmt(i))
          print('xrefs',','.join(hex(x) for x in xrefs) if xrefs else 'NONE')

          # Find plausible owner prologue(s) preceding xrefs and list key branch/call/load/store operations.
          print('\n=== YC OWNER FILTERED TRACE ===')
          owners=[]
          for a in xrefs:
            for q in range(a,0x42154800,-2):
              i=one(q)
              if i and i.mnemonic=='push' and 'lr' in i.op_str:owners.append(q);break
          for p in sorted(set(owners)):
            print('OWNER',hex(p))
            for i in dis(p,0x42154f28):
              if i.mnemonic.startswith(('ldr','str','cmp','b')) or call(i) is not None:print(fmt(i))

          # Test YC owner direct dependency on original IMG color-space field via offsets +0xb4/+0x44/+0x20 and CA9 globals.
          print('\n=== YC OWNER COLORSPACE DEPENDENCY TEST ===')
          for p in sorted(set(owners)):
            hits=[]
            for i in dis(p,0x42154f28):
              x=lit(i)
              if '#0xb4' in i.op_str or '#0x44' in i.op_str or (x and x[1] in (0x43705760,0x43705780)):
                hits.append(fmt(i))
            print(hex(p),hits if hits else 'NO_DIRECT_COLORSPACE_FIELD_OR_CA9_GLOBAL_REFERENCE')

          print('\n=== KNOWN B2Y PROGRAMMER CALLS FROM YC OWNER ===')
          known={0x420d15e8:'DG',0x420d25a4:'INTERP_GAMMA',0x420d3c1c:'TONE',0x420d1170:'DEKNEE'}
          for p in sorted(set(owners)):
            hits=[]
            for i in dis(p,0x42154f28):
              t=call(i)
              if t in known:hits.append((hex(i.address),known[t]))
            print(hex(p),hits if hits else 'NONE')

          print('\n=== GATE ===')
          print('Use TF post-call copies to identify the remapping destination. Treat YC selector as parameter selection unless its owner writes hardware or calls B2Y programming. No renderer changes from selector strings alone.')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/M10R_OUTPUTSPACE_TRANSFER1F.txt
          git commit -m 'research: record YC selector and TF destination trace 1F' || exit 0
          git pull --rebase origin m10r-outputspace-transfer1a
          git push
